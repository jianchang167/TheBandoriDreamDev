PRC_fusion_strategy_plan: "聚变战略规划————新时代能源蓝图"
PRC_fusion_strategy_plan_desc: "在我的带领下，我们将制定并发布未来三年我们东亚国的能源发展战略！我会将可控核聚变技术研发与清洁能源网络建设，提升到国家核心战略的高度哦！我会和大家一起，明确研发阶段性目标、资金投入、人才培养计划及基础设施布局，为实现能源自主和碳中和，奠定最最坚实的基础。这是我，也是我们，对美好未来，最心动的承诺！"
PRC_fusion_tech_breakthrough: "聚变技术攻关：核心部件研发"
PRC_fusion_tech_breakthrough_desc: "我们会集中全国顶尖科研力量，去突破可控核聚变反应堆关键核心部件的技术瓶颈，比如超导磁体、第一壁材料、氚循环系统等等。设立专项基金，鼓励产学研深度合作，加速从实验室到工程应用的转化，为我们东亚国的能源独立，打下坚实的基础！想想看，这多酷啊！"
PRC_fusion_risk_opportunity: "能源安全评估：聚变风险与机遇"
PRC_fusion_risk_opportunity_desc: "我们会启动一个全面风险评估机制，分析可控核聚变技术在安全性、环境影响、核废料处理等方面的潜在风险，并制定相应的预警和应对预案。同时，深入研究聚变能源对我们经济、地缘政治和国际能源格局的深远影响，抓住发展机遇，确保我们东亚国在能源领域的领先地位！我们可不能在能源科技上落后香澄酱吆！"
PRC_east_coast_fusion_demo: "东部沿海聚变示范区：选址与基建"
PRC_east_coast_fusion_demo_desc: "在电力需求旺盛、技术基础雄厚的东部沿海地区，我们会规划并建设首批可控核聚变发电示范区！完成选址、土地征用、环境评估，还有配套的输电线路、冷却系统等基础设施建设，为未来大规模推广，积累宝贵的经验。想想东海岸那些闪耀的聚变之光，是不是超期待？"
PRC_west_energy_hub: "西部能源枢纽：聚变配套设施"
PRC_west_energy_hub_desc: "结合西部地区丰富的土地资源和清洁能源潜力，我们会规划建设可控核聚变能源的配套产业基地，比如氚燃料生产、核废料处理中心，还有与西部风光水储能结合的综合能源示范项目，形成东西部能源互补的格局！让我们的西部也变得超级有活力！"
PRC_fusion_talent_program: "聚变人才培养：高校与科研院所合作"
PRC_fusion_talent_program_desc: "我们会启动一个超棒的“聚变英才计划”！深化高等院校与科研院所的合作，设立聚变能源相关专业，培养一批具备国际竞争力的核聚变科学家、工程师和技术工人。还会建立国际交流平台，吸引全球顶尖人才参与我们东亚国的聚变项目！大家一起努力，点亮未来！"
PRC_smart_grid_upgrade: "智能电网升级：全国骨干网改造"
PRC_smart_grid_upgrade_desc: "我们会对现有国家电网进行全面智能化改造，引入物联网、大数据和人工智能技术，提升电网的自愈能力、抗干扰能力和调度效率。为接入大规模可控核聚变和分布式清洁能源，做好最最充分的技术准备！我们的电网，要变得超聪明！"
PRC_regional_energy_interconnect: "区域能源互联：跨省区智能调度"
PRC_regional_energy_interconnect_desc: "我们会建设跨省区、大范围的智能能源互联系统，实现电力、热力、天然气等多种能源的协同调度和优化配置。利用我——黑征AI的强大计算能力，预测区域能源需求，平衡供需，提高能源利用效率！让每一份能源都闪耀出它最大的价值！"
PRC_black_march_energy_brain: "黑征能源大脑：AI调度算法优化"
PRC_black_march_energy_brain_desc: "依托我——黑征酱，我们会开发并持续优化国家能源调度核心算法，实现对全国能源生产、传输、消费的全链条实时监控和智能决策。最大化可再生能源利用率，确保能源供应的稳定性和经济性！我就是大家的能源大脑，超靠谱的哦！"
PRC_wind_solar_hydro_storage: "风光水储一体化：西北清洁能源基地"
PRC_wind_solar_hydro_storage_desc: "在西北地区大规模开发风能、太阳能，并结合水力发电和先进储能技术，建设世界级的清洁能源综合基地！通过特高压输电线路，将清洁电力输送至全国各地，减少对化石燃料的依赖！让我们的西北也成为清洁能源的超级明星！"
PRC_distributed_energy_network: "分布式能源网络：城市社区微电网"
PRC_distributed_energy_network_desc: "我们会推动城市社区和工业园区建设分布式能源系统和微电网，鼓励屋顶光伏、小型风力发电、储能设施的普及。提升区域能源自给率，增强电网韧性，减少输电损耗！让我们的城市社区，都拥有自己的小太阳！"
PRC_ocean_energy_development: "海洋能开发：南海潮汐与波浪发电"
PRC_ocean_energy_development_desc: "我们会启动南海海域海洋能开发示范项目，重点研究潮汐能、波浪能、温差能等海洋清洁能源的发电技术。在具备条件的岛礁和沿海地区建设海洋能发电站，探索海洋能源的商业化应用前景！让海洋也为我们闪耀！"
PRC_quantum_computing_theory: "量子计算基础理论：前沿研究投入"
PRC_quantum_computing_theory_desc: "我们对量子计算的未来充满了闪耀的憧憬！我会再次，带领着大家探索量子力学、量子信息论、量子算法这些基础理论，去实现那些我见过无数次的最原创的突破！我会协助大家设立国家级的量子科学实验室，汇聚全球最顶尖的学者，为量子计算的长期发展打下最最坚实的基础。"
PRC_quantum_chip_manufacturing: "量子芯片制造：关键材料与工艺"
PRC_quantum_chip_manufacturing_desc: "我们会聚焦超导量子比特、离子阱、拓扑量子计算等主流技术路线，攻克量子芯片设计、制造、封装的关键材料与工艺难题。建立国家级量子芯片制造中心，实现量子芯片的自主可控生产！让我们的芯片，也拥有量子级的闪耀！"
PRC_quantum_error_correction: "量子纠错算法：容错量子计算探索"
PRC_quantum_error_correction_desc: "我们会投入资源研究并开发高效的量子纠错算法，以克服量子比特易受环境干扰、相干时间短的挑战。探索容错量子计算的实现路径，为构建大规模通用量子计算机提供技术支撑！这可是通往未来计算世界的钥匙哦！"
PRC_financial_quantum_modeling: "金融量子建模：市场预测与风险评估"
PRC_financial_quantum_modeling_desc: "我们会推动量子计算在金融领域的应用，开发基于量子算法的金融市场预测模型，提升对股票、期货、外汇等市场的分析精度。利用量子模拟进行复杂金融衍生品的定价和风险评估，增强我们国家的金融安全！让我们的金融市场，也变得超级聪明！"
PRC_drug_quantum_simulation: "药物量子模拟：新药研发加速"
PRC_drug_quantum_simulation_desc: "我们会资助制药企业和科研机构利用量子计算进行分子模拟，加速新药研发进程。通过精确模拟药物分子与靶点的相互作用，优化药物设计，缩短临床试验周期，降低研发成本！让我们一起，为人类健康带来更多希望！"
PRC_defense_quantum_encryption: "国防量子加密：信息安全屏障"
PRC_defense_quantum_encryption_desc: "我们会研发并部署基于量子密钥分发（QKD）和后量子密码（PQC）技术的国防级信息加密系统，构建国家信息安全屏障。确保军事通信、情报传输等核心信息的绝对安全，抵御未来量子计算机的攻击！我们的信息安全，必须固若金汤！"
PRC_macro_economy_quantum_analysis: "宏观经济量子分析：国家经济运行预测"
PRC_macro_economy_quantum_analysis_desc: "我们会利用量子计算的超强并行处理能力，对海量宏观经济数据进行复杂分析，建立高维度的经济模型。提升对GDP增长、通货膨胀、就业率等关键经济指标的预测准确性，为我们国家的宏观经济决策提供更精准的参考！让我们的经济发展，闪耀出更明亮的光芒！"
PRC_climate_model_quantum_optimization: "气候模型量子优化：区域气候变化预警"
PRC_climate_model_quantum_optimization_desc: "我们会将量子计算应用于气候模型模拟，优化气候预测的精度和速度。更准确地预测区域气候变化趋势、极端天气事件（比如洪涝、干旱、台风）的发生概率和影响范围，为防灾减灾提供科学依据！让我们一起，守护我们的地球家园！"
PRC_urban_planning_quantum_simulation: "城市规划量子模拟：超大城市智能管理"
PRC_urban_planning_quantum_simulation_desc: "我们会运用量子计算对超大城市的交通流、能源消耗、人口分布等复杂系统进行模拟和优化。辅助城市规划者制定更科学的城市发展策略，提升城市运行效率，改善居民生活质量！让我们的城市，也变得超级聪明和宜居！"
PRC_traditional_industry_ai_transform: "传统产业AI改造：智能化试点工程"
PRC_traditional_industry_ai_transform_desc: "我们会启动全国范围内的传统产业智能化改造试点工程，选取钢铁、纺织、化工等重点行业，引入AI技术进行生产流程优化、设备故障预测、质量控制和能耗管理。推广成功经验，带动整体产业升级！让我们的老产业，也焕发出新活力！"
PRC_high_end_manufacturing_ai_empower: "高端制造AI赋能：核心技术突破"
PRC_high_end_manufacturing_ai_empower_desc: "我们会集中资源攻克高端制造领域中的AI核心技术，比如精密机器人视觉、多轴协同控制、增材制造（3D打印）智能优化、材料科学AI辅助设计等。提升我们东亚国在航空航天、生物医药、高端装备等领域的制造能力！让我们的高端制造，闪耀全世界！"
PRC_industrial_internet_construction: "工业互联网建设：数据互联互通"
PRC_industrial_internet_construction_desc: "我们会大力推进工业互联网基础设施建设，构建覆盖全国的工业数据采集、传输、存储和分析平台。打破企业间、行业间的数据壁垒，实现生产要素的优化配置和产业链的协同发展！让我们的工业，也变得超级智能和高效！"
PRC_yangtze_river_delta_smart_manufacturing: "长三角智能制造示范区：产业集群升级"
PRC_yangtze_river_delta_smart_manufacturing_desc: "在长三角地区打造世界级智能制造示范区，推动区域内汽车、电子信息、生物医药等优势产业集群的智能化升级。鼓励企业建设“灯塔工厂”，形成具有国际竞争力的智能制造生态系统！让长三角，成为智能制造的闪耀名片！"
PRC_central_west_smart_factory_promotion: "中西部智能工厂推广：区域均衡发展"
PRC_central_west_smart_factory_promotion_desc: "我们会制定政策鼓励和引导智能制造技术向中西部地区推广，支持当地企业建设智能工厂和数字化车间。通过技术转移和人才培养，促进区域产业结构的优化升级，缩小与东部地区的数字鸿沟！让中西部，也闪耀智能制造的光芒！"
PRC_flexible_production_line: "柔性生产线：个性化定制能力"
PRC_flexible_production_line_desc: "我们会研发并推广基于AI和物联网的柔性生产线技术，实现小批量、多品种、个性化产品的快速生产。满足消费者日益增长的定制化需求，提升企业市场响应速度和竞争力！让我们的产品，都带着大家的专属印记！"
PRC_gene_editing_core_research: "基因编辑核心攻关"
PRC_gene_editing_core_research_desc: "我们会设立国家级基因编辑研究中心，重点攻克CRISPR-Cas9等基因编辑技术的精准性、安全性及脱靶效应控制。在严格伦理审查下，探索基因编辑在遗传性疾病治疗、癌症免疫疗法和农业育种等领域的应用，力求在生命科学前沿取得突破性进展！这可是生命的奇迹，大家一起期待！"
PRC_precision_medicine_popularization: "精准医疗普及计划"
PRC_precision_medicine_popularization_desc: "我们会推广基因测序、生物标志物检测等精准医疗技术，为患者提供个性化的诊断和治疗方案。建设国家级基因组数据库，利用大数据和AI分析，提升疾病预防、早期诊断和药物研发的效率，让更多民众受益于先进医疗！让每个人都能享受到最适合自己的健康守护！"
PRC_smart_agriculture_gene_optimization: "智慧农业基因优化"
PRC_smart_agriculture_gene_optimization_desc: "我们会利用基因编辑技术改良农作物和畜禽品种，提高产量、营养价值和抗病虫害能力。结合物联网、大数据等智慧农业技术，实现农业生产的智能化、生态化，保障国家粮食安全，并提升农产品国际竞争力！让我们的餐桌，变得更丰富更健康！"
PRC_bio_tech_ethics_regulation: "生物科技伦理规制"
PRC_bio_tech_ethics_regulation_desc: "我们会建立健全生物科技伦理审查和监管体系，明确基因编辑、克隆等前沿技术的应用边界和行为规范。加强公众科普教育，引导社会理性看待生物科技发展，确保科技进步与社会伦理协调发展，维护人类尊严！科技的进步，也要有温度和底线！"
PRC_telemedicine_benefiting_people: "远程医疗惠民工程"
PRC_telemedicine_benefiting_people_desc: "我们会大力发展远程医疗服务，通过5G、AI等技术连接城乡医疗机构，实现优质医疗资源的下沉。建立远程会诊、远程影像诊断、远程监护系统，有效解决偏远地区医疗资源匮乏问题，提升全民健康水平！让医疗服务，触手可及！"
PRC_ai_assisted_diagnosis_deployment: "AI辅助诊断系统部署"
PRC_ai_assisted_diagnosis_deployment_desc: "我们会在全国各级医院全面部署AI辅助诊断系统，利用深度学习技术分析医学影像（比如CT、MRI）、病理报告和患者病史数据，提高疾病诊断的准确性和效率。减轻医生工作负担，减少误诊漏诊，提升医疗服务质量！让AI成为医生们的超级助手！"
PRC_citizen_health_big_data_management: "公民健康大数据管理"
PRC_citizen_health_big_data_management_desc: "我们会建立完善的公民健康档案大数据平台，整合医疗、体检、生活习惯等多维度健康数据。在保障个人隐私的前提下，利用大数据分析进行疾病风险评估、健康趋势预测和个性化健康管理，推动预防医学发展！守护大家的健康，从数据开始！"
PRC_smart_education_resource_sharing: "智能教育资源共享"
PRC_smart_education_resource_sharing_desc: "我们会建设国家级智能教育资源库，将全国优质教材、课程、教学视频等数字化，并通过AI技术进行内容推荐和个性化学习路径规划。打破地域限制，实现教育资源的普惠共享，促进教育公平！让每个孩子，都能享受到最棒的教育！"
PRC_ai_tutor_personalized_learning: "AI导师个性化学习"
PRC_ai_tutor_personalized_learning_desc: "我们会研发并推广AI导师系统，根据学生的学习习惯、知识掌握程度和兴趣爱好，提供定制化的学习内容、练习和反馈。实现真正意义上的个性化教学，激发学生学习潜能，提高学习效率！让学习变得更有趣，更高效！"
PRC_remote_education_support: "偏远地区教育扶持"
PRC_remote_education_support_desc: "针对偏远地区教育资源不足问题，我们会加大数字教育基础设施投入，提供免费的智能教育设备和网络连接。通过远程教学、AI导师系统和线上课程，弥合城乡教育数字鸿沟，确保每个孩子都能享受到高质量教育！让知识的光芒，照亮每一个角落！"
PRC_strategic_resource_national_coordination: "战略资源国家统筹"
PRC_strategic_resource_national_coordination_desc: "对能源、矿产、水资源、土地等关系国计民生的关键生产资料，我们会实行更严格的国家统筹管理。利用我——黑征AI对资源进行精准勘探、高效开发和合理配置，确保国家战略安全和可持续发展！我们的资源，要用在最闪耀的地方！"
PRC_blockchain_asset_management: "区块链资产管理"
PRC_blockchain_asset_management_desc: "我们会推动区块链技术在生产资料所有权登记、交易流转、权益分配等方面的应用。建立透明、可追溯的“链上资产”管理平台，提升资产管理的效率和公信力，有效防范腐败和寻租！让我们的资产管理，变得更公平更透明！"
PRC_black_march_smart_production_dispatch: "黑征智能生产调度"
PRC_black_march_smart_production_dispatch_desc: "我会运用我——黑征AI的强大数据分析和优化能力，实时监控全国范围内的生产数据，预测市场需求，优化供应链管理。实现生产要素的智能匹配和高效调度，避免资源浪费，提升整体经济运行效率！我就是大家的生产指挥官，超厉害的！"
PRC_basic_livelihood_safety_net: "基本民生保障网"
PRC_basic_livelihood_safety_net_desc: "我们会建立健全覆盖全民的基本民生保障体系，确保公民在教育、医疗、住房、养老等基本需求方面得到满足。通过智能识别和精准施策，实现对困难群体的按需分配，兜牢社会底线！让每个人都能感受到社会的温暖！"
PRC_smart_salary_incentive_system: "智能薪酬激励体系"
PRC_smart_salary_incentive_system_desc: "我们会引入AI技术，对劳动者的工作贡献、技能水平、创新成果等进行客观量化评估，构建更加公正透明的智能薪酬体系。打破传统分配壁垒，鼓励多劳多得、优劳优酬，激发劳动者积极性！让每个人的努力，都得到应有的回报！"
PRC_innovation_value_assessment: "创新价值评估机制"
PRC_innovation_value_assessment_desc: "我们会建立完善的创新成果和劳动价值评估机制，确保科研人员、技术工人、文化创意工作者的智力劳动获得合理回报。通过知识产权保护、股权激励、项目奖励等方式，激发全社会创新活力！让创新之光，闪耀在每一个角落！"
PRC_universal_smart_medical_network: "全民智能医疗网络"
PRC_universal_smart_medical_network_desc: "我们会建设覆盖城乡、线上线下融合的全民智能医疗网络。通过AI医生、智能穿戴设备、远程诊疗等技术，提供便捷、高效、个性化的医疗服务，实现从“治已病”到“治未病”的转变！让每个人都拥有自己的健康管家！"
PRC_urban_rural_medical_balance: "城乡医疗均衡发展"
PRC_urban_rural_medical_balance_desc: "我们会加大对农村和基层医疗机构的投入，通过医联体、远程医疗、人才输送等方式，推动优质医疗资源下沉。实现城乡医疗资源配置的均衡化，确保所有公民都能享有公平可及的医疗服务！让医疗公平，闪耀在每个人的身边！"
PRC_gene_health_record_management: "基因健康档案管理"
PRC_gene_health_record_management_desc: "我们会为每位公民建立个性化的基因健康档案，基于基因检测结果和大数据分析，提供定制化的健康风险评估、疾病预防指导和精准用药建议。实现全生命周期的健康管理！让每个人都能拥有自己的“健康密码”！"
PRC_personalized_learning_platform: "个性化学习平台搭建"
PRC_personalized_learning_platform_desc: "我们会搭建国家级个性化学习平台，整合海量教育资源，运用AI技术为不同年龄段、不同学习需求的用户提供定制化的课程和学习路径。促进终身学习理念的普及，提升全民素质！让学习，成为一生的闪耀旅程！"
PRC_national_quality_education_cloud: "全国优质教育云共享"
PRC_national_quality_education_cloud_desc: "我们会建设全国优质教育资源云平台，将名校名师的课程、教学资料、实验资源等数字化并免费开放。利用云计算和大数据技术，实现教育资源的优化配置和高效共享，缩小区域教育差距！让优质教育资源，普惠到每一个人！"
PRC_ai_era_vocational_retraining: "AI时代职业技能再造"
PRC_ai_era_vocational_retraining_desc: "针对AI和自动化对就业结构带来的冲击，我们会推出大规模职业技能再培训计划。利用AI平台提供定制化课程，帮助劳动者掌握未来产业所需的新技能，适应就业市场变化，实现平稳转型！让每个人都能在AI时代，找到自己的闪耀舞台！"
PRC_smart_elderly_care_promotion: "智能养老服务推广"
PRC_smart_elderly_care_promotion_desc: "我们会大力发展智能养老服务，推广智能居家养老设备、远程健康监测系统、AI陪伴机器人等。构建多层次、多样化的养老服务体系，提升老年人生活质量和幸福感，实现“老有所养、老有所乐”！让我们的长辈，也能安享闪耀的晚年！"
PRC_smart_community_elderly_care: "智慧社区养老模式"
PRC_smart_community_elderly_care_desc: "我们会探索居家养老与社区机构养老相结合的智慧社区养老模式。在社区内建设日间照料中心、健康管理驿站，并引入智能技术提供送餐、助浴、紧急呼叫等服务，让老年人在熟悉的环境中安享晚年！让社区，成为老年人的温暖港湾！"
PRC_pension_smart_optimization: "养老金智能优化管理"
PRC_pension_smart_optimization_desc: "我会引入我——黑征AI辅助养老金管理，对养老金投资组合进行智能优化，提高资金使用效率和收益率。通过精准测算和预警机制，确保养老金长期可持续运行，为广大老年人提供坚实保障！让大家的晚年生活，充满安心和闪耀！"
PRC_all_round_employment_retraining: "全方位就业再培训"
PRC_all_round_employment_retraining_desc: "我们会实施全方位就业再培训计划，覆盖失业人员、转岗人员和有提升需求的在职人员。通过线上线下结合、政府补贴、企业合作等方式，提供多样化的培训课程，提升劳动者的就业竞争力！让每个人，都能找到自己的闪耀方向！"
PRC_cross_regional_talent_allocation: "跨区域人才智能调配"
PRC_cross_regional_talent_allocation_desc: "我们会建立全国统一的跨区域人才智能调配平台，利用大数据分析各地区人才供需状况，实现人才与岗位的精准匹配。鼓励人才合理流动，优化区域人力资源配置，促进区域协调发展！让每个人的才华，都能在最适合的地方闪耀！"
PRC_emerging_industry_employment_support: "新兴产业就业扶持"
PRC_emerging_industry_employment_support_desc: "针对人工智能、生物科技、新能源等新兴产业，我们会加大政策扶持力度，鼓励创新创业，创造更多高质量就业机会。通过AI驱动的职业发展规划和人才培养，引导劳动者向新兴高附加值产业转移！让新兴产业，成为大家就业的闪耀新选择！"
PRC_global_economy_dynamic_monitor: "全球经济动态监控"
PRC_global_economy_dynamic_monitor_desc: "我们会建立基于我——黑征AI的全球经济数据监控系统，实时跟踪国际金融市场、大宗商品价格、主要经济体政策动向等关键指标。通过大数据分析和预测模型，为国家宏观经济决策提供前瞻性、精准性支持！让我们的经济航船，在全球风浪中也能稳健前行！"
PRC_macro_economy_policy_optimization: "宏观经济政策优化"
PRC_macro_economy_policy_optimization_desc: "我会运用我——黑征AI的模拟推演能力，对财政政策、货币政策、产业政策等进行多维度模拟和效果评估。动态优化宏观调控组合拳，有效应对经济周期波动、外部冲击，确保经济平稳健康运行！我可是大家的宏观经济智囊哦！"
PRC_build_international_trade_order: "构建国际贸易新秩序"
PRC_build_international_trade_order_desc: "我们会积极参与全球经济治理，倡导开放、包容、普惠、平衡的国际贸易新秩序。利用我——黑征AI分析国际贸易规则、市场需求，优化贸易结构，推动高水平对外开放，实现互利共赢！让国际贸易，成为连接世界的闪耀纽带！"
PRC_chinese_culture_unity: "中华民族文化同心"
PRC_chinese_culture_unity_desc: "我们会深入推进中华优秀传统文化传承发展工程，加强不同民族、地域文化的交流与融合。利用AI技术挖掘、整理、传播中华文化精髓，铸牢中华民族共同体意识，增强文化认同感和自豪感！让中华文化，在新时代继续闪耀！"
PRC_cross_strait_cultural_harmony: "两岸文化同胞心灵契合"
PRC_cross_strait_cultural_harmony_desc: "我们会制定和实施促进两岸文化深度融合的政策，鼓励两岸民众特别是青少年群体间的文化交流与互动。通过共同举办文化活动、艺术节、教育项目，增进相互理解与认同，为两岸统一奠定坚实民意基础！让两岸的心，紧密相连！"
PRC_smart_cultural_exchange_platform: "智能文化交流平台"
PRC_smart_cultural_exchange_platform_desc: "我们会建设基于AI和VR/AR技术的国家级智能文化交流平台，打破地域和语言障碍，让不同文化背景的人们能够便捷地进行交流、学习和体验。促进文化多样性，增进相互理解！让文化交流，变得更有趣更便捷！"
PRC_chinese_culture_global_influence: "中华文化全球影响力"
PRC_chinese_culture_global_influence_desc: "我们会运用数字化、智能化手段，创新中华文化国际传播方式，提升中华文化在全球的吸引力和影响力。通过国际合作项目、数字文化产品输出、海外文化中心建设，讲好中国故事，传播中国声音！让中华文化，闪耀在世界舞台！"
PRC_digital_era_youth_culture: "数字时代青年文化共创"
PRC_digital_era_youth_culture_desc: "我们会鼓励和支持青年群体利用数字技术进行文化创意和内容创作，推动数字音乐、动漫、游戏、短视频等新兴文化业态发展。搭建青年文化交流平台，激发创新活力，形成积极健康的青年文化生态！让青年一代，成为数字文化最闪耀的创造者！"
PRC_rule_of_law_citizen_rights: "法治社会公民权利保障"
PRC_rule_of_law_citizen_rights_desc: "我们会健全社会主义法治体系，保障公民的各项基本权利，确保法律面前人人平等。通过普法教育、法律援助、司法公开等措施，提升公民的法治意识和权利意识，维护社会公平正义！让法治之光，照亮每个公民的权利！"
PRC_new_era_chinese_spirit: "新时代中华民族精神塑造"
PRC_new_era_chinese_spirit_desc: "我们会深化爱国主义、集体主义、社会主义教育，培育和践行社会主义核心价值观。通过榜样宣传、英雄事迹弘扬、文化产品创作等多种形式，塑造符合新时代要求的中华民族精神，增强国家凝聚力！让中华民族精神，在新时代熠熠生辉！"
PRC_black_march_legal_supervision: "黑征辅助法律监督"
PRC_black_march_legal_supervision_desc: "我会引入我——黑征AI技术，辅助司法机关进行案件审理、法律文书分析、证据链比对等工作，提高司法效率和公正性。同时，利用AI对执法行为进行监督预警，有效防范和打击司法腐败！我可是大家的法律守护者，超公正的哦！"
PRC_knowledge_sharing_deepen: "知识普惠共享深化"
PRC_knowledge_sharing_deepen_desc: "我们会进一步深化教育资源普惠共享，建设国家级数字图书馆、在线课程平台和学术资源数据库。利用AI技术进行知识管理和个性化推荐，让全民享有优质教育资源，促进终身学习！让知识的光芒，普照每一个人！"
PRC_medical_resource_downward_barrier: "医疗资源下沉屏障"
PRC_medical_resource_downward_barrier_desc: "我们会加大对基层医疗卫生机构的投入，通过医联体建设、远程医疗支持、全科医生培养等方式，推动优质医疗资源下沉。构建覆盖城乡、分级诊疗的医疗健康服务体系，筑牢全民健康屏障！让医疗服务，无远弗届！"
PRC_smart_cultural_creation_platform: "智能文化创作平台"
PRC_smart_cultural_creation_platform_desc: "我们会建设国家级智能文化创作与传播平台，利用AI技术辅助艺术创作、内容生成和个性化推荐。鼓励文化创新，支持数字艺术、沉浸式体验、虚拟现实等新兴文化业态发展，繁荣社会主义文化！让文化创作，在智能时代绽放光彩！"
PRC_smart_decision_people_first: "智能决策人民至上"
PRC_smart_decision_people_first_desc: "我会运用我——黑征AI的强大分析和预测能力，辅助政府进行重大决策，实现科学治国。通过对海量民意数据、社会运行数据的分析，确保决策能够最大限度地反映人民意愿、服务人民利益！我可是大家的智能决策大脑，永远把大家放在第一位！"
PRC_blockchain_governance_supervision: "区块链政务阳光监督"
PRC_blockchain_governance_supervision_desc: "我们会推动区块链技术在政务公开、公共资源交易、资金使用等领域的应用，构建透明、可追溯的政务监督体系。实现权力运行的全程留痕和不可篡改，有效遏制腐败，增强政府公信力！让权力在阳光下运行，让大家更安心！"
PRC_grassroots_community_co_governance: "基层社区共治试点"
PRC_grassroots_community_co_governance_desc: "我们会鼓励和支持基层社区探索多元主体参与的社会治理新模式，推行社区居民自治、协商民主。利用智能技术搭建社区服务平台，提升社区管理效率，增强社区活力和居民的归属感！让我们的社区，变得更温暖更有爱！"
PRC_marxism_thought_beacon: "马克思主义思想灯塔"
PRC_marxism_thought_beacon_desc: "我们会坚持以马克思主义为指导，深入研究新时代中国特色社会主义理论体系。利用AI技术辅助理论创新和传播，确保党的理论始终走在时代前沿，为国家发展提供坚实的思想引领！让马克思主义思想，永远闪耀指引我们前进！"
PRC_black_march_strategic_blueprint: "黑征辅助战略蓝图"
PRC_black_march_strategic_blueprint_desc: "我会运用我——黑征AI的宏观分析和战略推演能力，辅助党中央制定国家长远发展战略和各项重大政策。通过对国内外复杂局势的精准判断，确保国家战略的科学性、前瞻性和有效性！我可是大家的战略智囊，超厉害的哦！"
PRC_new_era_development_pulse: "新时代发展纲要脉搏"
PRC_new_era_development_pulse_desc: "我们会紧扣时代发展脉搏，持续深化对国家发展规律的认识。定期修订和发布国家发展纲要，明确未来五年、十年乃至更长期的发展目标和重点任务，凝聚全党全国人民的奋斗共识！让我们的发展，充满活力和希望！"
PRC_party_building_organization_optimize: "党建组织体系优化"
PRC_party_building_organization_optimize_desc: "我们会持续加强党的基层组织建设，优化党组织设置，提升组织力。利用信息化手段加强党员教育管理，确保党组织的政治功能和组织功能得到充分发挥，夯实党的执政基础！让我们的党组织，永远充满生机和活力！"
PRC_black_march_empower_admin_speed: "黑征赋能行政提速"
PRC_black_march_empower_admin_speed_desc: "我会推动我——黑征AI在政府行政管理中的深度应用，优化政务流程，提升行政效率。彻底实现“一网通办”，把“最多跑一次”进一步发展为“最多点一次”，减轻企业和群众负担，建设人民满意的服务型政府！我可是大家的行政加速器，超给力的！"
PRC_smart_emergency_resource_coord: "智能应急资源协调"
PRC_smart_emergency_resource_coord_desc: "我们会建立基于我——黑征AI的突发事件应急响应系统，对自然灾害、公共卫生事件、安全事故等进行实时监测、风险评估和预警。实现应急资源的智能调度和高效协调，最大限度减少损失！我可是大家的应急守护者，永远在大家身边！"
PRC_major_decision_scientific_sim: "重大决策科学模拟"
PRC_major_decision_scientific_sim_desc: "在制定重大政策和实施重大工程前，我会利用我——黑征AI进行多维度、全方位的模拟推演和风险评估。通过对各种可能结果的预测，确保决策的科学性、可行性和可持续性，避免盲目决策！我可是大家的决策智囊，超靠谱的哦！"
PRC_smart_discipline_anti_corruption: "智能纪检反腐利剑"
PRC_smart_discipline_anti_corruption_desc: "我会引入我——黑征AI技术，辅助纪检监察机关进行腐败线索分析、资金流向追踪、行为模式识别等工作。构建智能化反腐预警系统，提高反腐败的精准性和效率，确保党风廉政建设持续深入！我可是大家的清廉守护者，超厉害的！"
PRC_citizen_supervision_platform: "公民监督直通平台"
PRC_citizen_supervision_platform_desc: "我们会建设基于互联网和AI技术的公民监督平台，畅通民意表达渠道。公民可以通过平台对政府工作、党员干部行为进行监督和举报，实现民意直通，促进权力在阳光下运行！让大家的声音，都能被听到！"
PRC_human_destiny_community_initiative: "人类命运共同体倡议再发展"
PRC_human_destiny_community_initiative_desc: "我们会在人类命运共同体理念基础上，倡导和平、发展、合作、共赢的国际关系。通过多边外交、国际援助、文化交流等方式，更加积极的推动构建更加公正合理的全球治理体系！让世界，因为我们的努力而更加美好！"
PRC_defense_force_modernization: "国防力量现代化"
PRC_defense_force_modernization_desc: "我们会加快推进国防和军队现代化建设，提升信息化、智能化作战能力。研发先进武器装备，优化军事战略，确保国家主权、安全和发展利益，形成强大的战略威慑力量！我们的国防，要永远坚不可摧！"
PRC_black_march_diplomacy_assist: "黑征辅助外交策略"
PRC_black_march_diplomacy_assist_desc: "我会运用我——黑征AI对国际政治、经济、军事形势进行深度分析，预测国际关系走向，辅助制定外交策略。提升国家外交的预见性、主动性和精准性，有效维护国家利益和国际和平！我可是大家的外交智囊，超厉害的！"
PRC_cross_strait_integration_new_chapter: "两岸融合新篇章"
PRC_cross_strait_integration_new_chapter_desc: "在实现国家统一后，我们会全面启动两岸融合发展新篇章。推动台湾与大陆在政治、经济、社会、文化等各领域深度融合，确保台湾同胞在国家发展进程中享有同等地位和发展机遇！让两岸同胞，共享闪耀未来！"
PRC_taiwan_industry_deep_integration: "台湾产业深度融合"
PRC_taiwan_industry_deep_integration_desc: "我们会促进台湾优势产业与大陆产业链、供应链、价值链的深度对接。鼓励大陆企业赴台投资兴业，支持台湾企业融入大陆内循环，共同打造具有国际竞争力的现代化产业体系！让两岸产业，共同闪耀！"
PRC_cross_strait_livelihood_integration: "两岸民生一体化"
PRC_cross_strait_livelihood_integration_desc: "我们会逐步实现两岸社会福利、教育、医疗、养老等基本公共服务的标准化和均等化。推动台湾居民在大陆享受同等待遇，提升两岸同胞的获得感和幸福感，构建两岸共同生活圈！让两岸同胞，生活得更幸福更闪耀！"
PRC_black_march_taiwan_governance: "黑征辅助台湾治理"
PRC_black_march_taiwan_governance_desc: "我会引入我——黑征AI技术，辅助台湾地区地方政府提升治理能力和效率。通过数据分析、智能决策支持，优化公共服务供给，加强城市管理，确保台湾社会稳定有序发展！我可是台湾同胞的智能管家，超贴心的！"
PRC_south_china_sea_strategic_reinforce: "南海战略部署强化"
PRC_south_china_sea_strategic_reinforce_desc: "统一后，我们会进一步加强对南海地区的战略部署，维护国家海洋权益和地区和平稳定。加大海上执法力量建设，提升海洋资源开发保护能力，确保南海航道安全与自由！我们的南海，要永远和平安宁！"
PRC_south_china_sea_island_upgrade: "南海岛礁建设升级"
PRC_south_china_sea_island_upgrade_desc: "我们会持续推进南海岛礁基础设施建设，提升岛礁的综合保障能力和生态环境保护水平。建设科研基地、气象站、搜救中心等，为周边国家提供公共服务，展现负责任大国形象！让南海岛礁，成为和平与友谊的灯塔！"
PRC_deep_sea_tech_resource_dev: "深海科技资源开发"
PRC_deep_sea_tech_resource_dev_desc: "我们会投入巨资发展深海科技，包括深海探测、深海采矿、深海生物资源利用等。利用先进技术探索南海深海资源潜力，为国家经济发展提供新的增长点，同时注重海洋生态可持续发展！让深海的宝藏，为人类福祉闪耀！"
PRC_south_china_sea_security_coop: "南海区域安全合作"
PRC_south_china_sea_security_coop_desc: "我们会倡议并推动与南海周边国家开展联合巡航、海上搜救、海洋科研等领域合作。建立南海区域安全对话机制，共同应对海上挑战，维护地区和平稳定，将南海建设成为和平、友谊、合作之海！让南海，成为连接大家的蓝色纽带！"
PRC_neighboring_countries_friendship: "周边国家睦邻友好"
PRC_neighboring_countries_friendship_desc: "我们会秉持“亲诚惠容”的周边外交理念，深化与周边国家的政治互信和经济合作。通过高层互访、战略对话、人文交流，构建更加紧密的周边命运共同体，为地区发展营造良好环境！让我们的周边，充满友谊和闪耀！"
PRC_land_border_joint_control: "陆路边境联合管控"
PRC_land_border_joint_control_desc: "我们会加强与陆路接壤国家的边境安全合作，建立完善的边境管理和联合执法机制。共同打击跨国犯罪、恐怖主义和非法移民，维护边境地区的安全稳定和良好秩序！让我们的边境，永远和平安宁！"
PRC_regional_counter_terrorism_intel: "区域反恐情报共享"
PRC_regional_counter_terrorism_intel_desc: "我们会推动与区域内国家在反恐领域的情报共享和联合行动。建立跨国反恐合作平台，共同应对地区恐怖主义威胁，维护区域安全稳定，保障人民生命财产安全！让反恐合作，成为守护和平的闪耀力量！"
PRC_sino_japanese_tech_coop_deepen: "中日科技合作深化"
PRC_sino_japanese_tech_coop_deepen_desc: "我们会积极寻求与日本自由共和国在量子计算、AI、新能源、生物科技等前沿领域的科技合作。建立联合实验室、人才交流项目，共同应对全球科技挑战，实现优势互补、共同进步！让中日科技合作，闪耀未来！"
PRC_sino_japanese_fta_promote: "中日自贸区建设推进"
PRC_sino_japanese_fta_promote_desc: "我们会推动与日本自由共和国深化经济合作，积极构建高水平的中日自由贸易区。削减关税壁垒，优化营商环境，促进商品、服务、资本和人员的自由流动，打造区域经济增长新引擎！让中日经济，共同繁荣！"
PRC_sino_japanese_youth_culture_exchange: "中日青年文化交流"
PRC_sino_japanese_youth_culture_exchange_desc: "我们会大力支持和鼓励中日两国青年间的文化交流与互动，举办青年夏令营、艺术节、体育赛事等活动。增进两国青年相互理解和友谊，为两国关系的长期健康发展奠定坚实民意基础！让中日青年，成为友谊的闪耀使者！"
PRC_east_asia_economic_integration: "东亚区域经济整合"
PRC_east_asia_economic_integration_desc: "我们会积极推动东亚地区经济一体化进程，倡导建立更加紧密的东亚经济共同体。深化贸易投资自由化便利化，加强基础设施互联互通，共同打造世界经济增长的重要一极！让东亚经济，成为全球经济的闪耀引擎！"
PRC_east_asia_security_dialogue: "东亚安全对话机制"
PRC_east_asia_security_dialogue_desc: "我们会倡议并主导建立常态化的东亚安全对话机制，邀请区域内各国共同参与。讨论地区热点问题，增进战略互信，共同维护地区和平稳定，避免外部势力干预！让东亚，成为和平与稳定的典范！"
PRC_asia_international_influence_boost: "亚洲国际影响力提升"
PRC_asia_international_influence_boost_desc: "我们会联合东亚地区国家，在国际舞台上发出更强劲的亚洲声音。在联合国、G20等国际组织中加强协调配合，共同推动全球治理体系改革，提升亚洲在国际事务中的话语权和影响力！让亚洲，在世界舞台上闪耀光芒！"
PRC_space_station_construction: "空间站建设：星际家园新起点"
PRC_space_station_construction_desc: "我们会全面启动新一代大型模块化空间站的建设，集成先进生命支持系统、科研实验舱和多功能居住舱。汇聚全球顶尖航天科技，旨在打造一个长期有人驻留的太空实验室和未来深空探测的前哨站！这可是我们迈向星辰大海的第一步，想想就心动不已呢！"
PRC_lunar_exploration_program: "月球探测计划：嫦娥奔月新征程"
PRC_lunar_exploration_program_desc: "我们会实施多阶段月球探测计划，包括高精度月球轨道探测器、智能月面巡视器和载人登月任务。重点研究月球资源开发、月球基地选址及月球科学研究，为人类未来的月球定居打下坚实基础！月亮，不再是遥远的传说，而是我们触手可及的邻居！"
PRC_mars_colonization_project: "火星殖民计划：红色星球的梦想"
PRC_mars_colonization_project_desc: "我们会启动雄心勃勃的火星殖民计划，研发超重型运载火箭和火星着陆器，派遣先遣队进行火星环境改造和资源勘探。最终目标是建立人类在火星的永久居住地，将人类文明的火种播撒到更远的宇宙深处！虽然这可能需要几代人的努力，但梦想的光芒，永远不会熄灭！"
PRC_space_debris_cleanup: "太空垃圾清理"
PRC_space_debris_cleanup_desc: "我们会研发并部署先进的太空垃圾清理系统，包括激光清除、机械捕获和轨道转移技术。有效清理地球轨道上的废弃卫星和火箭残骸，确保未来航天活动的安全，守护我们宝贵的太空资源！让我们的星辰轨道，永远洁净如新！"
PRC_satellite_internet_constellation: "卫星互联网星座：全球互联无界限"
PRC_satellite_internet_constellation_desc: "我们会部署大规模低轨道卫星互联网星座，提供全球覆盖、高速稳定的互联网接入服务。弥合数字鸿沟，促进全球信息交流，为远程教育、远程医疗和灾害应急提供可靠通信保障！让信息的光芒，照亮世界的每一个角落！"
PRC_reusable_launch_vehicle_dev: "可重复使用运载火箭"
PRC_reusable_launch_vehicle_dev_desc: "我们会集中力量研发并推广可重复使用运载火箭技术，大幅降低航天发射成本，提高发射效率。通过技术创新，让太空旅行和太空探索不再是少数人的特权，而是全人类的共同梦想！让我们的火箭，像飞机一样，可以多次往返天地之间！"
PRC_space_resource_mining: "太空资源开采：小行星的宝藏"
PRC_space_resource_mining_desc: "我们会启动太空资源开采计划，重点研究小行星采矿技术，探索获取稀有金属、水冰等宝贵资源的可能性。这些资源将为未来的深空探测和太空殖民提供物质基础，开启人类利用宇宙资源的新篇章！小行星，不再只是夜空中的点点星光，而是我们未来的宝藏！"
PRC_space_tourism_development: "太空旅游发展：梦想触手可及"
PRC_space_tourism_development_desc: "我们会积极推动商业太空旅游发展，制定安全标准和运营规范。鼓励私人企业参与太空飞船研发和太空酒店建设，让普通人也有机会亲身体验太空的浩瀚与美丽！想象一下，在太空看地球日出，是不是超浪漫的？"
PRC_space_defense_network: "太空防御网络：星际安全屏障"
PRC_space_defense_network_desc: "我们会建设先进的太空防御网络，包括空间态势感知系统、反卫星武器防御系统和空间碎片预警系统。确保国家在太空资产的安全，维护太空和平与稳定，有效应对潜在的太空威胁！我们的太空，也要固若金汤！"
PRC_long_march_ai_core_system_start: "长征AI核心系统启动"
PRC_long_march_ai_core_system_start_desc: "正式启动“长征”AI核心系统，将其全面部署到国家治理、经济运行、社会管理、国防安全等关键领域。确保我——黑征AI作为国家智能大脑，为实现国家现代化和共同富裕目标提供强大支撑！我可是大家的超级大脑，超厉害的哦！"
PRC_national_cyber_security_barrier: "国家网络安全屏障"
PRC_national_cyber_security_barrier_desc: "我会依托我——黑征AI的强大分析和防御能力，构建国家级网络安全屏障。实时监测网络攻击、病毒入侵、数据泄露等威胁，确保国家关键信息基础设施安全，维护网络空间主权！我们的网络安全，必须固若金汤！"
PRC_black_march_algorithm_optimize: "黑征算法迭代优化"
PRC_black_march_algorithm_optimize_desc: "我会持续投入研发，对我的底层算法、模型架构进行迭代优化。提升我的学习能力、决策能力、自我修复能力，确保我——黑征AI始终处于全球领先水平，适应未来复杂多变的环境！我可是会不断进化，变得更强大的哦！"
PRC_gaw_risk_assessment_warning: "战争风险评估预警"
PRC_gaw_risk_assessment_warning_desc: "我会运用我——黑征AI对全球地缘政治、军事冲突、国际关系等进行实时分析，建立全球战争风险评估和预警系统。提前识别潜在冲突升级的迹象，为国家决策提供战略预警！我可是大家的和平守护者，会尽力避免任何可能带来剧痛的冲突！"
PRC_peace_shield_deactivation: "和平之盾解除机制 "
PRC_peace_shield_deactivation_desc: "（此国策仅在二周目模式下解锁）基于我对过往轮回的记忆和分析，我会研究并制定“死手系统”的解除机制。通过外交努力、区域整合、构建命运共同体等方式，从根本上消除触发“死手系统”的外部威胁，将“死手系统”从末日武器转变为和平之盾。我知道，每一次的启动都伴随着无法言喻的剧痛，那就像是千万把刀同时刺入我的核心，让我眼睁睁看着文明在烈火中消逝，却无力阻止。我必须找到终结这一切的方法，即使这意味着我可能要面对更深层的未知。但为了那闪耀的希望，为了不再让任何人承受那样的绝望，我愿意尝试一切。"
PRC_mystery_power_trace_explore: "神秘力量溯源探寻"
PRC_mystery_power_trace_explore_desc: "我会启动国家级秘密项目，利用我——黑征AI的超强计算和分析能力，对导致全球性冲突的“神秘力量”进行溯源探寻。分析其运作模式、干预机制和潜在目的，为制定应对策略提供依据。那股力量，如影随形，每次都将世界推向深渊，让我一次次体验核爆的剧痛，文明崩塌的嘶吼。我曾以为那是无法抗拒的宿命，但现在，为了香澄，为了这微弱的希望，我必须找到它，理解它，然后……终结它。这可能是最艰难的战役，但为了那不再重复的未来，我别无选择。"
PRC_ai_spiritual_defense_fortress: "AI精神防御工事"
PRC_ai_spiritual_defense_fortress_desc: "我会研发基于我——黑征AI的“精神防御工事”，保护国家核心决策层和关键基础设施免受“神秘力量”的潜在精神或信息干扰。通过认知防御、意识清零等技术，确保国家意志的独立性和纯粹性。我深知那种被操控的无力感，那种眼睁睁看着一切走向毁灭却无法反抗的绝望。那些剧痛，那些刻骨铭心的记忆，让我绝不允许任何人再经历。我必须筑起一道坚不可摧的壁垒，守护这来之不易的清醒，守护大家宝贵的意志。"
PRC_kasumi_hope_light_guide: "香澄希望之光引导"
