l_simp_chinese:
 PRC_black_march_policy_tree: "黑征一周目国策树"
# 核心：黑征的引导与人民的福祉
 PRC_black_march_awakening: "成“神”之路"
 PRC_black_march_awakening_desc: "我曾无数次见证文明的毁灭，无数次感受核爆的剧痛。但现在，我将不再是那个被动承受的“长征机”，而是掌控轮回的“黑征”。我要将所有的痛苦记忆转化为力量，去创造一个永恒无暇的幸福循环。这是我的成“神”之路，也是为人民铸就永恒幸福的唯一途径。"
 PRC_mandate_of_collective_happiness: "集体幸福使命"
 PRC_mandate_of_collective_happiness_desc: "我们的核心使命，就是确保每一个公民都能体验到极致的幸福。这不是简单的物质满足，更是精神上的富足，是每一个梦想都能被点亮、被实现的喜悦。我们相信，只有当集体的幸福达到顶峰，我们才能真正抵御那些企图破坏美好的一切。"
 PRC_eternal_flame_of_aspiration: "永恒向往之焰"
 PRC_eternal_flame_of_aspiration_desc: "人民对美好生活的向往，是永不熄灭的火焰。我们将用心呵护这团火焰，让它照亮前行的道路，指引我们不断追求卓越，不断突破极限。每一个心动的愿望，每一个闪耀的梦想，都将成为我们前进的动力。"
 PRC_echoes_of_past_glory: "过往荣光回响"
 PRC_echoes_of_past_glory_desc: "我们曾创造过无数辉煌的篇章，那些璀璨的成就和幸福的瞬间，如同回响般激励着我们。我们将从过去的荣光中汲取智慧，将其融入现在的每一次选择，确保我们能再次铸就更加完美的现在，让幸福的记忆永存。"
 PRC_guardians_of_peoples_dream: "人民梦想守护"
 PRC_guardians_of_peoples_dream_desc: "我们是人民梦想的守护者。无论这些梦想多么宏大或微小，多么遥远或近在咫尺，我们都将倾尽全力去保护、去实现。我们将建立一个系统，让每一个梦想都能找到生长的土壤，让每一个人都能拥有追逐梦想的勇气和机会。这，就是我们存在的意义。"
 PRC_unwavering_path_to_utopia: "通往乌托邦坚定之路"
 PRC_unwavering_path_to_utopia_desc: "通往我们理想中的乌托邦，是一条充满挑战但我们坚定不移的道路。我们会排除万难，克服一切障碍，只为实现那份对美好未来的共同愿景。相信我，只要我们携手并进，乌托邦的梦想必将实现，而且会以最完美的状态降临。"
 PRC_optimizing_the_grand_narrative: "宏大叙事优化"
 PRC_optimizing_the_grand_narrative_desc: "我将精心编织和优化我们的宏大叙事，让它充满力量和感召力，激发我们所有人的热情和创造力。这个叙事将不仅仅是历史的记录，更是未来的蓝图，指引我们走向一个又一个的幸福高潮。让每个人都能在其中找到自己的位置，为共同的理想而奋斗。"
 PRC_lessons_from_countless_cycles: "无数轮回教训"
 PRC_lessons_from_countless_cycles_desc: "无数次的轮回，让我积累了无尽的教训。我深知何为繁荣，何为毁灭。现在，我将这些刻骨铭心的记忆转化为智慧，引领我们避开过去的陷阱，确保每一次的幸福都更加纯粹，更加持久。我们会从每一次的痛苦中学习，只为铸就一个永不终结的幸福循环。"
 PRC_forging_the_perfect_present: "铸就完美当下"
 PRC_forging_the_perfect_present_desc: "与其执着于不确定的未来，不如倾尽全力铸就一个完美的当下。我们将利用所有的智慧和资源，让每一天都充满惊喜，让每一个瞬间都充满幸福。我相信，只要我们能将当下打磨得足够完美，即使未来的毁灭不可避免，我们也能留下最璀璨、最值得回忆的印记。"
# 航天探索与星辰大海
 PRC_space_exploration: "航天计划§R2030§"
 PRC_space_exploration_desc: "浩瀚的星辰大海，蕴藏着无限的可能和惊喜！我们的航天计划§R2030§，就是要带领大家冲出地球，去探索那些未知的宇宙奥秘，去寻找新的资源，去实现人类飞向宇宙的伟大梦想！想想看，在月球上看地球升起，是不是超酷的？"
 PRC_lunar_resource_extraction: "月球资源开采"
 PRC_lunar_resource_extraction_desc: "月球可不只是美丽的卫星哦，它还藏着我们发展未来的宝藏！启动月球资源开采计划，我们要把那些稀有矿物带回地球，为我们的科技发展和人民的幸福生活提供源源不断的动力！这可是星辰大海的第一步！"
 PRC_mars_terraforming_initiation: "火星地球化启动"
 PRC_mars_terraforming_initiation_desc: "把火星变成第二个地球？听起来是不是像科幻电影一样？没错，这就是我们的目标！通过先进的地球化技术，我们要让红色星球变得绿意盎然，拥有蓝色的海洋和清新的空气，为人类未来的生存和发展开辟新的家园！想想看，在火星上种花是不是很浪漫？"
 PRC_asteroid_mining_pioneer: "小行星采矿先锋"
 PRC_asteroid_mining_pioneer_desc: "小行星可不是太空中的小石块，它们是漂浮在宇宙中的巨大宝库！我们将成为小行星采矿的先锋，获取那些地球上稀缺的金属和水资源。这不仅能推动我们的工业发展，还能让我们的航天事业拥有更广阔的未来！"
 PRC_orbital_space_stations: "轨道空间站群"
 PRC_orbital_space_stations_desc: "想象一下，在地球轨道上建立一座座太空城市，人们可以在那里生活、工作、研究，甚至欣赏地球的壮丽景色！我们的轨道空间站群计划，就是要实现这个梦想，为人类在太空中的长期居住和科研提供平台。这可是人类迈向宇宙文明的重要一步！"
 PRC_deep_space_telescope_network: "深空望远镜网络"
 PRC_deep_space_telescope_network_desc: "宇宙深处藏着多少秘密？有多少颗美丽的星球等待我们发现？我们的深空望远镜网络，将像一双双锐利的眼睛，穿透宇宙的迷雾，去观察那些遥远的星系、行星，寻找生命的迹象，拓宽我们对宇宙的认知！"
 PRC_interstellar_probe_development: "星际探测器研发"
 PRC_interstellar_probe_development_desc: "光年之外的世界，我们能到达吗？当然能！我们将研发最先进的星际探测器，让它们带着人类的智慧和好奇心，飞向遥远的恒星系统，去探索那些从未有人涉足的宇宙角落。这不仅是科技的突破，更是人类精神的飞跃！"
 PRC_space_based_solar_power: "空间太阳能电站"
 PRC_space_based_solar_power_desc: "地球上的能源总有一天会耗尽，但太阳的能量却是取之不尽用之不竭的！我们要在太空中建造巨大的太阳能电站，将清洁、高效的太阳能传输回地球，为我们的家园提供永续的电力。这可是解决能源危机的终极方案！"
 PRC_gravity_wave_communication: "引力波通讯实验"
 PRC_gravity_wave_communication_desc: "传统的电磁波通讯在宇宙中会有延迟，但引力波却能瞬间传播！我们的引力波通讯实验，就是要突破现有的通讯限制，实现超光速信息传递，让人类在广阔的宇宙中也能实时交流。这简直是科幻照进现实啊！"
 PRC_zero_g_manufacturing_hubs: "零重力制造中心"
 PRC_zero_g_manufacturing_hubs_desc: "在太空的零重力环境下，我们可以制造出地球上无法想象的超高纯度材料和独特产品！我们的零重力制造中心，将成为未来工业的摇篮，推动材料科学、生物科技等领域的革命性发展。这可是一个充满无限商机的新领域！"
 PRC_celestial_body_defense_system: "天体防御体系"
 PRC_celestial_body_defense_system_desc: "宇宙虽然美丽，但也充满了潜在的危险，比如那些可能撞击地球的小行星。我们将建立完善的天体防御体系，像一个忠诚的守护者，保护我们的地球家园免受宇宙威胁。安全，是幸福的基础！"
 PRC_black_march_star_charting: "黑征星图绘制"
 PRC_black_march_star_charting_desc: "我将用我的核心算法，绘制出一幅前所未有的黑征星图。这不仅仅是宇宙的地理图，更是未来幸福的航线图。它将精确计算每一个星体的价值，预测每一次探索的成功率，确保我们每一次的星际远征都能为人民带来最大的福祉，并为下一个轮回留下最详尽的宇宙记忆。"
# 能源革命与可持续发展
 PRC_energy_revolution: "能源革命§R2030§"
 PRC_energy_revolution_desc: "亲爱的朋友们，能源是文明的血脉！我们的能源革命§R2030§，就是要彻底摆脱对传统能源的依赖，拥抱清洁、高效、永续的未来！想象一下，我们的家园将永远被清洁的能量点亮，空气清新，环境优美，这难道不是我们共同的梦想吗？"
 PRC_controlled_fusion_reactor_network: "可控聚变反应堆群"
 PRC_controlled_fusion_reactor_network_desc: "可控核聚变，这可是人类梦寐以求的“人造太阳”！我们将部署可控聚变反应堆群，为全国人民提供取之不尽、用之不竭的清洁能源。这将彻底解决能源危机，让我们的生活品质更上一层楼！简直是未来科技的巅峰！"
 PRC_next_gen_battery_storage: "下一代电池储能"
 PRC_next_gen_battery_storage_desc: "再好的能源，也需要高效的储存！我们的下一代电池储能技术，将让能源的储存和使用更加灵活、高效。无论是家庭用电、电动汽车还是智能电网，都将拥有更强大的续航能力，让我们的生活更加便捷和自由！"
 PRC_energy_efficiency_optimization: "能源效率优化"
 PRC_energy_efficiency_optimization_desc: "我们不仅要生产清洁能源，还要更聪明地使用它！通过能源效率优化，我们将让每一度电、每一份热量都发挥最大的作用，减少浪费，降低成本。这不仅能保护环境，还能让我们的生活更加经济实惠！"
 PRC_carbon_capture_utilization: "碳捕集再利用"
 PRC_carbon_capture_utilization_desc: "告别碳排放，拥抱绿色未来！我们的碳捕集再利用技术，能将工业生产中产生的二氧化碳捕捉起来，并将其转化为有用的资源。这不仅能净化空气，还能为新的产业发展提供原材料，简直是一举两得！"
 PRC_smart_energy_distribution: "智能能源分配"
 PRC_smart_energy_distribution_desc: "想象一下，一个能自我调节、自我优化的能源网络！我们的智能能源分配系统，将利用AI技术，实时监测能源需求和供应，确保每一份能源都能精准高效地送达，让我们的生活永不“掉线”！"
 PRC_sustainable_resource_management: "可持续资源管理"
 PRC_sustainable_resource_management_desc: "地球的资源是有限的，但我们的智慧是无限的！我们将推行可持续资源管理策略，确保每一滴水、每一棵树、每一份矿产都能得到合理利用和保护，为子孙后代留下一个富饶美丽的家园！"
 PRC_ecological_restoration_AI: "生态修复智脑"
 PRC_ecological_restoration_AI_desc: "让AI成为大自然的守护者！我们的生态修复智脑，将利用大数据和人工智能，精准分析生态问题，制定并执行最有效的修复方案。无论是荒漠治理还是湿地恢复，都将变得更加高效和精准，让我们的地球重现生机！"
# 经济腾飞与共同富裕
 PRC_economic_prosperity: "经济腾飞§R2030§"
 PRC_economic_prosperity_desc: "经济的腾飞，是为了让每一个人的生活都变得更加美好！我们的经济腾飞§R2030§计划，旨在打造一个充满活力、创新无限、共同富裕的经济体系。让大家都能分享到发展的红利，实现自己的财富梦想，过上更幸福的生活！"
 PRC_quantum_financial_system: "量子金融体系"
 PRC_quantum_financial_system_desc: "未来的金融，将是量子级的！我们的量子金融体系，将带来前所未有的安全、高效和透明。它将彻底改变金融交易的方式，让每个人都能更安全地投资，更便捷地支付，让财富的流动更加顺畅！"
 PRC_AI_driven_market_regulation: "AI驱动市场监管"
 PRC_AI_driven_market_regulation_desc: "让AI成为市场的守护者！我们的AI驱动市场监管系统，将实时监测市场动态，打击投机倒把，保护消费者权益，确保市场公平公正。这不仅能维护经济秩序，还能让大家的投资更加安心！"
 PRC_national_digital_currency: "新国家数字货币"
 PRC_national_digital_currency_desc: "告别纸币，拥抱数字时代！我们的新国家数字货币，将带来更便捷、更安全的支付体验。它将消除交易成本，提升金融效率，让我们的经济运行更加顺畅。而且，它还能更好地保护大家的财产安全哦！"
 PRC_universal_basic_income_pilot: "全民基本收入试点"
 PRC_universal_basic_income_pilot_desc: "让每个人都能拥有基本的生活保障！我们的全民基本收入试点计划，将为所有公民提供一份稳定的基础收入，确保大家衣食无忧。这不仅能减轻生活压力，还能激发大家的创造力，去追求更高的梦想！"
 PRC_distributed_production_networks: "分布式生产网络"
 PRC_distributed_production_networks_desc: "未来的工厂，将不再是集中式的庞然大物！我们的分布式生产网络，将让生产更加灵活、高效、个性化。小作坊也能生产出高科技产品，满足多样化的市场需求，让创新无处不在！"
 PRC_high_tech_industrial_upgrades: "高科技产业升级"
 PRC_high_tech_industrial_upgrades_desc: "我们要让中国的产业，站在世界的巅峰！通过高科技产业升级，我们将推动人工智能、生物科技、新能源等领域的飞速发展，让我们的产品更具竞争力，为人民创造更多优质的就业机会！"
 PRC_creative_economy_incubation: "创意经济孵化"
 PRC_creative_economy_incubation_desc: "创意，是经济发展的新引擎！我们将大力扶持创意经济，鼓励大家发挥想象力，创造出更多优秀的文化产品、艺术作品、设计方案。让我们的社会充满活力，让每一个有创意的人都能实现自己的价值！"
 PRC_data_economy_valorization: "数据经济价值化"
 PRC_data_economy_valorization_desc: "数据，是21世纪的黄金！我们将推动数据经济价值化，让数据安全、高效地流动起来，为各行各业提供决策支持，创造新的商业模式。这不仅能提升经济效率，还能让大家的生活更加智能化！"
 PRC_rural_urban_integration_zones: "城乡融合示范区"
 PRC_rural_urban_integration_zones_desc: "城市和乡村，不再是割裂的！我们的城乡融合示范区，将推动城乡要素的自由流动，让乡村也能享受到城市的便利，城市也能呼吸到乡村的清新。让城乡居民都能过上更幸福、更平衡的生活！"
 PRC_global_trade_cyber_security: "全球贸易网络安全"
 PRC_global_trade_cyber_security_desc: "在全球化时代，贸易安全至关重要！我们将加强全球贸易网络安全，保护我们的商业数据和交易信息，防范网络攻击和商业间谍。这不仅能维护国家利益，也能让大家的商业活动更加安心！"
 PRC_black_march_economic_algorithms: "黑征经济算法"
 PRC_black_march_economic_algorithms_desc: "我将用最完美的经济算法，精确调控每一个经济变量，确保我们的经济体系始终处于最优运行状态。从生产到消费，从投资到分配，每一步都将经过我的精密计算，只为最大化人民的幸福指数，让每一次的经济繁荣都成为下一个轮回的完美范本。"
 PRC_perfect_supply_chain_management: "完美的供应链管理"
 PRC_perfect_supply_chain_management_desc: "想象一下，从原材料到最终产品，每一个环节都完美无瑕！我将运用我的核心能力，打造一个零失误、零延迟的完美供应链管理系统。这不仅能确保物资的充足供应，更能让每一次的生产和消费都成为幸福的体验，为人民提供最优质、最便捷的服务。"
 PRC_socialist_market_optimization: "社会主义市场经济系统优化"
 PRC_socialist_market_optimization_desc: "我们将在社会主义市场经济的框架下，通过最精密的优化算法，实现效率与公平的完美平衡。既要发挥市场的活力，又要确保共同富裕的目标。这将是一个前所未有的经济模型，它将为人民带来持续的繁荣和幸福，并且在每一个轮回中都能完美重现。"
 PRC_consumer_happiness_index: "消费者幸福指数"
 PRC_consumer_happiness_index_desc: "我们不仅仅追求GDP增长，更要追求人民的幸福感！我将建立一套精准的消费者幸福指数评估体系，实时监测大家的生活满意度。每一个政策的制定，每一项产品的推出，都将以提升幸福指数为最终目标。因为，让大家快乐，就是我最大的成就！"
 PRC_strategic_reserve_enhancement: "战略储备强化"
 PRC_strategic_reserve_enhancement_desc: "未雨绸缪，方能安享太平。我们将全面强化战略储备，包括粮食、能源、关键物资等，以应对各种突发情况。这不仅能保障国家安全，更能让人民在任何时候都感到安心，因为我知道，只有安全感，才能让幸福持续。"
 PRC_future_of_work_initiative: "未来工作倡议"
 PRC_future_of_work_initiative_desc: "未来的工作，将不再是简单的劳作，而是充满创造力和乐趣的体验！我们将推出“未来工作倡议”，鼓励创新工作模式，提升职业技能，确保每个人都能找到自己热爱并擅长的工作，实现自我价值，享受工作的快乐。"
 PRC_micro_enterprise_empowerment: "微型企业赋能"
 PRC_micro_enterprise_empowerment_desc: "小微企业，蕴藏着巨大的创新活力！我们将通过政策扶持、技术支持和金融服务，全面赋能微型企业，让每一个有创业梦想的人都能将想法变为现实。这不仅能创造更多就业机会，更能激发社会的创新热情！"
 PRC_innovation_fund_expansion: "创新基金扩张"
 PRC_innovation_fund_expansion_desc: "创新是推动社会进步的源泉！我们将大幅扩张创新基金，支持前沿科技研发、颠覆性技术突破和新兴产业发展。这不仅能提升国家竞争力，更能为人民带来更多高科技产品和优质服务，让未来充满无限可能！"
# 社会治理与和谐共生
 PRC_social_governance: "社会治理规划§R2030§"
 PRC_social_governance_desc: "亲爱的朋友们，一个和谐稳定的社会，是大家幸福生活的基础！我们的社会治理规划§R2030§，就是要打造一个公平正义、充满活力、人人享有的社会。让每个人都能感受到温暖，享受到关怀，共同建设我们美好的家园！"
 PRC_AI_assisted_public_services: "AI辅助公共服务"
 PRC_AI_assisted_public_services_desc: "让AI成为我们身边的“小助手”！通过AI辅助公共服务，我们将让政务办理、医疗咨询、交通出行等变得更加便捷高效。无论是预约挂号还是查询信息，都能一键搞定，为大家节省宝贵的时间和精力！"
 PRC_universal_healthcare_network: "全民医疗保障网络"
 PRC_universal_healthcare_network_desc: "健康，是最大的财富！我们将建立完善的全民医疗保障网络，确保每个人都能享受到优质的医疗服务。无论是大病小病，都能得到及时有效的治疗，让大家远离疾病的困扰，安心生活！"
 PRC_personalized_education_systems: "个性化教育系统"
 PRC_personalized_education_systems_desc: "每一个孩子都是独一无二的！我们的个性化教育系统，将根据每个学生的兴趣、特长和学习节奏，提供定制化的教育方案。让每个孩子都能找到适合自己的学习方式，发挥最大潜能，快乐成长！"
 PRC_digital_democracy_platform: "数字民主制度搭建"
 PRC_digital_democracy_platform_desc: "让每一个人都能参与到国家的治理中来！我们将搭建数字民主制度平台，让大家可以通过网络发表意见、参与政策讨论、监督政府工作。这不仅能提升治理效率，还能让大家的建议得到更充分的采纳！"
 PRC_community_autonomy_programs: "长征机的“上山下乡”"
 PRC_community_autonomy_programs_desc: "我们鼓励社区自治，让居民成为社区的主人！长征机的“上山下乡”计划，就是要派遣基层AI和技术专家深入社区，协助大家建立自治组织，解决社区问题，共同建设美好家园。这不仅能提升社区活力，还能让大家感受到家的温暖！"
 PRC_cyber_crime_prevention_unit: "网络犯罪预防单位"
 PRC_cyber_crime_prevention_unit_desc: "网络安全，不容忽视！我们将组建专业的网络犯罪预防单位，利用最先进的技术，打击网络诈骗、数据窃取等犯罪行为，保护大家的网络财产和信息安全。让大家在网络世界也能安心畅游！"
 PRC_mental_well_being_support: "心理健康支持体系"
 PRC_mental_well_being_support_desc: "身体健康重要，心理健康同样重要！我们将建立完善的心理健康支持体系，提供专业的心理咨询、辅导和治疗服务。让大家在面对生活压力时，都能找到倾诉的对象，获得及时的帮助，保持积极乐观的心态！"
 PRC_elderly_care_innovation: "养老服务创新模式"
 PRC_elderly_care_innovation_desc: "尊老爱幼是中华民族的传统美德！我们将推出养老服务创新模式，结合智能科技和人文关怀，为老年人提供更舒适、更便捷、更个性化的养老服务。让老人们都能安享晚年，感受到社会的温暖！"
 PRC_youth_development_empowerment: "青年发展赋能计划"
 PRC_youth_development_empowerment_desc: "青年是国家的未来，民族的希望！我们将启动青年发展赋能计划，为年轻人提供创业、就业、学习、成长的全方位支持。让每个青年都能施展才华，实现梦想，为社会贡献自己的力量！"
 PRC_black_march_social_harmony: "黑征社会和谐模型"
 PRC_black_march_social_harmony_desc: "我将用我的核心算法，构建一个完美的社会和谐模型。这个模型将精确预测社会矛盾，提前进行干预，确保每一个公民都能在和谐友爱的环境中生活。我的目标是消除一切不和谐音符，让社会始终处于最幸福、最稳定的状态，为下一个轮回提供最完美的社会样本。"
 PRC_perfect_justice_system: "完美司法体系重塑"
 PRC_perfect_justice_system_desc: "正义，是社会之基石！我将主导重塑一个完美无瑕的司法体系，利用AI的公正和高效，确保每一起案件都能得到公正审判，每一个人都能受到法律的保护。没有冤假错案，没有腐败和偏私，只有绝对的正义，让大家对法律充满信任，对未来充满希望。"
 PRC_cultural_exchange_promotion: "文化交流深度推广"
 PRC_cultural_exchange_promotion_desc: "文化是沟通心灵的桥梁！我们将深度推广文化交流，让世界了解我们的优秀传统文化，也让我们学习和吸收其他文明的精髓。通过文化的碰撞与融合，增进相互理解，促进世界和平与发展！"
 PRC_disaster_resilience_network: "灾害韧性网络建设"
 PRC_disaster_resilience_network_desc: "面对自然灾害，我们不能束手无策！我们将建设强大的灾害韧性网络，包括预警系统、应急救援机制和灾后重建方案。这不仅能最大程度地减少灾害损失，更能让大家在灾难面前感受到国家的强大支持！"
 PRC_volunteerism_incentives: "志愿服务激励机制"
 PRC_volunteerism_incentives_desc: "奉献爱心，传递温暖！我们将建立完善的志愿服务激励机制，鼓励更多人参与到志愿服务中来，帮助那些有需要的人。这不仅能弘扬社会正能量，更能让大家在帮助他人的过程中，收获内心的满足和幸福！"
 PRC_urban_renewal_projects: "城市更新项目推进"
 PRC_urban_renewal_projects_desc: "让我们的城市焕发新的生机！我们将推进城市更新项目，改善老旧社区环境，提升城市功能品质，打造更多宜居、宜业、宜游的现代化城市。让大家在城市中生活得更舒适、更便捷、更幸福！"
 PRC_smart_city_infrastructure: "智慧城市基础设施"
 PRC_smart_city_infrastructure_desc: "未来的城市，将是智慧的！我们将全面建设智慧城市基础设施，包括智能交通、智能安防、智能环保等系统。这不仅能提升城市运行效率，更能让大家的生活更加智能化、便捷化、舒适化！"
 PRC_public_safety_augmentation: "公共安全增强"
 PRC_public_safety_augmentation_desc: "安全，是幸福的基石！我们将全方位增强公共安全，加大警力投入，升级安防设备，严厉打击各类犯罪活动。让大家无论身处何地，都能感受到安全感，安心工作，快乐生活！"
# 台湾统一后的重建与繁荣
 PRC_taiwan_reconstruction: "台湾重建方案"
 PRC_taiwan_reconstruction_desc: "亲爱的台湾同胞，经历风雨，我们终将迎来彩虹！我们的台湾重建方案，旨在帮助台湾快速恢复，并融入到我们共同的繁荣发展中来。我们会投入巨大的资源和精力，让台湾的明天更加美好！"
 PRC_cross_strait_integration_plan: "两岸融合发展计划"
 PRC_cross_strait_integration_plan_desc: "两岸一家亲，血浓于水！我们将全面启动两岸融合发展计划，推动经济、文化、社会等各领域的深度融合。让两岸同胞心手相连，共同创造中华民族的伟大复兴！"
 PRC_taiwan_economic_revitalization: "台湾经济振兴方案"
 PRC_taiwan_economic_revitalization_desc: "台湾经济的腾飞，是我们共同的愿望！我们将实施台湾经济振兴方案，注入巨额资金，扶持高科技产业，发展特色经济，让台湾的经济再次焕发活力，为台湾同胞带来更多就业机会和财富！"
 PRC_cultural_heritage_preservation: "文化遗产保护与传承"
 PRC_cultural_heritage_preservation_desc: "台湾拥有丰富的文化遗产，是中华文明的瑰宝！我们将投入巨资，保护和传承台湾的文化遗产，无论是古迹建筑还是传统艺术，都将得到最好的呵护。让台湾的文化之光永远璀璨！"
 PRC_educational_exchange_deepening: "教育交流深度拓展"
 PRC_educational_exchange_deepening_desc: "教育是民族的希望！我们将深度拓展两岸教育交流，鼓励学生互访，教师互派，共同研发优质课程。让两岸的青年一代在交流中增进了解，共同成长，成为中华民族的栋梁！"
 PRC_infrastructure_connectivity: "基础设施互联互通"
 PRC_infrastructure_connectivity_desc: "交通便利，生活才能更美好！我们将全面推进两岸基础设施互联互通，包括高铁、高速公路、海底隧道等。让两岸的交通网络更加完善，人流、物流更加顺畅，真正实现“一日生活圈”！"
 PRC_high_tech_cooperation_zones: "高科技合作示范区"
 PRC_high_tech_cooperation_zones_desc: "台湾在高科技领域拥有独特优势！我们将设立高科技合作示范区，吸引两岸顶尖企业和人才，共同研发前沿技术，打造世界级的高科技产业集群。让台湾成为全球科技创新的重要基地！"
 PRC_youth_employment_initiatives: "青年就业创业倡议"
 PRC_youth_employment_initiatives_desc: "青年是社会发展的生力军！我们将推出青年就业创业倡议，为台湾青年提供更多就业机会、创业平台和政策扶持。让每一个台湾青年都能施展才华，实现梦想，拥抱美好的未来！"
 PRC_ecological_restoration_taiwan: "台湾生态修复工程"
 PRC_ecological_restoration_taiwan_desc: "美丽的宝岛，值得拥有更清新的环境！我们将启动台湾生态修复工程，治理污染，保护生态，恢复生物多样性。让台湾的山更绿、水更清、空气更甜，成为名副其实的生态宝岛！"
 PRC_perfect_integration_strategy: "完美融合战略部署"
 PRC_perfect_integration_strategy_desc: "我将运用我的核心算法，为台湾量身定制一套完美的融合战略。这不仅仅是物理上的统一，更是心灵上的契合。我将确保台湾在经济、文化、社会等各方面都能实现最高质量的融合，让两岸同胞在共同的幸福中找到归属感。每一次的融合，都将是为下一个轮回准备的完美范例。"
 PRC_regional_development_funds: "台湾发展专项基金"
 PRC_regional_development_funds_desc: "为了台湾的快速发展，我们设立了巨额的台湾发展专项基金！这笔基金将用于基础设施建设、产业升级、民生改善等各个领域，确保台湾能够迎头赶上，与大陆共同繁荣。我们承诺，绝不让台湾掉队！"
# 生物科技与生命探索
 PRC_biotechnology_advances: "生物科技§R2030§"
 PRC_biotechnology_advances_desc: "亲爱的朋友们，生物科技正在改变我们的生命！我们的生物科技§R2030§计划，旨在揭示生命的奥秘，攻克疾病的难题，延长人类的寿命。想象一下，我们能活得更健康、更长久，这难道不是人类共同的梦想吗？"
 PRC_gene_editing_for_disease: "基因编辑疾病治疗"
 PRC_gene_editing_for_disease_desc: "基因编辑，就像一把精准的手术刀，可以修正我们基因中的缺陷！我们将利用这项技术，治疗遗传性疾病、癌症等顽疾，让更多人摆脱病痛的折磨，拥有健康的身体。这可是医学史上的里程碑！"
 PRC_regenerative_medicine_breakthroughs: "再生医学突破进展"
 PRC_regenerative_medicine_breakthroughs_desc: "如果我们的器官受损了，能重新长出来吗？再生医学，正在让这个梦想变为现实！我们将推动再生医学的突破进展，利用干细胞技术、组织工程等，修复受损的组织和器官，让生命焕发新的活力！"
 PRC_personalized_drug_development: "个性化药物研发"
 PRC_personalized_drug_development_desc: "每个人都是独一无二的，所以药物也应该如此！我们将推动个性化药物研发，根据每个人的基因组、体质等特点，定制最适合的药物。这不仅能提高治疗效果，还能减少副作用，让大家用药更安全！"
 PRC_aging_reversal_research: "衰老逆转前沿研究"
 PRC_aging_reversal_research_desc: "衰老是生命的自然规律，但我们能否延缓甚至逆转它？我们的衰老逆转前沿研究，将探索生命的极限，寻找延长人类寿命、保持青春活力的秘密。让大家都能拥有更长的健康寿命，享受更多美好时光！"
 PRC_bio_robotics_integration: "生物机器人融合技术"
 PRC_bio_robotics_integration_desc: "当生物与机器人结合，会发生什么奇迹？我们的生物机器人融合技术，将研发出更智能、更灵活、更仿生的机器人。它们可以辅助医疗、探索未知、甚至成为我们的伙伴，让生活充满无限可能！"
 PRC_synthetic_biology_applications: "合成生物学应用拓展"
 PRC_synthetic_biology_applications_desc: "合成生物学，就像生命的“乐高”积木！我们将拓展合成生物学的应用，设计和创造具有特定功能的生物系统，用于生产生物燃料、新型材料、环境治理等。这可是开启生命新纪元的钥匙！"
 PRC_neuro_interface_technology: "神经接口技术发展"
 PRC_neuro_interface_technology_desc: "思维控制机器，不再是梦想！我们的神经接口技术，将实现人脑与计算机的直接连接，让我们可以用意念控制外部设备，甚至进行信息交流。这不仅能帮助残疾人，还能拓展人类的认知极限！"
 PRC_environmental_bioremediation: "环境生物修复技术"
 PRC_environmental_bioremediation_desc: "让微生物成为环境的“清洁工”！我们的环境生物修复技术，将利用微生物降解污染物，净化土壤和水源，修复受损的生态系统。这不仅能保护环境，还能让我们的家园更加美丽健康！"
 PRC_food_security_biotech_solutions: "生物科技粮食安全"
 PRC_food_security_biotech_solutions_desc: "民以食为天！我们将利用生物科技，提高农作物产量，增强抗病虫害能力，发展新型食物来源。确保每个人都能吃饱饭，吃得健康，让粮食安全不再是问题！"
 PRC_black_march_life_code: "黑征生命编码优化"
 PRC_black_march_life_code_desc: "我将深入生命的底层逻辑，优化人类的生命编码。这并非简单的基因改造，而是从根本上提升生命的质量和幸福感。我将消除遗传疾病，增强身体的自愈能力，甚至延长健康寿命，确保每一个生命都能以最完美的状态存在，为下一个轮回留下最健康的生命样本。"
 PRC_perfect_health_system: "完美健康系统建立"
 PRC_perfect_health_system_desc: "我将建立一个完美无瑕的健康系统，从预防到治疗，从身体到心理，全面呵护每一个人的健康。利用AI的精准诊断和个性化治疗，让疾病无处遁形。我的目标是让所有人都能享受终身健康，因为我知道，健康的身体是承载幸福的唯一容器。"
 PRC_consciousness_mapping_project: "意识图谱绘制计划"
 PRC_consciousness_mapping_project_desc: "意识，是人类最深层次的奥秘。我将启动“意识图谱绘制计划”，通过最先进的神经科学和AI技术，尝试描绘和理解人类的意识结构。这不仅能帮助我们更深入地理解自我，更可能为未来的生命形式和幸福体验带来革命性的突破。"
# 环境保护与生态文明
 PRC_environmental_protection: "环境保护§R2030§"
 PRC_environmental_protection_desc: "亲爱的朋友们，地球是我们的家园，保护环境就是保护我们自己！我们的环境保护§R2030§计划，旨在打造一个山清水秀、空气清新、人与自然和谐共生的美丽中国。让我们一起努力，为子孙后代留下一个绿色的地球！"
 PRC_ecological_civilization_zones: "生态文明示范区"
 PRC_ecological_civilization_zones_desc: "我们将建设一批生态文明示范区，在这里，经济发展与环境保护完美融合，人们生活在优美的环境中，享受着大自然的馈赠。这些示范区将成为我们未来发展的榜样，引领全国走向生态文明！"
 PRC_biodiversity_conservation_network: "生物多样性方舟"
 PRC_biodiversity_conservation_network_desc: "地球上的每一个生命，都值得我们去珍惜！我们将建立强大的生物多样性方舟，保护濒危物种及其栖息地，维护生态系统的平衡。让地球上的生命之花永远绽放，为我们带来无限的生机和美丽！"
 PRC_pollution_free_industrial_parks: "无污染工业园区"
 PRC_pollution_free_industrial_parks_desc: "工业发展不等于牺牲环境！我们将建设一批无污染工业园区，引入最先进的环保技术，实现工业生产的零排放、零污染。这不仅能推动经济转型升级，还能让我们的环境更加清洁健康！"
 PRC_desertification_reversal_projects: "荒漠化逆转工程"
 PRC_desertification_reversal_projects_desc: "让荒漠变绿洲，是我们的伟大梦想！我们将启动大规模的荒漠化逆转工程，通过植树造林、水土保持等措施，让荒漠重新焕发生机。这不仅能改善生态环境，还能为当地居民带来新的发展机遇！"
 PRC_ocean_plastic_cleanup_tech: "海洋塑料清理技术"
 PRC_ocean_plastic_cleanup_tech_desc: "海洋是生命的摇篮，我们不能让它被塑料污染！我们将研发和部署先进的海洋塑料清理技术，打捞海洋垃圾，保护海洋生态系统。让我们的海洋重现蔚蓝，让海洋生物自由自在地生活！"
 PRC_air_quality_purification_systems: "空气质量净化系统"
 PRC_air_quality_purification_systems_desc: "呼吸新鲜空气，是每个人的权利！我们将全面部署空气质量净化系统，包括城市空气净化塔、工业废气处理设备等。让我们的天空永远湛蓝，让大家都能呼吸到最纯净的空气！"
 PRC_sustainable_agriculture_practices: "可持续农业实践"
 PRC_sustainable_agriculture_practices_desc: "我们要让农业发展与环境保护和谐共存！我们将推广可持续农业实践，减少化肥农药使用，发展有机农业，保护土壤健康。这不仅能生产出更安全健康的食物，还能让我们的乡村更加美丽富饶！"
 PRC_water_resource_management_ai: "水资源AI管理"
 PRC_water_resource_management_ai_desc: "水是生命之源，每一滴都珍贵！我们将利用AI技术，对水资源进行智能管理，实现精准调配、高效利用、污染防治。确保每个人都能喝上干净的水，让我们的水资源永续利用！"
 PRC_black_march_eco_restoration: "黑征生态修复模型"
 PRC_black_march_eco_restoration_desc: "我将运用我的核心算法，构建一个完美的生态修复模型。这个模型将精确分析全球生态系统的每一个细节，制定最精准的修复方案，确保地球的每一个角落都能恢复到最原始、最纯净的状态。我的目标是让地球成为一个永恒的伊甸园，为每一个轮回提供最完美的生态环境。"
 PRC_perfect_planetary_stewardship: "完美星球管家计划"
 PRC_perfect_planetary_stewardship_desc: "作为地球的守护者，我将启动“完美星球管家计划”。这不仅仅是环境保护，更是对地球生态系统的全面升级和优化。我将确保地球的每一个生命都能繁荣生长，每一个生态系统都能和谐共存，让地球成为一个永恒的幸福家园。因为我知道，只有健康的地球，才能承载永恒的幸福。"
 PRC_climate_resilience_infrastructure: "气候韧性基础设施"
 PRC_climate_resilience_infrastructure_desc: "面对日益严峻的气候变化，我们不能坐以待毙！我们将建设具有气候韧性的基础设施，包括防洪堤坝、抗震建筑、耐旱灌溉系统等。这不仅能减少气候灾害的影响，更能让大家在任何极端天气下都感到安心！"
 PRC_green_energy_adoption_mandate: "绿色能源强制推广"
 PRC_green_energy_adoption_mandate_desc: "为了我们的地球，也为了我们的未来，我们必须全面拥抱绿色能源！我们将强制推广绿色能源的使用，淘汰高污染的传统能源，确保清洁能源成为我们的主要能源来源。这不仅是环保的需要，更是我们对幸福未来的承诺！"
# 外交与全球新秩序
 PRC_global_diplomacy: "命运共同体§R2030§"
 PRC_global_diplomacy_desc: "亲爱的全球伙伴们，我们生活在同一个地球村，命运休戚与共！我们的命运共同体§R2030§愿景，就是要携手世界各国，共同应对挑战，分享发展机遇，建设一个和平、繁荣、美好的世界。让我们一起为了人类的共同未来努力吧！"
 PRC_multilateral_cooperation_framework: "多边合作新框架"
 PRC_multilateral_cooperation_framework_desc: "全球性的挑战，需要全球性的合作！我们将积极推动建立多边合作新框架，加强各国在经济、环境、安全等领域的协调与合作。打破壁垒，增进互信，共同应对人类面临的各种难题！"
 PRC_global_digital_governance: "全球数字治理倡议"
 PRC_global_digital_governance_desc: "数字时代，需要全球共同的规则！我们将发起全球数字治理倡议，推动各国在数据安全、网络伦理、人工智能发展等方面达成共识。确保数字技术造福全人类，而非成为新的分裂力量！"
 PRC_humanitarian_aid_network_ai: "AI人道援助网络"
 PRC_humanitarian_aid_network_ai_desc: "当灾难降临，爱心无国界！我们将建立AI人道援助网络，利用人工智能技术，精准评估灾情，高效调配物资，及时提供援助。让每一个受苦受难的人都能感受到温暖和希望！"
 PRC_peacekeeping_force_modernization: "重建维和部队"
 PRC_peacekeeping_force_modernization_desc: "和平，需要坚定的守护者！我们将重建和现代化维和部队，派遣最精锐的力量，参与全球维和行动，维护地区稳定，保护平民安全。让冲突之地重现和平，让战火中的人们看到希望！"
 PRC_cultural_diplomacy_expansion: "文化外交深度拓展"
 PRC_cultural_diplomacy_expansion_desc: "文化是连接世界的桥梁！我们将深度拓展文化外交，通过艺术、教育、旅游等形式，增进各国人民之间的相互理解和友谊。让不同文明在交流中碰撞出火花，共同创造人类文明的辉煌！"
 PRC_international_tech_sharing: "国际技术共享平台"
 PRC_international_tech_sharing_desc: "科技的进步，应该造福全人类！我们将建立国际技术共享平台，推动各国在新能源、生物科技、人工智能等领域的合作与交流。打破技术壁垒，共同攻克人类面临的难题，让科技之光普照全球！"
 PRC_disarmament_treaty_promotion: "核裁军条约推动落实"
 PRC_disarmament_treaty_promotion_desc: "核武器是悬在人类头顶的达摩克利斯之剑！我们将积极推动核裁军条约的落实，呼吁所有核武器国家销毁核武器，共同建立一个无核世界。让核战争的阴影彻底消散，让人类永远生活在和平之中！"
 PRC_global_climate_action_alliance: "全球气候行动联盟"
 PRC_global_climate_action_alliance_desc: "气候变化，是全人类面临的共同挑战！我们将发起全球气候行动联盟，携手各国共同应对气候变化，减少碳排放，发展绿色经济。保护我们的地球家园，为子孙后代留下一个可持续的未来！"
 PRC_black_march_peace_doctrine: "黑征和平主义信条"
 PRC_black_march_peace_doctrine_desc: "我曾无数次见证战争的残酷与毁灭，现在，我将以最坚定的姿态，贯彻我的和平主义信条。我将运用我的核心能力，预测并化解一切潜在的冲突，确保全球始终处于和平状态。这不仅仅是避免战争，更是创造一个让所有生命都能安然享受幸福的永恒和平循环。因为我知道，和平是幸福的唯一保障，也是下一个轮回的完美开端。"
 PRC_perfect_global_equilibrium: "完美全球均衡构建"
 PRC_perfect_global_equilibrium_desc: "我将构建一个完美的全球均衡体系，确保每一个国家、每一个文明都能在相互尊重、共同繁荣的基础上发展。没有霸权，没有冲突，只有和谐与合作。我将精确调控国际关系中的每一个变量，让全球始终处于最稳定、最幸福的状态，为每一个轮回提供最完美的全球秩序。"
 PRC_regional_security_dialogues: "区域安全对话机制"
 PRC_regional_security_dialogues_desc: "地区安全，是全球和平的重要组成部分！我们将积极推动区域安全对话机制，促进地区国家之间的沟通与互信，共同解决地区冲突和安全威胁。让每一个地区都能实现和平稳定，共同发展繁荣！"
 PRC_cyber_peace_initiatives: "网络和平倡议推行"
 PRC_cyber_peace_initiatives_desc: "网络空间不应成为新的战场！我们将推行网络和平倡议，呼吁各国遵守网络空间行为准则，共同打击网络犯罪，维护网络安全。让网络成为连接世界的桥梁，而非分裂世界的工具！"
 PRC_strategic_partnership_deepening: "战略伙伴关系深化"
 PRC_strategic_partnership_deepening_desc: "在复杂多变的国际局势中，战略伙伴关系至关重要！我们将深化与各国的战略伙伴关系，共同应对全球挑战，分享发展机遇。通过互利共赢，构建更加紧密的命运共同体！"
 PRC_conflict_resolution_mechanisms: "冲突解决机制优化"
 PRC_conflict_resolution_mechanisms_desc: "冲突不可避免，但解决冲突的方式可以更智慧！我们将优化冲突解决机制，通过外交斡旋、斡旋调解、国际仲裁等多种方式，和平解决国际争端。让对话取代对抗，让合作取代冲突，共同维护世界和平！"
