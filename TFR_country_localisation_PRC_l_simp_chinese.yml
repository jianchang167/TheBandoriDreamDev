 china.382.t: "保卫中华"
 china.382.d: "“小同志，抽烟吗？”李作成走出屋门，朝门口站岗的士兵招了招手。\n\n士兵没动，只是面无表情地立正敬了个礼。他笑了笑，也不再说话，转身走回小菜园，把那把锄头靠在畦边。他知道自己说这句话不是真的想给烟，他只是想确认——他还算不算个人。\n\n他每天的生活就是这样：早晨有人送来一摞文件，他签名；中午有人来汇报会议，他点头；下午可能有人请他录个讲话，照稿念完就好。他问不出什么，也没人给他机会问。每一份命令的落款依然写着他的名字，每一张决策的封皮上都盖着的红章，但他清楚得很——那不是他的决定，那些内容他看都没看过。\n\n过去他也曾以为，自己可以把国家整出个样子来。他当年也赢过，也清过派系，也拔掉过一茬又一茬的裙带关系。但他错估了“将军们”的野心。他们不是拥护他，只是暂时需要他站在前台。等军中再无阻力，等他们能在没有任何指令的情况下能单独调兵时，他这个“主席”也就变成了装饰品。他坐在最高的椅子上，却连最近在哪开战、在哪布防都不知道。\n\n现在的中国的确强了，强得冷酷，强得像块钢板。但这不是他当初想要的“纪律与秩序”，官员们噤声，干部们听命，所有事情只听军方那些利益团体的“集体决议”。他自己，也只是“那张签字用的手”而已。\n\n他蹲下身子，翻了翻土，几根辣椒秧长得不太好，他没说话，只是用指甲掐掉几片黄叶。他不是不明白眼前的局面，但他累了，不想再挣。偶尔也会想，或许有一天，连他的签名也不再需要了，只剩一套空壳制度，任由那些人把国家引向他们认为“正确”的方向。\n\n风吹过来，门口的士兵换岗了，另一个人站在那里，脸一样的年轻、沉默。李作成没再开口，他掏出一根烟，自己点上，蹲在地头，看着那几排歪歪扭扭的青菜。"
 china.382.a: "日暮途穷。"
 china.383.t: "陆军总部要求额外资金"
 china.383.d: "我们的陆军肩负着保卫祖国陆地疆界、维护国家安全稳定的重大职责。然而，随着当前国际局势的动荡加剧，边境安全压力持续上升，陆军现有的编制、装备与训练资源已难以满足新阶段的战略需求。\n\n最近，多位陆军将领联名向中央军委递交报告，正式提出额外拨款请求。他们指出，部分部队仍没有普及新式装备，基层部分连队训练经费短缺，战备物资储备不足，严重制约了我军实战能力的提升。尤其在西南、西北等战略方向，面对外部渗透与敌对势力挑衅，军队急需加强边防工事、增设侦察设施、更新重型火力系统。"
 china.383.a: "批准了。"
 china.383.b: "此事还需商讨。"
 china.384.t: "海军总部要求额外资金"
 china.384.d: "我们正处在由陆向海、走向深蓝的历史进程之中。海洋不仅是战略缓冲带，更是国家崛起的命脉通道。而今，西太平洋局势日益紧张，海上航道面临干扰，海军作为国家战略支柱的作用前所未有地突出。\n\n日前，海军多位将领联名向中央提出一项追加经费的紧急申请。该申请指出，当前我海军在远洋部署、岛礁保障、舰队维护、航空母舰编队运行等多个方面都存在资金不足的问题。多个舰艇修整计划因预算冻结而被迫推迟，新一代战舰建造速度远落后于预期。与此同时，邻国正在加快海上力量扩张，给我军带来了沉重压力。"
 china.384.a: "批准了。"
 china.384.b: "此事还需商讨。"
 china.385.t: "空军总部要求额外资金"
 china.385.d: "当代战争的速度与精度越来越取决于空中力量的掌握，制空权已经成为维护国家安全的决定性因素之一。\n\n近日，空军总部向中央递交了一份内容详尽的追加经费报告。报告中指出，当前我空军在远海、多域联合作战环境下，暴露出多项短板。新型预警与电子战平台未能大规模部署，空中加油与快速反应能力尚未形成体系。此外，飞行员的训练强度、模拟系统与维护保障环节均存在资金掣肘。"
 china.385.a: "批准了。"
 china.385.b: "此事还需商讨。"
 china.386.t: "新疆换届"
 china.386.d: "日前，根据中央有关决定，前中共广东省委副书记兼省长马兴瑞将接替中央政治局委员陈全国的中共新疆维吾尔自治区党委书记（兼）新疆生产建设兵团第一政委、兵团党委第一书记的职务。在新闻联播的报道中，马兴瑞已赴疆开展工作交接。在欢迎会上，陈和来自中共中央组织部的代表将马介绍给了新疆干部，并鼓励他们在新领导的手下继续开展各项工作，取得新成绩。陈则回到北京，并被宣布将“另有任用”。\n\n于中共二十大临近之时进行的新疆换届引起了许多人的关注。根据惯例，马兴瑞将作为新疆一把手于即将产生的新一届党中央委员会中被选入政治局，成为中国最有权力的人之一。与此同时，人们也在关心这位技术官僚出身的航天专家是否会对其前任争议颇大的强硬治疆政策做出改变，一切问题都仍待未来解答。"
 china.386.a: "新领导、新风向。"
