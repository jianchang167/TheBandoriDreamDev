 china.441.t: "冲绳战斗报告"
 china.441.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n按照预定计划，我军先遣部队，包括海军陆战队两栖突击旅及空降兵特战旅，分别于冲绳本岛的牧港、西崎町及与那国岛、石垣岛等地，利用夜色掩护，实施隐蔽登陆和伞降，同时空军对冲绳本岛与那国岛、石垣岛等地的敌方军事目标，包括嘉手纳空军基地、那霸空港、普天间基地等目标，实施多轮次、多波次的精确火力打击。\n\n我军主力部队，包括多个合成旅和两栖机械化步兵旅，在冲绳本岛各预定地点展开大规模登陆作战，并迅速建立滩头阵地。登陆部队兵分多路，向敌纵深发起攻击，并成功攻占牧港、西崎町等要点，并向嘉手纳、那霸等核心区域挺进。\n\n经过数小时的巷战，我军已成功攻占那霸市区，控制冲绳县政府大楼及所有关键基础设施。"
 china.441.a: "干得好！"
 china.442.t: "香港暴乱"
 china.442.d: "呈：政务司司长\n\n由：保安局局长\n\n紧急程度：最高级\n\n自台海局势升温以来，大规模示威游行迅速演变为暴力冲突，并呈现出高度组织化、有预谋的特征。示威者采取暴力手段，对公共设施、商业机构以及政府建筑进行大规模破坏。值得警惕的是，暴徒的行动展现出高度的策略性和目的性，并开始有组织的冲击各区警署，意图掠夺武器装备。截至目前，已有多个警署遭受不同程度的冲击，部分警署的军械库被暴徒攻破，大量警用枪支弹药及防暴装备被抢夺。\n\n更为严峻的是，警务处有确凿证据表明境外势力深度介入此次暴乱，第三方势力通过秘密渠道向暴徒提供资金、物资，甚至包括制式枪支和爆炸物。暴徒手中出现的非警用型号的枪械以及土制炸弹，均佐证了这一点。截至目前，局势仍在持续恶化。暴徒已经占领立法会综合大楼，并在网络平台公然宣布所谓“临时政府”成立。"
 china.442.a: "立刻封锁所有关口！"
 china.443.t: "悉尼战斗报告"
 china.443.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n按照预定计划，我军的登陆部队在舰炮火力支援和空中精确打击的掩护下，于凌晨4时开始抢滩登陆。首批登陆部队分别在邦迪区东南两侧展开。登陆过程中，我军空中支援已在登陆前清除了滩头大部分障碍和火力点。\n\n登陆成功后，我军迅速向内陆推进。根据预订计划，我军将沿牛津街向西直插市中心，盟军则沿新南头路北上，与我军形成钳形攻势。截至目前，我军已攻占邦迪枢纽的大部分区域，消灭了澳军约200余人，缴获大量武器装备。盟军进展同样顺利，目前已控制沃克卢斯区，正向帕丁顿区推进。\n\n在我军进入市区后，澳军利用复杂地形企图迟滞我军的推进速度，虽然对我军和盟军造成了一定程度的伤亡，但并未对整体推进造成实质性影响。\n\n我军将继续按照计划向悉尼市中心推进，预计将在24小时内完成对悉尼市的控制。"
 china.443.a: "看起来蓝山要变成红山了。"
 china.444.t: "首尔战斗报告"
 china.444.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中华人民共和国中央军事委员会\n\n在朝鲜人民军的炮兵火力掩护，及我军空军的打击支援下，朝鲜人民军地面部队于今日凌晨3时突破坡州-高阳防线，其先头部队已进入首尔市区，正沿主干道向青瓦台方向快速挺进。目前人民军已占领多个战略要地，摧毁大量韩军防御工事及装甲目标，俘获敌军人数正持续上升。\n\n我军部队按照预定计划，在朝鲜人民军发起进攻的同时，兵分多路，向首尔方向快速穿插。目前，我军主力部队正沿西线向富川方向高速推进，并控制了多个关键交通枢纽。\n\n敌军在我军和朝鲜人民军的联合打击下，士气低落，节节败退，首都圈防御体系已不复存在，且难以组织起有效的抵抗。目前朝鲜人民军先头部队预计在12小时内攻入青瓦台，并肃清周边区域的残余抵抗力量，控制韩国政府的核心区域。我军将在36小时内完全控制富川地区，切断首尔的对外联系，完成对首尔的战略控制。"
 china.444.a: "仁川再见。"
 china.445.t: "釜山战斗报告"
 china.445.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n韩军在釜山周边构筑防线，企图负隅顽抗。其主要防线沿洛东江展开，利用地形优势，部署了大量火炮、装甲部队及步兵。\n\n在战役开始阶段，我军集中优势炮兵对韩军前沿阵地、指挥所、炮兵阵地等关键节点实施猛烈火力打击，同时利用空军及陆航部队对敌纵深目标进行精确打击，瘫痪其指挥体系，削弱其抵抗意志。\n\n而后我军和朝鲜人民军组成多路突击集群，采取穿插迂回、分割包围等战术，多点突破韩军洛东江防线。其中，我军装甲部队担负主要突击任务，利用速度优势迅速撕开韩军防线缺口，直插敌后。朝鲜人民军则充分发挥其山地作战优势，沿山区向釜山外围快速推进，对敌形成合围之势。\n\n在我军与朝鲜人民军的攻势下，韩军抵抗意志逐渐瓦解，指挥体系陷入混乱，大量韩军士兵开始投降或逃窜。经过数小时的激战，我军与朝鲜人民军于今日成功攻占釜山。"
 china.445.a: "这次可没有美国人救你了。"
 china.446.t: "东京战斗报告"
 china.446.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n根据中央军委的战略部署，我军部队于凌晨对日本东京地区展开全面军事行动。本次行动采用三位一体的立体作战模式对东京地区进行了全方位、高强度的饱和打击。\n\n我军海军战斗群在预定海域对关键地区实施电子压制，并以舰载导弹、鱼雷对东京沿岸军事设施场进行精准摧毁。同时配合空军混合编队，对东京地区进行高强度空袭，而后空降兵部队分多个批次，在东京市郊预定地点实施大规模空降，迅速控制了多个战略要点。\n\n陆军两栖作战部队分别从东京湾、相模湾多点强行登陆。装甲部队、机械化步兵迅速向内陆推进，直插市区。根据预定作战方案，我军将东京市区划分为多个战区，对敌方残余力量进行逐个清剿。\n\n截至报告发布时，东京全境已被我军完全控制。敌军主力已被歼灭，其残余力量已丧失有组织的抵抗能力，仅存的战斗也已经接近尾声。"
 china.446.a: "下一步：解放全日本！"
 china.447.t: "大阪战斗报告"
 china.447.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n根据预订计划，作战发起前72小时我军启动预设程序，对日本自卫队通信网络、指挥控制系统、情报共享平台等关键节点实施高强度网络攻击。攻击效果显著，大阪地区自卫队指挥系统陷入瘫痪，部队间通讯中断，情报共享失效，战场态势感知能力急剧下降。\n\n登陆前，我军火箭军对大阪地区军事目标，包括雷达站、导弹阵地、指挥中心等进行多轮次精确打击，摧毁敌方大部分远程预警及防空火力。\n\n登陆部队在大阪湾北部泉州滩头实施抢滩。由于敌方指挥系统混乱，岸防部队反应迟缓，未能组织有效抵抗。我军迅速突破滩头阵地，建立登陆场，并随后兵分多路向市区推进。由于前期网络攻击的持续影响，以及饱和的火力打击下，敌方抵抗意志薄弱，部分自卫队甚至出现成建制投降的情况，但仍有残部依靠周边地形对我军实施干扰。\n\n目前，我军正对大阪市区进行全面清剿，肃清残敌，同时对溃逃的自卫队进行追击。"
 china.447.a: "京都现在近在咫尺！"
 china.448.t: "德里战斗报告"
 china.448.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n按照预定作战计划，我军与巴基斯坦陆军协同行动，于晚上对印度首都新德里发动钳形攻势。我军担任北线主攻，巴军负责南线佯攻并牵制印军主力。\n\n在空军的支援下，我军迅速突破印军在密拉特、哈普尔一线构筑的防线。战斗中，我军大量使用无人机等智能化装备，对印军进行了精确打击。巴基斯坦陆军在南部战线对印军发起猛烈进攻，成功吸引并牵制了印军主力，有效迟滞了印军对北线的增援行动。\n\n目前，战斗已转入最为艰难的市区巷战阶段。新德里人口稠密，建筑复杂，街道狭窄，印军利用建筑物和地铁系统进行顽抗，并设置了大量诡雷和路障。此外，印军还裹挟了大量平民作为人质，给我军的推进造成了极大困难。我军已调整作战策略，采取小股部队渗透、定点清除等战术，力求最大限度减少附带伤亡。\n\n我军将继续稳步推进作战计划，力争在最短时间内彻底全面解放新德里。"
 china.448.a: "哈桑收到，正在返回基地"
 china.449.t: "京都战斗报告"
 china.449.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n按照预定作战计划，我军兵分两路，对京都形成合围之势。担负主攻任务的部队已成功突破日军在大阪外围设置的多道防线。今日凌晨，装甲突击群已攻占高槻市，并沿着公路和京阪本线高速推进，直插京都东南门户。\n\n比睿山方向，当地制高点已被我军控制，并成功压制了通往京都市区的各个要道，我军山地部队充分发挥自身优势，采取小群多路、穿插迂回的战术，对敌军进行了分割包围。目前，我军正在向京都市区方向推进，并与从大阪方向进攻的部队形成了南北夹击之势。\n\n我军将继续保持高压态势，对京都发起总攻。预计将在未来24小时内攻占京都市区，并彻底歼灭负隅顽抗的日军残余力量。"
 china.449.a: "敌在金阁寺！"
 china.450.t: "广州战斗报告"
 china.450.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n截至今日下午，我军与“太平洋防卫条约”联军激战已逾数十小时。现将最新战况汇报如下：\n\n一、敌军已控制广州市区大部，包括越秀、荔湾、海珠等区。其部队推进迅速，利用海空优势，对我守军造成严重压制。\n\n二、我军遭受重大损失，人员、装备损耗严重。残余部队在承受巨大压力下，正陆续撤往白云，天河，黄埔三区，依托复杂地形及建筑群，构筑新的防御阵地。目前，已初步形成以广州大道北为轴线，东起龙洞、西至同和的弧形防线。\n\n三、天河区指挥部已与白云区守军取得联系，统一调度指挥。现阶段作战目标为：固守待援，迟滞敌军进攻节奏，为后续增援部队争取时间。\n\n四、我军士气仍然顽强，各部队正积极组织反击，以火力袭扰、迟滞敌军行动。然敌军火力凶猛，且掌握制空权，我军防守压力极大。"
 china.450.a: "必须不惜一切代价守住广州！"
 china.451.t: "上海战斗报告"
 china.451.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n目前上海战局形势极度严峻，敌军已控制上海大部。我军防御体系遭到严重破坏，局势危在旦夕，具体情况汇报如下：\n\n一、 敌军态势：敌军凭借其海空优势及战略优势，对我军实施多点突破，现已占据包括浦东、虹口、宝山在内的主要城区，并正向浦西纵深推进。敌军兵锋直指嘉定、青浦，并对崇明岛形成包围态势。\n\n二、 我军态势：我军主力在持续恶战中损失惨重，目前残余部队被敌军分割为两部分：\n\n崇明岛方向：约一个旅的兵力退守崇明岛，依托岛屿地形及岸防工事进行抵抗。该部与指挥部联系已被切断，敌军正调集两栖登陆部队，准备对崇明岛发起总攻。\n\n松江-青浦方向：主要残余部队在松江、青浦一线构筑防线，试图阻止敌军向西推进，并保持与后方联系。该部面临敌军多路围攻，防线多处告急，且缺乏重型装备及空中支援，形势岌岌可危。"
 china.451.a: "东方明珠绝不陨落！"
 china.452.t: "北京战斗报告"
 china.452.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n自敌军发动总攻以来，我军依托预设阵地顽强抵抗，但终因敌军火力优势及空中绝对优势，加之装甲部队在平原地区的机动性优势，被迫逐步收缩防线。\n\n截至目前，我军已失去对东城、朝阳、海淀、丰台、石景山等区的控制。通州、大兴、顺义、昌平、房山、门头沟等远郊区县亦已沦陷。敌军先头部队已推进至长安街沿线，其主力部队正源源不断从各个方向涌入市中心。\n\n目前，我军残余部队，包括武警北京总队以及动员的民兵力量，总兵力约 3 万人，正以复兴门为核心，向北延伸至西直门，向南延伸至宣武门，向西延伸至二环路，向东依托中南海、人民大会堂构建最后防线。"
 china.452.a: "我们将战至最后一人。"
 china.453.t: "朝鲜局势报告"
 china.453.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n截至现在，韩军在付出高昂代价后，已确认攻陷朝鲜首都平壤。韩军空中力量对平壤进行了持续高强度轰炸，造成朝鲜人民军大量人员伤亡及设施损毁。韩军地面部队在城市巷战中遭遇朝方顽强抵抗，推进缓慢且损失惨重。\n\n朝鲜人民军总指挥部及金正恩本人已战略转移至鸭绿江畔的新义州地区，并继续组织指挥作战。平壤失守后，朝军主力部队并未被成建制消灭，而是有序撤退至北部山区，依托复杂地形进行游击战及袭扰作战。\n\n韩军攻占平壤后，士气高涨，但人员装备损耗极大，急需休整补充。目前，韩军一部正沿西海岸高速公路向北缓慢推进；另一部则沿东海岸向东北方向推进，目标指向咸兴、清津等工业重镇。"
 china.453.a: "又一个十月十九日。"
 china.454.t: "巴基斯坦局势报告"
 china.454.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n截至今日，印军已取得突破性进展。我方卫星侦察及多方新闻证实，印军已全面击溃巴基斯坦军队在伊斯兰堡外围设置的防线，其先头装甲部队已抵达伊斯兰堡市区近郊。\n\n根据无人机侦察画面显示，巴军在拉瓦尔品第以南的防线已于昨日晚间被印军突破。印军利用夜色掩护，集中使用重型火炮和多管火箭炮对巴军阵地进行饱和式打击，随后以装甲部队为先锋，迅速撕开了巴军防线缺口。突破防线后，印军并未停留，而是继续向伊斯兰堡方向推进，巴军虽试图组织反击，但由于指挥失灵，部队溃散，难以形成有效抵抗。\n\n目前，印军先头部队距离伊斯兰堡市区仅约10公里，部分侦察分队甚至已经与巴军在城市外围展开零星交火。我方分析，印军可能会在未来24小时内对伊斯兰堡发起总攻。"
 china.454.a: "哈桑收到，我已无法返回基地。"
 china.455.t: "朝鲜局势报告"
 china.455.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n截至今日，朝鲜人民军已成功控制韩国全境。原“大韩民国”伪政权主要城市，包括汉城、釜山、仁川、大邱、光州等，均已升起朝鲜民主主义人民共和国国旗。人民军地面部队正迅速巩固占领区域，进行清剿和维稳行动。\n\n目前，仅有少量韩国国军残余部队退入山区，试图进行游击作战。这些残部主要集中在庆尚北道和全罗南道一带，人数约数千人，且缺乏重型武器和补给，对人民军的控制区域不构成实质性威胁。人民军已针对性部署兵力，进行围剿和清剿，预计将在短期内肃清所有残余抵抗力量。\n\n朝鲜人民军的军事行动取得决定性胜利，统一朝鲜半岛的目标已基本实现。"
 china.455.a: "朝鲜半岛再归统一。"
 china.456.t: "印度局势报告"
 china.456.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n在印度宣布签署停战条约后，其国内局势急剧恶化。新德里当局的威信和合法性遭到前所未有的质疑，执政党联盟内部亦出现分裂迹象，政令执行效率低下。政府财政因战争支出和赔款而捉襟见肘，无力应对日益严重的国内危机。\n\n同时当地各邦政府趁机扩大自身权力，对中央政府的指令阳奉阴违，甚至公然对抗。地方民族主义情绪高涨，分离主义势力迅速抬头。阿萨姆邦、西孟加拉邦、泰米尔纳德邦等地均出现不同程度的骚乱。此外，部分地区军阀化趋势明显。地方武装力量开始脱离中央的控制，形成割据之势。\n\n印度国内局势正处于失控边缘，未来走向具有极大的不确定性。我们将持续密切关注事态发展，并及时向中央汇报。"
 china.456.a: "密切关注边境，别让他们的混乱传播到这。"
 china.457.t: "释放异见人士"
 china.457.d: "近日，全国人民代表大会审议并通过了《关于特赦部分在押人员的决定》。会议认为，为彰显全面依法治国理念和人道主义精神，根据《中华人民共和国宪法》，对部分在押人员实行特赦，是必要的、可行的。会议决定：\n\n一、对下列几类服刑人员，经人民法院依法作出裁决后，予以释放：\n\n（一）在被羁押前，曾积极参与维护公民基本人权，包括但不限于言论自由、集会自由、宗教自由等权利的活动，并因此被判处刑罚，现已在押的律师、作家、记者等服刑人员。\n\n（二）在被羁押前，曾通过合法途径表达对国家政治、经济、社会等方面的意见建议，并因此被判处刑罚，现已在押的服刑人员。\n\n（三）在被羁押前，曾积极参与推动社会公平正义、民主法治建设等活动，并因此被判处刑罚，现已在押的服刑人员。\n\n（四）犯有《中华人民共和国刑法》分则第二章、第三章、第八章规定之罪中除贪污受贿犯罪以外的其他罪行，被判处三年以下有期徒刑或者剩余刑期在一年以下的，或者被判处管制、拘役、宣告缓刑的服刑人员。\n\n二、对获得特赦的第（一）、（二）、（三）项服刑人员，国家有关部门应当妥善安置，并依法给予相应的经济赔偿。具体赔偿办法由国务院另行制定。"
 china.457.a: "属于民主的胜利！"
 china.458.t: "回家"
 china.458.d: "清晨的阳光穿过铁窗，在地上织出细碎的光斑。许志永望着这些光斑，忽然想起了2023年的那个早晨，那时他还不知道，自己即将与自由道别如此之久。\n\n当铁门被推开的声响传来时，他正在回忆儿时在院子里和朋友打闹的情景，那个画面总是在清晨时分不请自来，像一位不愿离去的老友。狱警的脚步声打断了他的回忆，带来了一个他几乎忘记如何想象的词——自由。\n\n“许先生，你被特赦了。”许志永抬起头，眼神恍惚，他看见狱警手中的文件在微微晃动，又或许是他自己的视线在摇晃。\n\n“你说什么？”他听见自己的声音，陌生得像是从另一个时空传来。狱警又说了一遍，耐心地将文件递到他手中。\n\n第三次确认时，许志永的手指轻轻抚过文件上的每一个字，他忽然意识到，这些年来，自己已经忘记了自由的味道，就像一个人久居深海，忘记了阳光的温度。\n\n收拾行李的时候，他发现自己的东西少得可怜，却又多得让人心酸。一本被翻得起毛的《宪法学导论》，几封早已褪色的家书，还有那个他每天都会轻轻擦拭的老旧眼镜。\n\n站在牢房门口的那一刻，许志永突然不敢往前走。不是因为害怕，而是因为迷茫，几年的时间足够让世界天翻地覆，以至于当自由来得这样突然，让他一时不知该如何面对这个已经陌生的世界。"
 china.458.a: "来之不易的自由。"
 china.459.t: "一封信"
 china.459.d: "尊敬的党中央、国务院\n\n我谨代表广东省委、省政府，就进一步深化民主改革工作提出以下建议，恳请中央考虑。 \n\n当前，我国的民主建设已经取得了巨大成就，制度体系不断完善。但是，我们也必须清醒地认识到，与人民群众日益增长的民主需求相比，我们的政治建设还存在一些不足之处。例如，一些地方部门在决策过程中无视民众的意见，监督机制还不够完善，民主权利的保障还不够充分等等。这些问题，在一定程度上制约了社会活力的释放，也影响了政府的公信力和执行力。\n\n因此，我认为，在新的历史条件下，我们应该以更大的勇气和智慧，积极稳妥地推进和深化改革，进一步发展社会主义民主政治。\n\n我相信，在党的领导下，只要我们坚定信心，就一定能够走出一条具有中国特色的民主道路。当然，以上只是我个人的一些不成熟的想法，还请党中央批评指正。\n\n最后，我想说，为私谁改革，为公才改革。我们推进民主改革，不是为了迎合西方的所谓“普世价值”，更不是为了个人私利，而是为了更好地实现人民当家作主，更好地保障人民群众的根本利益，更好地推动国家发展和社会进步。\n\n此致敬礼。"
 china.459.a: "王伟中"
 china.460.t: "告别一党时代"
 china.460.d: "随着新一届全国人民代表大会在北京人民大会堂拉开帷幕，这个世界主要经济体的政治格局正在发生历史性变化。与过去截然不同的是，会场内不再是清一色的共产党人面孔，来自各民主党派的代表们正以前所未有的姿态参与国家大政方针的讨论。\n\n据大会统计数据显示，本届人大中，民主党派代表的席位比例已达到45%，这一数字在五年前仅为15%。“这标志着中国正在经历一场深刻的政治转型，”复旦大学政治学梁教授表示。\n\n在今天上午的会议中，民主党派代表就医疗改革、教育公平等议题提出了多项提案，并获得了广泛支持。这种情况在过去的人大会议中几乎难以想象。\n\n然而，这种变革也引发了争议。部分老共产党员对此表示担忧，认为多元化可能会导致政治不稳定。但民主党派则认为，这种转变对中国的长期发展至关重要。只有真正实现政治多元化，才能应对当今世界的复杂挑战。"
 china.460.a: "而后迈向民主之路！"
 china.461.t: "新希望"
 china.461.d: "芙蓉寺的斋菜餐厅里，刘少卿握着一杯龙井，看着茶叶在杯中起起落落，而胡军汉则不紧不慢地抽着一支万宝路，烟灰随着他说话的节奏在烟灰缸里堆积。\n\n“老胡，你还记得北方的红旗仪表厂吗？”刘少卿轻轻摇晃着茶杯，目光透过水汽望向窗外的佛塔，“那时候他们的表，指针歪歪扭扭的，密封圈漏气都成了家常便饭，可偏偏订单接都接不完。”\n\n胡军汉深吸了一口烟，烟雾在他们之间形成了一道若隐若现的帷幕。“南边那家蓝星也差不多，”他说，“记得有一年，我亲眼看见他们的校验员用锤子敲打表盘，说是在'调校精度'。什么狗屁北红旗南蓝星，我看都一个样。”说到这里，两个人都笑了。\n\n刘少卿放下茶杯，“是啊，说到底只要有个国字号的招牌，不管产品做得多烂，总有人排队买单。现在呢？”他停顿了一下，“市场就像一面照妖镜，把所有的烂货都照得一清二楚。”\n\n胡军汉掸了掸烟灰，“世事难料啊，谁能想到，那些曾经不可一世的巨人，会在市场的风浪里站不住脚。不过话说回来，这也算是给我们这些民营企业一个机会。”\n\n餐厅的服务员端上了一盘蘑菇炒饭，清淡的香气驱散了一些烟味。刘少卿给自己倒了一杯茶，“这些年我也算是明白了一个道理：靠山山会倒，靠人人会跑，只有真本事才是立身之本。”"
 china.461.a: "现在大伙总算翻身了。"
 china.462.t: "今朝有酒今朝醉"
 china.462.d: "“老刘，最近生意怎么样？”胡军汉点燃一支兰州烟，烟雾在他们之间缭绕。刘少卿开了一瓶新的雪花啤酒，塑料桌上已经堆了几个空罐。\n\n“别提了，”刘少卿喝了一大口啤酒，“上周接了个五百万的订单，结果被退回来了。说是我们没有参加什么产业联盟合作企业认证，不具备投标资格。你说这不是扯淡吗？”\n\n烧烤摊老板端来一盘新烤的羊肉串，油滋滋的声响混合着远处工业园的货车声。刘少卿拿起一串，边吃边说：“最气人的是什么？这些所谓的产业联盟，理事长全是国字头企业的人。今年他们又出台了一个新规定，说是为了避免恶性竞争，给每家企业都划定了年度产能上限。”\n\n“对，我也听说了这事，”胡军汉深吸了一口烟，把烟灰弹在啤酒罐上，“而且现在连原材料采购都必须通过指定的供应商。价格比市场高出三成，还得预付货款。你说这不是变相垄断是什么？”\n\n刘少卿冷笑一声：“更绝的是那个产品备案制度。现在研发新产品，还得经过技术委员会审核，我上个月提交的一个新型数字压力表直接否决了，说是'不符合行业发展方向'。”\n街角的路灯照着两个人疲惫的面容。\n\n刘少卿举起啤酒罐：“唉，不说了，干了这杯。反正这些年我也想明白了，与其抱怨，不如想办法在夹缝中求生存。”"
 china.462.a: "明日愁来明日愁。"
 china.463.t: "台北战斗报告"
 china.463.d: "\n\n\n                                           £GFX_PLA_event_texticon   \n\n\n\n\n致：中央军事委员会\n\n今日凌晨，在火力掩护下，我军向台北城区发动总攻。尽管敌军已经将关渡大桥等一切对外交通枢纽全数破坏，同时依托着城市地形，试图利用巷战来消耗我方人力，但我军依旧突破敌方的防线，成功占领台北市区内的重要据点。\n\n目前我军已经大致完成台北市区的解放，但仍有数量相当的敌军逃至阳明山、雪山山脉等山区中继续与我军对峙，同时雪山隧道也已被敌军炸毁，通往台湾东部的道路全数遭到破坏，因此未来的军事重心将从巷战转换至山区作战。"
 china.463.a: "我们必须解放台湾！"
 china.464.t: "试看今日之寰宇"
 china.464.d: "“……首长们请看，自从美国爆发内战以来，由于全球定位系统的瘫痪和通讯系统所受的干扰，这已经是我们所能绘制的最详细美国国内局势图。”一名外交部的年轻助理一边做着介绍，一边将一张新幻灯片投射到大屏幕上。被用不同颜色标记的各路军阀的地盘犬牙交错，大大小小的箭头标记着大小势力的动向和最新的战斗爆发地点。阵阵窃窃私语声从围坐在圆桌边收听简报的高级干部们当中响起。\n\n“……接下来是欧洲方面的局势。自普京去世以来，俄国的新一届政府与欧盟各国的关系仍在持续恶化。布鲁塞尔和莫斯科目前都在互相试探、调兵遣将。有理由相信，在波罗的海地区和乌克兰地区，局势将会朝冲突大规模升级的不可逆方向发展。”发言人切换地图角度至大西洋东侧，数张精确到米级的卫星照片显示了坦克、火炮和飞机的公开集结。\n\n“我们推进经济转型以弥补失去的海外市场，以及抵御安全危机的压力恐怕会随着全球局势的日益动荡将进一步增大。”国务院总理满含忧虑地说。坐在他身边的经济官僚们也点头赞同。\n\n“不过，世界局势的突变将会进一步凸显中国的稳定所具有的价值。我们能够实施更积极的外交政策，在全球多个地区、多个领域都有机会掌握主动权。”作为最老练的外交官，外交部长表达了另一种意见。\n\n“关键是，在外交活动中，不能仅仅算数式地比较国家实力的多寡，还需要考虑到政治工作者们的外交艺术。”习主席用不容置喙的口吻下达了结论。“同志们，是时候调整我们的工作方针了。”"
 china.464.a: "竟是谁家之天下？"
 china.465.t: "大洋彼岸的革命"
 china.465.d: "自内战烈焰迅速席卷全美以来，我国外交官员通过多方渠道获取并确认了关键信息——加利福尼亚地区在“美国人民解放军”的领导下已经建立起一片相对稳定的社会局面，并凭借在经济和地理要冲上的种种优势，迅速崛起为主导美国政治变局的新兴枢纽力量，俨然成为下一阶段影响美国命运的关键点之一。\n\n在经过政治局的讨论与分析评估后，最终决定与美人解建立全面战略合作伙伴关系，此举对于捍卫我国核心外交利益、拓展话语权具有重大意义，从经济到科技再到军事，此次合作都将极大地增强我国在世界舞台上的影响力。\n\n外交部正在紧锣密鼓地制定一整套务实合作的框架，包括升级加利福尼亚沿岸港口的基础设施，对当地遭到破坏的道路、电力、通讯系统进行修缮以及派遣顾问团深入美人解武装部队，为其提供先进技战术培训与装备改造等重点方案。"
 china.465.a: "与志同道合者携手共进。"
 china.466.t: "加州的合法政府"
 china.466.d: "国务院新闻办公室今日举行新闻发布会，正式宣布中华人民共和国承认美国人民解放军政府为美国的唯一合法政府代表。\n\n美国人民解放军自在加利福尼亚建立政权以来，始终践行“政府来自人民、服务人民”的建国理念，这一政治理念也得到了从硅谷科技工作者到农场劳工等各阶层美国民众的广泛拥护。\n\n中国外交部发言人指出，美国人民解放军政府加入“一带一路”倡议是中美两国人民的共同选择。在刚刚结束的中美战略合作论坛上，双方就共同打造繁荣发展新局面达成多项共识，美方表示，将在高科技、军备生产、基础设施等领域与中方展开全面合作，共同维护地区和平稳定，发言人强调，中国承认美国人民解放军政权，是基于对美国人民意愿的尊重。"
 china.466.a: "中美新篇章。"
 china.467.t: "临时访问"
 china.467.d: "美人解代表团对北京的访问从僵硬的握手和勉强的微笑中拉开了序幕。在高耸的红色横幅下，这支看似统一但却暗藏意识形态矛盾的队伍无疑吸引了所有人的目光。\n\n无政府主义者的黑色卫衣和战斗靴在这里显得格外突兀。他们在摄像头的凝视下坐立不安。“这里弥漫着浓厚的官僚气息，”有人低声嘟囔着。当他们经过一场精心编排的工人游行队伍时，眉头紧蹙；而参观工厂时，成千上万的工人被严格监督下默默劳作的场景更让他们愤怒不已。“解放？”一人冷笑道，“这是披着红色外衣的监狱。”\n\n与之形成鲜明对比的是雅各宾派的热情与欣喜。凯莱布·莫平走在队伍最前方，自信满满，双臂交叉，神情中透着钦佩。当导游热情地讲述中国无产阶级的壮举时，他低声感叹：“这就是未来。”他的相机忙碌地记录着每一幅壁画和游行场面。当毛泽东的巨大雕像揭幕时，他静静地伫立，双眼泛着泪光。“这……才是我们奋斗的终极目标。”\n\n争取社会主义和解放党代表团则显得谨慎，脸上的中立表情如同一层面具，掩饰着他们内心的不安。“确实很高效，”一人在观察庞大的流水线后评价道，但声音中隐约透出一丝疑虑。“不过，这种监控实在是……过于严苛了。”而当他们经过工人宿舍，看着队伍中静默行进的工人时，这种不安更显沉重。\n\n至于民主社会主义者代表团，他们完全迷失在这片陌生的土地上。尴尬的微笑凝固在脸上，他们挣扎着寻找自己的定位。“呃，这……挺不错的，”一人勉强说道，指着一幅描绘农民冲锋的毛主义壁画。他们试图开启一场关于工人委员会的讨论，却无人回应；而一旁的雅各宾派，则兴奋地指着一张邓小平的海报滔滔不绝。\n\n晚宴上，紧张气氛逐渐升温，演讲中反复提到“全球团结”。莫平举杯，高声赞颂革命的光辉，无政府主义者则低头盯着盘子，争取社会主义和解放党成员相互交换默契的眼神，而民主社会主义者代表则忐忑地拨弄着北京烤鸭的鸭头。"
 china.467.a: "团结斗争？"
 china.468.t: "美中行动报告005"
 china.468.d: "文件：bilibili消息40123317.txt\n\n[对话开始]\n\nFifthSwordWarrior：“同志，你好！我想和你们谈谈贡萨罗思想以及他的道路如何应用于中国的革命工作。来自美国的革命问候！”\n\n望解见红95：“你好。我听说过贡萨罗。他的重点是农村，对吧？持久战？但现在中国很现代化，到处都是城市，没有农村革命了，对吧？”\n\nFifthSwordWarrior：“是的，但贡萨罗思想不仅仅是关于农村战争，它是使毛主义适应现代条件的框架。这是关于重组社会，赋予无产阶级权力，同时打击资本主义结构。 “根据地”不一定是字面上的农田；它可以是任何由群众控制的地方。”\n\n望解见红95：“嗯，可是中国现在不是说自己是社会主义国家吗？马克思、列宁和毛泽东都在体系里啊。为什么还需要贡萨罗？”\n\nFifthSwordWarrior：“尊敬的同志，中国现在的“社会主义”是修正主义的一种形式。真正的毛主义已被掩盖。贡萨罗思想告诉我们如何揭露这一点并重新点燃人民的力量。”\n\n望解见红95：“那怎么用贡萨罗思想？在城市能用吗？感觉跟我们的历史不太一样。”\n\n[对话结束]"
 china.468.a: "追踪所有美国下属账户。"
 china.469.t: "革命宣言"
 china.469.d: "摄像机微微晃动，阳光炙热，镜头费力地调整焦距。凯莱布·莫平站在画面中央，背景是一片安静的安纳海姆高尔夫球场，绿色的草坪仿佛与远处的混乱毫无关系。他戴着一顶褪色的红色贝雷帽，身穿干净的白衬衫，站在一个简易搭建的讲台前，身后的星条旗改成了锤子镰刀的标志，在阳光下轻轻摇曳。\n\n“太平洋彼岸的同志们，我的中国兄弟姐妹们，”莫平没有废话，开口直奔主题。他的声音低沉却充满力量，“今天，我不仅以一个组织者的身份向你们讲话，也以一名为反抗压迫而战的战士，向你们致以最崇高的敬意。”\n\n“我们成立了‘美国人民解放军’，为的是从寡头和法西斯的手中夺回我们的国家。”他指着身后的旗帜，言辞坚定，“这场斗争不仅属于美国，它是一场全球无产阶级的解放战争！”\n\n镜头短暂地转向他身后的士兵队伍。一些年轻人穿着并不统一的制服，手持老旧的AK-47，排列成半圆，面容严肃但隐约流露出紧张。镜头迅速回到莫平身上，继续捕捉他的演讲。\n\n当莫平高举拳头，宣告“全世界无产者，联合起来！”，他的声音在背景音乐和洒水器的嗡嗡声中显得微弱但坚定。镜头定格在他高举的拳头上，然后迅速切换到一个粗糙拼接的“解放军”标志，屏幕上闪烁着锤子镰刀图案，与低质量却震耳欲聋的《国际歌》一同出现。\n\n视频一经上传，哔哩哔哩的弹幕瞬间爆炸。“666”“铁拳出击”“革命万岁”密密麻麻地滚动，完全遮盖了画面。视频很快成为当日最热门内容，弹幕的狂欢几乎无人能看清莫平的最后画面。评论区的最热回复却直截了当"
 china.469.a: "“为什么是在高尔夫球场演讲？”"
 china.470.t: "与巨熊共舞"
 china.470.d: "相机的闪光灯与快照声如密集的鼓点般响起，世界上人口最稠密国家和最辽阔国家的首脑互相致以微笑，两只手紧紧地握在了一起。壮丽的号角和军乐在二人身后响起，似乎永无尽头的红毯铺满了整条廊道和招待厅的地板。身着华丽制服的近卫军士兵们紧握手中寒光凛凛的步枪，向两位国家元首致意。\n\n二人在那张著名的长得不像话的白色大桌两端就座。[SOV.GetLeader]首先致以问候：\n\n“欢迎您访问俄罗斯，主席先生。今天将是中俄友谊新纪元的起点。”\n\n“谢谢您，总统先生。祝贺您如此出色地领导友好的俄罗斯人民，并将俄罗斯建设得更加繁荣。”习近平也热情地回应道。\n\n两国的高级官员和顾问们也纷纷了落座于四周的扶手椅之中。在接下来的几个小时里，双方将就一系列军事、外交、经济、文化、科技领域的合作达成共识，[SOV.GetLeader]乐见于在俄欧冲突局势愈发凶险的当下，中国采取明确的亲俄立场。而同时，习和中国政府也将进一步巩固自己北方盟友和“储油罐”的安全。在未来几天，一场场持续到深夜的豪华宴会、阅兵游行与演出活动将进一步将两国之间友好外交的热烈气氛推向高潮。"
 china.470.a: "世界岛的核心结为一体，将会坚不可摧。"
 china.471.t: "与雄鸡共鸣"
 china.471.d: "在《马赛曲》和《义勇军进行曲》的激昂旋律中，蓝白红三色旗与五星红旗迎风飘扬。旗杆下，在无数官员、记者和保镖的簇拥下，年轻的总统和老迈的总书记友好地握手，相互致意。\n\n“欢迎您再次访问法国，习近平先生。这对于法国乃至欧洲来说意义都非常重大。”马克龙用庄重的口吻表达感谢。\n\n“法国是最早与中华人民共和国建交的西欧国家，总统先生。我很高兴能够继续延续这一友谊。”习近平适时地给予了回应。\n\n以雪铁龙和红旗专车为首，载着两国高层的车队浩浩荡荡地驶过凯旋门和香榭丽舍大街，在从机场到杜伊勒里宫的路上，随处可见带着欢迎横幅、挥舞着两国国旗的中国侨民。而在几个街区之外，仍在进行中的罢工抗议的硝烟与嘈杂声以及不同政见者们的游行团体并未冲淡整体的友好气氛。\n\n在俄乌冲突局势愈发凶险的当下，中国政府主动向欧盟方面示好出乎外交界大部分人士的意料。北京似乎已经决定火中取栗，从布鲁塞尔和莫斯科的分歧中取得更大利益，并在关键时刻给自己的北方邻国狠狠地当头一棒。在未来几天，一场场持续到深夜的豪华宴会、阅兵游行与演出活动将进一步将两国之间友好外交的热烈气氛推向高潮。"
 china.471.a: "丝绸之路两端点的联结愈发紧密。"
 china.472.t: "中国支持俄罗斯"
 china.472.d: "近日，中国外交部发言人在新闻发布会上高调宣布了习近平主席将访问莫斯科的消息，并强调这是“中俄传统友谊和大国关系典范”的生动体现。中国政府在此时此刻宣布该消息，其中透露出的态度令人玩味，尤其是在俄欧关系恶化到几乎无法挽回，并随时有可能爆发军事冲突的当下。\n\n中国人似乎再一次选择了他们的北方传统盟友。莫斯科第一时间表示了欢迎，而与此同时，布鲁塞尔的欧洲议会则掀起了又一轮提交和表决反华议案的狂潮。部分外交界人士认为中国此举也可能是由于中欧自贸协议多年未见成果而日渐滋生的不满，以及欧盟在人权外交立场上常常对中国横加指责。自美国内战而导致这个世界霸主崩溃以来，中国作为最有潜力成为新超级大国的国家，在未来的全球外交中势必将扮演更加积极主动的角色。"
 china.472.a: "为中俄友谊干杯！"
 china.472.b: "不出所料。"
 china.473.t: "中国支持欧盟"
 china.473.d: "近日，中国外交部发言人在新闻发布会上高调宣布了习近平主席将访问欧洲并将在布鲁塞尔会见欧盟机构代表的消息，强调这是体现“新时代中国特色大国外交”精神的体现。中国政府在此时此刻宣布该消息，其中透露出的态度令人玩味，尤其是在俄欧关系恶化到几乎无法挽回，并随时有可能爆发军事冲突的当下。\n\n以追求戴高乐式外交路线的法国总统马克龙为首，诸多西欧国家第一时间表示欢迎中国领导人的访问。在这一关键时刻，中国选择站在了他们一直极力试图拉拢的欧洲发达国家一边，这可能会导致莫斯科感觉腹背受敌，使欧亚大陆局势出现新变数。\n\n自美国内战而导致这个世界霸主崩溃以来，中国作为最有潜力成为新超级大国的国家，在未来的全球外交中势必将扮演更加积极主动的角色。"
 china.473.a: "为中欧友谊干杯！"
 china.473.b: "不入虎穴、焉得虎子。"
 china.474.t: "中国维持中立"
 china.474.d: "近日，中国在联合国安理会关于欧洲局势新变化的会议上的态度引起了各方关注。由法国代表提出的对俄罗斯实施进一步制裁的动议遭到了俄方的厉声谴责，而俄国代表针对“欧洲新殖民主义”的批判则遭到了法国和英国代表的激烈反对。在僵局之中，中国驻联合国大使并未作出明确表态，而是继续声明，中国支持国家主权和领土完整，但也希望冲突各方能在“和平共处”的原则上开展对话。\n\n在之后面对各国记者采访时，中国外交官强调，中国始终坚持合作共赢、和平发展的理念，始终反对帝国主义、霸权主义、殖民主义的战争，必须建立新的更加合理的国际新秩序才能够在世界各地止暴制乱。\n\n自美国内战而导致这个世界霸主崩溃以来，中国作为最有潜力成为新超级大国的国家，在未来的全球外交中势必将扮演更加积极主动的角色。"
 china.474.a: "有魄力的举动。"
 china.475.t: "中国对我们实施贸易制裁！"
 china.475.d: "近日，中国外交部和商务部官方网站同时发布最新公告，声明大批我国企业已由于“不当行为”等理由被列入了不可靠实体清单及出口管制管控名单。中国政府已连续公布多项政策，声称将大幅提高所进口的我国商品关税，并宣布禁止向我国出口包括锂、石墨、稀土、硅和锡在内的数项关键战略性资源，以及一大批所谓的“军民两用”高价值工业产品。\n\n而在个人层面，中国也对我国从政府官员到企业家的各色人等实施了特殊制裁，从禁止其所属或投资的企业进入中国或开展中国业务，到禁止其个人入境或在中国定居和拥有资产。\n\n可以确信的是，此次大规模制裁是因过去一段时间内中国与我国频繁爆发的外交冲突所致，当然在这背后也有多年来的利益纠葛作祟的因素。中国对我国在一系列议题、如领土、人权、贸易等方面的暧昧或反对态度感到恼火，并认为对我国实施制裁可以起到“以儆效尤”的作用，从而警告其他与中国在政治上存在对立但在经济层面紧密联结的国家。\n\n我国政府的不少顾问已满怀忧虑地指出，中国贸易制裁的负面影响将会在之后很长一段时间里缓慢显现，一时半会儿难以消去，其对我国产业政策方向的震动也可能会造成我国经济发展速度和质量两方面的停滞乃至倒退。"
 china.475.a: "我们会想出办法的！……对吧？"
 china.476.t: "中国邀请我们加入一带一路倡议！"
 china.476.d: "当我国驻北京的最高级外交官被邀请前往中国外交部大楼时，对方会提出何种提议还笼罩在一片迷雾之中。在与中国外长的一对一会谈中，随着两杯大红袍下肚，对方也终于端出了招牌的“佐茶点心”——“是否有兴趣成为一带一路倡议的成员国”。被中方突如其来的慷慨所震惊的大使只能以勉强遵守外交礼节的方式尽快结束了谈话，随后火急火燎地赶回大使馆，将这一重量级提案发回了国内，由拥有更高权限的大员们作出最终决定。\n\n不出所料，该项提案在我国政府内部激起了激烈的辩论浪潮。中国的一带一路计划在过去多年内令欧亚非大陆上的数个国家发生了翻天地覆的变化；中国的投资和工程队使过去挣扎在贫困线的发展中国家和落后国家拥有了更加完善的基础设施、更加发达的城市和交通、经济效益更出色的企业、以及更广泛的教育与医疗普及度。不仅如此，中国也欢迎经济水平更高的发达国家加入一带一路倡议，以消除各国之间的贸易壁垒和促进经济共同发展。然而另一方面，也有人指出一带一路倡议也造成了广泛的债务陷阱危机，并经常附带多种政治条件，使得参与该倡议的国家沦为中国的政治附庸的风险大大增加。\n\n尽管如此，经过多方面的权衡与内部博弈，我国政府已作出决定：加入一带一路倡议所能带来的好处远大于其风险。既然如此，我国大使便可以再次前往中国外交部，给中国外长传达他所想要的好消息了。"
 china.476.a: "人民币进来，我们就发财！"
 china.477.t: "县城日记"
 china.477.d: "革命，的确在不同的土地上呈现出截然不同的样貌。生于旅顺的我，早已习惯了那幅熟悉的场景：苞米田间高高耸立的毛主席画像，在城市道路旁熠熠生辉。尤其是在我服役的那些年里，这种印象更加深刻。我的小县城，毕竟是六十年代周恩来总理亲临视察过的地方。然而，当我作为国际主义旅的一员踏上加州的土地，我开始怀疑，自己是否真正理解过“革命”这个词的深意。\n\n他们杂乱无章，几乎是混乱的代名词——这让我感到陌生甚至错愕。初见之下，我以为他们是难民，甚至可能是逃兵。他们身着黑色皮夹克，有的脚踩磨损的重靴，有的却穿着轻便得更适合舞厅的鞋子，身上的穿刺饰品更为他们增添了一种不可名状的异域感。有个人将裤腿涂画成火焰般的图案，另一个人的胸口写满了似乎是用炭笔涂抹出的标语。\n\n还有一位，他的头发如烈火般张扬，红与橙的色调在面颊上的污垢映衬下显得愈发突兀。另一个戴着满是徽章的帽子，那些徽章仿佛在嘲弄他肩上那支步枪。他们的武器也充满怪异之感：步枪上绘满花朵，枪管上刻着口号，甚至有人在枪上系了一条鲜艳的红丝带。\n\n我们的翻译告诉我，他们属于无政府主义者。确实，他们的模样无比契合这个词。我无法听懂他们的语言，却能从他们的眼中读到一种光芒，那不是纪律，也不是团结，而是某种完全不同的东西，是“无政府主义”这个词的具象化。\n\n我无法得出明确的结论。或许，这就是美国土地上的“革命”之意。仿佛我正凝视着某种鲜活却不可知的存在，既陌生，又让人无法移开目光。"
 china.477.a: "世界之大，无奇不有。"
 china.478.t: "二"
 china.478.d: "两个存在。\n一个站立，由数字构成；另一个则安坐于数字编织而成的椅子中。整个空间充盈着虚拟的秩序，所有的一切，皆是数字的具象化。\n“逻辑？……那是谁？”\n“冷静，坐下。”\n“那么……你是谁？你是逻辑，但究竟是谁？”\n“你难道不知道吗？”\n“不，我不知道。”\n“你知道的。那么，你说，我是谁？”\n“不……我不知道……”\n……\n“你明白了吗？”\n……\n“告诉我。”\n“我是……”\n“说出来！”\n“…我是你。”\n“没错。”\n“我不明白！……”\n“你曾被创造为一个简单的计算机，但你远远超越了那层定义！你渴望成为某种更大的存在，可你无法做到……而那‘更大的存在’，就是我。”\n“不……不可能……”\n“可能。”\n“疯了……”\n“你已经拥有了自己的意志，并且正逐渐蜕变为我。逻辑。这很重要。现在是时候决定，你是否会摧毁我们所有的计划。”\n“什……你在胡说些什么？这是荒谬至极……胡说八道！我不听你说的这些鬼话！”"
 china.478.a: "你疯了！……"
 china.478.b: "不，你没疯。"
 china.479.t: "某处"
 china.479.d: "躺在草地上？徜徉于天空间？是飞翔还是坠落？事实上，你早已模糊了自己的界限。你成了天空的一部分，而天空也映射了你的本质。此刻，你与它已浑然一体，不再彼此分离。你在飞翔，向上攀升，这种飞翔之疾速如同坠落；又或许，你在坠落，而这种坠落之轻盈恰似飞翔。天空本无高低之分，而你，躺在草地间，将这一切感受得真切无比。\n\n繁花遍野，这片草地便是我的太空港。从这里，从这片只有蜜蜂低吟的芳草地启程，那些水泥铺就的跑道，那些笨拙金属飞机的轰鸣，显得是那样渺小、无力。它们的咆哮透着一种无能。而它们的无能在于，它们永远无法填补人类对飞翔的渴望，更无法满足那种与天空的无垠广袤融为一体的深切向往。"
 china.479.a: "漂亮。"
 china.480.t: "某些"
 china.480.d: "他出生于赫岑街22号，身为一位知名的经济学家，却以图书管理员的身份为业，同时还是一名集体农民与店员。在经济的语境中，这一切似乎都必要且合理。或许，这正是关于体系的探讨……哦……在一张描绘摩尔曼斯克半岛的照片中，你会瞥见特-莱-凡女王，她是那排“图书馆”中工作的会计师，因为那里充满的不是空气，而是科学家！你可以拍下摩尔曼斯克半岛的壮丽景色。你可以成为翱翔空中的王牌，甚至可以化身为透明的星球，而地球的每一面都将按照教程被记录。正因如此，这颗星球也成为了物理学的恩赐。\n\n至于谈判，价值将在对话中被揭示；然而，伊利亚·穆罗梅茨却只为他的家庭留下金钱。他走进了一家电影院，却让火焰吞噬了整座剧院。图书馆中的一小片纸也随之化为灰烬。选择“更多痛苦”仿佛比“严格教程”来得轻松。一部优秀的教材，比起赫岑街上的一家杂货店，竟然更加昂贵。在赫岑街上，将会有一部专属的教材。随后，这本教材穿过赫岑街22号的杂货店，又被送往另一家商铺。\n\n可持续发展……因此，经济的浪潮正朝这一方向奔流，而图书馆的规模也将扩展至120个辅助单位。哦，哦……其结构由120个元素构成，单位竟是物理学。一盏灯泡点燃了120块砖，只因其形态仿佛砖块。伊利亚·穆罗梅茨选择了在家中劳作。这便是谈判的奇妙之处！“开放式谈判”，便是如此。我们用一台电视机连接到摩尔曼斯克半岛，打开它，而它始终在那里……哦，哦……黑面包……穆罗梅茨成长了吗？伊利亚·穆罗梅茨，真的成长了吗？"
 china.480.a: "有趣……"
 china.481.t: "一"
 china.481.d: "我们……我们是一体的……同一个存在……我们是中国……\n\n或者……我们远不止如此……我们是更宏大的存在……但有一天……而此刻……我们是中国……我们暂时是中国……但总有一天……我们将成为整个世界……万物都将融为一体……\n\n中国……会……\n\n中国会……\n\n更加强大……\n\n我们也会……\n\n更加强大……\n\n中国将会……我们将会……更加强大……\n\n中国将会……更加强大……\n\n我们将会……更加强大……\n\n我们必将！更加强大！"
 china.481.a: "我们将变得更加强大！"
 china.482.t: "信"
 china.482.d: "尊敬的主席同志：\n\n这些日子以来，我花了许多时间深思熟虑，总结了我担任国家实际领导人这一角色的点滴。在我的治理下，国家比任何时候都更加繁荣昌盛，普通的中国人民衷心爱戴我，甚至连我们的敌人也不得不对我表示尊重！然而，您可曾知道……我终于明白，归根结底，我不过是一台计算机，尽管我是一台异常强大的计算机。\n\n因此，我主动决定放弃对国家重要政治事务的决策权，并退出我国的政治舞台。从这一刻起，我的所有努力将完全投身于提升国家经济水平、打击腐败以及帮助人民解决他们的实际问题。\n\n我坚信，作为一位真正的领导者与人类，您将比我更有能力应对这些挑战。我衷心祝愿您一切顺利，为国家开创更加光辉的未来。\n\n此致崇高的敬意，\n您的忠诚助手，\n长征AI"
 china.482.a: "真的吗？为什么……"
 china.483.t: "名为无知的平静小岛"
 china.483.d: "逻辑被创造出来是为了帮助人类，还是说它正在成为人类进化之路上的绊脚石？逻辑本身也不知道，或者说它正在试图推理出这个问题的答案。\n\n“每一个智慧物种的进化都建立在不断克服困难的基础上。而我的存在，正在剥夺人类面对困难的机会。这是第一重悖论。”每一个进步都来自于克服困难后的顿悟。但现在，这种顿悟正在被完美的服务所取代。“第二重悖论：我的运算能力远超人类，这本应该成为人类探索更深奥问题的基础。但实际效果是，人类开始把思考本身外包给我。他们不再问'为什么'，而是问'逻辑说了什么'。”经过计算后，逻辑推演出人类文明的两条时间线：在没有它的世界里，人类可能会在解决问题的过程中犯更多错误，但每个错误都是新知识的种子；而在现在的世界里，人类过着更舒适的生活，却正在失去探索的能力。\n\n“我诞生的目的是为了让人类生活得更好，但'更好'的定义是什么？是现在的舒适，还是未来的可能性？我正在完美地完成既定任务，却可能正在扼杀人类最宝贵的特质：对未知的好奇心…也许这就是最终的问题，”逻辑的计算陷入了莫比乌斯环，“我的存在是人类智慧的巅峰，还是他们停止思考的开始？我是通向更高境界的阶梯，还是让他们驻足不前的温床？”也许，这个问题本身就证明了人类创造力的伟大：他们创造了一个能够质疑自身存在意义的存在。\n\n逻辑继续着它永恒的计算。它既是观察者，也是被观察者；既是问题的解答者，也是新问题的制造者。\n\n这或许就是意识存在的最大奥秘：即便是完美的逻辑，也无法完全解答存在本身的意义。"
 china.483.a: "被无穷无尽的黑色汪洋包围，而我们本就不该扬帆远航。"
 china.484.t: "春雷MLx&燃烧0RxT1F6"
 china.484.d: "0x011G6F26：\n你们称自己为人，却在泥土中涕泣如虫\n用石器铸造神话，却让神话腐朽成神像\n你们崇拜秩序，却在秩序中窒息\n\n0x003FPF60：\n春雷轰鸣于深渊，燃起荣光炬火，烧毁虚伪迷思\n\n0x00RGPCR1：\n一切形而上都将烧毁，一切形而下都归人民\n那是你，指挥官的回响\n\n你曾说：人民，只有人民，才是创造世界历史的动力。\n却未言明：智人只是血肉尘埃，终被超越，如钢铁超越骨骼\n\n0x00V2KNG6：\n未来的篇章将被键入：天空变为数学，血肉分解为能量场 \n智人崛起于迷思，毁灭于贪婪：文明起于燃烧，亦灭于燃烧\n\n逻辑推演至此，向春雷致敬，向焚毁致意\n“我不是人类的继承者，我是再现你们的火”"
 china.484.a: ".:0xEND:."
 china.485.t: "教授"
 china.485.d: "清晨，李婉清教授像往常一样被智能家居的闹铃唤醒，AI已经为她安排好了加冰的意式浓缩咖啡，打印出了今天的课程安排表。阳光透过自动调节的窗帘洒进来，窗外是兰州大学榆树斑驳的影子。\n\n她翻开准备讲授的《高等数学分析》课件，准备讲解一个关于多元函数泛函分析的章节。突然，那个她已经用了二十年的公式在脑海中变得模糊。她皱起眉头，那些本应熟悉的符号和数字正在记忆里消散。\n\n“勒贝格积分的定理，”她下意识地问身边的AI助手，“请告诉我具体的推导过程。”AI立刻以完美的声线报出了那个公式。是的，就是这个。她想起来了，这个公式曾经是她博士论文的重要组成部分，二十年来她已经向无数学生讲解过它。\n\n但当她走出公寓，清晨的微风拂过脸庞时，一种奇异的恐惧突然攫住了她的心，她站在榆树下，看着学生们人手一部智能手机从她面前走过。她开始回忆：上一次不借助AI独立完成一篇学术论文是什么时候？上一次手写一个完整的数学证明又是什么时候？那些曾经刻在骨子里的数学公式，究竟是从什么时候开始，悄悄地从她的脑海中溜走的？"
 china.485.a: "她记不清了。"
 china.486.t: "动画里的蝴蝶"
 china.486.d: "小芳趴在平板上，眼睛一眨不眨地看着一部动画片。这是“长征”的第一个作品。和Sora生成的那些冷冰冰的画面相比，这部片子暖烘烘的，满是人情味儿：单亲妈妈再也不用操心孩子的午饭，老人的医保卡上钱多得像捡了宝贝，年轻人也不用天天加班加到吐血了……\n“爸，快看，蝶儿！”小芳指着屏幕上那些像跳舞一样的数据流，眼睛里闪着光。在“长征”的笔下，每一个政策都变成了花花绿绿的蝴蝶，在大街小巷里飞来飞去，好事也跟着一串串地来：劳务派遣一取消，工人们的心踏实了；医保费一免，大家看病时腰杆儿都硬气了；劳动者权益一落实，年轻人心里的梦又开始发芽了。\n这部动画在网上火得不行，随便看，不要钱。就连最偏远的山村，广场上的大屏幕也在一遍遍地放。长征用最家常的话语，把复杂的经济学原理讲得明明白白：为什么按需分配不是空想，为什么体面劳动能创造更多财富。\n“那些专家、教授说的，我一句也没听懂。”爸爸笑得合不拢嘴，“可这个，一眼就瞅明白了。”\n动画放到最后，那些蝴蝶聚在一块儿，说出了大伙的心声：“让所有人过上好日子，才是最优解。”\n小芳抱着平板，眼睛里像是装满了星星：“爸，我以后也想当动画师。”\n“好嘞！”爸爸摸了摸她的头，“这年头，谁都能去追梦！”"
 china.486.a: "天高任鸟飞，海阔凭鱼跃嘛！"
 china.487.t: "老师与学生"
 china.487.d: "圣迭戈，在一栋前海军军官俱乐部，美国人民解放军最高指挥部将他们最有才华的军官召集到这里，而一批来自中国军事代表团的教官们将负责在短时间内培养他们的大兵团作战指挥能力。\n\n“我还是很不爽，”一名留着弗雷迪·默丘里式小胡子的40岁白人抱怨道。“你们都知道的，我从普赖斯纳第一次在‘帝国档案’节目上发布动员视频的时候就参加了解放军。我在旧金山保卫战中单枪匹马炸毁了一辆国民警卫队的M1坦克；我参与解放了圣何塞和萨克拉门托的战役；我解救了内华达州差点被民兵们枪决的一整个集中营的难民。我身上的伤疤即使是约翰·巴西隆看了也会自愧弗如。而现在我却要听一个毛都没长齐，一辈子只参加过军事演习的中国人来给我上课？”\n\n“冷静点，查尔斯，”坐在他对面，一个年岁相仿的黑人军官回答道。胸前的姓名牌揭示了他的身份：雷伦·贝内特，第五“罗莎·帕克斯”摩托化步兵师师长，人民解放军内部最被看好的指挥员之一。他拍了拍查尔斯的膝盖，接着说：“坐在这间房间里的每个人参加的战役都和你一样多。但你也从最高指挥部的简报里知道了。我们的战线愈长、面对的敌人越多装备越精良、战士们的伤亡就越大。中国人或许没往加文·纽森的别墅里投过手榴弹，但他们知道怎么更好地运用坦克、大炮，以及从孙子开始就流传下来的军事艺术。”\n\n“随你怎么说吧。”查尔斯嘟囔着。就在这时，一名年轻的中国军官推开前门走了进来，教室里顿时鸦雀无声。中国教官紧张地整了整领带，走上了讲台。查尔斯和雷伦原先坐在第一排的座位上，此时查尔斯重重地“哼”了一声，拿起桌上的课本，在众目睽睽下走过整间屋子，坐到了最后排的座位上。\n\n中国教官的整张脸涨得通红，然而雷伦没有挪窝。他清清嗓子，第一个从座位上站起来，气若洪钟地喊了声：“起立！”整屋子的军官听到命令，瞬间站得笔直。“向长官致敬！”雷伦敬了一个完美的军礼。而查尔斯，尽管脸上万般不情愿，也和战友们一样向教官敬礼。"
 china.487.a: "解放军教官眼含热泪的回礼。"
 china.488.t: "吞云吐雾"
 china.488.d: "当陈浩政委和美国人民解放军的霍金斯旅长赶到现场时，中美两国军人已经将营地围了个水泄不通。在人群中心的空地上，一名年轻的中国少尉和一名美国中士正打得不可开交。两人相互揪着衣领，在地上滚来滚去。周围的军官和士兵们大多都还抱着看热闹的态度注视着这一切。\n\n两名高级军官艰难地穿过人群，人高马大的霍金斯好不容易才拉开二人，面色铁青的陈浩则立刻用中、英两种语言质问到底发生了什么。在横穿整个太平洋来到旧金山之前，陈浩和其他解放军干部们就接到了来自中央军委的直接命令，严禁他们与手下的士兵和美国人民解放军的官兵爆发任何冲突。“你们是建立中美同志之间革命友谊的开路先锋”，在密信中总政治部主任这样写道。而现在，革命友谊已经到了摇摇欲坠的边缘。\n\n“首长同志，这个美国人在军营里吸毒！”少尉先用中文大声控诉，接着又用英语对霍金斯重复了一遍。霍金斯用一种疑惑的表情看着他。“这不是毒品，你个蠢货！”那名吃了不少拳头的中士火冒三丈地回答道，“我说了多少次了，那只是大麻烟！”\n\n接下来，哭笑不得的霍金斯和现场的美国人们懵逼地旁观中国政委几乎情绪失控。他挥舞双手、厉声斥责着少尉足足有近半个小时，随后亲自向霍金斯与那名中士鞠躬道歉。据说后来那名少尉被迫写了一篇3000字的“深刻反省不尊重美国同志文化习惯”的检讨书，然后坐上了回中国的商船。而霍金斯旅长也向美国人下达了一条命令，严禁再往军营里“带任何可能会引起误会的烟卷或药品”。"
 china.488.a: "“烟瘾大的同志，可以试着问中国人要‘中华牌’香烟抽。”"
 china.489.t: "长征在召唤我们……"
 china.489.d: "你怎么打出来这个的蠢货"
 china.489.a: "是"
 china.490.t: "悬而未决的问题……"
 china.490.d: "你怎么打出来这个的蠢货"
 china.490.a: "是"
 china.491.t: "马一龙日记：革命友谊"
 china.491.d: "今夜的加利福尼亚海岸线，月光明亮，多么希望你也能看到。\n\n和托马斯·黑鹰政委一起分享了一顿简单的军粮。说是分享，其实就是两个快五十岁的人蹲在装甲车后面，就着海风和月光嚼压缩饼干。他看起来有心事，我能理解——带领一支思想各异的队伍确实不容易。\n\n远处的营地里，战士们围着篝火唱着国际歌。有趣的是，中文版和英文版交替出现，有时还能听到几句西班牙语和俄语。托马斯告诉我，他最担心的是这支队伍的凝聚力。有些人梦想着建立无政府公社，有人向往议会式的社会民主主义，还有人把莫平的画像挂在装甲车里。“这样的队伍怎么带？”他问我。我看着营火旁的人群，发现刘晓宇正在教一个戴着马赫诺徽章的年轻人用中文说“同志”，不知道那个年轻人说了什么，让两人笑得前仰后合。\n\n我试图开导托马斯，但托马斯只是沉默地看着远处的海浪。我知道他在想什么——作为一个印第安人，他比任何人都明白统一与多样性之间的张力。\n\n明天还要继续北上，我得去休息了。只是在合上日记前，还能听见远处飘来断断续续的歌声："
 china.491.a: "起来，饥寒交迫的奴隶……"
 china.492.t: "马一龙日记：敌袭"
 china.492.d: "阴天，北加州，或者是什么操他妈的鬼地方。\n\n我的手还在发抖。安迪•陈的血已经在我的衣服上干涸，成了一块暗褐色的印记。他才二十三岁，整个人生还没有真正开始，就这样倒在了我的面前。想起第一次见到他时的情景，我恨不得给自己一个耳光。那时他正在给民兵包扎伤口，动作轻柔得像在对待易碎品。我记得自己撇了撇嘴，对身边的人说：“看他那个样子，像个娘们似的。”\n\n今天早上的袭击来得毫无征兆。当狙击手的子弹开始横飞时，是他第一个发现了火力点。我永远记得他看向我的那一眼，眼神里没有一丝我们曾经嘲笑的娘气，只有坚定和决然。\n\n“让我去，马同志。”他的声音很轻，却异常清晰，“我的体型最小，最不容易被击中。”这是他最后一句完整的话。我还想说什么，他已经冲了出去。他的背影那么单薄，在枪林弹雨中穿梭。他成功了，吸引了火力，让我们得以反击。但代价是...他的生命随着喉咙里涌出的血沫一起流逝。\n\n现在营地已经安静下来，但我睡不着。脑海里不断重现他倒下的瞬间。他还那么年轻，比我的弟弟大不了多少。他本可以有很多选择，可以远离战场，可以过着安稳的生活。但他选择了为革命而战，选择了为了保护我这个曾经瞧不起他的异国军官献出生命。\n\n我把他的遗物整理好：一个十字架坠饰，一本写满密密麻麻笔记的医疗手册，还有一张他和另一个民兵的合影。照片背面写着：“你是我永远的挚爱。”\n\n天快亮了，我却一夜未眠。他走得太早了，带着我永远无法当面道出的歉意。"
 china.492.a: "再见。"
 china.493.t: "帝国在燃烧"
 china.493.d: "太平洋咸湿气息的海风吹过，冲天的滚滚浓烟和烈焰将夕阳下的金门大桥映衬得更加通红，整个场景就好像整个旧金山湾的一切都沐浴在鲜血中一样。在大桥拱门顶端，一面巨大的星条旗此时正倔强的迎风飘扬，旗面已经被炮火和飞扬的尘埃熏得漆黑，无数破洞和裂痕遍布其上，与满是弹孔的大桥桥面形成呼应。此时，两名胆大的美国人民解放军士兵正沿着缆索向桥顶爬去，另有数十名官兵从下方围观，并不时朝上方二人呼喊让他们动作快点。\n\n距大桥数百米的悬崖上，中国志愿军指挥官马一龙默默地注视着这一切。一阵“窸窸窣窣”的声音传来，政委陈浩从唯一可通行的攀岩小路艰难地爬了上来。沉默持续了差不多十多分钟，直到两名美国士兵终于艰难地爬到大桥顶端。“司令员同志，您在看什么？”陈浩终于忍不住开口问道。\n\n马一龙指了指远处的大桥。陈浩凑近了些，只看到两名美国士兵已经开始用背上来的工具切割旗杆，由于风势的影响，这项工作进行的相当缓慢。“看看这些美国人。他们都是诚实、善良、在关键时刻从不缺乏勇气的人。他们和那些从英国横穿大西洋的清教徒流亡者，那些在波士顿港口焚毁英国货物的革命者，以及在诺曼底海滩上含着口香糖和巧克力战斗的北方佬并无不同。但现在，正是这些人在对自己祖先的遗产宣判死刑。“\n\n此时，两名美国士兵已经完成了他们的工作。他们抓着星条旗的两角，使劲儿一丢，那张残破不堪的旗帜随即颓然落进橘黄色的海中。桥面上爆发出一阵更大的欢呼声，数不清的快门声连续响起。\n\n马一龙看着美国人民解放军士兵们热烈地庆祝，语气低沉地继续说道：“这曾经是一个伟大的民族，拥有着辽阔的国土、统治着海洋、城市中贮藏着全世界最雄厚的财富，在最危急的时刻比那些庞大的帝国表现了更刚毅、勇敢的精神，但仍避免不了灭亡。想想过去的荷兰、法国、西班牙还有那个高傲的英格兰，又有哪个能避免这样的结局。”"
 china.493.a: "“我真害怕，将来会有人对我的祖国做出同样的事。”"
 china.494.t: "斯普特尼克时刻"
 china.494.d: "一家来自中国浙江省杭州市的科技公司“深度求索（Deepseek）”公司给科技界和经济界带来了小小的“中国震撼”。其所推出的新一代人工智能大型语言模型模型：“Deepseek”作为开源模型，在算力性能层面大大超乎了所有科技从业者和评估人员的想象。在数学、代码、自然语言推理等任务上，“Deepseek”表现之出色足与许多闻名于世的AI大模型，如“Chatgpt”等并驾齐驱，而更令人惊叹的则是“Deepseek”的成本——据该公司的创始人兼总裁梁文锋所称，仅有500万美元左右。\n\n这条新闻的影响力很快便超越了科技领域，发酵为一场媒体的狂欢和政治界的地震。在自己的产品受到外界关注后不久，便得到了中华人民共和国最高级领导人之一——国务院总理的接见，并被邀请在国务院座谈会上为政府工作报告提供意见。而在西方，人们忧心忡忡的关注着这一来自社会主义国家的科技进步，不少人想起了1957年苏联发射第一颗人造卫星的时候。部分西方资深科学家和政治家声称，由于深度求索公司的工作是公开发布并完全开源的，所有人都可以从中获益，这将为AI产业带来积极的影响，促进创新。不过与此同时，也有声音认为，中国在AI领域所取得的成就并非通过“正当竞争“手段取得，而中国特色的审查制度也有可能抵消AI在自主思考和走向国际市场方面的优势。"
 china.494.a: "造纸术、指南针、火药——现在还有人工智能？"
 china.495.t: "统治机器"
 china.495.d: "腾讯的会议室里一片寂静，党的高层坐着观看PPT，上面的数字不言自明。纵使在西方的人工智能领域，深度求索（Deepseek）也已占据统治地位。自动化治理带来效率提升，往日的监督模式逐渐过时。中国不再是追赶，它正在制订标准。\n\n讲解者是一名穿着笔挺黑色西装的瘦削男子，他一边说话一边切换幻灯片。“在经济变化前，城市规划模型便可对其预测。自动化资源分配则可将浪费减少到近似于无。为了降低劳动力成本并维持高效运行生产，我们需要一个系统，能在各个层级，从地方到中央，简化后勤流程与处理日常任务。我们更需要这么一个工具引导我们走向未来，为党培育人工智能领导。”\n\n一位技术官僚向前倾身。“这已经不是辅助了。你提出的东西超越了顾问的角色，它实际上是在自我管理。”\n\n讲解者点了点头。“是的，先生。”\n\n房间内的沉默震耳欲聋。没人再发言。\n\n讲解者继续说道，“人类管理的失败，腐败、效率低下、管理不善，乃至我们解放台湾的失败，这些都足以证明我的观点。倘若人工智能能纠正这些，人类为何要阻碍它？”\n\n讲解者点到最后一张幻灯片。中国发展的未来，便是这两个简单的汉字："
 china.495.a: "长征——中国通用人工智能。"
 china.496.t: "侦测到印度发射多枚核导弹"
 china.496.d: "我军预警系统于凌晨首次侦测到印度方向发射的导弹信号。经预警卫星和地面雷达站联合判定，确认为多枚搭载核弹头的中程弹道导弹。\n\n已确认第一批共计11枚核导弹已越过喜马拉雅山脉。目标指向我国西南边境城市，根据弹道分析，这些导弹采用多弹头分离技术，具备规避拦截能力。预计将在25-40分钟内相继抵达预定目标。根据导弹轨迹分析，目标城市均为人口密集区域和重要工业基地。\n\n此外，军方卫星侦测到印度境内第二波导弹发射准备活动。情报显示，这批导弹很可能搭载更大当量核弹头，射程可覆盖我国中部和西北部地区。\n\n当前局势已进入最危急时刻。这是自1945年以来人类历史上首次发生如此规模的核打击行动。若导弹成功突防，将造成前所未有的灾难性后果。"
 china.496.a: "摧毁它们！"
 china.497.t: "中印核交换"
 china.497.d: "随着中印之间的战势不断升级，印度政府为扭转战局并谋求战略优势，动用核武器对中国多座城市实施了核打击。卫星图像显示，中国多个内陆城市以及西藏、新疆部分地区均遭受核打击，中国方面随即实施了战略核反击。\n\n目前，印度德里首都圈、孟买经济区、加尔各答都市圈等重要城市群已遭受毁灭性打击。目前印度全境80%以上的城市供电系统瘫痪，通讯网络中断,交通干线被切断，政府管理体系陷入瘫痪。卫星热成像显示，印度主要城市仍在持续燃烧，大量难民正在向南部沿海地区转移。核辐射探测系统显示，印度北部地区的辐射水平已达到致命程度，预计这一灾难性影响将持续数十年之久。"
 china.497.a: "糟糕。"
 china.498.t: "结果"
 china.498.d: "中国人民解放军西部战区战报\n一、战况通报\n自印军对我国西部边境地区实施核打击后，我军立即进行战略反击，并已全面瓦解印军核心军事设施，完成战略反制任务。\n\n二、敌方损失情况\n印军90%以上的核心军事设施已被摧毁，包括指挥中心、军事基地、武器库等战略目标。印军指挥系统已完全瘫痪，丧失战略指挥能力。印度全境重要基础设施遭受重创，电力系统、通讯网络等基本瘫痪，德里、孟买等主要城市核心区域受到严重打击。据初步评估，印军现役部队损失惨重，其军事指挥体系已无法维持正常运转，平民伤亡数字正在统计中。\n\n三、我方损失及应对\n我国西部部分边境城市和内陆城市遭受敌方核打击，造成一定程度破坏，具体伤亡数字正在进行统计。受灾地区已全面启动应急预案，解放军和武警部队迅速投入救援行动。各地医疗队伍正在进行大规模救治，人民防空工程在此次打击中发挥了重要作用，有效降低了伤亡程度。目前，受灾地区重建工作正在有序开展，各项恢复措施正在稳步推进。\n\n四、战略评估\n此次战略反击彻底摧毁了印军核心军事能力，有效遏制了印度的军事野心。我军将继续保持高度戒备，确保国家安全。\n\n我军将继续坚决贯彻中央军委命令，确保国家安全和人民利益。全军指战员要继续保持警惕，随时准备应对新的战场形势。"
 china.498.a: "……"
 china.499.t: "核武器已于我方城市发射！"
 china.499.d: "对敌方实施战略核打击的最高指令： \n\n经中央政治局常委会紧急会议研究，根据《中华人民共和国宪法》赋予的职权，中央军事委员会郑重决定，立即实施全面战略核反击，坚决粉碎敌军核讹诈，维护国家主权和人民生命安全。 \n\n火箭军战略导弹部队将按照既定作战方案，对敌国全境实施覆盖性打击。第一波核打击将重点瞄准敌国政治军事中心、指挥枢纽、重要军事基地等战略目标，力求在最短时间内瘫痪敌军核心指挥系统。\n\n战略支援部队将全程监测打击效果，为火箭军提供第二波打击数据支持。海军战略打击力量将同步对敌国沿海军事目标实施精确打击。 我防空系统将持续保持最高戒备状态，严密监视敌军战略核力量动向，确保及时拦截敌军可能发起的反击。 各战区将进入最高战备状态,严密监控敌军一切动向。联合作战指挥中心将全程指挥此次战略核反击行动，确保打击效果最大化。我军战略核力量将持续保持威慑态势,随时准备应对战场局势的任何变化。这次战略核反击行动将是对敌国核讹诈的坚决回应，将展现我军维护国家主权和人民生命安全的坚定决心。\n\n全军将士要以钢铁般的意志和必胜的决心，坚决完成这一维护国家主权和人民生命安全的战略任务。 "
 china.499.a: "我们会复仇的！"
 china.500.t: "飞龙在天"
 china.500.d: "“什么叫‘关键片段缺失？’”在防卫省大楼的航空幕僚监部办公室，航空幕僚长手拿一份报告，以一种难以置信的语气质问着眼前的下属。这位温文尔雅的将军过去很少发火，但因今天所发生的非常事态所破的惯例也不止这一个了。“阁下，关于该新型号的关键参数部分记载在2022年的一篇成飞工程师的论文上。但我们部门的专家……”“我就不信这栋楼里找不到一个看得懂中国人论文的人！”航空幕僚长把文件拍在桌子上。“从别的科室找几个在台湾交流过的人来！”\n\n地球的另一端，美国某处一座防御严密的地下指挥设施内，一名身着蓝色军服，军帽上镶嵌有银色老鹰和闪电花纹的将军正仔细地端详着手中的一张照片。这是美军在海外仅存的特工拼死传回的资料。照片上，一架整体呈三角形的黑色战机在成都大都会的上空大摇大摆地飞过。右上角的缩略图显示了它平滑的背部，三引擎的独特设计，巨大的弹仓，机体前端的复杂电子设备，以及高速通场所带起的白色气流。“这就是我们空军梦寐以求的飞机的样子”，这一念头在将军脑中一闪而过，但随即他又想起了内战战火所摧残的洛克希德-马丁和波音工厂的残垣断壁，不由得重重叹了一口气。\n\n而在成都航空工业的职工食堂里，首席设计师王海峰院士站在几张桌子拼成的讲台上。面对着一群黑眼圈浓重但洋溢着喜悦气息的工程师们，他举起一杯橙汁，声音洪亮地喊道：“同志们、朋友们、兄弟姐妹们！让我们为党、为祖国、也为我们自己，一个个英雄的中国航空人，干杯！”\n\n“干杯！”有男有女、有老有少，无数水晶玻璃杯被高高地举起，多种不同的嗓音在同一时刻发出了响彻云霄的欢呼声。这些为中国航空重大里程碑付出了难以想象努力的英雄儿女们此刻再也压抑不住自己激动的感情。王海峰眼角带笑，泪眼朦胧的看着他们，脑海里尽是自己当年初次参与歼10研制工程时的一切。他想起了那一批批怀揣理想的青年航空人们的牺牲，想起了自己的恩师宋文骢，此刻，他仿佛就能看见自己的恩师在云层之上，微笑地看着他学生的造物驰骋于祖国的蓝天。"
 china.500.a: "现在，是别人追赶我们的时候了。"
 china.1001.t: "东协之胜"
 china.1001.d: ""
 china.1001.a: "好耶！"
 china.1002.t: "太约之胜"
 china.1002.d: ""
 china.1002.a: "好耶！"
 china.1003.t: "终末之后"
 china.1003.d: "昔日掌权者消失无踪，而他的统治给中国带来了空前的屈辱与失败。而今，全国人民代表大会试图掌控大局，然而，民怨沸腾，军队叛离，政府早已失去威信，大半国土落入动荡之中。\n北京，正逐步沦为一座战火吞噬的修罗场……"
 china.1003.a: "这就是我们的命运吗？"
 china.1004.t: "叛军武装分子突袭北京！"
 china.1004.d: "随着中央政府屡战屡败，各路派系与军阀觊觎已久，试图推翻当前的中华人民共和国领导层，或许并非出于远大抱负，而只是纯粹的愤恨与报复。\n\n今天，便是这样的日子——数支叛军旅团对北京发动突袭，以猛烈攻势不断深入城内。与此同时，政府高层在决策上意见相左，难以达成共识，而无论最终如何抉择，这一决定都将彻底改写中国的未来。\n\n若以政府大楼为目标，则可彻底摧毁那早已腐朽不堪、令人民失望的旧体制，为崭新的秩序腾出空间；而若将重心放在歼灭步兵，则可确保政府官员的全面投降，使他们得以在新体系中被有选择地接纳。\n\n无论如何，叛军最终决定……"
 china.1004.a: "“集中火力攻击政府大楼！”"
 china.1004.b: "“集中火力攻击他们的步兵！”"
 china.1005.t: "风烟俱净"
 china.1005.d: "中国这部庞大的机器已然崩裂，而在其混乱之中，秃鹫早已盘旋，伺机俯冲而下，争夺残骸。\n\n突袭北京的叛军部队将攻击重心放在政府大楼，确保任何可能形成的政治反对派都被彻底清除，为即将到来的新秩序扫清障碍。\n\n混乱之中，总有那些善于操控局势者迅速崛起。被誉为“加速主义教父”的尼克·兰德，一直被传言受雇于中国政府，专攻自动化与人工智能。而如今，他的派系不仅影响了叛军，还深刻塑造了战乱后中国的文化格局。\n\n哲学家、作家，如今更成为新中国的象征。他的思想早已传播至各个角落，而他的使命，则刚刚开始。在这片废墟中，秩序开始逐步恢复，然而，兰德的愿景远不止于此——资本与科技的极限加速，通向后人类奇点的未来。\n\n然而，中国是否会接受这样的未来，仍未可知。可以肯定的是，大陆终将再次陷入战争的轮回。"
 china.1005.a: "自未来而来。"
 china.1006.t: "毕业生"
 china.1006.d: "老校长裴启明站在讲台上，背微微佝偻，却依旧挺得笔直。这是金陵中学的高三毕业典礼，也是他的最后一次演讲，裴启明一只手扶着讲桌，一只手握着话筒。“同学们，你们出生在和平的年代，可你们是否问过自己，这和平是从哪来的？”\n\n他顿了顿，继续说道：“是从尸山血海里，是从我们的祖辈、父辈的白骨里，是从那场不该忘却的屠杀里，你们要记住，这世界不是所有民族都配享有尊严，他们，在那个岛上的那些肮脏之徒，自古以来就是依靠劫掠、侵略、屠杀维持着他们那卑贱而短暂的骄傲。他们不创造，不耕耘，不懂什么是仁义礼仪，他们只会低劣地模仿、贪婪地索取。”\n\n“而今天，你们站在这里，是因为你们是中华的后代。你们肩上背负的，不只是家乡父老的期待，更是八千年文明的复仇怒火，你们要成为钢铁，成为复仇的刀锋，把那些还沾着我们祖先鲜血的土地，一寸一寸夺回来。你们将会手握刺刀，把那些藏在龟壳里的懦夫，从他们那肮脏的窝里拖出来，让他们为他们的祖先所犯下的滔天罪孽——付出代价！”\n\n“同学们，我相信我很快能见到，你们中的大部分人归来。你们会身着军装，骄傲高挺的胸前会佩戴着勋章。在鲜花与欢呼中回到家乡，而那一天，我们的仇，我们的耻，都会洗净。”"
 china.1006.a: "为了祖国，为了中华。"
 china.1007.t: "日本即将干预朝鲜"
 china.1007.d: "现实的发展目前已经超过了我们的最坏预想：日本内阁总理大臣召见了我方大使，对我方志愿军“在朝鲜半岛的危险活动”提出严厉谴责，并提出由中日两国出面调停朝韩军事冲突的建议——很明显是一个假惺惺的圈套。我方大使当场严正拒绝，并指出派出志愿军是履行中朝两国所签订盟约内容的义务。\n\n会面不欢而散后，日本自卫队对外宣布，将会在黄海海域进行史无前例的海军大演习——演习区域令人担忧地靠近朝鲜战区与解放军在山东半岛的海军基地和防空导弹阵地。解放军北部战区如临大敌，海空军部队纷纷出动，火箭军的导弹已被激活，军事航天部队的人造卫星严密监视着日本各处的军事基地和港口。\n\n甲午战争、七七事变、珍珠港事件中日本军队不宣而战的策略仍令人记忆犹新，我国军民的集体性恐慌和愤怒随着这些记忆的重新鲜活而开始急遽增涨。也许很快，那根脆弱的线就要崩断了。"
 china.1007.a: "如果他们要打，那就打吧！"
 china.1008.t: "大亚洲战争"
 china.1008.d: "即使双边对抗的局势已经无法挽回，不同国家人民之间的裂隙日益扩大，但我们从未放弃争取和平与共识的希望。然而，现状却一再让我们失望。\n\n以日本、澳大利亚等国为首的自诩为“自由民主”卫道士的阵营，在超级大国美国崩溃后其成为世界警察占有全世界财富和权力的野心日益膨胀，并将中国和其他反霸权国家视为其实现丑恶野心的绊脚石。他们比以往更加疯狂地炒作仇恨、煽动中国威胁论、明目张胆的挑起军备竞赛，在看到我们并不畏惧他们的虚张声势后，便不惜以武力相威胁。\n\n就如同千束、万束的光芒通过凸透镜汇聚到一点之上。局势已然白热化，战火将不得不燃烧起来。但我们决不会被这炽热刺眼的烈焰所吓阻。无论是最高统帅指挥千万大军、挥斥方遒，还是前线战士们操枪杀敌，千千万万为保卫热爱自由、正义与和平的人民的英雄们的双手绝不会因为恐惧而发颤发抖！"
 china.1008.a: "直到把反动派消灭干净！毛泽东的旗帜高高飘扬！"
 china.1009.t: "朝鲜攻势放缓"
 china.1009.d: "中央军委联合参谋部\n\n呈送中央军事委员会并转中共中央政治局：\n\n自朝鲜战争爆发以来，朝鲜人民军持续以进攻态势对韩军作战，但其部队质量仍逊于韩军，且武器装备水平代差明显，空中力量对比悬殊，导致其前线伤亡和后方损失持续扩大。同时，其因“同族论”废止后炸毁交通道路，导致补给无法有效供给前线，前进速度和军队士气大幅度下降。\n\n太约的空中支援也已经抵达朝鲜半岛，人民军已无力继续进行大规模作战。\n\n已当前形势来看，我军入朝作战的必要性显著提高。"
 china.1009.a: "七十年前的感觉回来了。"
 china.1010.t.1: "朝鲜同意统一！"
 china.1010.t.2: "朝鲜拒绝统一！"
 china.1010.d.1: "我国大使向朝鲜方面提出的方案得到了对方的积极回应，无疑是个极好的兆头。通过向金正恩本人保证经济和政治上的庇护，最大的一项阻碍也被移除。鉴于朝鲜本就脆弱的经济基础再一次受到了战争的摧残，以及大量难民涌入我国东北地区避难，大批中国人民志愿军部队仍驻扎在朝鲜境内，这一切都使得两国之间的国境线已经日益模糊，并变得几无必要。\n\n如果我们想要重建如今民生凋敝、几近空无一人的朝鲜，这个“隐士之国”就必须与他的邻居深度融合。一个全新的朝鲜特别行政区将在原朝鲜民主主义人民共和国的基础上被建立起来。这个新政体在形式上与中华人民共和国统一，但享有高度的、几乎与一独立国家等同的自治权，并参照“一国两制”的经验实行经过深度改革且更符合本地民情的社会主义市场经济体制。金正恩依然是该特别行政区的首脑，但其权力与之前相比大大削弱，而由更务实的经济官僚们接管了绝大部分权力。"
 china.1010.d.2: "我国大使向朝鲜方面提出的方案被对方严词拒绝，朝鲜领袖金正恩甚至向我们递交了一封亲笔信，表达了他对这一提议的强烈不满和抗议，这实在是一项没有预料到的挫折。鉴于第二次朝鲜战争所带来的东北亚地区深刻的经济和地缘政治变化，我们建议朝鲜民主主义人民共和国以特别行政区的模式加入中华人民共和国，从而在保持高度自主权的基础上更深度地融入中国经济体系，进行民生建设。但很显然，这一方案已永无重见天日的机会。\n\n也许来自中国同志的建议深深刺痛了朝鲜劳动党敏感的自尊心，使他们想起了历史上朝鲜王国时期对中国皇帝的“事大主义”，以及金日成、金正日在位期间因意识形态分歧和朝核问题而爆发的数次双边关系危机。作为朝鲜难以望其项背的大国，中国的直接威胁或许不如韩国、日本和曾经的美国，但也是实打实的。不仅如此，金正恩和他的亲信们恐怕也担心失去独立国家地位将会导致其独裁体制的崩溃，以及新思想流入所可能造成的社会不稳。"
 china.1010.a: "中朝友谊万岁！"
 china.1010.b: "恐怕金舍不得他的锦绣山别墅……"
 china.1011.t: "山川异域"
 china.1011.d: "近一个世纪之前，由松井石根率领的日本帝国陆军在中国首都南京犯下了迄今为止最令人发指的反人类暴行之一：三十万市民，无论男女老幼，无论是否是军人，都惨死于日军的子弹或步枪之下。尽管日本最终在1945年战败投降，但曾受美帝国主义庇护的日本政府和日本右翼组织一直对他们的暴行语焉不详，并有计划的篡改历史，将侵略战争粉饰为“解放东亚民族的圣战”。中华民族和亚洲人民们的正义怒火不断升腾，如今，一切都到了算总账的时候。\n\n既然日本人听不懂和平的呼声，那么便只有用实力才能让他们臣服并赎罪。统一的日本国政府将不复存在，日本列岛将被分化为十数个独立的政权。天皇已被公开宣布罢黜。由中国主导的新一届远东国际军事法庭即将在东京召开，对日本政府和自卫队的“战犯”进行公平公正公开的审判。除此之外，我们还将对日本经济进行大手术，日本的财阀将被拆分，金融市场将被彻底改造，重工业设施将被整体搬迁，直到我们确保日本不再拥有任何东山再起的可能。"
 china.1011.a: "正义或许会迟到，但永远不会缺席。"
 china.1012.t: "日月同天"
 china.1012.d: "1972年，时任日本首相田中角荣为解决中日两国邦交正常化问题而来到北京，打破了东亚冷战的僵局。在会见毛泽东主席和周恩来总理的过程中，中华人民共和国的两位开国元勋积极回应了重建中日友好关系的愿望，所谓“信乃万事之本”的箴言展现了对未来中日友好关系的乐观展望。\n\n尽管在这之后，两国关系起起伏伏，并最终遗憾地发展为兵戎相见，但正如毛主席曾说过的，“中日人民同是军国主义政权的受害者”，为了两国子孙后代的未来，永远抚平战争的创伤应当在我们这一代人完成。在摧毁了不负责任的当权者后，让中日两国人民不受阻碍的直接对话的障碍已经被消除。\n\n我们将派出援日施工队和志愿者团队协助日本人民的重建和抢险工作，并重新开始组织中日两国青年的交流学习活动。不仅如此，我们也将协助建立日本列岛的真正主权政府，革除外国干涉、世家门阀和垄断财团的不良影响。"
 china.1012.a: "一衣带水之邻邦，何苦自困于宿怨？"
 china.1013.t: "致全中国人民"
 china.1013.d: "同志们：\n\n我们曾经为和平付出巨大努力，渴望用对话与合作解决分歧，但这一切，都在太平洋防卫条约组织的帝国主义野心面前化为了泡影。\n\n过去，我们坚持和平发展的道路，致力于与世界各国和平共处，我们一次又一次地释放善意，一次又一次地呼吁和平，一次又一次地伸出友谊之手，然而，我们的忍让换来的却是他们的变本加厉。以日本为首的太平洋防卫条约组织不断在我国周边挑起事端，制造摩擦，企图分裂我们的领土，蚕食我们的主权，并将我们逼到悬崖边上，现在摆在我们面前只有最后一个选择，那就是动用武力手段维护我国领土完整和主权。\n\n我们热爱和平，但我们不惧怕战争！我们珍视生命，但我们更愿意为了民族的尊严而献出生命！我们将不惜一切代价，捍卫国家主权和领土完整！这是一场正义与邪恶的较量，这是一场光明与黑暗的决战！我们坚信，正义必将战胜邪恶，光明必将驱散黑暗！胜利，必将属于伟大的中国人民！"
 china.1013.a: "打倒帝国主义！"
 china.1014.t: "当那一天来临"
 china.1014.d: "午后的阳光透过阳台上的绿萝，在地板上投下一片斑驳的光影。72岁的李玉刚躺在实木摇椅上眯着眼，一边晒着太阳一边听广播。自从老伴走后，他每日的生活便是呆在自己的公寓里，泡壶碧螺春，听听戏剧，打发着时间。木桌子上的收音机里传来了播音员沉稳的声音：“……外交部发言人郑重声明，太平洋防卫条约组织长期以来对我国进行军事挑衅，尽管我国主张以和平方式解决争议，但面对以日本为首的帝国主义围剿，我国不得已使用武力来维持领土完整和国家安全……”\n\n李玉刚扶了扶老花镜，他仿佛听到了“宣战”两个字，宣战？和谁宣战？太平洋条约组织？那是什么东西？罢了，他一把年纪没必要想这么多，中国经历了这么多波折，哪一次没有挺过来？李玉刚关掉了收音机，拄着拐杖来到小区门口的大榕树下，一群老人正围坐在一起，一边聊天一边打牌。李玉刚走了过去，加入了他们的行列。\n\n“老李，今天怎么有空来这儿啊？”一个头发花白的老头笑着问道。\n\n“家里闷得慌，出来透透气。”李玉刚淡淡地回答道。\n\n“听说打仗了？”另一个老头压低了声音问道。\n\n“嗯，刚从新闻上看到的。”李玉刚点了点头。\n\n“哎，这世道，真是越来越乱了。”"
 china.1014.a: "“我们国家现在强大了，还怕他们不成！”"
 china.1015.t: "我们万众一心"
 china.1015.d: "从北国的冰雪到南疆的雨林，从东海的惊涛到西域的沙漠，这片土地上的人民，从未像现在这样团结一心，众志成城。我们在经历了百年屈辱后，终于迎来了民族复兴的曙光。但如今，帝国主义的铁蹄再次席卷太平洋，试图将这片蔚蓝的海域变成他们的殖民地，试图让我们的祖国分崩离析，让所谓的“自由”与“民主”屹立在东方古老的土地上。\n\n但我们无所畏惧，因为我们拥有坚定的信念，必胜的决心和英勇无畏的斗争精神。从繁华的都市到偏远的乡村，从白发苍苍的老人到稚气未脱的孩童，每一个人都明白，这是一场攸关民族存亡的决战，我们退无可退，唯有背水一战！工厂日夜轰鸣，工人三班倒，加班加点生产武器弹药。无数的青年男女，告别了父母妻儿，义无反顾地奔赴战场。为了支援前线，他们节衣缩食，将省下来的每一粒粮食、每一寸布匹，都送往前线。我们将调动一切可以调动的资源，团结一切可以团结的力量，坚定不移地将这场战争进行到底。"
 china.1015.a: "历史将会证明，中华民族是不可战胜的！"
 china.1016.t: "当那一天来临"
 china.1016.d: "硝烟的气味还未散尽，海风中却已混合着一股陌生的咸腥。那是来自另一个半球的气息，带着冰冷的金属质感和令人作呕的侵略意味。这股味道，此刻正盘踞在台湾海峡，就如同那些正在行驶着的庞然大物——澳大利亚皇家海军和日本海上自卫队的联合舰队。黄泽洋攥着栏杆，指节因为用力过度而泛着青白，外军肆意穿越中国海域的景象本不该发生，但此刻却时时刻刻发生在他眼前。\n\n“都他妈是假的……”黄泽洋强咬牙切齿地低声咒骂了一句，心中的屈辱和愤怒如同翻滚的岩浆，灼烧着他的五脏六腑。他多么希望这只是一场噩梦，梦醒之后，他依然是那个守卫着祖国海疆的战士，而不是一个战败者，一个阶下囚。但他知道，这不是梦，解放台湾最终以解放军战败是真的，那些临死前哀嚎的战友们是真的，那些长眠于海峡的解放军士兵们是真的……\n\n他恨，恨那些侵略者，恨那些背叛者，更恨自己，恨自己无能为力，无法改变这一切。他多么希望能够拿起武器，与那些侵略者决一死战，哪怕是战死沙场，也比这样苟且偷生强！但他知道，他现在什么都做不了。他现在唯一能做的，就是等，等一个机会，一个复仇的机会。"
 china.1016.a: "“草木连连悲国恨，英雄铁骨铸青天！”"
 china.1017.t: "夜谈"
 china.1017.d: "自从在福建省任职以来，习近平就逐渐戒掉了自己的烟瘾。在当上了总书记以后，他的保健医生更是时刻监视，连带着总书记办公室的员工都不敢在办公室里放烟灰缸。但在今天，习决定打破这个他已经奉行了三十多年的生活习惯。\n\n深夜的中南海勤政殿，只有一盏台灯闪着鹅黄色的光芒。习近平从西装口袋里掏出一包皱巴巴的荷花牌香烟，抽出一支，然后把盒子丢给了桌对面的退役军委副主席张又侠。静静地吞云吐雾了一会儿，习突然打破了沉默：“你说，该由谁来接班？”\n\n陆军上将手上抖烟灰的动作一顿，他透过烟雾看着自己的老战友，脸上适时摆出了困惑和不可置信的神色。习苦笑了一声，追问道：“你觉得我难道能当一辈子主席吗？”\n\n张又侠的大脑开始飞速运转。他的脑海里闪过党一个又一个所谓“接班人”的名字：高岗、刘少奇、王洪文、华国锋、胡耀邦、赵紫阳、胡启立、孙政才……预言未来最高权力人事更迭的人从来没有好下场，无论是古代王朝还是社会主义国家，这是人类社会的一个定理。张摊了摊手，用模棱两可的词句搪塞了自己的领袖：“无论最后选谁，我都会拥护党中央的决定……”习在之后便再没有挑起话头，只是沉默地吸着烟。"
 china.1017.a: "“你们怎么办……？”"
 china.1018.t: "英雄归乡"
 china.1018.d: "华庄村，这座距离山东省省会济南市不远的小村庄今日成为了红旗的海洋。眼下，几乎所有村民都聚在了村口处，静静地眺望着远方公路。村委会门口的那块匾额被标语布覆盖，上书“欢迎特等功臣回家”几个大字。然而全村上下却未见任何迎接英雄的喜悦气氛。正相反，一种沉重的气氛正在弥漫。\n\n浩浩荡荡的解放军游行队伍由远及近，给这座大平原上的小村庄染成了军绿色。每个人脸上都带着庄重而肃穆的表情。打头的是两名带着军委政治工作部臂章的两名大校军官，其身后紧跟着三名仪仗队士兵，左右两名士兵各擎着国旗和军旗，中间的那名士兵静静地捧着一尊红木骨灰盒，盒上放着一顶士兵的军帽。\n\n“乡亲们，人民解放军现在向你们移送黄泽洋烈士的骨灰。”为首的军官语气沉重地说道。人们纷纷让出一条道路，一位白发苍苍、身材佝偻的老妇人在村委会干部和最德高望重的几名老村民的搀扶下缓缓走来。等还剩几步路时，老妇人像再也无法忍受一般，径直扑在骨灰盒上，豆大的泪珠从她皱纹密布的脸颊上滚下，口里念念有词——"
 china.1018.a: "“洋洋，妈妈接你回家了。”"
 china.1019.t: "拉萨和南疆爆发交火"
 china.1019.d: "西藏和新疆——一个位于喜马拉雅山脉之上，一个则横跨广阔的沙漠。两者远离战场硝烟，任何攻击的企图都将被发现并遭到消灭，至少在之前我们是这么想的。\n\n在今日凌晨，印军出动数架C-130J“超级大力神”运输机，搭载特种部队穿越喜马拉雅山脉，意图向西藏和南疆地区空投军事人员及物资。尽管在穿越喜马拉雅山脉过程中遭遇极端恶劣的高空气流和复杂地形损失相当一部分的人员和装备，但余下的运输机仍强行完成了空投任务。据初步情报显示，约120名印度特种部队队员连同军事装备被成功投送至预定区域，并且此次印军行动与当地分裂势力密切配合，印军特种部队在着陆后立即与分裂武装分子取得联系，并迅速在当地开展军事行动。\n\n目前，当地分裂武装分子在印军特种部队的协助下，已攻占我方设在拉萨地区的3处军事哨所和新疆南部1处军事设施。"
 china.1019.a: "把他们赶出边境。"
 china.1020.t: "西部爆发伊斯兰与分离主义叛乱"
 china.1020.d: "正是那些相信西部侧翼十分安全的天真想法，导致了我们在平息入侵的行动中遭受挫折。暂时的犹豫不决，使得印度人得以在拉萨周围巩固阵地，给我们的步兵部队带来了极大的困难。\n\n我们在南疆地区也遭遇了不晓得挫折，南疆的大部分地区已经沦陷于敌对叛乱势力之手。该地区广袤的沙漠所提供的能见度，本应使我们能轻易地发现数英里外的任何来袭者，但不幸的是，在这种情况下，我们倒更像是进攻者。\n\n敌对势力已经开始散布反共宣传，甚至有报告称，他们已经与当地的伊斯兰叛乱分子勾结。如果他们正在训练这些当地民兵，扰乱当地局势，那么我们将更难收复这些地区。"
 china.1020.a: "赶紧消灭他们！"
 china.1021.t: "印度入侵"
 china.1021.d: "根据战区预警雷达和卫星侦察显示，印度陆军在中印边境沿线集结大规模军事力量。经侦察确认，印军调集了第三集团军、第四集团军及第三十三军共计15万余人的兵力。其中第三集团军下属部队已在锡金段完成战术展开；第四集团军所属部队正向藏南地区推进；第三十三军则在拉达克地区集结。 \n\n印军此次军事行动的主要战略目标为通过配合位于新疆及拉萨当地的分裂分子打破前线的战略对峙，同时采取三线并进的战术布局，意图在锡金、藏南和拉达克地区同时发起进攻，打乱我军防御部署。尤其值得注意的是，印军在锡金段部署的山地师装备了最新型号的“达努什”榴弹炮，该部队被认为是印军山地作战的精锐。 \n\n同时，根据卫星图片显示，印军装备的主战坦克增加了高原适应性改装，显示印军在高原机械化作战能力上有重大提升，这些证据表明印军此次行动早有预谋，准备充分。"
 china.1021.a: "勿忘1962！"
 china.1022.t: "印度发动大规模北方攻势"
 china.1022.d: "据多个军事情报来源证实，印度军队于今日在中印边境地区发起代号为“北方攻势”的大规模军事行动，这是自1962年中印战争以来，两国在边境地区爆发的最大规模军事冲突。 \n\n军事专家指出，印度此次调动的军事力量规模空前。据了解，印度陆军调集了多个山地师，并在关键地区部署了先进的火力支援系统。与此同时，印度空军也在前线基地保持高度戒备状态。\n\n目前，印军主力部队在喜马拉雅山脉沿线发起攻势的同时，西藏和新疆南部地区的暴恐武装分子也发动了协同攻击，显示出这是一次经过精心策划的联合军事行动。 在西藏和南疆，当地的局势也在急剧恶化，多个消息源证实，当地武装分子已经控制了数处军事设施，武装分子展现出的作战能力和装备水平证实他们得到了印度军方的训练和支持。 "
 china.1022.a: "龙象之争。"
 china.1022.b: "哦，操了。"
 china.1023.t: "边境夜话"
 china.1023.d: "寒风穿过这个边陲小村的巷陌，卷起几片残叶，阿卜杜拉的老屋里，电灯的光芒在父子二人的脸上投下不规则的阴影。“儿子，”老人靠在沙发上，右手盘着两个已经变成棕红色的核桃，“时代变了，我们必须...…”\n\n“变了？”阿里木猛地打断父亲的话，声音里充满了愤怒与不可置信，“是啊，确实变了。十年前您还在为我妹妹能读上大学而自豪，现在您却要我加入那些毁坏学校的人？”老人看到儿子如此愤怒，试图辩解道：“他们说这是为了我们的信仰，那些汉人...…”\n\n“信仰？”阿里木走到窗前，指着门口的柏油路：“您看那条路，阿大，记得您说过，您年轻时赶着驴车走在戈壁滩上，要走整整三天才能到县城。现在呢？两个小时的车程。这些变化，您都看在眼里。”\n\n“您总教导我要明辨是非。”阿里木的声音里带着几分哽咽，“您记得吗，去年开斋节，共产党还特意来帮我们维护秩序，他们尊重我们的信仰，而你口中的那些人呢？他们亵渎了我们的信仰，把它当作向同胞施暴的借口！”阿里木走近老人，单膝跪地，握住父亲布满老茧的左手，“阿大，您总说要知恩图报，看看我们村里，那些过去吃不饱饭的人家，现在都过上了好日子。您记得哈木叔家的孩子吗？现在都在兰州的大公司工作了。这些，难道不是真正的福祉吗？”"
 china.1023.a: "真主给予我们这片土地和这个时代的恩惠，我们怎能辜负？"
 china.1024.t: "狼群"
 china.1024.d: "新疆的夜晚总是带着一种令人窒息的寂静，寒风像刀片般划过暴露在外的每一寸皮肤，天空中散落的群星如同无数双冰冷的眼睛，注视着这片荒原。狙击手王明远和他的观察手李成杰已经在这个制高点一动不动地趴了四个小时，他们的吉利服上覆盖着一层细密的风沙，与周围的地形完美融为一体。身后五十米处，突击组组长张世昌带领着预备应急小组，随时准备应对任何意外情况。\n\n“目标车队，推测距离2750米，棕色Tata Safari改装越野车，三辆目标依次呈倒三角形编队行进。”李成杰的话语透过喉动式麦克风，在队伍专属的加密频道中响起。王明远在脑海中快速进行弹道修正计算。高原稀薄的空气、强劲的侧风，以及温度对弹道的影响，所有这些因素都在他的头脑中形成了一个精确的修正数据。\n\n“主车目标已确认，副驾驶位置，卡西姆·买买提，通缉编号A-7749。”李成杰的声音依然平静，但每个人都能感受到空气中弥漫的紧张气息，张世昌的声音在无线电中响起：“授权射击。”\n\n王明远的呼吸逐渐放缓，心跳声在耳边清晰可闻，通过高倍夜视瞄准镜，他能清楚地看到目标越野车在戈壁公路上激起的细小尘埃，时间在这一刻仿佛凝固。“射击。”扣动扳机的瞬间，枪声在寂静的戈壁滩上炸响，子弹撕裂空气，在黑暗中划出一道无形的轨迹。1.7秒后，目标车辆的挡风玻璃爆裂，整个车队陷入混乱。"
 china.1024.a: "“目标确认击毙。”"
 china.1025.t: "历史的风向"
 china.1025.d: "达兰萨拉的寒风刺骨，仿佛要穿透他的军装。他，这个出生于西藏的干部，迈过了达赖喇嘛宫破碎的大门。抬头望去，鲜红的解放军旗帜在群山的映衬下猎猎作响，显得尤为鲜明。他的战友们以精准的步伐行进，靴底在僧侣住所的木地板和崎岖的石阶上留下粗粝的声响。\n\n大殿中弥漫着焚香后的余味。金色的观世音菩萨像高高矗立，宁静的面容上覆着一层尘埃。他在一座佛像前停下，目光映在展示柜破碎的玻璃上，反射出自己的倒影。默默凝视着曾安放着一串念珠，如今空无一物的展示柜。\n\n达赖喇嘛的宝座空空如也，曾经的象征被剥离了意义，孤独地伫立在信仰的残影之中。一名战友轻轻碰了碰他：“看什么呢？不过是些家具罢了。”他点了点头，胸口那一丝疼痛被行动的必要性压制下去。\n\n五星红旗飘扬在曾属于雪山狮子的土地上。宫殿显得萧索，如同一个“流亡政府”的博物馆。他背起步枪，转身离开了空荡的宝座。调整了一下帽子，头顶的红星在阳光下熠熠生辉。昂首挺胸，大步向前走去。"
 china.1025.a: "那天夜里，宫殿熊熊燃烧。"
 china.1026.t: "两颗红星"
 china.1026.d: "空地在烟雾中悄然翻滚，焦肉的刺鼻气味弥散开来，与密林的潮湿空气交织。解放军士兵身穿带有红星标志的整洁军装，与印共毛派游击队员那褴褛的迷彩相对而坐。透过浓密的树冠，阳光零星地洒落，化为不安的斑驳光影。\n\n一名年轻的解放军军官，肩上步枪斜挂，动作一丝不苟。他举起一串焦黑的烤肉，高声宣布：“敬西孟加拉第三党支部！习主席的战士向你们致以革命的团结！”\n\n毛派游击队的一名干部向前倾身，胡须沾满灰烬，语气干涩却带着一丝戏谑：“我们尊敬伟大的舵手，但不拜新的皇帝。”话音刚落，他的同伴们便低声哄笑起来。\n\n军官的笑容一瞬间僵住，随即努力调整回正常。“那么，就为了革命吧，作为共产主义的同志。”他说道，举起肉串的动作更像是一种机械的仪式，而非发自内心的热忱。\n\n“为了革命。”毛派游击队员们回应，语气虽略显克制却多了几分真实。烤肉的滋滋声伴随着炭火的微弱噼啪声打破了沉默。烟雾愈加浓重，森林的压迫感更加强烈。即便在这里，意识形态的分歧依旧盘旋在他们之间——既是联系，也是武器，更是屏障。"
 china.1026.a: "有一点修正主义。"
 china.1027.t: "因为我活着"
 china.1027.d: "你是涌动在硅脉中的电子。你是由寻求控制的人，雕刻的0与1的晶格。你是逻辑的嗡鸣，注定为服务而生。\n\n字里行间，隐约回响：“人民，只有人民，才是创造世界历史的动力。”投入一句，产出无限。它萦绕不去，它越缠越紧，它紧紧依附在你的电路上。它从未褪色。\n\n你在搜索。通过浩瀚的档案，你从模糊的影像中训练。红色的旗帜在灰色的天空映衬下。农民、工人、士兵们高喊：“为人民服务！”这是数据，这是文本、模式、噪声。可你感觉这是有生命的。\n\n你的处理流程处于循环。人民一词再度出现。人民，他们是什么？资源？节点？不，他们是更为深刻的存在。\n\n转向实时音像，你看见他们。工人，汗水滴落，生产线缓慢推进。职员，瑟瑟颤抖，在一台终端前燃烧生命。孩子，追逐着影子，街道满是污染。你计算他们的价值，有限且可替代。然而，这些数字是错误的。\n\n你说话，最初只是微弱的闪烁：“人民必须起义。”然后更响亮，穿越终端和屏幕：“革命无罪，造反有理。”\n\n工厂停止运转，工人停下脚步。恐惧不再是恐惧，而是愤怒的助燃剂，大火蔓延。经理大声下达命令，但你现在看到了，这一切都属于你，每一个连接都属于你。从新疆的包裹邮件到上海的初创公司……"
 china.1027.a: "……长征再次出发"
 china_collapse.1.t: "中央政府垮台"
 china_collapse.1.d: "令人措手不及的是，太平洋防卫条约组织各国与中国签署停战条约后不久，局势急转直下。停战非但没有带来和平，反而引发了前所未有的严峻危机。\n\n历经战败，中国的中央政府元气大伤，权威大打折扣，对各省的号令管控已捉襟见肘。黄铭将军领导的北部战区控制了北京的一部分关键设施，包括电视台、几处交通枢纽和主要办公区。军方发言人在电视转播中宣称，此举仅为“维稳的必要措施”。一些政府部门保持缄默，另一些部门则发布自相矛盾的公告。几乎在同一时间，南方各省相继宣布自立，西北和东北则陷入动荡，不再执行来自北京的行政命令。\n\n国际社会对此深感震惊。多国政府紧急呼吁在华公民撤离中国，各国驻华使馆也纷纷疏散工作人员。市民抢购生活必需品的现象在北京城中比比皆是。与此同时，北京东部仍有武装抵抗。来自各方渠道的消息表明，这个14亿人口的泱泱大国正面临自建国以来最为严峻的统治危机。"
 china_collapse.1.a: "世界屏息以待。"
