 china.1037.t: "中国开启对印度斯坦最终征服"
 china.1037.d: "中华人民共和国近日对陷入军阀混战和政治动荡的印度斯坦地区发动了一系列大规模军事行动。根据多方消息来源，解放军在多条边境线上展开推进，伴随空中打击与后方补给体系的迅速部署，局势发展引发国际广泛关注。\n\n据卫星图像和公开资料显示，解放军在喜马拉雅山脉以南展开快速推进，在多个交通要道设立前线指挥站，有效控制了印度北部的大部分战略枢纽。\n\n尽管尚无法确认中国是否计划直接接管该地区，但在实质控制与军事存在不断扩大的背景下，观察人士担忧南亚地缘格局正经历一次结构性转变，国际社会或将面临如何应对一个不断外延的中国战略边界的问题。"
 china.1037.a: "解放军席卷亚洲。"
 china.1038.t: "宿敌的未来"
 china.1038.d: "随着日本各地的城市恢复了秩序，交通、电力、通讯逐步由我方接管，从东京到札幌，从大阪到福冈，所有人都一致认为，日本必须为它过去犯下的一系列历史罪行付出代价。\n\n但在如何处置日本的问题上却引发了激烈讨论，在临时军管总部召开的数次会议中，军官们提出了截然不同的方案。有人认为，应将整个日本列岛划为解放军的军管区，由军事系统全面接管政务、舆论和教育，通过暴力手段彻底肃清日本本土残余的民族主义势力，以及日本人潜在的反抗情绪。\n\n另一部分军官提出了不同的设想。他们主张彻底“去日本化”，不保留原有国家结构，将整个日本拆分为数十个区域政体，分别由中央派驻的地方事务委员会过渡管理。这些地区将脱离“日本”这一政治概念，未来在地理、文化、语言、行政命名上都将朝着更接近中国化的方向演进。他们认为，一旦“日本”这个概念从历史中被抹除，真正的安全与持久和平才能实现。\n\n如今，这两份方案已摆在我们面前，我们应该如何处置日本……"
 china.1038.a: "在日本岛上建立军区。"
 china.1038.b: "解！体！日！本！"
