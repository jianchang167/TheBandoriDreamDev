 PRC_CHEN_WENQING_DESC: "若是有人回到四十多年前，告诉当时还只是一名普通民警的陈文清，他在未来将掌握中国和中共的最高大权，陈一定会认为此人是个疯子——即使是仅回到二十年前，跟当时已成为四川省人民检察院检察长的陈说相同的话，恐怕得到的回应也不会有太大区别——除了开国元勋们以外，中共历史上从未有缺乏经济工作与地方主政经验的中共官僚攀爬到权力阶梯的顶峰。然而现实再一次创造了经验知识无法理解的先例——陈文清，这位1960年生的政法沙皇，在付出了许多又失去了许多之后，终于在此多事之秋坐上了最高领袖的宝座。\n\n近十余年前，陈文清的职业生涯出现了一个关键的拐点——受习近平钦点，他成为了首位法务官僚出身的国家安全部部长，并自此与这个国家的情报系统结下了不解之缘——台海战争前后，国安部在全球各地四处出击，陈苦心经营的全球特工网络使他的视野所及实际上早就盖过了总书记和习的亲信们。也正因如此，当台海战局首现颓势时，陈巧妙地选择了明哲保身的策略，并将手中的资源逐步投入到了应对未来危机时刻中的背水一搏之上。\n\n如今，陈的豪赌已被证明为明智之举，而在他身边，那些手握前所未有之大权的特工和警察们正蠢蠢欲动，势要将他们的宏伟愿景在中国的动荡土地上付诸实践。他将成为中国的“安德罗波夫”吗？还是将包括《1984》在内的一众政治惊悚小说所做出的最恐怖的预言带到人世间？"
 PRC_CHEN_QUANGUO_DESC: "除却总书记、国家主席和国务院总理之外，陈全国或许就是全世界最为熟悉的中共官员——这位曾经的“新疆王”，“维吾尔人的噩梦”，在联合国人权理事会和欧洲议会臭名昭著的铁腕人物，在短短几年间已经成为了新时代中国的某种代名词；中华民族主义与共产主义愿景的完美结合，高效、冷酷无情，并且绝不对西方“卑躬屈膝”。\n\n于1955年出生于河南省乡村的陈全国在很长一段时间里都默默无闻。自解放军退役之后，他曾在家乡省份任职多年，而后又转战河北、西藏等地，在中国或最沉闷或最偏远的角落默默耕耘，一步步从基层崭露头角，为自己赢得了任劳任怨的实干家的名声。在西藏自治区党委书记任上，陈推行的政策令整个青藏高原地区都得到了显著的发展。正因在这一岗位上赢得了善于处理边疆和民族问题的名声，随着新疆恐怖袭击事件的爆发愈发频繁，陈于2016年作为“救火队长”调任西北边陲；而后的故事便是大家耳熟能详的了。\n\n作为“稳定高于一切”这句口号的具象化体现，如今，陈全国的手中掌握着一块比新疆大得多，人口多得多，也难管得多的土地——然而，对陈本人而言十分幸运的是，台海新败后短期的集体情绪低谷如今已被更加汹涌的民族主义情绪的反弹所取代。正是凭借着这股东风，陈仅仅是顺其自然，便登上了中国最高领袖的宝座。如今，陈全国正摩拳擦掌，誓要将中国建设得比以往任何时候都更强大、更安全、更团结，并且对任何非我族类之人都更加仇恨。"
