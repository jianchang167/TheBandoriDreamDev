 china.544.t: "台湾行动圆满成功"
 china.544.d: "经过一系列的侦察行动，我们终于摸清了“公众之敌”的首脑与其日程表。毫不意外的，这位首脑身处敌伪政权的中心——台湾台北。尽管对岸的反侦察力度愈来愈强，但想要策划一场针对非政府官员的刺杀还是易如反掌。\n\n更何况我们如今的网络科技水平可以说是已经全面超越整个东亚乃至世界。\n\n10:38，通过入侵的安保摄像头得知目标从自己的出租屋走出。\n11:20，目标拐进咖啡馆，使用咖啡馆内的摄像头继续监视，目标碰头的人物曾被怀疑为“公众之敌”的干部。\n13:32，目标与干部嫌疑人从咖啡馆中出来。\n13:35，他们叫了一辆无人驾驶网约车。\n\n机会来了：一场应该由网约车公司全权负责的意外车祸。"
 china.544.a: "两人当场死亡。"
 china.545.t: "无知的后果"
 china.545.d: "经过长期监测和情报收集，我们已经锁定了“公众之敌”这一松散团体的基本结构。该群体以海归大龄青年和境内闲散人员为主，打着道德、生态环境保护、性别平权甚至爱国等诸类旗号，实则长期暗中从事反华反共活动。这些人学识低下却自视甚高，在境内外各社交平台成为网络意见领袖，充当西方价值观的传声筒。\n\n我们注意到，该群体的指挥中枢位于海峡对岸，通过端到端加密通讯向境内成员下达指令。他们扮演的“立场”各有不同，但一致反对技官治国理念，企图通过鼓吹社会议题危害稳定，为境外势力的渗透提供土壤。\n\n此次专项行动将分三个阶段进行：首先，精准打击其境外骨干成员、资金链和通讯网；其次，对境内相关人员实施抓捕；最后，清理其在各平台的舆论阵地。我们已经部署了专业技术团队，完成相关人员的数字画像建档。同时，各地网信部门已做好配合准备，确保行动的统一性和精准性。"
 china.545.a: "我们必须铲除这个毒瘤！"
