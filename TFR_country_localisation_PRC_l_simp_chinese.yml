 china.505.desc: "中央财经委员会最近收到了一份来自国家安全部的提案，提案建议国家将新一轮科研预算中一部分资金抽离常规分配机制，专门用于军事相关领域的战略性投入。报告由陈文清亲自起草，其核心内容是：应加强军队、间谍系统与网络安全的能力建设，将预算直接投向高级反间谍人才培训、新一代网络作战装备等“不可公布但必须提前准备”的方向。这份报告措辞严厉，强调：“国家不应将资源浪费在‘幻想性的教育理想’上。在当前形势下，我们比科学更需要的是控制、信息与防卫。”\n\n此提议引起部分科技和教育界代表的反对。几位中科院院士联名上书，提醒国家切勿“为了对抗风险而自毁根基”。他们指出，教育的长线投入才是战略之本，而非权宜之策。他们提出对案反案：与其将钱投入秘密部门，不如用于全国性的公共科学教育计划，培养群众对新科技的理解与信任，以增强国家内部韧性。\n\n而贺建奎则提交了第三份替代方案。他主张将资源优先投向“野心勃勃且智识过人的学生”，为他们提供与国家核心实验项目直接接触的机会，并在军校、高校及某些实验室之间建立快速通道，塑造未来国家科研的“尖刀群”。在他的设想中，普通教育经费将被“重新统筹”，用于建立“高风险天才筛选与培养系统”。\n\n现在，所有方案都摆在我们面前。无论选哪一个，都代表我们对未来国家安全与科技路线的根本判断。"
