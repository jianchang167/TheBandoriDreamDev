 china_collapse.9.t: "北京遭到围攻"
 china_collapse.9.d: "在中央政府大权旁落后，军队悍然政变，硝烟与恐慌如狂潮般吞噬全国各地，首都亦未能幸免。\n\n城东的枪声未曾停歇。这些叛军并非组织统一、目标明确的集团，而是由各种背景、不同派系的武装力量临时组成。主要成员为前政府军队中的异见分子，同时一些明显信仰极端思想的组织也异常活跃。尽管彼此间意识形态和诉求各有不同，但这些乌合之众在“推翻现状”这一点上却出奇地达成共识。这些武装分子已经渗透进城区各处，对军政府发起了全面攻势。黄铭将军仍在勉力维持，但面对多方攻击，也显得疲于奔命。\n\n国际媒体竞相报道北京战局，卫星图像显示多个区域出现浓烟，互联网流传的视频记录了激烈的巷战场景。在这动荡时期，普通市民们躲在防空洞里，盼望这噩梦能早日结束。"
 china_collapse.9.a: "战哭多新鬼......"
