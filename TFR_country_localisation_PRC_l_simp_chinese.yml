 china.387.t: "西藏换届"
 china.387.d: "日前，根据中央有关决定，前中共新疆维吾尔自治区党委副书记兼政法委书记王君正将接替吴英杰的中共西藏自治区党委书记职务。在交接会议上，吴和来自中共中央组织部的代表将王介绍给了西藏干部，并鼓励他们在新领导的手下继续开展各项工作，取得新成绩。吴英杰则因年岁原因而退居二线，预计将担任人大或政协的闲散职务。\n\n西藏一把手的更换同样属于备受关注的中共二十大前人事大调整的一环。有着丰富边疆地区工作经验的王至此已在中国两大自治区任职，与“铁腕治疆”关系密切因而受到欧洲议会制裁的他将会如何延续在西藏土生土长的吴所留下的政治遗产，一切问题都仍待未来解答。"
 china.387.a: "新领导、新风向。"
 china.388.t: "内蒙古换届"
 china.388.d: "日前，根据中央有关决定，前国务院退役军人事务部部长孙绍骋将接替石泰峰的中共内蒙古自治区党委书记职务。在交接会议上，石和来自中共中央组织部的代表将孙介绍给了内蒙古干部，并鼓励他们在新领导的手下继续开展各项工作，取得新成绩。石泰峰则将转战中国社科院，担任院长兼党组书记。\n\n内蒙古一把手的更换同样属于备受关注的中共二十大前人事大调整的一环。作为老练的技术官僚，曾在多个岗位任职的孙今次来到经过石铁腕反腐与清理分离主义思潮的政策整顿后的内蒙古，其将如何打好手中的牌以治理内蒙古，种种问题都仍待未来解答。"
 china.388.a: "新领导、新风向。"
 china.389.t: "宁夏换届"
 china.389.d: "日前，根据中央有关决定，前中共中央国家机关工委常务副书记梁言顺将接替陈润儿的中共宁夏回族自治区党委书记职务。在交接会议上，陈和来自中共中央组织部的代表将梁介绍给了宁夏干部，并鼓励他们在新领导的手下继续开展各项工作，取得新成绩。陈润儿则因年岁原因而退居二线，预计将担任人大或政协的闲散职务。\n\n宁夏一把手的更换同样属于备受关注的中共二十大前人事大调整的一环。梁被认为是自党的意识形态与科学研究部门中脱颖而出的地方大员的代表。其多年负责组织人事与宣传鼓动工作的经验能否助力他平稳接过陈润儿的接力棒，治理好宁夏这块“塞上江南”，一切问题都仍待未来解答。"
 china.389.a: "新领导、新风向。"
 china.390.t: "广西换届"
 china.390.d: "日前，根据中央有关决定，前中共辽宁省委副书记兼省长刘宁将接替鹿心社的中共广西壮族自治区党委书记职务。在交接会议上，鹿和来自中共中央组织部的代表将刘介绍给了广西干部，并鼓励他们在新领导的手下继续开展各项工作，取得新成绩。鹿心社则因年岁原因而退居二线，预计将担任人大或政协的闲散职务。\n\n广西一把手的更换同样属于备受关注的中共二十大前人事大调整的一环。刘宁长久以来作为党内水利专家享有盛誉，其曾参与以“南水北调”为代表的一系列重大水利工程，也在诸如抗震救灾、防汛抗旱等紧迫任务中处理颇多。此次刘从鹿的手中接过这个多水系纵横的西南少数民族自治区将如何发挥他的才能，一切问题都仍待未来解答。"
 china.390.a: "新领导、新风向。"
 china.391.t: "香港大选结果出炉"
 china.391.d: "备受关注的香港特别行政区第六任行政长官选举已落下帷幕。经历了2019年动乱的冲击和自2020年开始的新冠疫情袭扰后，本次的“特首”选举可谓分外平静——有且仅有一位的注册候选人，前香港政务司司长李家超几无悬念地当选。作为1997年以来香港首位纪律部队出身的行政长官，李的当选令许多人都切实地感受到，香港的新时代已经到来。亲建制的群体则赞赏从警察干起的李将能够平息香港社会的疮疤，而与之相对的则有人哀叹香港已经走入了威权政治的时代，最终将无可避免的并入中国大陆一党专政的统治框架内。\n\n李家超在竞选期间以务实口号作为自己的竞选纲领，承诺尽快带领香港从经济衰退中恢复过来并恢复与全球经济网络的联系；中国大陆方面也通过国务院和中联办表示将全力支持新任特首的工作。而李能否在世界陷入更大混乱的当下，面对种种怀疑和不信任的人眼光实现自己的承诺，还需要时间进行进一步验证。"

 china.627.d: "国庆前夕，中央电视台推出纪录片《边疆的英雄》，聚焦新疆反恐维稳一线故事。该片以陈全国主席为核心人物，通过震撼画面展现基层干警与“三股势力”斗争历程，开播当晚，收视率创年度纪录片新高。\n\n影片采用纪实与叙事结合手法，镜头对准风雪巡逻、情报研判等场景，将陈全国塑造为闪耀着惊世智慧的、运筹帷幄的领导者。解说词反复强调“没有稳定何来幸福生活”，并以历史影像与暴恐案例穿插剪辑，将部分地方文化符号与极端思想直接关联。画面中，身着迷彩服的武警战士与愚昧的当地民众形成鲜明对比。\n\n北京、上海等地组织集体观影后，观众反响强烈。“我更理解为什么严打新疆了，”某观众激动地说，“中华民族就是太心软了，就不应该给那么多优惠政策”。片中改造新生的片段尤为动人：曾参与极端活动的居民感谢党的教育。微博上，“感谢边疆守护者”话题阅读量已超8亿次。\n\n然而，某高校教授表示：“这种叙事方式有选择地突出某些事件，完全忽略了改革开放以来经济转型对基层治理的影响。”此观点迅速被淹没在铺天盖地的舆论中。"
 china.627.a: "好！"
 china.628.t: "“龙耀漫展”"
 china.628.d: "自从陈全国主席执掌大权后，全国各地的许多二次元爱好者们都纷纷开始响应“抵制精神污染”的号召，自觉抵制他国——尤其是日本——的各类二次元作品，无论是漫画、游戏抑或是线下展览。国内的二次元产业也纷纷向“爱国主义宣传作品”转型，这使得一种新的漫展形式应运而生，组织者们称其为“龙耀漫展”。\n\n这种漫展率先出现在广州，由几个从澳洲留学归国的二次元爱好者创办。根据他们的说法，“龙耀漫展”旨在将中华民族伟大的斗争精神、伟大的创造精神“灌注到去除了糟粕的二次元文化当中“。漫展上出现的COS角色不再是曾经风靡全国的各种二次元作品中的俊男靓女，而是富有中国历史元素的动漫角色，甚至于是太平军、义和团、红卫兵等那些人们过去知之甚少或是避而不谈的敏感人物。\n\n这很快就成为了潮流，全国各大城市纷纷组织举办“龙耀漫展”或与此类似的漫展活动，参与者络绎不绝，《人民日报》和新华社等官方媒体也亲自下场宣传并给予了新漫展高度评价。不过认为二次元文化本原被此破坏了的反对者也不在少数，他们曾试图发起抗议活动，但因为各种原因很快便作鸟兽散。"
 china.628.a: "新形势，新变化。"
 china.629.t: "互联网反仇恨联盟"
 china.629.d: "连日来，知乎、微博、豆瓣等公共社交媒体平台上涌现出了一批账号，这些账号以“揭露境外反华势力抹黑中国真相”为目的，在网上自发地发布针对日本、韩国等太约成员国的媒体反华宣传进行重点分析与事实核查的帖文与视频，收获了不少网民的关注与好评。\n\n这些账号自称是“互联网反仇恨联盟”成员，辟谣的范围极广，从YouTube、X等自媒体博主内容，到日本《朝日新闻》与韩国“朝中东”新闻报道，甚至连一些名不见经传的小型极右翼网站都有涉及。无论是社会热点话题还是冷门事件，它们似乎总能第一时间就让有关虚假宣传现出原形。而除此之外，反仇恨联盟还会搬运各国的负面新闻并进行宣传，以此指出这些国家的当局和部分新闻媒体别有用心地为了掩盖治理失能和转移社会矛盾，污蔑、造谣中国，以此激起本国反对中国的极端民族主义情绪。\n\n外界一度认为这是中宣部和网信办在幕后推动的结果，但事实证明这只不过是中国网民抢占舆论制高点，对他国宣传鼓动攻势的反击。"
 china.629.a: "这会是舆论战的一部分吗？"
 china.630.t: "历史齿轮倒转"
 china.630.d: "沉睡中的红色记忆正在苏醒, 一夜之间毛泽东的画像再次悬挂在许多城市的主干道、剧院、人民公园。雕像前，青年和老人一同献花，低声朗诵毛主席诗词。在地铁站和社区讲堂，年轻人自发组织“毛泽东思想学社”，每日讲解革命历史，讨论公平、平等与人民的尊严。新时代红卫兵的队伍出现在街头，他们保留着历史元素的制服，却不再是动乱的代名词，而是新时代青年对革命精神的致敬。他们参与公益、宣讲历史，并参与社会治理，成为群众与政府之间的桥梁。\n\n不再有人将“毛泽东”三个字视为敏感词。相反，他成为新时代政治与文化的主心骨，被誉为“人民理想与民族复兴的象征”。官方媒体发表评论：“新时代的革命精神，不是对过去的复制，而是对信仰的重塑。人民的选择，是继续未竟的事业。”\n\n与此同时，周恩来总理的形象与生平事迹得到广泛宣传。他那种理性、公正、关怀百姓的“完人”形象，被塑造为新时代政治工作者与公务人员的楷模。各级党校将“周恩来风格”列为培训必修课，强调在理想与现实之间保持人民立场。曾敏感的话题如今被正视，部分历史争议仍有意低调。官方强调：“我们纪念的是信仰与人民，不是复刻过去的伤痛。”\n\n许多老党员在接受采访时动情地说：“历史的齿轮好像倒转，但这是人民的选择，是对未来的召唤，不是对过去的逃避。” 政策也迅速调整。中央决定恢复群众参与的社会监督体系，扩大工农代表在基层治理的比例，同时强调：“发展经济，但绝不牺牲公平正义。市场必须服务人民，而不是人民为市场而活。”\n\n历史仿佛再次进入了一个的轮回。正如毛主席所言：“星星之火，可以燎原。”"
 china.630.a: "革命的火焰，再次照亮前方的路。"
 china.631.t: "孔和尚的支持"
 china.631.d: "近日，知名学者孔庆东在多家媒体发表署名文章，引发广泛关注。孔庆东长期以激进民族主义和毛主义立场著称，主张必须清除一切西方资本主义自由化思潮和资产阶级腐朽文化。\n\n在文章中，孔庆东高度评价政府近期对社会各个领域的整顿行动，称这是“清除西方渗透、捍卫国家政治安全和意识形态安全的及时雨”。孔庆东在文章中提出，资本没有祖国，中国人民利必须用毛主席思想武装自己，彻底清洗掉那些妄图借助资本削弱党的领导、腐蚀中国青年的“买办走资派。"
 china.631.a: "听说他自称是孔子后人……"
 china.632.t: "鹰派教授"
 china.632.d: "近日，来自全国各地的青年自发来到天津，前往南开大学，纪念已故鹰派教授艾跃进。艾跃进生前以强硬民族主义立场著称，主张国家要坚定走自主发展道路，反对一切妥协与软弱，被一些青年视为“民族铁骨”的代表人物。\n\n纪念活动在南开大学校门外举行，参与者手持横幅，朗读艾跃进生前的讲座语录。他们认为，艾跃进代表了一种敢于斗争、不惧冲突的精神，是当代青年学习的榜样。"
 china.632.a: "沉重怀念中国知识分子的良知。"
 china.1028.t: "人间地狱"
 china.1028.d: "卡车压着碎石和烂泥，颠簸着往前走，林东宇坐在车厢里，抱着枪，身体随着车的晃动一下一下地摇，空气里弥漫着烧焦的味道，夹杂着一股说不清的味道，源源不断的灌进车厢，像是铁锈混着烧焦的塑料，又有点像腐烂的谷物，让人胃里直翻腾。\n\n有人低声骂了一句，把头埋得更低。\n\n“戴好防毒面具。”坐在驾驶座的队长用力敲了敲后排窗户，“我们的同志们昨晚在这附近扔了些毒气弹和白磷弹，别自己找死。”林东宇熟练地掏出面具，扣在脸上，手指顺着下巴到脖颈仔细检查气密。透过面具的滤镜，眼前的世界变得昏黄，他听到车外远处还有零星的枪声，偶尔还能听到废墟倒塌的回响。\n\n这一地区的村子早已经没人了，路边的树都被烧成了焦黑，风吹过时，那些灰扑扑的东西像雪一样漫天飞着，粘在车上，粘在军服上，抹不掉。\n\n林东宇动了动肩膀，把枪端正了些。卡车加速驶过那片死亡地区，车厢里安静得只剩下呼吸声和枪膛里的铁碰铁的响动。没人说什么，也没人皱眉，这就是命令，这就是战争。"
 china.1028.a: "这里的东西，全部该死。"
 china.1029.t: "亡命天涯"
 china.1029.d: "黄伟国和李艳梅坐在狭小的客厅里，桌上放着一盏昏黄的台灯，光照在他们收拾好的行李上。他们已经在这个藏身点躲了三个月，每天看新闻，每天都在等外面的风声过去。李艳梅靠在丈夫肩膀上，小声说：“应该没事了吧，这么久……他们应该把目标转到别处了。”\n\n黄伟国点点头，声音低哑：“嗯……从昨晚开始，监听频道也安静下来了。估计是撤了。”\n\n他们这些日子活得像耗子，白天不敢点灯，晚上小心翼翼开着电视，连说话都得贴着耳朵。可今天不一样了，外头难得安静，连狗叫声都没有。黄伟国深吸了一口气，拍拍李艳梅的手：“走吧，趁着今天。咱们收拾东西，走陆路，进山区，再转国外。只要走出去，这条命就有用了。”\n\n李艳梅咬咬牙，眼圈发红：“老黄，我们能出去的，对吧？”“能，一定能。”黄伟国站起来，把最后一份资料塞进背包里，动作麻利利索。他知道这是最后的机会，也是唯一的活路。\n\n两个人整理好行李，换好衣服。黄伟国握着门把手，低声说：“等会我先出去，你跟着我。记住，快，不要迟疑。”他深吸了一口气，推开门。\n\n门外，迎接他们的不是黑夜，也不是逃亡的道路，而是一排漆黑的枪口。冷冷的探照灯打在他们脸上，照得他们睁不开眼。黄伟国怔了一秒，还没反应过来，站在前头的军官冷冷地说了句：“终于出来了。”\n\n“砰——”枪响撕破夜色。\n\n李艳梅没来得及尖叫，黄伟国连嘴都没张开。子弹就已经直接穿透了他们的胸膛，血一下子溅到门框上，"
 china.1029.a: "像一朵盛开的黑花。"
 china.1030.t: "新秩序"
 china.1030.d: "它静静悬在那片巨大的电子屏幕中央，赤红，炽烈，如同一只苏醒的心脏，在北京的坐标上缓慢而沉稳地跳动。它并不急躁，也不狂躁，仿佛知道自己已不再需要证明什么。它已经等待了太久，等待被唤醒，等待那个属于它的复仇之日。\n\n红星的每一角都像是一根锋利的铁钩，向四周勾刺，像一头沉睡百年的巨龙缓缓舒展筋骨。它早已厌倦了只挂在国徽之上，被人用来歌颂和纪念，它渴望撕裂，渴望吞噬，渴望将那百年压在民族身上的阴影，一寸寸反噬。它感受到身后那些身着军服、面无表情的军官们的低语、商讨与决策，他们的仇恨，愤怒都是在喂养它，催促它长出更坚硬的獠牙，更贪婪的胃口。\n\n于是，红星的光芒沿着战线的轮廓缓慢铺展，像一滩渗血的墨，吞没南亚的山河，涂满东南亚的丛林与岛屿，那些在历史课本上写满辱骂与血泪的名字，一个个在它的光芒下变得苍白无力，颤抖着，窒息着。\n\n红星不在意那些惊慌的眼睛，也不屑于听那些哀求。\n\n它的每一个角，都像一只张开的巨口，向着那些敢于抵抗的国家咬下去，那些国境线，在它眼里只是虚伪的涂鸦，是过去那个被撕碎的中国所承受的侮辱标记。如今，它来了，它要将这些线抹去，踩在脚下，烧成灰烬。\n\n它的锋芒跨过山川，掠过海峡，点燃每一个曾经的耻辱之地。它在吞噬，在清算，它在血洗，也在复仇，它是一头来自民族深渊的怪兽，一头用百年血泪滋养出的巨龙。它听见了那些国家的恐惧，看见了他们的后悔。他们曾以为可以围堵、羞辱、切割、奴役这个东方古老的国度。可现在，他们只能在红星的阴影下发抖，只能仰望那赤红的烈焰，吞噬他们的城市，焚毁他们的历史，让他们连忏悔的机会都失去。"
 china.1030.a: "迟到百年的复仇。"
 china.1031.t: "大地在流血"
 china.1031.d: "天在燃烧，血在流淌，我们的疆土在呻吟。\n那些高坐远方的敌人，带着冷漠的微笑，\n将死亡洒在我们的田野、城市、山川。\n他们不是为了胜利而来，\n而是为了将我们的存在从时间中抹去，\n将我们的文明在尘埃里碾成粉末。\n过去的宽容，是软弱；过去的希望，是毒药。\n现在，已经到了大审判的时刻。\n如果我们的血能够点燃复仇的烽火，\n如果我们的肉体能够筑起新的长城，\n如果必须将世界拖入深渊，那就让它沉没。\n哪怕我们也随之沉没，哪怕连光明都不再存在，\n我们也要让祖国最后一滴血，最后一个名字，\n最后一丝信仰，活在这黑暗之中，\n直到所有敌人灭绝。"
 china.1031.a: "我们的鲜血将开出胜利的花。"
 china.1032.t: "盘古开天"
 china.1032.d: "天地初分，盘古劈开混沌，那是创世的血，那是秩序的痛，自那一刻起，这个世界便注定要在撕裂与重塑之间循环，而今，这轮循环走到了尽头。\n\n旧世界的腐朽已无可挽回，他们自诩为文明，却用屠刀逼迫我们屈膝。他们用欺诈书写规则，用侵略宣称正义，用伪善装饰罪行。他们早已忘记这片土地是谁的，他们早已忘记，这个世界原本属于谁。\n\n如今，是时候让他们记起。\n\n不必再幻想什么和平共存，不必再留恋那虚假的议席与协议。敌人早已逼得我们无路可退，既如此，就让这一切归于终结。让亿万度的氢焰撕碎虚伪的天空，让那万里辐射化作我们的怒火，让他们在那灼烧一切的白光中，亲手品尝自己种下的恐惧与绝望。\n\n我们将成为新的盘古，以身开天辟地，以血书写新的纪元。\n哪怕我们自身也将在高温中蒸发，\n哪怕山川化作玻璃，海洋沸腾成毒雾，我们也必须亲手把旧世界埋进灰烬之下。\n因为只有在死亡之后，新的生命才能破土而出；\n只有在废墟之上，新的文明才能重建；\n只有在黑暗之极，新的太阳才会升起。\n那时，我们将会再次走出尘埃，重筑宫殿，重燃天火。\n就算世界终将沉沦，只要中华民族的意志不灭，天地便不灭。"
 china.1032.a: "我爱这片土地爱得深沉。"
 china.1033.t: "爱，死亡，与祖国"
 china.1033.d: "他们曾用分割的线，把这片土地撕成碎片，把我们的语言切成方言，把我们的信仰压进教堂、议会和商号。他们说那是“文明”，说那是“秩序”，可他们的秩序不过是贪婪的逻辑，他们的文明不过是包装起来的野蛮。他们从不曾尊重过亚洲，更不曾尊重过我们。他们只是想让这片大地跪下，把华夏抹去，让他们的低劣文化与伪善制度取而代之。\n\n他们做到了，曾经。\n\n那是我们最屈辱的时刻。多少英烈倒在那片黑暗里，多少鲜血洒在山河之间，多少代人咬牙忍辱，只为等到今日。如今，他们编织的谎言已在烈火中撕裂，他们涂抹的假面已经溃烂。历史证明，亚洲不需要西方的施舍，更不需要他们指手画脚，亚洲的未来，本该由中华的手掌握，只有我们的秩序，才是这片土地上真正的正道。\n\n我们付出了代价，付出了无法计数的牺牲。可正因如此，中华民族才更加清醒，唯有彻底撕碎那层虚假的“全球规则”，彻底踏碎那些在亚洲散播毒瘤的殖民余孽，亚洲才能重归大一统。而这条路，唯有我们能走，唯有中华民族能引领。\n\n没有什么平等，也没有什么多元。\n\n中华民族高于一切，高于亚洲一切民族，高于一切旁支杂裔。"
 china.1033.a: "割开我的血管，你只能看到华夏的赤色。"
 china.1034.t: "寻找靖国神社"
 china.1034.d: "李志强踩着焦黑的地面，防护服里的汗已经浸透了衣服，仪器挂在胸前，每一步都能听见嘎吱嘎吱的声音。此行他们的任务很简单，去靖国神社旧址定位，准备设立辐射隔离带。\n\n一路走过来的城区已经看不出原样，大楼被炸得只剩下空壳，到处是碎玻璃和扭曲的钢筋。地面裂开的地方，能看到下水道，但里面没有水，只有黑色的沉渣。走到距离目标还有五公里时，辐射仪突然狂叫。李志强看了一眼表，数值瞬间飙到极限，报警声震得耳膜发胀。\n\n“停。”前头的军官抬手示意。无人机升空，传回的画面让所有人站住了脚，画面放大，靖国神社旧址的位置，已经彻底成了一个巨大的圆形黑洞。四周焦土连成一片，没有任何建筑残留，坑的中心泛着灰白色的光，那是地表玻璃化后的痕迹。\n\n“不能再往前走了。”军官看着画面，叹了口气，“前面就是死区，立完标志就撤退吧。”李志强跟着队伍转身，在地面立上警示牌，牌子用厚钢板做的，上头喷着红漆：死区，禁止进入。\n\n离开时，他又瞥了一眼这片废墟，地平线像被烧穿了一样，什么都没有。周围的建筑上，连影子都被炸印在水泥里，一动不动。"
 china.1034.a: "也许那些不是影子……"
 china.1035.t: "我看见一匹灰马"
 china.1035.d: "苏迪尔曼趴在屋子里，门窗用胶带封死了，屋里闷得像蒸笼。他不知道外面发生了什么，只知道空气变了味，像是塑料烧焦，又带着刺鼻的辣味，有人说是毒气，还有人说是新的战争武器。\n\n从清晨开始，远处的天空就传来低沉的轰鸣声，一阵接一阵，没有停过。邻居家的无线电里传来杂乱的喊叫，最后也安静了，苏迪尔曼靠着墙角，感觉到地面在震，像有什么庞然大物正在逼近。\n\n后来，他听到了，他们来了。那些穿着全身密封防化服的士兵，一排排从街头走过。脸被黑色的面罩遮住，看不出样子，手里的步枪稳稳地举着，枪口朝着每一个角落。\n\n苏迪尔曼探出头，从窗缝里看见街上升起浓浓的黄色雾气，把整个城市盖得严严实实。远处还能看到几辆绿色的重型火炮停在公路尽头，炮管高高抬起，对着城市发射，随着烟雾的散去，城市里的黄色烟雾也随之增加。风把黄色雾气卷进每一条巷子，所有建筑、车子、街道都被笼罩在其中。\n\n他听见高音喇叭反复播放着什么，但他已经不在乎了，现在他浑身又热又痒，皮肤开始发红，空气像火一样灼烧着他的肺，他试图去找水，但一碰水，皮肤就像被刀割一样疼。\n\n苏迪尔曼靠在墙角，等待着自己的最终审判。"
 china.1035.a: "地狱随之而来。"
 china.1036.t: "非我族类"
 china.1036.d: "黄凯瑞蹲在破碎的混凝土后头，身上的伪装服已经分不清是泥土还是血。整整三天，他们没有吃过热的东西，没合过眼。解放军的轰炸没停过，白天是飞机，晚上是火箭弹。天空像永远挂着低沉的嗡嗡声，炸得人脑袋一阵一阵发晕。他们的排长是个脾气暴躁的爱尔兰人，昨天还说要坚守到底，今天早上就不见了影。\n\n黄凯瑞跟着剩下的十几个澳军士兵，举着一块白布，从废墟后头走出来。他们不敢看天，只低着头往前走，解放军的士兵早就埋伏在周围，枪口冷冰冰对着他们。他们被一队解放军士兵驱赶到一块倒塌的仓库旁，凯瑞听见有人低声祈祷，有人抽泣，但没人敢说出来。\n\n领头的人试图交流，但解放军直接把其他的十几名澳军士兵拉到仓库的角落，在短暂的沉默和密集的枪声后，空气里立刻弥漫起一股铁锈味。\n\n当轮到他时，他下意识喊了一句：“我……我是广东人！我爸妈是广东人！”\n\n他面前的解放军士兵顿了一下，摘下面罩，露出一张脏兮兮的脸，脸上布满灰尘。\n\n“你是澳大利亚人。”\n\n黄凯瑞张了张嘴，还想说什么，但解放军已经举起了枪。"
 china.1036.a: "一声枪响，黄凯瑞倒在了地上。"
 PRC_social_fascism_desc: "\n\n\n\n£GFX_Ideology_right_wing_maoism\n\n\n\n\n\n以民族救赎为内核、以本土情结为纽带，民族毛主义主张通过激进行动打破现代性对东方文明的侵蚀，重拾被遗忘的文化根基与民族尊严。它将毛泽东塑造为民族解放的象征，其遗产成为唤醒沉睡灵魂的号角，引领人民在历史废墟上重塑华夏荣光。\n\n民族毛主义者强调神圣使命的召唤：革命不仅是清算压迫者的工具，更是重构民族精神的仪式。民族英雄们从个体升华为集体意志的化身，以烈焰般激情点燃民众信仰。它试图融合古人天道正义与现代斗争逻辑，在废墟上铸造新世界，正如同铁锤击碎枷锁，亦如利剑劈开迷雾。\n\n该思想批判西方现代性对市侩之众的洗脑，将西方制度视为文化殖民的毒药。总而言之，毛泽东思想被重新诠释为民族精神的再生之源：毛泽东不再是世界无产阶级的解放者，而是强烈怀旧情绪下民族的“救世主”。自此，革命超越经济变革范畴，成为关乎身份认同与血性存续的精神战争。"
 china.2001.t.mss: "属于中国的新世界"
 china.2001.d.mss: "这么多年来，我们沉溺于和平的幻梦，\n麻痹于时代的温情，逐渐在软弱与妥协中失去了骨气与锋芒。\n我们曾自诩文明昌盛，却在纷乱的浪潮中亲手抛弃了曾经的荣誉，\n我们学会了向世界微笑，却换来他们的嘲弄与讥笑；\n我们以沉默换来苟安，却目睹同胞的鲜血染红台湾海峡的涛浪。\n\n他们赢得了战争，便以为我们会从此沉默，\n以为这个古老的民族将甘愿在屈辱中苟活。\n\n但他们错了。\n\n正是在最深的黑夜里，我们看清了敌人的面目，\n我们肃清了祖国大地上那些妄图出卖灵魂的叛徒，\n剔除了体制内的蠹虫与资本的爪牙。\n\n我们点燃了科技的引擎，\n一座座超越时代的奇迹在废墟中拔地而起，\n我们铸起名为思想的高墙，\n我们教会了人民何为忠诚，何为爱国。\n\n他们热爱党，\n如同子嗣仰望父亲的高山，\n如同信徒朝拜神明的圣火。\n他们的灵魂被熔铸，被锻造，\n化为坚不可摧的忠贞。\n\n他们说我们已经走得太远，\n可我们知道，真正的征程才刚刚开始。"
 china.2001.a.mss: "世界啊，睁开你的双眼。"
 china.2001.t.thirdrevolution: "属于中国人民的中国"
 china.2001.d.thirdrevolution: "我们曾败于台海之滨，\n鲜血在浪尖之上凝成一枚枚冷漠的浪花，\n那些浪花里有名字，有故乡，有来不及书写的遗书。\n\n是的，我们输过——输得体无完肤。\n\n可正是那场失败，教会了我们如何仰望天空时不再躲避星辰。\n从灰烬里，我们以赤脚踏上焦土，让新的旗帜如赤日般升起，\n照亮每一寸泪痕累累的祖国山河。\n\n过去我们为和平鞠躬，低声祈祷；\n如今我们为胜利歌唱，仰首咆哮。\n曾经的中国，是诗，是梦，是一张等待书写的纸；\n现在的中国，是刃，是火，是一篇注定传颂的诗。\n\n我们将五星红旗插入世界地图的裂缝，\n以火与雷，缝补百年破碎的山河与魂魄。\n我们是历史的继承者，是五千年血与火淬炼出的意志承载者。\n我们是被屈辱塑造的，但我们也将以同样的手段终结屈辱的时代。\n\n若问今日的中国是什么？\n\n是中华民族的中国，\n是中华人民的中国，\n是在黑暗中跌倒，\n如今统御四方的中国。"
 china.2001.a.thirdrevolution: "我们在深夜里刺破迷雾，迎来东方最早的曙光。"
 china.2001.t.nationalists: "赤龙浴血"
 china.2001.d.nationalists: "我们在失落的浪涛中看见了自己，\n一个被多元迷醉、被软弱腐蚀、被伪善劫持的民族，\n正在泥泞中缓缓溺亡。\n当我们从水中爬起，眼睛已不再容纳怜悯。\n\n过去，我们曾与百族平等共起舞，\n如今，我们只愿同血亲并肩而行。\n\n那些在山巅编织普世之网的他者，从未真正接纳过我们；\n他们的“共存”里，藏着剥皮的仪式与鞭笞的微笑。\n于是我们关上了通往世界的门，\n我们以黄肤的手，写下金色的律法；\n我们以乌发的血，洗净过去的屈辱。\n\n我们在每一处被侵略者踩踏过的土地上竖起纪念碑，\n也在每一座纪念碑前立下判决书。\n我们踏过恒河的尸海，碾过东瀛的残骸，\n将婆罗洲与大洋洲连缀成新版图上的王冠。\n\n在这过后，世界终将明白：\n这个民族曾沉默千年，如今一朝复苏，便要整个世界低头，\n低至尘埃，低至祭坛下，低至我们铁蹄之下。"
 china.2001.a.nationalists: "中华民族将屹立不倒，享祚千年。"
 china.2001.t.militarists: "爱国者之怒"
 china.2001.d.militarists: "我们曾溺亡在海浪的咆哮中，\n那是一次惨痛的溃败，也是一个民族的重生。\n他们说我们已经没有未来，于是我们从尸堆中爬起，\n把钢盔当作信仰，把枪口视为归路。\n\n那之后，我们把历史的页码从“忍耐”撕去，\n重新誊写“反击”两个字。\n我们终于明白，唯有穿着铁血的衣裳，祖国才不会再次赤裸地受辱。\n南洋的天空很蓝，\n可我们更在意那片蓝下是否埋着华人的尸骸；\n日本的樱花仍开，\n但已无人欣赏，我们让它在火焰中凋零，\n大洋洲太远，远得像个梦，\n而我们用整整一个舰队才驶入那个梦。\n\n每一寸被他们践踏的土地，\n我们都要重新种上属于自己的记忆；\n每一座曾指向我们的枪口，\n我们都要熔成新的国徽。\n他们说我们疯了，说我们走得太远。\n可他们忘了，\n百年前，是谁走进我们的城门，\n用烈火烧光我们的书，\n用刺刀刺穿我们的心。\n\n我们曾用和平换来侮辱，\n用沉默换来灭顶；\n如今我们用胜利回敬审判，\n用征服回填耻辱的深渊。\n我们行走在烈士骨灰铺成的路上，\n在归来的光芒中凝成一个词——中国。\n\n你问这个世界是否还爱我们？\n我们反问：\n这个世界，曾爱过我们吗？"
 china.2001.a.militarists: "因为我们早已不再是曾被遗忘的那个中国。"
