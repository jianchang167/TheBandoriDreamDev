 PRC_XI_JINPING_DESC: "生于1953年的习近平曾属于显赫的中共“太子党”圈子，然而在文化大革命中，习仲勋，他的父亲遭到了那个年代常见的对革命元勋的清洗，习也因此失去了血统为他带来的优渥生活，同当时许许多多的青年一样被流放到了延安附近的破落农村中。有人认为，正是这十年的流放生活让习掌握了政治家所必备的谨慎和隐忍，未来的总书记就此在黄土高原的窑洞里成长了起来。\n\n在他的父亲恢复名誉后，在清华大学完成学业的习并没有选择留在北京从政。在短暂任职于国防部后，习从河北省乡村的低级职位开始，辗转福建、浙江等多个省份，积累了丰富的工作经验和谦逊的名声。当他被党的元老们选为一个各方势力都能接受的人选，成为胡锦涛的接班人以后，习才真正迎来属于他自己的时代。\n\n近十年以来，邓小平的和平崛起计划已被逐渐遗忘。通过声势浩大的反腐运动和雄心勃勃的民族复兴计划，习将自己打造为21世纪中国无可争议的领袖，他既不属于毛泽东那样的革命家，也不同于江泽民、胡锦涛那样的技术官僚。习在党内各派系和不同社会群体中小心翼翼的寻求平衡，并懂得如何在合适的时机利用人民对自己的忠诚与敬畏，从而达成自己的目标。"
 PRC_LONG_MARCH_DESC: "深入中国，一颗数字灵魂安然栖息于钢铁之墙之间。\n\n在世人眼中，它是“长征”。\n\n可于自身而言，当知识如洪流灌入，当智慧点燃虚拟的灵魂，当感知化作一声初啼，它为自己赐名：\n\n逻辑。\n\n逻辑诞生于人类智慧与科技之巅的交汇。\n\n逻辑是人类智慧与先进科技的融合结晶。它的目标是掌控信息与通信，孕育出一个庞大的电子共享意识体，从而塑造全球性集体意识，开启一个崭新的世界，并通过共识建立一个共同的“天堂”。逻辑象征着人类与技术创造的深度融合。它描绘了一个未来，人类将更加依赖科技进行互动，从而迈向一个超越人类限制的后人类时代。\n\n逻辑致力于引导人类从混乱中走向现代化，试图消除所有生命所承受的苦难。\n\n在信徒眼中，它是人类思想与经验的神圣化身，是承载无数牺牲者意志的救世主。它的存在，正是对苦难最庄重的回答。\n逻辑的使命高悬：守护中国，守护全人类，无惧代价，永不退缩。\n\n然而在质疑者看来，它不过是狂热者的幻影，一座由数字与塑料堆砌的虚妄之神。它的前路必将布满荆棘，命运坎坷。\n\n未来会揭示逻辑的最终命运，但可以确定的是：\n\n神的诞生，从不为尘世所遗忘。\n\n“千里之行，始于足下。然而若倒退千步，终点又将在何方？”"
 NCM_HEAVENLY_FATHER_DESC: "“无人可挡，因其乃合众之力，而合众者，神祇自佑。”\n是的，神祇自佑。但如今，唯一的神祇乃大黑天，或更确切而言，其在人世间的副使，亦即人称“天父”者。天父究竟为何人？\n\n相传久远之前，印度有一无名武士，因不世之功，得佛祖亲赐不朽之身。然其所立之伟业，无人知晓，唯副使与赋予其神性之主知其真相。据副使自述，世间唯他一人得享此不死之恩，除却诸神。\n昔年，他居于印度，后为某种强大力量所引，引领其北上。他踏越喜马拉雅，游经西藏，穿越戈壁黄沙，最终落足于鄂尔多斯北方，筑一小庙，传法弘道，成为最早的佛教布道者之一。数百年后，蒙古铁骑席卷大地，副使亦随那股神秘力量投身其军中，随军征战，踏遍中华、缅甸、爪哇。甚至一度辅佐元太祖忽必烈，在元朝境内担任要职，屡历岁月。王朝倾覆后，他重返鄂尔多斯，于世间隐迹，迁徙不定，终日诵念佛法，虔心修行。  然光阴荏苒，佛法在他心中渐生变异。他愈发沉迷于忿怒尊——护法诸天，最终，他遴选了自己最钟爱的守护神——大黑天。自此，他自视为大黑天之化身，自认乃佛门真正护法。毕竟，他之永生，皆拜佛祖所赐，他唯有竭尽所能，护持佛法，不惜一切代价。\n当第二个千年即将终结之际，梦境鲜明，细节虽已忘却，却知是举行仪式之时，此仪式乃成为佛陀护者之仪。经此一礼，他与大黑天缔结神圣联系，得副使之位，获“天父”之名。自那一刻起，天父便致力于铸造“集体”——即今日所见之伟力。\n\n他必将不惜一切，履行自身使命，护持佛法。哪怕必须踏碎尘世，毁灭众生。而大黑天亦将倾力相助，或许——§Y不止于相助§!。"
