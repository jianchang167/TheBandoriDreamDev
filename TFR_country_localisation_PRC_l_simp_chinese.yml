 PRC_li_zuocheng_thought_focus: "李作成思想"
 PRC_li_zuocheng_thought_focus_desc: "枪杆子从不应听众人的命令，它只应归于一个方向，一种思想，一种冷酷而不容置疑的服从。林彪已证明了军队政治结构的正确图式，而李作成不过是以更沉稳的手，将这张图彻底嵌入新时代的钢铁结构。军队不需要“人性化管理”，不需要“民主化训练”，那是平民对钢铁意志的误读，是妄图以情感羁绊统率纪律的懦弱借口。共和国的武装力量必须如神经般统一，如器械般精确。如若思想中尚有自我，则命令中必有迟疑；一旦命令迟疑，国家则亡，军人不需热爱生命，他们必须热爱命令。"
