 china.363.t: "中国在阿富汗的利益"
 china.363.d: "黄沙漫天，驼铃叮当，缠着厚厚头巾、浑身烤羊肉串味儿的阿拉伯人用冷漠且多疑的眼神打量着你——这是大多数中国人对塔克拉玛干沙漠以西、博斯普鲁斯海峡以东疆域人民的刻板印象。然而，很不幸的是，在阿富汗甚至都没有壮丽的沙海，而是光秃秃的岩石山脉；而遮掩住香喷喷烤羊肉味儿的则是弥漫的硝烟所挥之不去的火药味儿。\n\n喀布尔街头，距阿富汗最负盛名的宫殿和清真寺建筑群仅几步之遥的便是中国大使馆。在那间装修粗旷的办公室，三名此时在阿富汗地位最高的中国外交官正围坐在一张小小的圆桌周围，时而互相对视一眼，时而低下头，聚精会神地盯着桌面平铺开来的一张大比例阿富汗地图。每个人手边都摆着一杯加了冰块的威士忌，不过还没人动过。\n\n终于，大使打破了沉默，将桌上的阿富汗地图推向坐在自己对面的使馆武官和政治处主任。“说说看，你们都看到了什么？”\n迟疑了一会儿，武官首先说道：“战略要地，易守难攻……我国西北的重大威胁，长此以往必成大患。”\n政治处主任也跟着嗫嚅了几句：“塔利班上台，人心惶惶；民间思潮日趋极端化，华侨如今已十不存一……”\n\n“你们都看到的是危险；而我看到了机遇！”大使狠狠地戳了戳地图上几处用红铅笔标记出来的地方：“喀布尔国际机场年久失修；塔利班毁掉的罂粟田至今还无人问津；德国人承包的铜矿开发到一半就跑路了……看从昆都士到坎大哈，这样的地方比比皆是！”大使从热情的解说中抬起头来，双眼放光，勃勃雄心昭然若揭，“愚蠢的美国人把这里打成了一片废墟，从军事上始终无法征服阿富汗；而我们将借由这百废待新的局面，从政治和经济上收服顽固的阿富汗人。我们三个人将写一份精彩绝伦的报告，让国内的首长们注意到这块‘风水宝地’。为了我们的前途，祖国的未来……”"
 china.363.a: "现在是时候认真对待这件事了。"
