 china.397.t: "从军记"
 china.397.d: "许家二儿子许季南退役那天，穿着一身旧迷彩，背着行李，从县里坐车、转车，又走了两里山路，才回到了乐业县那个早已被地图边缘遗忘的小村子。村口的晒谷坪空荡荡的，鸡也不见几只。\n\n他走进院子，看到奶奶蹲在灶前捡柴火，手上的皮肤皱得像老树皮。老人听到有人进门的声音，手抖了一下，转过头，半晌才认出他来：“季南……你还记得回这个家啊？”他放下背包，蹲下帮老人理着柴火。\n\n“阿婆，三弟呢？”奶奶陷入了沉默，而后慢慢开口：“老早就不在家了。也没说去哪儿，就说要上百色市里找活。可后来，人武部来过，说是体检合格，直接送去训练了。”\n\n“征兵？”许季南皱起眉，“可他那年才十七。”\n\n“那年村里一次去了八个男娃，还有后头几年，断断续续的，都没再回来过。”\n\n“他们都去当兵了？”\n\n“有的是自己去的，有的是被招去的。”奶奶叹口气，“军车开进来的时候，乡亲都出来看，还以为是来修路的，结果一下来几个穿迷彩的，说是‘国家需要’，就带走了。”\n\n“那村里现在呢？”\n\n“还能有啥。”老人低头理着柴火，“你往村头走走看，还有几个老头子撑着锄头种地。田是要交产的，不干不行，可哪家还有人啊？都被拉去啦。”"
 china.397.a: "“不知道他们最近怎么样……”"
 china.398.t: "新成都"
 china.398.d: "晨雾缭绕于峨眉山的山腰之间，将废弃多年的厂房与铁轨隐在了白茫茫的雾气之中。林骁是工程总包单位派来的结构工程师，调入这片工程区不到一周。他来的时候，工地已经开始动工，和这些工人一起来的，还有全国各大高校调派的专家组和工程技术队伍，以及一组来自研究中心的科学家。\n\n林骁一开始对这个项目还存了几分模糊，直到第一次走进总设计图展板前，他才意识到这是一件前所未有的工程：一座名为“第三新成都市”的地下大型都市群，将承担核交换环境下的生存保障、军备生产、医疗系统与科研工作。而林骁负责的，是主轴结构的支撑体系。他每天要带队进隧道，检查混凝土浇筑质量和钢梁预埋误差.\n\n他们住的工程营地就在山腰，一栋栋白色预制板房整齐排列，房间里有暖风机和带门帘的热水洗浴间，每天按点三餐，医疗站配备齐全。晚上吃完饭，林骁常常会坐在作业区边上，望着远处亮着灯的山洞口出神。\n\n日子一天天过去，工程也逐渐延伸向山腹深处。林骁的生活被各种工作安排得密不透风，但却从未觉得压抑。只要他一天还在这里，他就会站在图纸前，把城市建下去。"
 china.398.a: "备战备荒为人民。"
 china.399.t: "模范士兵"
 china.399.d: "《解放军报》上到处都是有关他的报道和照片；纪录他在演习场上是如何神勇的影片被下发到各大战区、集团军和连队中，让数百万将士参阅学习；从中央电视台到东方卫视，以他为主题的专题纪录片更是比比皆是。上校和将军们与他亲切的拥抱，轻拍他的后背，仿佛他真的是他们的子侄一般；那些形形色色的普通人对他竖起大拇指：“你真是个男子汉！”仿佛他们真的了解他一样……\n\n许季康身着一尘不染的新军装，在大门后站得笔直。另一边记者们嘈杂的声音和高级军官的谈笑声依稀可辨。他也想过小小地休息一会儿，但每当他一闭眼，训练场泥泞的湿地，雷雨交加、时有闪电劈过的灰暗天空，教官们的命令让人脚不沾地……种种情景如山呼海啸一般在他的脑海中将他吞没。因而他不得不时刻保持清醒，以免于继续遭受恐惧的折磨。\n\n他并非是没有无感的机械，但自出生开始就木讷内向的他自然卦于表达。正因如此，他便是当今军队最喜欢的士兵——如骡子般天生的吃苦耐劳。即使是执行着最艰苦的任务，还能在训练场和战区演习中屡创奇迹。他的手榴弹是扔得最远的，他的步枪打靶永远得分最高，他的防御工事总是修建的最坚固的，他给所在部队争取的荣誉和嘉奖总是最丰厚的。谁会不喜欢这样的士兵呢？哪个国家的统帅和元首不会希望自己的军队里都是这样的人呢？\n\n终于，大门“轰”地一声打开了，刺眼的灯光差点让季康流出眼泪。炫目的闪光灯下，满面笑容的总司令从人群中走出来，他肩膀上金色的星星熠熠生辉。就像每一个上级一样，他面带微笑地将奖章别在季康的胸口，热情握手、轻拍后背，还有那一句永远不变的嘉奖词——"
 china.399.a: "“你是我们的骄傲。”"
 china.504.b: "我们不能再落后于别人了。"
 china.505.b: "科学家的方案也许会好一些。"
 china.505.c: "贺建奎的方案看起来更好。"
 china.506.b: "第二套方案也许不错。"
 china.507.t: "向党忠诚"
 china.507.d: "贾启明已经分不清这是第几个夜晚了。他坐在冰冷的铁椅上，手指已经枯瘦得像树枝，指甲里满是血痕。他不记得自己上次吃饭是什么时候，嘴里只剩下一股苦涩的唾液。国安部的审讯员坐在桌子另一侧，一身整齐的制服，扣子扣到最顶，手里翻着那份他已经签过无数遍的供词。\n\n“贾启明，你还有漏交代的。”审讯员声音平稳，像读一份会议记录。\n\n贾启明瑟瑟发抖，拼命摇头：“没有了，同志，我把我能记的都说了，谁给我送钱，谁给我送女人，谁帮我洗钱，我全写了。我……”\n\n审讯员打断了他的解释，继续说道：“你还有更严重的问题。组织认为，你不仅贪腐，你还背叛了党，背叛了人民，背叛了祖国。”贾启明僵住了，张着嘴，像哑了一样。\n\n见贾启明无动于衷，审讯员按下了桌上的按钮，门口很快出现了两个穿着黑色制服的人。“带他去隔壁房间。”审讯员说。\n\n贾启明猛地跪在地上，声音嘶哑：“不要！同志！求您了！我……我认，我认！我什么都认！我承认我背叛了党，背叛了人民，背叛了祖国！我不是人，我是畜生！我是叛徒！我认一切罪！”\n\n审讯员递给他一张纸。“写下来，签名、按手印。”\n\n贾启明接过纸，手抖得写不成字，像一个疯子一样嘴里不停重复着：“我认罪，我背叛，我自愿接受任何惩罚……我该死，我该死……”\n\n审讯员接过纸，看了一眼。"
 china.507.a: "“很好。谢谢配合。”"
 china.508.t: "国家安全部内部专报"
 china.508.d: "一、基本情况\n\n经工作发现，全国多个城市存在以“平权”“多元”“性少数支持”等名义设立的非法组织，其活动覆盖面广，活动频率高，相关组织长期接受境外势力策动，已初步形成松散网络化结构，具备较强的动员能力及社会话语扩散能力。\n\n二、调查发现\n\n（一）已查实多个主要组织接受来自日本、澳大利亚、印度非政府组织及基金会的资金注入，资金形式包括境外电子钱包、小额分散转账、虚拟货币等，具有典型的反侦查、隐蔽洗钱特征。\n\n（二）相关组织除进行所谓“性别平权”“多元文化推广”外，已涉嫌开展煽动性政治言论扩散，鼓吹西方“普世价值”，配合境外势力进行意识形态破坏。\n\n（三）部分成员已被境外情报机关吸收，参与情报搜集、策反引导、社会事件炒作等活动。部分组织被用于为境外势力在我境内部署人员、发展代理人提供掩护与联络便利，具有严重的国家安全风险。\n\n三、处置情况\n\n截至目前，我部已依法取缔非法组织23个，关闭相关社交平台账号及网站150余个，查封非法出版物、宣传材料4800余份，依法约谈警示重点人员267人，刑事拘留涉案人员43人，涉外资金账户全部冻结。"
 china.508.a: "一群西方犬儒。"
 china.509.t: "小拉萨"
 china.509.d: "索朗坐在自己租住的小屋里，手里捧着一杯淡茶。屋外是达兰萨拉阴沉的天空，山上的风带着潮湿的冷意，吹得窗户咯吱作响。他已经在这里三年了，作为一个被成功安插进去的情报员，他现在已经是个小有地位的人物，很多关键会议他都能参与，很多人把他当成可以信任的同胞。他的身份干净，没有破绽，他习惯了说谎，习惯了用谎言织起一张网。\n\n但他从不忘记自己是谁。\n\n夜深时，他偶尔会闭上眼，回忆起那段在国安部秘密基地受训的日子。那时候，他还只是一个名字，一个编号。他记得训练官告诉他们，从今天起，你们没有过去，没有名字，只有任务，只有祖国。那些话，他烂熟于心。他们是无名的影子，是注定不会留下名字的人。\n\n这时，门外传来一声敲门。他警觉地起身，手下意识摸向桌角的消音手枪。是同伙仁青的声音，低低地传进来：“索朗，开会。今天印度那边派了大人物来，办公室那边通知让我们都到场。”\n\n索朗深吸一口气，把桌上的录音笔揣进衣兜。他检查了一下表情，又恢复到那个温和、忠诚的藏人干部的样子。\n\n他打开门，跟着仁青走进夜色。"
 china.509.a: "无名英雄。"
 china.510.t: "局内人"
 china.510.d: "香港的夜总是热闹的，霓虹灯在狭窄的街巷里打出各种颜色，行人川流不息，谁也不会去注意一个背着双肩包、戴着鸭舌帽的中年男人。林建中穿过弥敦道，走进重庆大厦。这里的气味复杂，混杂着咖喱、汗水、香料、油烟。\n\n大厅里的印度人、巴基斯坦人还是很多，但比他几年前来时明显少了一些。林建中的眼神不动声色地扫着四周，他习惯了这种谨慎。尤其是今天，他要见的人身份敏感，是来自印度的老联系人，负责在中印边境地区策动反抗活动的人。\n\n他们约在大厦九楼的一个小旅馆。那种只收现金的地方，什么都不问，什么都不记，他们谈的内容，按理说不会留下痕迹。他按了电梯，电梯慢得像上世纪的废铁，吱吱作响。他进电梯前四处张望，没有异常，他以为没有。到了九楼，走廊里一股潮湿的霉味。他敲了两下门，一个瘦削的印度男人给他开门。房间里点着昏黄的灯泡，桌子上放着地图、文件和一壶廉价的茶。\n\n印度人笑着递给他一份资料，是最新的招募计划和路线。他们低声谈论，讨论如何在山区渗透、如何利用地方的民族矛盾、如何掩护训练营。\n\n林建中一边听，一边在笔记本上记下要点。他专注地工作着，但他没注意到，窗外那栋对面的建筑，一扇黑着的窗后，正有一只镜头安静地对准了他们的房间。\n\n他更没注意到，他进大厦那一刻起，他的面孔，他按的楼层，全都被记录了下来。"
 china.510.a: "林建中只是隐约觉得哪里不对。"
 china.511.t: "廉政"
 china.511.d: "王继东坐在办公室里，看着桌上那只沉甸甸的水果盒，他打开一看，下面压着一沓现金，整整齐齐，像是刚从银行里提出来的。他知道这是哪个企业送的，那家矿业公司，最近要批一个项目，手续还卡在他这里。王继东点了根烟，心跳有些快。他不是第一次面对这种情况，但这一次，他犹豫了。他知道这笔钱代表什么，也知道拿了意味着什么。过去，像他这样的小官，关上门，睁一只眼闭一只眼，日子也算过得去。\n\n可现在不一样了。他听说过，上个月张掖市的一个部长，收了钱，第二天还在饭局上笑，结果第三天就人间蒸发，还有那个财政办的新人，据说是在国安的审问室里被折腾了快两个月，最后崩溃到在审讯室里爬着求饶。\n\n王继东摸了摸脖子，仿佛收下这笔钱，下一个消失的就会是他。他坐了一会儿，咬牙把那盒钱推到一边，他打开电脑，登陆内网，填好了举报表格。对他而言，把事情捅到纪委那里，才是最稳妥的做法，至少自己还能安稳活着，至少还能睡得着觉。\n\n填完表，他按了发送，电脑屏幕亮了一下，弹出“已提交”的提示。\n\n他深呼吸了一口，起身倒了杯三炮台茶。水杯里，他的脸有点模糊，看上去十分憔悴，他低声说了一句，像是在提醒自己："
 china.511.a: "“别动那些不该动的心思。”"
 china.512.t: "被害妄想症"
 china.512.d: "傅澄怀最近睡得越来越差。\n他曾是上海交通大学哲学系的副教授，讲席上滔滔不绝，深得年轻学生的崇拜。而这一切直到他发现自己似乎被人监视，一开始是邮件，每一封邮件他都觉得被人阅读过，后来是手机，他换了三部手机，换了四张卡，每次接通电话，总会有几秒静默。\n\n傅澄怀开始远离人群，他把自己关在屋子里，里头所有插座都被他用胶带封死，连都窗户贴上了厚重的黑布。他开始在笔记本上记录那些他认为在监视他的人，他的笔记本里写满了名字，但他也不确定那些人是真的，还是他自己虚构出来的。\n\n直到一个雨夜，他走在外滩，浑身湿漉漉，嘴里喊着：“他们在看我！他们一直在看我！就在你们头顶的摄像头里，在你们家里！”他的头发凌乱，胡子拉碴，眼神布满血丝。那些曾经认识他的同行、学生，如今也只是看他像看一个疯子。\n\n随后家人把他带走。把他送进精神病院，穿上白色的病号服，吃着强制性的药片，四面白墙，连梦里都是无数双眼睛。可他从不安稳，在走廊里高谈阔论，在病房里争论，他告诉每一个不愿听他说话的人：“你们以为我疯了吗？不，我看得比你们都清楚！”他成了一个可怜的笑话，一个社会的废人。\n\n在家人的陪伴与治疗下，傅澄怀似乎逐渐回到了“正常”的轨道。医生反复向他解释，被害妄想症不过是精神在重压下自我编织的牢笼。他学着去相信这些解释，或许他真的是病吧，或许，他真的疯过。那一切，真的只是自己搞错了吧。\n\n有天夜里，久违的困意袭来。他枕着柔软的枕头，呼吸均匀，眼皮缓缓阖上。雨声敲打着窗台，像是世界终于放过了他。\n\n可在他看不见的窗外，紧贴着那台不起眼的空调外机，一颗细小的红点依旧在黑暗中一闪一灭。"
 china.512.a: "他们一直在看着他。"
 china.513.t: "SY-03项目"
 china.513.d: "实验主持：辛亚拉设施\n报告日期：保密\n\n一、背景\n随着非对称战争与城市渗透任务的特殊需求，传统意义上的特工与兵员在“高密度监控环境”下逐渐暴露出各类问题。本项目旨在通过精神重塑，让社会边缘人群转化为“可控人员”。\n\n二、测试对象\n共征集流浪人口312名，均为无家属、无社会关系、无身份记录或身份信息模糊者。\n签署同意书后转运至设施。\n\n三、实验流程\n阶段一：人格剥离\n持续96小时不间断噪声与光刺激，剥夺睡眠与感官稳定性。\n重复灌输“否定自我”语言指令，强化个体对自身存在价值的怀疑。\n通过施加不可预测性惩罚，打破个体对“因果关系”的正常认知。\n阶段二：重塑\n注射SSRI、NMDA拮抗剂，削弱大脑前额皮质功能。\n被动性催眠训练，训练关键指令词响应，指令下达后自动进入“执行态”。\n阶段三：实战化测试\n将“对象”置入高压情境（模拟暗杀、爆破、劫持等任务）。\n关键指令激活后，测试其完成任务的效率与破坏性。\n\n四、结果与评估\n312名对象中，首批30人达成“完全执行态”，对自身损伤无反应，具备极高的突袭与自毁能力。其中18人在实战模拟中成功完成任务后自毁。\n11人因目标刺激不足未达成自毁，被执行人工清除。\n剩余个体进入“行为紊乱”阶段，失去利用价值后进行回收。"
 china.513.a: "阅。"
 china.514.t: "低空滴滴"
 china.514.d: "随着城市空中交通技术的发展，中国多地开始推广电动垂直起降飞行器（eVTOL），标志着这一新兴交通方式正逐步走向商业化和日常通勤场景。\n\n据业内人士介绍，eVTOL在运行成本上的优势是推动其加速普及的关键因素之一。“一架直升机一年的维护成本可以接近上千万元，而eVTOL总体维护成本几乎可以忽略不计，除了电池。”东部通航相关负责人谢嘉表示。\n\n成本差异也直接反映在票价上，根据东部通航的估算，在eVTOL实现规模化运营后，深圳至珠海的单座票价预计在90至120元人民币之间；这使得eVTOL在短途城市间通勤市场上被视为更具可行性的替代方案。\n\n目前，广州、深圳、上海等地正在推进试点航线布局，同时加强低空空域管理与基础设施建设。分析人士认为，尽管eVTOL商业化仍处于早期阶段，但其在政策推动、技术成熟和成本控制三方面的进展，使其有望在未来几年内逐步改变中国城市间中短途出行格局。"
 china.514.a: "很难想象未来会是什么样的。"
 china.515.t: "云上织网"
 china.515.d: "前段时间，深圳、香港等珠三角地区正式启动“腾云”空中交通系统，标志着飞天汽车进入全面运营时代。这一曾被寄予“改变人类出行方式”厚望的技术奇迹，实际上更像一场国家主导的精密社会工程。与科幻作品中的翱翔不同，“腾云”并非人人可享的飞行特权，而是一套高度管控的空中公交体系，乘客需经多重审核方能获得通行证。\n\n“腾云”轨道并未普及全城，仅串联核心商务区、政府机关和大型IT私企。官方称此举能缓解地面拥堵、提升通勤效率，但知情者指出，该项目最初并非出于民生需求，其深层用意在于对重点人群实施精准监控与管理，构建一张可控的空中网络。\n\n表面上，“腾云”是应对交通难题的创新解法，实际上却是地方政府缓解土地财政危机的权宜之计。随着土地出让收入锐减，政府将目光投向了尚未开发的低空空间。通过修建飞天汽车轨道及配套设施，变相售卖空中“地块”，以吸引开发商投资，为财政注入新活力。\n\n然而，在运营初期，“腾云”仅服务于科研部门、龙头国企及体制内人员。民众若想乘坐，需购买高价通行证。一位出租车司机无奈道：“这根本不是给我们普通人用的。”"
 china.515.a: "至少，飞天汽车的梦想已经落地。"
 china.516.t: "高考工厂的终结"
 china.516.d: "河南某地第二中学，曾被誉为“高考工厂”的应试教育堡垒，而该校近日被整顿。根据新出台的政策，凡继续超时限教学、强化训练的学校，将被限制招生，而相关责任人员将会被处分。\n\n近年来，该校高考升学率常年领先，却屡现学生自杀与自残。最近一例，全国震动：某个在校外跳楼自杀的学生留下遗书——“每天只睡五小时，妈妈监控我的QQ列表和定位，老师说没考上二本就是垃圾……”校长秦某辩解称：“我们只是培养孩子的竞争意识，让他们更好的适应社会。”而心理医生透露，大部分学生已出现严重抑郁，“在校是刷题机器，校外在网络上疯狂寻求解脱，甚至组建自杀交流群。”\n\n新领导班子已派出专家组，对全国同类学校展开全面检查。毕竟，科学研究表明，高压教育会损伤大脑，带来终身认知障碍，这不是教育，而是摧毁。\n\n部分家长对关停决定表示强烈反对。一位家长在抖音上请愿：“不爱吃苦，孩子怎么考得上好大学？别人家孩子还在拼命，我们却要放弃？”"
 china.516.a: "我们将失去一些清北学子，但挽回了无数年轻的生命。"
 china.517.t: "设计生命"
 china.517.d: "近日，国务院发布了《基因优化技术发展规划纲要》，中国首家基因编辑医院——北方优生中心，在北京海淀区隆重开业。这家中心以其豪华的环境和高科技氛围，更像是一座未来感十足的科技展示厅，而非一般的医院。\n\n中心主任向来访者展示了最新的CRISPR Max技术平台：“我们能够为未来的孩子定制多项基因组合，包括优化情商表现，调整外貌特征，甚至增强记忆力和学习能力。”据介绍，目前最受欢迎的服务项目包括“学霸基因套餐”和“容颜定制体验”，价格在170万元至2000万元之间。\n\n在咨询大厅，来自海淀区的邓女士正为婴儿挑选理想的基因：“既然国家已经支持了，为什么不给孩子最好的起点？邻居家都选择了智力增强，我们也不能落后。”另一位男士则表示：“我家族有近视史，既然可以消除这个缺陷，为什么不做？这和打疫苗没有区别。”\n\n然而，国际社会对此反应强烈。多国科学家警告称，这一步骤如同打开了潘多拉的魔盒。欧盟更是宣布禁止相关技术的合作与人员交流。"
 china.517.a: "中国已率先迈出这一步"
 china.518.t: "应龙外骨骼研发计划"
 china.518.d: "第一次志愿者实验\n对象：死刑犯\n效果：不是很理想，受试者在替换脊柱后并没有像预想的那般提高了反应能力，反而对外部反应迟缓，正在探究原因，此原型产品无法通过标准。\n处理：按照协议，该死刑犯会被改判无期徒刑，但今后永久性在研究设施生活并担任部分体力工作，不得外出。\n\n......\n第五次志愿者实验\n对象：死刑犯\n效果：与前两次一样表现出惊人的破坏力，反应力提升效果几乎可以忽略不记。但外骨骼的能耗比模拟时要大得多，正在探究原因，此原型产品无法通过标准。\n处理：按照协议，该死刑犯会被改判无期徒刑，但今后永久性在研究设施生活并担任部分安保工作，不得外出。\n\n......\n第二十次志愿者实验\n对象：乞丐志愿者\n效果：替换脊柱后，我们要求受试者展开躯体防弹板，但受试者一脸惊恐地把替换的脊柱与其连接的部位强行“拆除”了出来，正在探究原因，此原型产品无法通过标准。\n处理：清理一下现场，场面实在有点血腥，今天整个研究室都没有人愿意吃肉。顺便告知一下老吴把他的宠物蛇收起来，毕竟太像蠕动的那玩意了......\n\n......\n第二十八次志愿者实验\n对象：死刑犯\n效果：受试者的反应力与破坏力均远超出了常人标准，能在0.8秒内从机械脊柱中展开保护胸腔、腹部与背部的防弹板，且可按受试者的意愿释放各类激素（如肾上腺素）与镇痛药物，外骨骼的续航能力来到了72小时，外接的腿部和手部外骨骼运作良好。此原型产品通过标准，正在向军方递交验收申请。"
 china.518.a: "按照协议，他将会进入特殊部队服役，根据战功减刑。"
 china.519.t: "共和国长子的未来"
 china.519.d: "中国官方宣布，可控核聚变技术已实现关键性突破，并在东北地区率先启动试点应用。这一进展被视为中国能源发展史上的重要节点，也为长期面临能源与环境双重挑战的东北带来新的发展契机。\n\n根据科学技术部门的通报，首批聚变反应装置已在四平与辽源地区投入运行，提供稳定电力超过六个月，运行状态“可控且高效”。在此基础上，相关部门启动区域性电力结构调整，推进全面电气化。目前，东北三省已基本摆脱冬季能源紧张局面，实现城乡稳定供暖，部分地区还启动了“夏季冷电调节”试点。\n\n产业链也开始出现显著变化，得益于低成本、高容量的核聚变电力，电动车、轨道交通和高耗能制造业正在加速向东北转移。一名地方经济规划人士表示，过去制约发展的电力瓶颈“已被彻底移除”。官方文件也提到，“东北工业带正进入新一轮结构性重构阶段”。\n\n与此同时，能源成本的下降亦推动海水淡化与农业技术的进展。在大庆、伊春、齐齐哈尔等地，多个地下农场实验区已经建成。依托高密度照明与智能温控系统，这些设施实现了全年生产、封闭种植的目标。研究人员指出，该模式有望缓解中国北方冬季农产品供应压力，亦为极端气候下的粮食安全提供新方案。"
 china.519.a: "冰雪下面是热土。"
 china.520.t: "所有的明天"
 china.520.d: "在贵州省省会贵阳，国际会议展览中心201大厦近日举办了一场以“人类未来与科学治理”为主题的全球科学论坛。此次会议吸引了来自中国多个科研机构、前美国地区、南美洲以及独联体国家的科学家、思想家与政策研究者，并围绕未来社会形态与科技主导的治理结构展开为期多日的讨论。\n\n会议期间的话题涉及人工智能发展、基因编辑、人口结构变化等多领域议题。其中，具有代表性的交流之一是围绕“技术理性在社会组织中的地位”展开的圆桌对话，参与者包括以“黑暗启蒙”理论知名的思想家尼克·兰德，以及“基因编辑婴儿之父”贺建奎。\n\n据现场视频显示，尼克·兰德在发言中认为传统政治机制已难以回应指数级变化带来的复杂性，必须将技术专家纳入核心治理结构。并同时提出了三角形社会结构，即：科学家位于决策顶端，负责长期判断与方向设定；其下为官僚执行层，负责技术转化与政策实施；最底层则为广泛公众，参与基础性工作与社会协同。\n\n尽管该结论尚属理论性质，且缺乏具体操作框架，但其所引发的关于“谁应掌握人类未来方向”的讨论，已在国际学术圈与政策分析界引起持续关注。多位科学界人士认为，这一提案反映出科技界对于“后民主时代”社会治理形态的深入思考，也极有可能影响未来部分国家在科技政策与社会组织上的调整方向。"
 china.520.a: "我的双眼已看到了未来。"
 china.521.t: "天南海北"
 china.521.d: "中国官方宣布，其超级高铁项目已完成关键载人实验阶段，标志着这一高速度磁悬浮运输技术在现实运营条件下实现重大突破。此次实验分别选取位于北方内陆与南方沿海的两条线路进行测试，均成功完成全程运行并实现稳定运载。\n\n据山西省超级高铁实验室发布的信息，大同—太原—运城线路在复杂地形与气候条件下进行了多次往返测试，列车运行速度最高接近每小时700公里，远超目前常规高铁时速，在最短运行时间内，该线路将大同至运城的通行时间从原本约五小时缩短至一小时内。\n\n与此同时，广东-海南超级高铁实验室的三亚—海口—湛江线路则主要测试高湿度与沿海复杂气候环境下的运行性能。相关数据显示，列车在台风季节前的多轮载人测试中表现稳定，未出现系统性故障，该线路串联起海南岛与粤西城市，有望大幅缓解海陆通行压力，并带动区域经济一体化发展。\n\n航天科工集团超级高铁项目负责人毛凯表示，实验阶段的成功标志着超级高铁已具备在多种自然环境下进行商业化部署的技术基础。下一阶段，相关部门将启动沿线枢纽站建设优化，并加快票务系统与安全评估流程。初步规划显示，未来十至十五年内，超级高铁网络将逐步从东南沿海推广至华中、西北等内陆核心区域。"
 china.521.a: "我们的双手创造了未来。"
 china.522.t: "中科院呼吁提高教育经费"
 china.522.d: "近日，中国科学院在京发布报告，呼吁国家大幅提高教育经费投入，以应对科技创新与人才培养的迫切需求。报告中指出，中国的教育经费占GDP比例长期低于发达国家甚至部分发展中国家的水平。中科院专家强调，教育是中华崛起之基石，当前人工智能，通信工程等前沿领域竞争激烈，人才短缺问题日益凸显，急需加大对教育特别是高等教育及科研培训的投入。\n\n同时报告中还提到，中国网络安全问题日益严峻，国家应重点投入网络国防教育，不仅要提高学生爱国主义情怀，也要大量培养网络安全人才，以收紧数据监控，防止国家信息泄露。\n\n教育部迅速表态配合，并宣布即将对内进行大刀阔斧地改革，对外大幅提高教育素质，时刻为民族崛起与国家安全做好最充分的人才储备。"
 china.522.a: "打造高科技国防，建立次世代长城。"
 china.523.t: "击溃道德虚伪面具"
 china.523.d: "起初，没有人注意到城市的流浪者变少了，地铁站出口不再有伸手乞讨的人，桥洞下的毯子和破布也渐渐看不见了，没有冻死的新闻，也没有志愿者发布求助信息。人们只以为是政策收紧了，也可能是清理行动更隐蔽了，没人真正追问这些人去了哪里。\n\n与此同时，研究机构的成果不断公布。治愈率更高的癌症疫苗刚进入三期临床，一种基因编辑技术据称突破了原本认为不可能跨越的伦理红线，媒体以积极的口吻报道进展，听起来像是世界正在步入一个崭新的纪元。\n\n有些报道只存在几小时就被撤下，最初在社交媒体上讨论相关实验的人账号很快就注销了，发帖记录也被清空。剩下的人不敢再多说，也没必要多说，毕竟没人关心。郊区的某些旧监狱也悄悄改了用途，过去这里关押死刑犯，现在周围设了电子围栏，时不时有货车出入，没人知道里面发生了什么，也没有任何公开资料提及那片区域的变化。\n\n人们逐渐习惯了这种秩序。城市更干净了，社会更安静了，技术更先进了。没有人再追问那个失踪的流浪汉、那个突然“转移监区”的死刑犯，他们曾短暂存在，后来就像没来过一样。新的治疗方法推广到了民用领域，平均寿命延长了，精神疾病的发病率下降了，电视里播放着科学改变生活的宣传片，办公室和家庭里的讨论也逐渐从“他们去哪了”变成了“我们能活多久”。"
 china.523.a: "无事发生。"
 china.524.t: "缸中之脑"
 china.524.d: "早上七点，林澄语醒来了。阳光从窗帘缝隙透进来，落在她白色的棉被上。她穿上柔软的家居服，煮了一杯咖啡，屋里弥漫着熟悉的香气。客厅窗外是一排樱花树，枝头花开得刚刚好，和昨天一模一样。\n\n但她的心里，总有一点奇怪的感觉。她在一家出版社工作，工作稳定，生活规律。但不知从什么时候起，她开始觉得这个世界仿佛不是真的，地铁上总是那几个陌生而熟悉的脸孔，公司里的同事说着同样的寒暄，像永远卡在一个固定的旋律段落。\n\n直到那一天，她从办公室走回家的路上，突然发现街角那家便利店的招牌“抖”了一下，像电视机信号丢失后画面模糊的那种抖动。没人注意，所有人继续走路，继续说笑，像什么都没发生过。她开始试图打破一切安排，换了路线，不坐地铁，不接电话。她试图走出城市的主干道，却发现无论怎么走，都会回到原来的那条街道上，她走到商店前的玻璃前，看向自己的脸。那一瞬间，镜子里的人影竟稍稍错位了一瞬，不是她那副熟悉的面容，而是一片模糊的、如错误数据般抖动的影像。\n\n她怔住了，那不是她照镜子——而是镜子在“看”她。空气里忽然传来一阵几不可闻的声音：“编号A417触发自我怀疑，准备重置感官程序。”\n\n世界归于黑暗。"
 china.524.a: "下一秒，林澄语“醒”了。"
 china.525.t: "笼中鸟"
 china.525.d: "婴儿一出生便接受全面的数据建档，入学前，他们会再次接受一轮筛查，之后是分层教育。有人进入“实用群体培养通道”，有人被列入“科研预备梯队”，也有人，在幼年时便被标记为“社会辅助型人力资源”，将来负责维护城市秩序、清洁系统，或其他必须存在却不被提起的岗位。\n\n没有人觉得不对，教育本就是筛选，分层是为了效率，资源是有限的。家长逐渐适应了不再为孩子“选择”兴趣班，也不再焦虑择校——系统会根据预测模型，直接为孩子分配最优路径。“自由发展”仍被写在教育理念中，只不过是“在能力允许范围内的自由”，比如，如果一个青少年的数学模型显示他在15岁以后智力增长将趋于平稳，他将被安排进入体力方向发展区，如果某人的情绪响应模型过于敏感，他就不适合处理金融或国家事务。\n\n城市里建起了“才能分布图”，每个社区都是按职业与功能分区居住，人与人之间的差距清晰、可控。曾经混乱的“梦想”不再出现，社会更平稳了，犯罪率下降了，精神疾病减少了，跳楼的学生不见了，连夜痛哭的家长也不见了。\n\n有人说这是一个人人都能实现自我的时代，也有人说，他们从未真正拥有过“自我”，但社会的每个人都在微笑着接受这场安排，并相信那正是自由。"
 china.525.a: "他们自由地走进笼子，然后告诉自己那是天空。"
 china.526.t: "改天换地"
 china.526.d: "沈苒落地北京的时候，是清晨五点半，天色还没完全亮。她坐在登机口外的长椅上，看着机场里来来往往的旅客，忽然有点不适应。五年前她刚从浙江大学毕业时，拿着奖学金去了喀山联邦大学深造，那时北京还没有这么“干净”，现在却像被什么无形的东西清洗过一样：不乱，不吵，甚至连杂乱的招牌都换成了统一的白底蓝字。\n\n她拖着行李走出安检口，一排排广告屏幕亮着，显示她刚刚刷脸过闸的信息，姓名、证件号、体温记录，全都闪在左上角，她有些错愕地回头看了一眼，但身后的人却神色平常，仿佛这就是生活的一部分。她原本以为自己是回来“熟悉”的，可现在，沈苒反而觉得一切陌生。\n\n机场里的广播被头顶不断变换的灯光和导向投影所替代；买瓶水不用扫码付款了，自动贩售机直接扫了她的脸，扣费提示发到她绑定的账户上；甚至洗手间外的屏幕，也在显示使用人数和每个人的“卫生指数”。“卫生指数”？她看着这个词，有点想笑，又笑不出来。\n\n她突然有点想念在喀山念书时的公寓、结冰的街道、市场上俄国老太太卖的黑面包，那种粗糙、吵闹、凌乱的世界，突然让她怀念了起来。"
 china.526.a: "美好新世界。"
 china.527.t: "新科研改革"
 china.527.d: "多年来，科研系统积累了大量项目与人员，层级森严，审核程序复杂，成果产出周期冗长，大量资源沉没于文书往来与论资排辈之中，年轻人难以上位，真正关键的课题长期滞后。如今为了彻底摆脱这一问题，原有的评审制度被取消，不再设年龄限制，不再要求职称资历，项目归属与资源配置直接挂钩于产出效率与可执行指数，谁能把成果做出来，谁就能获得下一阶段的经费与权限。\n\n新设立的科研机构开始大量吸纳技术人才，只要能解决问题，出身背景不再重要，有人曾因违反实验伦理被行业封杀，如今重新被召回，也有人曾因思想过于激进而遭到排斥，现在却成为关键领域的主导者。没有人再谈“伦理审查”，这几个字在文件中被大幅简化，作为“操作指引”之一，仅供参考，如今他们更关心的是结果，是否能突破技术瓶颈，是否能短期内实现量产。\n\n外界偶尔传出争议，比如某些技术可能涉及活体试验、某些算法可能存在数据操控。但这些声音很快消散于效率的浪潮中。"
 china.527.a: "而道德被留在了走廊尽头，无人再去探望。"
 china.528.t: "祛除蛀虫"
 china.528.d: "马蒂亚斯·罗梅罗坐在香港机场的过境等候室里，手指在牛仔裤上一下一下地敲着，他的行李已经托运，签证也批了，一切看起来都很顺利。可当他准备登机进入深圳口岸时，被海关人员礼貌地请到了一间隔间，随后十多个小时就这么过去了。\n\n没有粗暴，没有质问，只有一位穿制服的男人进来，递给他一张纸，上面印着一句简单的决定：“您不符合入境条件。”他不理解。“为什么？”他问。那人只是看着他：“你知道为什么。”\n\n马蒂亚斯张了张嘴，却什么都说不出来，他脑子里忽然一片空白，过去的那些事像被人一把拽出来摆在眼前。十年前，在布宜诺斯艾利斯，他在社交媒体上炫耀自己在朋友的生日派对上吸过可卡因。五年前，他因为酒驾撞上电线杆，被拘留十二小时。三年前，他曾发过几条对政府粗俗的推文。可他从没提过这些，那些记录在他自己的记忆里都快模糊了，可现在它们却一条条被拿出来，像干净整齐的档案。\n\n“你们怎么知道的？”那人笑了笑，没回答，只是把那张决定书往他面前又推了一点。"
 china.528.a: "“祝你回程愉快。”"
 china.529.t: "资本身上的镣铐"
 china.529.d: "凌晨四点，深圳南山区的一栋写字楼外，国安部人员身着便装自地下停车场与电梯井同步进入，对该楼内三家大型投资控股企业展开突袭，办公区的服务器被立即封锁，现场所有电子设备统一封存，几名企业高管当场被带走。\n\n几乎在同一时间，广州珠江新城的另一栋总部大楼内，财务部门仍在通宵加班，后台数据正在被迅速转移至境外账户。但这一切都在突入的执法组面前戛然而止，被扣押的资料显示，该公司正准备将数十亿资金通过空壳机构流入境外信托体系，并计划在本周内将核心资产置换至香港附属公司名下。\n\n类似的行动，也出现在杭州西溪湿地边缘的高新园区，在近半年调查中，这些企业利用关联算法交易、虚假技术评估、员工持股信托等方式，将大额利润转出主账户体系，并试图通过外籍法人洗净过往资本流动轨迹。调查人员封存了现场账本与代码服务器，同时还截获了几位关键人物准备搭乘私人飞机出境的路线安排。"
 china.529.a: "是时候该好好收拾这些资本家了！"
 china.530.t: "渗透全球网络"
 china.530.d: "达米安·斯通坐在堪培拉国防部五楼的办公室，风扇嗡嗡转着，屋里有点闷。他端着咖啡，盯着电脑屏幕上闪烁的蓝色聊天框。\n\n“我整理了一份初步草案，是关于与日本共同训练机制的备忘录。”他在聊天框里敲完这段话，按下了enter键。几秒后，对面回了句：“好的，发我看看。”语气和平时一样，没有多余的词，也没有少。\n\n达米安点开附件，把那份标注着“内部讨论，未经批准不得外传”的文件拖进去，点击了发送。他犹豫了一下，又补了一句：“里面我加了几条敏感建议，可能需要再确认一下优先级。”对方回得很快：“明白，处理得不错。”然后是一个再熟悉不过的笑脸表情——他上司常用的那个，标准而机械的：）\n\n他们又聊了几句，说了几句无关紧要的轻松话题，比如国会预算会不会拖延、前厅那个打印机还是没修。一切都像往常那样。\n\n达米安喝完咖啡，合上笔记本，准备离开。隔壁办公室有人在打电话，他没听清内容，他也没注意到，自己刚刚发送的那份文件，已经出现在一份存档页面中，它被重新编号、分类、时间标注，最后落在一个标识为“华南监测中心—三组”的系统内页下。"
 china.530.a: "达米安走出门，打了个哈欠。"
 china.531.t: "智能国度"
 china.531.d: "很久没有人再看见工人在流水线上弯腰，也没有人再听见卡车司机凌晨启动引擎的声音。工厂里一排排机械臂精准操作，仓库内自动分拣系统日夜不停，配送车辆按秒计算路线，早已不需要驾驶员。城市各处的环卫车、维修站、收费岗亭，早就更换为统一标准的智能终端，效率极高，几乎不出差错，这一切都被称之为进步。\n\n媒体用整版报道展示数据：生产总值持续增长，交通事故率下降，失误率接近于零。城市变得整洁、高效、安静，几乎没有多余的噪音。每个人的生活仿佛都被安排进一个更有序的系统，少了等待，也少了麻烦。\n\n有些人开始留意到，曾经喧闹的工业园不再出现换班高峰，地铁站少了穿着制服的上班族，出租屋区的灯光夜晚不再亮起。旧城区的小饭馆接连关门，理发店的椅子也空着，过去常常在街口抽烟闲聊的人，不知从什么时候开始再也没出现过。"
 china.531.a: "他们究竟去哪里了？"
 china.532.t: "世界的木偶师"
 china.532.d: "“你这身破玩意儿，真从中国淘来的？”卡尔看着一旁趴在沙地里的民兵。那是个戴着红星头巾的年轻人，身上背着m72law。他身上的“雅科达”战术背心已经被荆棘刮出两道口子，线头都冒出来了，“便宜，一件六十。”民兵嘀咕道。\n\n卡尔没回他，只是握紧手里的步枪，目光盯着山谷那头的尘土，敌军正在逼近，至少两个排，还有一辆M1主战坦克慢慢推进，“他们知道我们在这儿了，”趴在一旁的队长说，“我们恐怕连十分钟都活不到。”\n\n空气发闷，耳朵边隐隐有炮声靠近，就当卡尔觉得自己马上要把命交代在这时，坦克忽然停在了原地。紧接着，它缓缓调转炮塔，突然间开火——不是对他们，而是朝自己阵地后方一连串的步兵扫去。接着是第二发，第三发，爆炸声在峡谷里轰响起来。\n\n“操，它疯了？”民兵张大了嘴。卡尔愣了几秒，然后立刻爬起，“趁现在，撤出去！”他们迅速往侧翼转移，子弹从身后擦过，但追兵已乱。卡尔回头看了一眼那辆坦克，只见驾驶舱门紧闭，没有一点动静，炮塔却在机械地左右摆动，像是被什么东西接管了。\n\n远在半个地球之外，一间控制室中，一名穿灰色制服的技术人员缓缓从控制台上移开手指。"
 china.532.a: "屏幕上的卫星信号逐渐消失。"
 china.533.t: "无所不知，无所不能"
 china.533.d: "瑞士卢加诺湖边的一家咖啡馆里，亚历山大·冯·哈特，一名驻欧盟对外事务部的中层官员，靠在藤椅里，他对面坐着他的法国老朋友，让-皮埃尔，两人认识二十多年了，今天算是难得的闲暇。\n\n“你还记得我们刚进部的时候多天真吗？”亚历山大笑了笑，“现在派到哪儿去都一个样，签个文件就能过一天。”让-皮埃尔嗤了一声，“上个月那个被派去澳大利亚的同事，整个月都在发沙滩照片。还有人在开会提他调研成果，笑死人。”\n\n亚历山大点点头，挪了挪坐姿，“外派？现在不就是去旅游、定期发点报告、剩下的时间躲着不惹事？只要不犯大错，没人查你。”他停了停，望了眼远处的湖面：“有时候我甚至觉得，我们这些人对外的价值，还没那些驻华使馆的实习生大。”\n\n“也不是完全没用，”让-皮埃尔说，“起码还能带点奶酪回来。”两人都笑了。\n\n而在一万公里外的南宁，一间不挂单位牌的普通办公楼里，国安部正同步处理着他们两人之间的对话内。"
 china.533.a: "已存档，持续监听中。"
 china.534.t: "跨越历史门槛"
 china.534.d: "我常在深夜独自看着那些情报汇总，思考这个世界会走到什么地步。\n眼下，所有西方国家都陷入一种自我麻醉式的内乱，\n连他们自己都分不清敌人是谁，朋友又在哪里。\n他们喜欢在破碎的街头高举废纸写的标语，自以为在维护某种自由，\n殊不知连最基本的社会秩序都已失去。\n我看到帝国主义者相互咬噬，资本主义者在他们空洞的市场游戏里沉沦，\n就像一群耗子，在腐臭的粮仓里啃食同类的尸体。\n他们的国会里充满了软弱无能的表演，\n而这些表演还要在新闻里被粉饰得冠冕堂皇。\n他们的媒体一边鼓吹胜利，\n一边害怕承认自己正在走向失败。\n我对这种低劣的戏码没有兴趣，他们的所谓制度、所谓价值，\n在我们看来不过是一堆无法运转的废铁。\n他们缩在自己的小圈子里，彼此怀疑，互相指责，却没有一个人敢站出来说实话。\n即使他们得到了一次胜利，也不过是在泥潭里挣扎，狗咬狗罢了。\n而我们不再跟他们在同一个舞台上扮演那套旧时代的把戏。\n他们的国家像漏风的船，摇摇晃晃，但他们还在自欺欺人地谈什么国家尊严。\n我对他们没有怜悯，我们也不会给他们留下选择。\n他们想追赶，可已经太晚了，中国不允许他们喘息。\n我们不会仁慈，因为这个世界不配拥有仁慈。\n他们要么低头接受新秩序，"
 china.534.a: "要么被时代的车轮碾碎。"
 china.535.t: "旧日残影"
 china.535.d: "陈文清主席放下手中的文件夹，透过办公室的落地窗望向远方。秘书刚刚离开，带来了一份特殊报告——全国各地出现模仿毛主席的现象，从广场舞大妈的口号到网络直播间的致敬表演，甚至有人组织重走长征路活动。\n\n“您认为这是境外势力策划的吗？”秘书临走前小心翼翼地问道。陈文清摇头，嘴角微微上扬：“历史自有定论，不必过分解读。”他平静地挥手示意秘书可以离开了。办公室门关上的瞬间，陈文清的表情骤然变得严肃。他拿起红色加密电话，拨通了一个内部号码：“谛听、谛听，立刻启动溯源行动，不要打草惊蛇。”\n\n在次日的秘密会议，“谛听”汇报：“初步调查显示模仿者背景各异，包括失业人员、历史爱好者和边缘群体，无明显组织痕迹。但有人鼓吹呼吁回归社会主义、落实劳动法等诉求。境外势力已开始利用此事。”陈文清沉默片刻，说：“扩大调查范围，重点关注境外煽动活动。”他轻叩桌面，“即使尚未找到明确证据，也要做好最坏的准备。”\n\n走回办公室，他再次望向窗外，夕阳将整个北京城染成了红色。"
 china.535.a: "红色幽灵是否会再次降临？"
 china.536.t: "稳定之手"
 china.536.d: "自陈主席上任以来，国家政治生态持续向好。近日，中纪委联合国安部展开代号为“磐石”行动，对党内部分人员进行集中调查，以确保党的团结统一和国家长治久安。\n\n官方通报显示，“磐石”行动旨在清除潜藏在党内的“不稳定因素”，此次行动重点关注长期鼓吹政治改革、传播西化思想以及在网上发表激进言论、挑动阶层对立的党员。调查发现，这些人与境外势力暗通款曲，试图利用社会矛盾危害国家安全。此次行动抓捕了多名经济学家、法学教授和新媒体工作者，并查封了大量书籍和政论网站。\n\n颇具新意的一点在于，国安部在此次行动中运用了一种全新的思想溯源技术，通过大数据分析和AI，精准定位并追踪了这些人员的意识形态来源和传播路径。这引发了一场自我审查浪潮，全社会纷纷互相检举，甚至主动上交违规书籍，以示忠诚。陈主席表彰“磐石”工作组的英勇工作，并要求全党上下以更高的政治站位和更强的责任担当，维护安全和稳定。"
 china.536.a: "稳定之手紧握方向盘"
 china.537.t: "国家的捍卫者"
 china.537.d: "在百年未有之大变局席卷全球之际，陈文清主席近日罕见现身国安部某训练基地，视察代号为“鲲鹏”的特工队伍。此次视察并非一般的慰问，而是一次高度保密的战前动员。\n\n主席在简短讲话中并未过多提及国际局势的严峻性，而是以一种极富象征意味的方式向特工们阐述了“使命”。他缓缓踱步于训练场，观看特工们进行高难度的情报收集、心理战术演练。“你们不是普通的特工，而是隐藏在暗流中的利剑。”主席停顿片刻，目光扫过特工的面庞，“鲲鹏展翅，必先破茧。时代赋予我们的使命，是超越常规、打破边界，用隐蔽的力量守护国家利益”。\n\n“鲲鹏”并非针对单一国家或地区，而是一项全球范围内先发制人的战略。特工们将被部署至全世界，任务包括但不限于：渗透外国的关键部门，窃取核心技术情报；瓦解境外反华势力，阻止其颠覆中国的企图；以及在舆论场上与敌对势力展开斗争。\n\n陈主席还特别强调了文化输出的重要性。他指示国安部组建一支由顶尖艺术家、作家和学者组成的“破冰队”，利用中国文化的魅力，软化敌对国家的民众情绪，为国家争取国际支持：“我们要用我们的故事，改变世界的认知。”"
 china.537.a: "看不见的战争早已打响"
 china.538.t: "打扫门户"
 china.538.d: "国家安全部近日完成一项代号为“清源”行动的大规模安全调查，由一名曾为西方情报机构工作的人士主动举报引发。举报者曾在境外资助下组织反政府活动，因遇到内部纷争，转而向国安部递交了大量“反华证据”，试图通过戴罪立功保全自身并打击竞争对手。\n\n根据官方通报，此次行动清查了10家接受境外资金的媒体平台、160余个社交媒体账号及80多家非政府组织，涉及性别平权、艺术娱乐、法律援助等多个领域。当局称这些组织打着公益旗号，行颠覆之实，并公布了部分涉案机构与欧美境外势力的资金往来证据。\n\n中国国安部微信公号发文，称：“任何试图打着权益旗号而从事危害国家安全活动的组织和个人，都将面临法律制裁。”同时有关部门强调此案并非针对特定群体，而是清除隐藏在各领域的境外渗透势力。值得注意的是，尽管举报者试图以检举他人换取宽大处理，他本人仍因煽动颠覆国家政权罪被判处重刑。“他利用自己狭隘而偏颇的认知，将国内正常的社会议题污名化。”一位参与调查的警官透露。"
 china.538.a: "一场反间谍风暴落幕。"
 china.539.t: "备受争议的生物学家"
 china.539.d: "在推特上颇具人气的中国著名生物学家贺建奎曾因非法利用CRISPR技术编辑了三名婴儿的胚胎基因而被判处非法行医罪，而他现在已升入中科院。\n\n根据新华社的新闻稿，4月1日，贺建奎成为中国科学研究院院士兼中国科学技术大学基因研究院的全职教授。该机构由中国科学技术大学和解放军政府于[GetYear]年共同创立。\n\n贺建奎的研究重点是通过基因编辑以预防艾滋病等免疫性疾病。该研究项目曾引起科学界和伦理界的渲染大波，但如今已成为中国国家批准的重点研究项目。\n\n贺建奎告诉《自然》杂志，他致力于“不要让任何一个人落下”。“没有人应当生来就在基因上落后”，贺建奎说，作为基因与胚胎研究的最前沿科学家。“我也希望我的美国粉丝也能继续支持我的研究，”他补充道。"
 china.539.a: "他会创造出猫娘吗？"
 china.540.t: "反技官运动兴起"
 china.540.d: "关于境内外“反技官运动”敌对势力渗透情况的特别报告\n\n近期在我党内部及社会思想领域出现一股被初步识别为“反技官运动”的敌对思潮与组织活动，其核心目标为破坏我党确立的以科技主导治理体系的基本国策，推翻我方在技术治理结构中的核心力量，严重威胁国家战略安全与意识形态稳定。\n\n该组织主要由一批长期抱有自由主义倾向、否定技术统治合法性的知识分子与个别退役官僚构成，其宣传口号以“普世精神”、“恢复人民民主专政”为外衣，实质则是抨击我党对高级技术干部的重用政策，鼓动党内干部与人民群众对“技官统治”的不信任与对立情绪。\n\n此外，根据掌握的情报，该派系已与境外多个敌对国家接触，包括印度、日本、澳大利亚、新西兰等国情报机构与反华智库。在过去六个月中，至少五起境外资金流入案件与该组织外围网络有关。\n\n目前，“反技官运动”规模尚处于萌芽阶段，但其理念具有欺骗性、部分成员具有一定政治与学术影响力，极易形成破坏性扩散。若不及时遏制，将可能引发意识形态风波与基层思想混乱，影响党在高科技领域的主导权与社会稳定。"
 china.540.a: "对境外势力绝不能手软。"
 china.541.t: "公众之敌已被消灭"
 china.541.d: "本台消息，公安部近日成功破获一起由境内外敌对势力策划、组织的重大政治渗透案件，有力维护了国家政治安全与社会稳定。\n\n经查，名为“科技伦理研究学会 ”的组织恶意歪曲我党坚持以科技强国为核心的发展战略，诋毁国家科技治理体系，鼓吹“普世精神”“人权高于主权”等错误思潮，更为恶劣的是，该组织骨干人员与境外多个敌对势力存在密切联系，非法接受印度、日本、澳大利亚、新西兰等国提供的资金与技术支持，频繁散播谣言，破坏社会秩序，严重危害国家安全。\n\n公安机关依法对涉案人员依法采取刑事强制措施，查封非法资金账户，关闭相关非法网络平台，并彻底捣毁其在多个省份设立的地下联络点。初步审讯显示，该组织妄图借“人文研究”之名，挑动群众情绪、煽动对立，其行为性质极其严重，性质明确，证据确凿。\n\n公安部表示，国家对任何形式的分裂主义、颠覆活动零容忍，任何妄图扰乱国家战略部署、破坏社会稳定的图谋，注定失败。全社会要进一步增强政治意识，坚决同一切敌对势力作斗争，共同维护国家安全与繁荣稳定。"
 china.541.a: "大快人心。"
 china.633.t: "得国之正"
 china.633.d: "自从我们为毛主席上皇帝尊号之后，在党内和社会上都陆续出现相似的呼声，提议为与毛一同参加革命并建立了新中国的开国元勋们授予同样的荣誉尊号，以起到彰显辉煌历史、规范政治秩序、凝聚社会共识、增强人民团结和自豪感的作用。尤其是，借此机会，我们可以为过去一部分党史中讳莫如深的领导人们真正盖棺定论，给予他们应有的评价和荣誉。\n\n针对此项建议，中共中央宣传部已经给出了具体实施方案和意见。我们的最终决定是……"
 china.633.a: "当然！为什么不呢？"
 china.633.b: "我们只会尊崇毛主席！"
 china.634.t: "人间英雄气"
 china.634.d: "北京市劳动人民文化宫——又称北京太庙。在过去的帝制时代，这里曾是供奉历朝历代的皇帝先祖以及辅佐他们或一统天下、或开创盛世的英雄豪杰之处。自新中国建立以来，这里则成为了北京市民们休闲与集会之地，再无过去的庄严和肃穆之象。\n\n而今日，似乎百年前的盛景又再度重现。身着现代风格华丽制服，手中紧握寒光凛凛步枪的仪仗队士兵与身着宽袍大袖，衣冠皆仿古制的礼仪官们组成了一副对比强烈的图景。香炉中缓缓升起白烟，昭示着仪式进入高潮。为首的官员打开一卷长长的国书，朗声念出所册封的开国元勋们的名字与谥号——\n\n吴文正公，周恩来；\n楚文怀公，刘少奇；\n湘文惠公，任弼时；\n鄂文懿公，董必武；\n海阳烈公，李大钊；\n衡山哲公，陈独秀；\n长沙贞公，何叔衡；\n淮南敬公，陈潭秋；\n延陵义公，瞿秋白\n零陵英公，蔡和森，以及——\n\n梁忠武公，朱德；\n潭襄武公，彭德怀；\n荆悼武公，林彪；\n巴靖武公，刘伯承；\n洪毅武公，贺龙；\n芙宁武公，陈毅；\n衡昭武公，罗荣桓；\n代顺武公，徐向前；\n江安武公，聂荣臻；\n越恭武公，叶剑英。\n\n只要中华人民共和国尚存于世，这些英雄便千秋万代香火不绝。"
 china.634.a: "神州满天星。"
 china.635.t: "勋旧各归位"
 china.635.d: "北京市劳动人民文化宫——又称北京太庙。在过去的帝制时代，这里曾是供奉历朝历代的皇帝先祖以及辅佐他们或一统天下、或开创盛世的英雄豪杰之处。自新中国建立以来，这里则成为了北京市民们休闲与集会之地，再无过去的庄严和肃穆之象。\n\n而今日，似乎百年前的盛景又再度重现。身着现代风格华丽制服，手中紧握寒光凛凛步枪的仪仗队士兵与身着宽袍大袖，衣冠皆仿古制的礼仪官们组成了一副对比强烈的图景。香炉中缓缓升起白烟，昭示着仪式进入高潮。为首的官员打开一卷长长的国书，朗声念出所册封的开国元勋们的名字与谥号——\n\n汉玄文王，邓小平，以及——\n\n苏文肃公，陈云；\n漳文熙公，邓子恢\n岳文理公，李富春\n澧文诚公，林伯渠\n宁文度公，谢觉哉\n化文慈公，徐特立\n荣文清公，吴玉章\n嘉文达公，郭沫若\n桐文裕公，沈雁冰，以及——\n\n沅睿武公，粟裕；\n悟成武公，徐海东；\n郴信武公，黄克诚；\n涟敦武公，陈赓；\n源恪武公，谭政；\n洙节武公，萧劲光；\n琼烈武公，张云逸；\n柏质武公，王树声；\n果钦武公，罗瑞卿；\n善闵武公，许光达。\n\n只要中华人民共和国尚存于世，这些英雄便千秋万代香火不绝。"
 china.635.a: "神州满天星。"
 china.636.t: "英烈宜得尊"
 china.636.d: "北京市劳动人民文化宫——又称北京太庙。在过去的帝制时代，这里曾是供奉历朝历代的皇帝先祖以及辅佐他们或一统天下、或开创盛世的英雄豪杰之处。自新中国建立以来，这里则成为了北京市民们休闲与集会之地，再无过去的庄严和肃穆之象。\n\n而今日，似乎百年前的盛景又再度重现。身着现代风格华丽制服，手中紧握寒光凛凛步枪的仪仗队士兵与身着宽袍大袖，衣冠皆仿古制的礼仪官们组成了一副对比强烈的图景。香炉中缓缓升起白烟，昭示着仪式进入高潮。为首的官员打开一卷长长的国书，朗声念出所册封的开国元勋们的名字与谥号——\n\n曲文宪公，彭真；\n黄文端公，李先念；\n雍文和公，习仲勋；\n晋文敏公，薄一波\n攸文介公，谭震林；\n渭德武公，张宗逊；\n达简武公，张爱萍；\n浏定武公，王震；\n浔敬武公，杨得志；\n汀荣武公，杨成武，以及——\n\n建宁穆公，左权；\n海丰革公，彭湃；\n归善忠公，叶挺；\n确山壮公，杨靖宇；\n弋阳献公，方志敏；\n保安光公，刘志丹；\n镇平克公，彭雪枫；\n南洲渊公，段德昌；\n湘乡威公，黄公略；\n邢台绍公，董振堂。\n\n只要中华人民共和国尚存于世，这些英雄便千秋万代香火不绝。"
 china.636.a: "神州满天星。"
 china.637.t: "民族卫队进军香港"
 china.637.d: "民族卫队近日被目击跨越边境检查站，自深圳罗湖，落马洲，福田进入香港。多段视频显示，这些身着统一制服、配备轻型武装的队伍在香港多地展开定点清查与大规模拘捕行动，目标主要集中于过去参与过抗议示威、被官方列入“反政府分子”名单的个人。\n\n据现场目击者和社交媒体流传的画面显示，民族卫队已在铜锣湾、旺角和油麻地等地区设立临时封锁线，并进行住宅逐户搜查。一些民主派前成员及与本土派相关的社运人士被带离住处，消息人士称其中多人已被送往粉岭一带的临时拘留中心。在沙田，一座曾作为社会民主连线组织的办公点被查封，内部物资被移除后现场出现燃烧痕迹，但具体原因尚未得到官方确认。\n\n目前，中央政府尚无公开声明回应行动性质或目标。但多家外媒援引接近政策圈的消息人士称，此次行动已获得高层“默认”，并被视为“一次必要的整肃”。据称，被拘留人员多数为曾在2018年后活跃于街头抗议、网络发声或参与非政府组织运作的个体。部分观察人士认为，这次行动有别于传统警务执法，其规模、组织形式以及针对性使“清洗”一词更为贴切。"
 china.637.a: "看起来不太妙。"
 china.638.t: "掌握过去……"
 china.638.d: "近日，中国文化思想界的最新变化再度引起了世人的关注。许多重量级学者和政府高级官员通过新闻采访、报刊文章与座谈会等多种方式多个角度频繁对所谓的“西方历史虚无主义”展开猛烈攻击。\n\n中国知识分子的头面人物们表示，大量文献研究与考古发掘已经充分证明了中国历史的悠久与文明起源地的地位；而与之相比，过去受到大量关注的西方历史之起源，例如希腊罗马文明，要么是自古中国迁徙的原始族群在旧大陆西端定居后形成，要么就是受中华文明影响的土著酋邦渐进式传播相关知识而形成的次生级文明。然而，许多中国人更愿意相信的是，所谓辉煌灿烂的西方文明只不过是后世那些占据了全球财富和权力的资本主义权贵们攀附高枝、粉饰出身之举。\n\n于是，从希罗多德的《历史》到修昔底德的《伯罗奔尼撒战争史》，从吉本的《罗马帝国衰亡史》到汤因比的《历史研究》，大量曾被认同为史家瑰宝的西方著作被贬斥为“伪作”，遭到封禁或销毁，各类资料库网站上也再难得见它们的踪影；许多从事西方史学研究的历史学家与知识分子也遭到打击，教授的教职被撤销，即使是从事科普工作的普通学者也没严令噤声。不仅如此，在娱乐领域以外，诸多具有代表性的西方文学和科学作品也被划入了“堕落文化”领域遭到打击，又或者是被刻意修改其起源而变为中国人的原创著作。中国官方的一系列动作被人以秦朝时的“焚书坑儒”相类比，许多人不禁担忧，在改造了全中国十四亿人的思想之后，“无所不能”的中国领导人们会将目光投向何方。"
 china.638.a: "……就是掌握未来。"
