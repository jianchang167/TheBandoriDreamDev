 china.364.t: "阿富汗经济一体化已完成"
 china.364.d: "自进入21世纪以来，中国的经济增长外溢效应成为了搅动东亚乃至世界局势的重要工具。这只红色巨龙如翻江倒海般近乎重塑了新自由主义革命以来的世界经济秩序，并从未停止自身壮大的脚步。如今，中国经济扩张的下一站已揭开了其神秘的面纱。\n\n跨过兴都库什山脉，在40余年的战乱时代后，秩序似乎正重新回归“帝国坟场”阿富汗。二度执政的阿富汗塔利班集团正寻找着重塑和重塑国家的重要助力。自然而然，中阿两国，尽管之间仍有重重政治分歧的阻隔，但在经济层面已越走越近。\n\n“中国制造”殖民帝国上最后几块缺失的拼图又再度被拼上了一块。在喀布尔的街头巷尾，小商贩们骑着浙江省生产的电瓶车开始一天的生计；执勤的阿富汗士兵们口袋里揣着小米和华为牌的手机；几家外墙弹痕累累的旅舍重新挂牌营业，并附上了粗陋的中文招牌和中餐菜单。我们的大使目睹着这个内陆穷国百废待兴的景象，心满意足地向国内发挥报告，绘声绘色地描述着这一切。"
 china.364.a: "中国式生意经。"
 china.365.t: "阿富汗政府已稳定"
 china.365.d: "许多人曾担心，这个曾经特产只有圣战分子和罂粟的阿富汗迟早将会再度陷入战火之中，更别提在当地掌权的是恶名远扬的塔利班组织。中国政府内部也对接触这一曾热烈支持东突厥斯坦分裂组织的伊斯兰极端政权心怀疑虑。\n\n不过，得益于中阿两国各自的稳健派的共同努力，一个适合合作的平台或许已经得到了建立。在现任阿富汗最高领袖海巴图拉·阿洪扎达之下，塔利班统合了许多过去曾互相攻伐、自相残杀的势力，并以稳健的方式治理着这个山峦叠嶂的小国。圣战者们似乎已涤尽硝烟，或穿上教士的服装深入乡村之间，或穿上西装转型为中央政府的职员；禁止罂粟种植、恢复教育并制定新课纲、外派外交官寻求承认和稳定似乎也给未来阿富汗成为正常国家的可能附上了乐观的色彩。\n\n或许来自中东君主国的持续金援能提供物质基础，但阿富汗想要学习推行新政的政治智慧仍需要一个经验丰富的老师。中国势必将在未来的阿富汗改革中扮演更重要的角色。"
 china.365.a: "大中华的小朋友。"
 china.366.t: "阿富汗-巴基斯坦友好条约宣言"
 china.366.d: "作为与我国友谊经过了血与火考验的重要盟友，巴基斯坦除南方的印度外，最为忌惮的便是其境内以所谓的“巴基斯坦塔利班运动”为代表的恐怖主义活动了。其创始人自称受到了他们阿富汗前辈的启发，在巴基斯坦西北部的普什图人聚落中汲取力量，实力迅速膨胀，最终成长为一支拥有数万人规模、肆虐十数年之久的恐怖组织，巴基斯坦军方屡次围剿而仍无法彻底灭绝。由于其肉眼可见的紧密联系，尽管在阿富汗执政的塔利班政府屡次否认他们与“巴塔”组织有关，巴基斯坦和阿富汗两国关系仍急剧恶化，两国军队也时常在杜兰线边界爆发冲突。\n\n“巴塔”组织多年来支持东突运动和威胁中巴经济走廊的行为也令我国政府深恶痛绝。不过，近期事态已发生了可喜的转变。在和北京方面取得联络并达成初步合作后，已渐趋成熟的阿富汗塔利班政府也终于下定决心，彻底斩断与“巴塔”组织的一切联系，后者在失去了他的主要靠山后想必也将在顷刻之间衰亡，而这也为巴基斯坦的态度软化奠定了基础。同时，经过中国外交官的斡旋，巴基斯坦政府也开始转变态度，两国代表最终得以齐聚伊斯兰堡，共同签署一份具有历史意义的宣言，宣告了两国关系的正常化，为未来的合作打开了大门。"
 china.366.a: "他们终于和好了。"
 china.367.t: "就阿富汗问题与俄罗斯达成一致"
 china.367.d: "论起哪些国家带给阿富汗的伤害最大、造成的破坏最深刻，除了近二十年来在阿富汗以强大武力试图保卫其西式民主傀儡政府的美国以外，另一代表或许就是以强大武力试图保卫其社会主义傀儡政府的苏联了。无独有偶，在美军狼狈撤离阿富汗的三十多年前，长达十年的漫长治安战也令苏联苦不堪言，在当时的冷战背景下也为其意识形态敌人创造了渗透和消耗的机会，并最终为帝国的崩溃添上了一把薪柴。这一历史上的恩怨纠葛也影响着继承了苏联遗产的俄罗斯与阿富汗塔利班政府，使得二者长期以来关系冷淡，甚至于差点再度兵戎相见。\n\n作为中亚诸国难以忽视的庞然大物，俄罗斯在历史上对该地区的野心和阿富汗潜藏的伊斯兰极端主义思潮同样是造成不稳定的因素。为确保未来合作的顺利，以及为新时代的和平与繁荣提供必要条件，我们便无法在与阿富汗进行外交协商时忽略俄罗斯的意见。通过高层内部对话，我们似乎有希望让俄罗斯相信阿富汗的中立和去极端化，并确保俄罗斯放弃任何在未来武力干涉阿富汗内政的潜在计划，转而共同投身至经济合作与资源共享的事业中。"
 china.367.a: "这一切都是为了确保和平。"
 china.368.t: "就阿富汗问题与中国达成一致"
 china.368.d: "阿富汗，苏联的伤心地，内亚的麻烦制造者。塔利班上次入主喀布尔执政时的作为过于臭名昭著，以至于美国与俄国、北约与集安组织这两大对头都选择了主动搁置分歧，在打击阿富汗政权的议程中通力合作，几近将圣战者们彻底绞杀。然而，一切早已今非昔比。过去十数年来在阿富汗作威作福的美国大兵已乘C17运输机灰溜溜地离开了此地，在其身后早已土崩瓦解的伊斯兰共和国政权被塔利班二度取代。而当我们正满怀不安地注视着新成立的阿富汗伊斯兰酋长国时，中国，这个中亚大博弈的新玩家，为我们抛出了入局阿富汗的橄榄枝。\n\n据我们乐观的中国朋友所言，阿富汗的国内市场毫无疑问是个“蓝海”；其贫瘠的农业、脆弱的工业毫无疑问意味着无数的开发和投资机会。依靠中国的资金与人员、俄罗斯的技术和能源，阿富汗经济的腾飞将得到保证，并在短时间内给予丰厚回馈。\n\n当然，这一切都将建立在阿富汗的中立化、去极端化，以及包括我国在内的周边大国解除对阿封锁和监控的基础上。也许仍会有人对阿富汗的安全稳定与营商环境抱有疑虑，而确定阿富汗的合作诚意目前也难以确定，支持这一方案的一派乐观地认为，这一切都将在未来的合作中得到解决。"
 china.368.a: "我们产品的新市场？听起来不错。"
 china.369.t: "阿富汗中国企业自由度问题"
 china.369.d: "我国企业目前仍在阿富汗高歌猛进，势如破竹般地抢占市场。然而些许不快已开始在阿富汗各界酝酿，逐渐汇集到了中国驻喀布尔大使馆的走廊中，最终演变为大使桌前的抱怨。从高级官吏到教士，从市井小民到新近才恢复元气的中产阶级，针对中国企业的抗议之声一时间令我国外交官有些措手不及。我国企业家的开拓精神固然可敬，但有些时候，开拓精神也意味着”鲁莽“与”唯利是图“，而这也正是导致中阿民间矛盾呈现激化之势的罪魁祸首。\n\n对中国商人和员工过度消费扰乱市场价格和秩序，不尊重阿富汗文化与伊斯兰习俗、尤其是不尊重阿富汗女性，频繁与阿富汗本地居民爆发冲突的投诉令中阿两国官员疲于应付，而与此同时，更多问题和压力也自上层传递了下来。塔利班高层对中国人带来的重商主义和世俗影响感到忧心，认为这将潜移默化改变阿富汗老百姓的价值观；许多阿富汗年轻人被中国的发达所吸引，极有可能造成人口单方面流动和永久流失；阿富汗农村地区占绝对优势的保守派对中国人愈发不加掩饰的商业活动感到恐惧和厌恶……\n\n归根结底，我们是否要对在阿中资的行事范围与自由度作出明确规定和限制？最后的决定将是……"
 china.369.a: "我们的企业将能够自由地做生意！"
 china.369.b: "他们当然会好好配合阿富汗政府的……"
 china.370.t: "中国-阿富汗友好合作协定"
 china.370.d: "天色渐晚，但阿格城堡仍灯火通明，在新修建的喀布尔新城区中显得分外亮眼。宴会厅内觥筹交错，黄金吊灯和装有各色无酒精饮料的水晶杯交相辉映。丰盛无比的各色菜肴摆放在当地有名的羊毛编织地毯上，既有阿富汗传统的烤肉串和烤馕，也有明显出自中国厨子的北京烤鸭可供享用。食客们坐在垫子上，围成大大小小的数圈会餐，气氛友好热烈。\n\n随着宴会气氛达到高潮，中国大使举起盛有葡萄汁的水晶杯，对坐在主位的阿富汗总理致意，并说道：“我提议为两国领导人新近签署的中阿友好合作协议干杯！同时，我也谨代表中国政府对为会谈作出重大贡献的总理阁下表示感谢，期待这份协议成为新时代中阿关系的基石！”\n\n满面春风的总理也跟着举杯，热情地回应道：“我国最高领袖也委托我向大使阁下表示感谢！中国是一个伟大的邻国和友邦，相信未来两国能够进一步加深合作和友谊！”宴会厅内此起彼伏的欢呼声和碰杯声响彻许久。\n\n中阿两国的官员们也有理由为自己的成就相互祝贺和干杯。对中国而言，协议的签署意味着赢得了一个近4000万人口、潜力无限的市场；同时还借机拔除了毒害西北许久的东突组织残余，并将阿富汗纳入其东协合作体系之中；对阿富汗塔利班而言，这代表经过数十年的动荡，阿富汗终于重新回归国际社会，并得以在相当长的一段时间内依靠地区强国的力量，期冀于有朝一日重现亚洲中心之国的辉煌。"
 china.370.a: "更多的新伙伴！"
 china.371.t: "阿富汗取消所有协定"
 china.371.d: "自19世纪以来便一直是阿富汗最高统治者官邸的阿格城堡曾招待过无数政客名流、一方豪强、统兵大将与富商巨贾，也曾见证过许多失败者在争夺权力桂冠的斗争中狼狈退场，在不光彩的落幕中结束自己的表演。\n\n在用彩色大理石和琉璃瓦装饰的会议厅，在那几张国王、总统、部长和将军们曾落座的沙发上，中国大使正徒劳地尝试挽回坐在对面的阿富汗人的希望，然而，他的失败已是注定。中阿关系的破裂并非一朝一夕之功。在政治、经济、文化等多个领域，中国人与阿富汗人或许已经证明了两者就像油和水一样无法兼容，并且很难说究竟是阿富汗人的固步自封还是中国人的傲慢自大需对此负更大责任。\n\n阿富汗总理用手势打断了大使的进一步恳求。这位须发花白的老人，其胡子末梢正因痛苦而颤抖。他摘下眼镜，叹了口气后缓缓道来，“大使阁下，你我都很清楚，我们的最高领袖所做的决定是不容更改的。或许中国的强盛无法使您的同胞理解阿富汗人的骄傲与敏感的自尊心。这片土地英国人来过，俄国人来过，美国人来过；阿富汗人流尽了血才把他们请出了我们的祖国，但我们再也经受不起十四亿人了。”他重新戴上眼镜，紧紧盯着坐在对面的大使，“我们想要和平，也想要活下去的机会。但我们不会以必须亲吻别人的靴子为代价换回这些。您可以把这句话带回给你的主席。”语毕，总理便从沙发上起身，剩余的阿富汗人也鱼贯离开了会议厅。\n\n大使仍然呆坐在原位，静静地咀嚼着总理的结束语，品味着自己的失败。他为中国在阿富汗苦心经营多年的一切短短几秒钟便化为泡影。他不知道该如何带着失败回国复命，也不知道该如何说服那个曾为中阿关系奔走奋斗过的自己。"
 china.371.a: "机遇尽失，钱钱尽失……"
 china.501.t: "西北局势失控"
 china.501.d: "解放军当然不希望在台海战争失败后遭受更多的羞辱，但如今将军们最可怕的噩梦变成了现实。虽然声称有能力镇压任何叛军部队，但新疆领导层辜负了党和人民的期望，让精锐部队在一次又一次的战斗中被打败，最终导致东突厥斯坦叛军控制了乌鲁木齐，而他们所做的只是畏缩在他的办公室里，并在叛军部队逼近城市时乘飞机逃离新疆。\n\n我们没有太多选择。维吾尔族恐怖分子现在住在党建造的房屋里，而哈萨克族、柯尔克孜族、塔吉克族和汉族人民正在被剥夺他们合法的财产，乘坐着装满饱经风霜的老人和冻伤儿童的车辆向东逃离。我们绝不能允许伊斯兰疯子撕掉我们祖国的另一块土地，并杀害更多我们忠诚的公民，而因此解放军正在新疆边缘地区集结。他们刚刚烧毁了橄榄枝，但我们将烧毁他们的希望——命令很明确，在自治区内，只能有五星红旗矗立。\n\n叛乱将被钢铁淹没。"
 china.501.a: "“劝君更尽一杯酒，西出阳关无故人。”"
 PRC_area_in_chaos_state_modifier: "混乱地区"
 PRC_SOV_death_from_the_sky_idea: "死从天降"
 PRC_drone_supplies_to_russia_idea: "无人机支援俄罗斯"
 PRC_drones_for_russia_tt: "§Y该国家精神将在战争结束后消失§!。"
 china.372.t: "战争之王"
 china.372.d: "如果说火炮是19世纪的战争女皇，而坦克统治了20世纪的战场，那么到了21世纪，无疑会有许多人将新的战争之王桂冠颁给无人机。自诞生以来，它们便天生适合应用于军事领域，其灵活、低成本、无人力消耗等特性在鲜血比黄金还宝贵的战场上自然会得到分外青睐。在美国人将无人机投放到中东和阿富汗的低烈度剿匪作战中后，无人机开始越造越大，越造越贵。然而有时候，比起那些硕大的“恐龙”，小巧的、有时甚至并非为战场而生的“蜜蜂”也能发挥致命的作用。\n\n当我们把目光那些在第聂伯河上空穿梭飞行的无人机时，值得注意的便是它们的零件大多都打着一家公司的商标——总部位于中国深圳的大疆创新科技有限公司。不光是大疆无人机在俄乌战场的投放密度令人惊叹，其种类之五花八门与被士兵们开发的新用途之多更令人瞠目结舌。过去负责送快递的无人机现在负责在敌方士兵的头顶投放炸弹，曾经被遥控拍下许多壮丽美景的无人机现在拍下的则是戒备森严的军事基地、后勤仓库和行军队伍。\n\n过去关于中国无人机“不安全”、“泄露用户数据”的批评已是老生常谈，而如今，“支持俄罗斯侵略战争”与“盗取情报”两条指控也顺势扣了上来。当人们在各种场合带着或好奇或批判的语气询问大疆总裁对自己的产品被用在东欧战场上的感想，后者永远会首先强调“产品用户决策与蔽企业无关”，并且他们对发生在千里之外欧洲的战争“不感兴趣”，同时全过程必然会配上令人挑不出破绽的茫然夹杂无辜的表情。"
 china.372.a: "“中国制造”，不止洗衣机和电磁炉。"
 PRC_HU_CHUNHUA_DESC: "自曾任共青团负责人的胡耀邦出任总书记以来，有着类似出身和履历的中共政治家们便如雨后春笋般涌现，并被称为“团派”，其中取得最大成就和最有代表性的便是前任国家主席胡锦涛和国务院总理李克强。“团派”出身平民阶层、普遍年轻等共同点使其在壁垒森严的中国政坛上分外引人注目，且常常被民众或同僚寄托了带来革新的期待。目前其在最高领导层中最显赫的领军人物便是胡春华。\n\n生于1963年4月的胡春华正好乘上了改革开放的东风，从湖北省群山之间升入中国最高学府北京大学，改变了自己的人生轨迹。其毕业后毅然决然奔赴西藏参与现代化建设的选择令他在全国小有名气。之后数十年，人们津津乐道的是他如何学习自己当时的上司，之后成为全中国最高领导人的胡锦涛，从共青团西藏区委一步步晋升，在担任团中央第一书记历任多个地方的一把手。2012年，时年49岁的胡春华成为了当时最年轻的中央政治局委员，拿到了通往最高宝座的门票。\n\n但自此之后，情形便急转直下。新上任的总书记习近平不喜欢他们这些年轻的暴发户。针对共青团已经成为了一个脱离实际的政治俱乐部等一系列指控给胡春华的仕途蒙上了阴影。随后，他也只得眼睁睁地目睹自己的许多同志或是被边缘化或是被指控腐败后清洗。在国务院副总理的现任职务上，胡也越发谨小慎微，只是在其分管的农业和扶贫领域卖力工作。但或许人们曾期待的那个能给中国带来变革的年轻人只是在在等一个凤凰涅槃的机会。而现在，机会已经来了。"
 PRC_LI_ZUOCHENG_DESC: "当年轻的李作成连长在弥漫着湿热瘴气的越南群山中，捂着自己被子弹打穿、血流不止的右臂，带领弟兄们冲锋陷阵夺下一个又一个越军阵地时，他绝不会想得到几十年后，其本人将站在200万人民解放军军人的巅峰，掌握着难以想象的权力和威势。\n\n生于湖南省一普通农民家庭的李作成或许是命中注定加入人民解放军，他的父亲曾是一位在朝鲜战场上和美国佬拼杀的志愿军英雄，而儿子的军旅生涯也并未辱没父亲的荣耀，甚至有青出于蓝而胜于蓝之势。然而，尽管自年轻时便享有战斗英雄的荣耀，但在之后漫长的和平岁月之中，当解放军的锐气日渐消磨，成为党所管辖的又一台臃肿的官僚机器时，李作成发现自己似乎已不再被需要，甚至因疏于打点人脉关系而仕途受阻长达十年。\n\n直到2012年之后，一切就又发生变化。习近平的反腐运动带来了军队内部的大洗牌，也促使过去被冷落许久的边缘化将领们再次得到了机会。从成都军区司令员到陆军司令员，再到联合参谋长，李作成以其彪炳战功和正直的名声成为了习军改计划的核心之一，解放军在他手上脱胎换骨，变得更加强大且令人生畏。回首自己的军事生涯，在欣慰与满足之余，不知李作成是否还会期待着在晚年再一次发挥自己作为军人的本色，带领千军万马实现不朽功勋。"
 PRC_WANG_YANG_DESC: "出生于1955年3月的汪洋，其原生家庭即使放在当时还算穷国的中国也可算得上是凄惨。困窘曾使得年轻的汪洋不得不成为一名掏粪工以补贴家用。在高中辍学进入食品厂工作后，勤快且脑子机灵的汪洋很快便脱颖而出，而就在他得到当地行署副专员赏识并成为后者的女婿后，其未来便大大超过了一名普通工人所能达到的上限，而是向政界进军，并取得了难以想象的成就。\n\n在改革开放事业差点陷入停滞的1991年，时任安徽省铜陵市市长，堪称人微言轻的汪洋大胆地发出公开号召，“历史不允许我们躺在计划经济上酣睡了。必须解放思想，向一切僵化、陈腐、封闭的思想观念开刀”。这一宣言也为他赢得当时正费尽苦心继续推进改革事业的中国最高领导人邓小平的赏识。此后，中国的改革事业加速前进，汪洋的仕途升迁也步入快车道。汪洋展现的实干作风和创新思维为他赢得了越来越多的拥趸，并逐渐被视为改革派和党内自由主义者们的精神领袖。\n\n被寄予了多种多样期待的汪洋在担任五年国务院副总理后正式成为了中国最有权力的七人之一，担任全国政协主席。对中共来说，他是统一战线工作的最高负责人；对中共之外中国其他几个地位有些尴尬的民主党派来说，汪洋是他们的保护神。此后，历经千难险阻，昔日的工人小子如今已登上中国权力巅峰，当未来更加辉煌而前路也更加凶险之时，汪洋的下一步将牵动着亿万人的命运。"
 PRC_belt_and_road_initiative_non_cen: "一带一路倡议扩张"
 PRC_belt_and_road_initiative_non_cen_desc: "黄沙中的驼铃响彻新丝路，远洋的货轮绘制新时代的脉搏。我们铺设的不仅是公路与铁路，而是企业的血脉与规则的牵系。友谊的旗帜高举，市场的律动无声渗透。是谁在欧亚心脏种下了经济增长的种子，又是谁将自由贸易的网线织成大局？\n\n外界在争论“一带一路”是桥梁还是陷阱，而我们只是继续前行。"
 PRC_trade_deals_in_africa_non_cen: "非洲贸易协定"
 PRC_trade_deals_in_africa_non_cen_desc: "当不同肤色的手掌相握，我们的目光已越过矿藏与港口。我们输出的不仅是基建与资金，更是规则、标准与机会。非洲的资源在流动，而我们输送的，是改变世界经济地图的方向盘。\n\n人们说这是援助，是投资，是命运共同体。这场没有殖民印记的合作，正逐步重塑世界经济格局。"
 china.373.t: "《哪吒2》冲击"
 china.373.d: "中国电影在国际影坛上似乎一直处在缺位的状态。自《末代皇帝》、《无间道》、《卧虎藏龙》的辉煌之后，再没有一部中国电影真正拥有过世界级的知名度。然而，一部横空出世的电影打破了人们对中国电影的刻板印象，而且还仅仅是一部3D动画片。\n\n在2019年小有名气的前作上映数年之后，由其原班人马打造的《哪吒之魔童闹海》于春节档上映。这部主角和故事主线脱胎于在中国民间人尽皆知的神话传奇——哪吒三太子——的奇幻喜剧片，一经放送便在口碑与票房等方面取得了巨大成功。观众们惊叹于其动画制作技术之突飞猛进，人物之栩栩如生，故事之跌宕起伏、扣人心弦。不仅如此，电影制片人们大胆创新为古老的角色和故事融入的现代精神内核，如友情、自由、反叛精神等，更加深了与观众的情感共鸣。\n\n一场场爆满的影院显示出这部电影的过硬质量，《哪吒2》在极短时间内便超越多部大片，成为中国内地票房最高的电影。如同一颗石子投入平静的湖面泛起阵阵涟漪一般，引得世界各地的发行商争先恐后地宣布引进该片。从新加坡到西雅图，世界各地的华人华侨们为《哪吒2》送上了极高的评价。而与前作影响力集中于华人圈子内部不同的是，经过包括Tikok 、小红书等社交媒体平台的传播效应，许多原先对中国神话一无所知的人也被吸引着走进了电影院，并在最后成为了哪吒太子的粉丝。尽管有人评价此片的巨大成功受到了中国“民族主义情绪的过热助推”，《哪吒2》仍被广泛认为是中国和非好莱坞电影的一座里程碑，向人们展示了中国动画电影行业的未来所在。"
 china.373.a: "我命由我不由天！"
 PRC_military_industries_renewal: "军工复兴"
 PRC_military_industries_renewal_desc: "中华民族的真正复兴与改革的重生需要强大的军队保驾护航，而没有完善的国防工业，军队就如同被抽空了血管的人一样，难以履行保护国家的任务。"
 PRC_encourage_digitalization_nat: "鼓励数字化"
 PRC_encourage_digitalization_nat_desc: "我们将全方位推进社会的数字化改造，构建全民统一数字身份系统，实现从出生到死亡全生命周期数据监控、行为预测与价值判断。一切行为皆留痕，一切数据皆归一，一切生活皆可分析。"
 PRC_eternal_union_of_army_and_state: "军国永远一体"
 PRC_eternal_union_of_army_and_state_desc: "人民解放军自成立之初，便肩负起保卫国家和人民的重任。每一位军人，不论男女，都必须牢记自己战斗的真正原因。他们的使命是为了保护。保护这片土地，保护他们的家人。武装力量是国家的一种工具，是国家用以自我主张的武器，只有在不可避免的情况下才会被使用。"
