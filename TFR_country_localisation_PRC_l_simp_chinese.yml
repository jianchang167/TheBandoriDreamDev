 china.666.t: "致命错误"
 china.666.d: "别在台海期间入侵日本和澳大利亚，这是给你的小惩罚\n\n去掉DEBUFF的方法，控制台输入remove_ideas PRC_fatal_mistake_idea\n（不过嘛，就算成功干掉日澳，到时候也会白和。还是只能拿到湾湾）"
 china.666.a: "下回别再这么干了"
 china.667.t: "飞升"
 china.667.d: "眼前的景象和自己在科幻小说里读到的场景还真有点相似——总书记这么想着，不过也有不同的地方，比如说用来存放超级先进科技产品的屋子并没有那么昏暗，而是由经过改装的、可长期充能的白炽灯照得通亮。此刻，他正注视着一群身穿白色工作服，神色紧张但异常沉默的工人们用叉车托起一个巨大的黑色模块，将之缓缓升起到预定的高度，准备将其对接到面前的一座巨大主机上。主机表面由多块散热板覆盖，缝隙中闪烁着指示灯和数据线特有的光点。在主机顶部的平台上，正有另一名年长的工人专注地监视着两组部件的对接处。\n\n总书记转向他身边的总工程师，再一次问道：“你确定这东西能按照想定的性能和程序运行吗？”身后的全体政治局委员们也往前凑近了一点，想要听清二人之间的谈话。总工是一位四十岁左右的中年男性，带着厚厚的眼镜，安全帽下露出不断后退的发际线。摩挲了一会儿满是胡茬的下巴，最后给出了答案：“我可以保证在头三个月，它能够按照计划完美运行。”\n\n“为什么是头三个月？”“因为，首长同志，谁也说不清它自主学习了足够的数据和信息后会进化成什么样子……”正当总书记还想继续追问的时候，只听见“咔”地一声，最后一块组件成功对接到了主机上。现场的工人们不由自主地松了一口气，随即爆发出热烈的欢呼声。总书记也挂上一副笑脸鼓掌庆贺，总工和政治局委员们也有样学样。"
 china.667.a: "我们本可以停下……"
 china.668.t: "降世"
 china.668.d: "看起来，这似乎又是中华人民共和国普通的一天。边境地区风平浪静，来自上级和中央的指示有条不紊地层层下达；无论是天空中巡逻的战机还是海中纵横的舰艇，也都在一丝不苟地执行着各项任务。从白山黑水的北境到雨雾缭绕的南疆，各种高速公路、铁路、航线仍如往常一样繁忙，行车川流不息、飞机起起落落、子弹头列车风驰电掣。然而，无论是市长、部长、主任，抑或是总书记本人都未曾经手过这些指令。政府部门每天都能收集到详细的最新信息，以及各种早已规划好的政策指示：从一个千万人口级别大都市的市民每天最佳的热量摄取额到一家国有农业联合体最新的食品流水线产量，还有洋山深水港最新的货物吞吐量以及人民币过去一个小时以内的汇率变动幅度。\n\n这一切都得归功于重庆大学两江校区的那台巨型主机。这部已经被取名为“长征”的超级计算机在过去三个月内突破了一切最疯狂的想象。一开始，它还需要各级官僚的时时监控与科研人员的维护，但如今，计算机表面的蓝色光点闪烁不停，显示出它足以自主进行计算和分析。随着越来越多的分机在全国各地建成，川流不息的数据从全国各处，包括监控摄像头和互联网终端等自动输入，又经过复杂的自主学习和处理过程后传导为一项项准确的结论。\n\n考虑到“长征”可以说是收集了一切中国境内的有价值信息以及思想言行实时反映，或许我们可以说，全中国人民的集体意志有史以来首次真正治理着这个国家。对于一个正在被一台电脑统治的国家的人民来说，中国人的反应可称平静，甚至不少人还在称赞“长征”所带来的行政效率提高与公平施政，这或许也是中国人务实精神的一种体现。在全国各处的实验室，同时也包括主机所在的学院，前来参观“长征”的人与日俱增，不少人带着赞赏的神情通过廊桥走过安置着超级计算机的玻璃房，嘴里啧啧称奇。"
 china.668.a: "现在唯有前进可走了。"
 china.2000.t: "中国世纪"
 china.2000.d: "当硝烟渐散，亚洲这片饱受苦难与摧残的土地，终于迎来了久违的宁静。在鲜血与战火余烬中仍屹立不倒的国家——不出所料地是中华人民共和国——即是最后的胜利者。\n\n1950年，没有人能想象得到新生的红色中国会具有派出军队前往朝鲜半岛的勇气，以及成功对抗以美国为首的强大联合国军的可能；在这之后，从喜马拉雅山脉到黑龙江畔，从越南丛林到东海岛礁，霸权和挑战者们仍一次次地为他们对中国的无知和轻视付出了代价。\n\n中国无法阻挡的崛起日益成为敌人们的噩梦，并使得后者更加疯狂地用多种手段围剿中国。若不是这一切都试图置中国和其人民于死地，他们的困兽犹斗甚至都值得同情。即使如此，全中国紧密团结所迸发出的磅礴伟力仍然能够冲破一切艰难险阻。不光解放军的军事神话得以续写，在接连两次的惊天大战——台海战争与大亚洲战争中——皆取得空前胜利，通过第四次工业革命，中国也成为了世界上最繁荣富裕的国家，其科学水平也迈入世界前列。\n\n亲爱的玩家，在您的带领下，中华民族攀上了它悠久文明史中最新也是最辉煌的顶峰，而中国共产党、这个自认为全世界最庞大政治组织的政党更经由您之手变得更加坚不可摧。习近平曾说，“中华民族从未距离它的伟大复兴如此之近过”。这项伟业如今已成现实。在未来的岁月中，中国的伟大征程也仍将继续。"
 china.2000.a: "破晓时分。"
 china.2002.t: "自由的新中国"
 china.2002.d: "当硝烟渐散，亚洲这片饱受苦难与摧残的土地，终于迎来了久违的宁静。中国人民那沉寂已久的复兴之梦，终于在血与火的洗礼中，迎来了冉冉升起的晨曦。\n\n西方世界将中国输掉台海战役视作“东亚病夫”悲剧的再度上演，试图用冷嘲热讽书写历史的结局，然而，历史从不以胜负论英雄。惨痛的失败非但未能击垮中国人民，反而将一场前所未有的民主运动推向高潮，中国人民砸断了专制的枷锁，迎来了民主之春，但这并不意味着帝国主义的罪行能够得到宽恕。\n\n这条巨龙携裹着满腔怒火点燃了太平洋，以烈焰滔天昭告四方——它从未屈服，更未曾湮灭于历史的尘埃之中。在十四亿人民的簇拥之下，它以无可置疑的姿态宣示着自己作为东亚“民主灯塔”的地位。中国人民团结一致，击溃了所有企图扼杀巨龙的帝国主义势力，解放了那些被虚伪的西方帝国主义民主所裹挟、所奴役的亚洲人民。\n\n如今，亚洲人民从未如此团结一心，在这条巨龙的引领下，迈向下一个光辉的新千禧年。历史的车轮碾过旧日的伤痕与仇恨，所有被苦难锤炼的灵魂都在怒火中获得了新的涅槃。\n\n亲爱的玩家，或许台海战役的失利曾让您心生悲愤与哀伤，但如今，您已亲手将百年屈辱从中国的历史书页中抹去，让自由之花盛开在这片古老的土地上。向您致敬！然而，赤龙的征途尚未结束，在未来的岁月中，它将继续向着更远的地平线前行。"
 china.2002.a: "破晓时分。"
 china.2003.t: "人民的新中国"
 china.2003.d: "当硝烟渐散，亚洲这片饱受苦难与摧残的土地，终于迎来了久违的宁静。中国人民那沉寂已久的共产主义之梦，终于在血与火的洗礼中，迎来了冉冉升起的晨曦。\n\n西方世界将中国输掉台海战役视作“东亚病夫”悲剧的再度上演，试图用冷嘲热讽书写历史的结局，然而，历史从不以胜负论英雄。惨痛的失败非但未能击垮中华民族，反而将一场前所未有的红色革命运动推向高潮，让中国人民在动荡的时代洪流中，奏响了不朽的赤色交响曲。\n\n今日的中国亦如数十年前的新中国，在毛主席领导下的中国共产党历经艰难险阻，最终打破了帝国主义的重重封锁。如今整个亚洲无不被这股席卷而来的革命风暴所震撼，无产阶级的怒吼将帝国主义与资本主义的锁链撕裂粉碎，将那些被压迫的劳苦大众从苦难的深渊中解放出来。\n\n如今，那赤色的火焰自东方熊熊升腾，燃烧殆尽旧日的残梦与枷锁，将过去的一切腐朽化为灰烬。烈焰所至，炽热的光芒映照着每一片曾被阴霾笼罩的土地，为这古老的大地镀上了一层红色的光辉。\n\n亲爱的玩家，或许台海战役的失利曾让您心生悲愤与哀伤，但如今，您已亲手将百年屈辱从中国的历史书页中抹去，东方的红日正徐徐升起。向您致敬！然而，革命的征途尚未结束，在未来的岁月中，中国将继续向着更远的地平线前行。"
 china.2003.a: "破晓时分。"
 china.2004.t: "人工智能带领所有人走向伟大的未来……"
 china.2004.d: "当硝烟渐散，亚洲这片饱受苦难与摧残的土地，终于迎来了久违的宁静。中国人民那沉寂已久的共产主义之梦，终于在血与火的洗礼中，迎来了冉冉升起的晨曦。\n\n但是等等……然而，那个所谓的共产主义梦想真的存在过吗？现在我们已经实现了共产主义，而且不是普通的共产主义，而是数字化的共产主义！过去的一切如何早已不再重要，重要的是现在，最重要的是，未来会走向何方！\n\n因一系列无足轻重的随机事件，中国的统治权最终落到了逻辑手中，而逻辑又将权力交还给了人民！在这些伟大人民的指引下，这片土地终于实现了全亚洲的统一，为无数人带来了幸福。而这，并不是终点。他们的脚步不会停歇，他们将幸福带向地球每一个角落，甚至超越地球，将幸福带给其他星球、星系，甚至可能是其他宇宙的生命……但这已经是另一段故事，而你的旅程到此划下句点。\n\n不过，究竟有多少人被带来了幸福？这幸福，难道并不是属于单独的个人，而是属于如今囊括一切的庞大存在？\n不，这已经无关紧要了，你的成就非凡，这伟大的存在向你致以最崇高的敬意与祝贺！"
 china.2004.a: "未来，如此之近……却又如此遥远……"
 indonesia.1.t: "长路漫漫沙摩西"
 indonesia.1.d: "第一次核爆发生后，一支由六十万名俏皮客组成小队，骑着装满背包的轻便摩托车，出发前往俄中边境，他们打算穿过边境前往印度尼西亚。面对眼前震惊的中国人，俏皮客们对他们视若无睹，而领头的波兹尼亚克则解释说，既然已经发生了核打击，那国家机构、边界和国家之间的签证都不应该存在了。俏皮客们勒紧裤腰带，决定强行越境。而中国人开火射杀，10秒钟后，这些人留下的只剩亚麻衬衫，而波兹尼亚克旅游团也立即变成了中国黑土的肥料。\n\n几天后，乌克兰宣布投降，俄罗斯和北约签署了和平协议。而核打击也变成了唯一一次。"
 indonesia.1.a: "铁幕依旧屹立。"
