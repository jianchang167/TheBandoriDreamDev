 PRC_science_anti_technocratic_movement_dynamic_changes_tt: "基础影响力：该运动以§Y5%§!的基础§R增长速率§!开始，并会额外生成一个§Y藏匿点§!（如果未被§Y阻止§!）。\n积极镇压：如果国家当前正在§Y采取行动对抗该运动§!，则该运动的§R增长速率§!将额外增加§Y10%§!，并且会为该运动创建一个新的§Y藏匿点§!（如果未被§Y阻止§!）。\n派系忠诚度影响：如果两个主要派系（§Y国安部和科学家§!）彼此之间的§Y忠诚度§!较低（低于§Y50%§!），则该运动会获得额外影响力。\n藏匿点乘数：该运动的总§R增长速率§!会乘以其§Y藏匿点§!数量（最多为 5 个）。\n最终调整：在考虑§Y藏匿点§!之后，§R增长速率§!会减半，以平衡总体增长。"
