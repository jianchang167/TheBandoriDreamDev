 PRC_nick_land_bop: "未来思想方向"
 PRC_ccru_side: "控制论文化研究小组"
 PRC_nrx_side: "新反动运动"
 PRC_balance_range_nl: "奇点迫近"
 china.58.t: "北京政府统一中国"
 PRC_suppress_dissent: "压制异议"
 PRC_suppress_dissent_desc: "所谓的自由与民主，已被反动派利用为煽动混乱的旗帜，在全国各地，反革命势力乘机煽动暴乱，制造动荡，妄图颠覆人民政权，毁灭共和国的未来。如果我们仍心存侥幸，仍寄希望于说服和妥协，那广大革命先烈用鲜血创造出来的中华人民共和国的前途和命运，就面临着严重的威胁。对此，我们必须以雷霆手段迅速粉碎一切反动势力，坚定压制一切异议。"
 PRC_increase_pla_representation_in_the_npc: "提高解放军在人大的代表人数"
 PRC_increase_pla_representation_in_the_npc_desc: "过去的混乱证明，当动荡蔓延，唯有军人、真正的战士，才能迅速作出决断，坚决执行任务，维系国家机器的正常运转。文官治国在和平时期尚可容忍，在危局面前却暴露出效率低、立场软等种种弊端。我们必须正视这一制度缺陷，并着手提高解放军及武警部队在人大代表中的比例，确保在关键决策中，军人能够更好的发表自己的观点。"
 PRC_increase_the_power_of_officers: "军官新机遇"
 PRC_increase_the_power_of_officers_desc: "党政体系的稳定与否，取决于谁在主导；而主导的权力，必须握在忠诚可靠、纪律严明的军官手中。当前局势要求我们进一步扩大军官在地方政府、核心企事业单位的比例。军官不是只懂军事的人，他们更是政治可靠、行动果断、组织严密的国家中坚。通过让他们进入治理体系核心，我们能够借此削弱一切消极怠政、阳奉阴违、不听指挥的文官干扰。"
 PRC_empower_theater_commands: "赋权战区指挥官"
 PRC_empower_theater_commands_desc: "过去的体制过于僵化，战区指挥官往往只能局限于军事事务，面对地方政府的配合不力、执行拖延，甚至在关键时刻出现地方官员阳奉阴违、推诿责任的现象，严重损害了国家安全与社会稳定的统筹效率。为此，我们必须作出彻底调整，战区指挥官将拥有对所在战区内省级政府事务的干涉与指令权，在涉及国家安全与战时准备等关键问题上，地方必须服从战区指挥官的统一部署。"
 PRC_citizen_militarization: "全民军事化"
 PRC_citizen_militarization_desc: "国家不能再把“军事”当作专业部门的事。每一个中国人都必须具备基本的动员能力、应战意识和政治忠诚。中小学将恢复军训常态化，大学将设立强制军事岗前教育，所有劳动密集型企业将定期组织员工进行战时转岗训练。政府各部门设有战时指挥链，所有城市基层单位建立“战备名单”。不再有“平民”这个概念，只有“士兵”，如今我们需要的是一触即发的社会动员能力，而不是在和平中麻痹意志的群众。"
 PRC_party_controlled_by_the_pla: "枪指挥党"
 PRC_party_controlled_by_the_pla_desc: "枪杆子从来就不是摆设，它是国家权力的最后保障，是秩序崩塌时唯一能站稳的支柱。在现实面前我们必须承认：当党内分歧激烈、行政系统失控时，只有军队具备足够的纪律、效率，能够迅速接管局势，恢复秩序，保全国家。我们将建立常态化的军政应急机制，确保在出现重大政治混乱或地方党委失效的情况下，战区指挥机关可以临时接管行政与党务指挥权，维持政治统一和社会稳定。"
 PRC_the_hero_state: "英烈之国"
 PRC_the_hero_state_desc: "我国的历史是由英烈用生命铸就，他们的牺牲不是历史，而是现在鲜血铸成的共和国的基业。我们要把对烈士的信仰变成全民意识形态。谁亵渎烈士，就是亵渎国家根基；谁质疑烈士牺牲的正义性，就是在动摇人民政权。我们不是一个靠谈判存活的国家，我们是一个靠死亡与流血赢下的国家。全国每一个人，都要知道自己活着，是因为别人替他们牺牲；知道什么叫代价，才知道什么叫忠诚。"
 PRC_new_production_and_construction_corps: "新生产建设兵团"
 PRC_new_production_and_construction_corps_desc: "在新形势下，我们需要一支不只是能打仗、更能建国家的力量。对此我们将建立新的生产建设兵团制度，兵团将直接归属中央军委领导，驻扎在战略边疆、重点资源区和潜在动荡地区。他们不仅承担基础设施建设、资源开采、人口安置任务，更要在必要时承担维稳和区域军事压制功能。一旦国家进入紧急状态，兵团将成为“区域接管者”——替代失效的地方政权，确保国家权力不坍塌一寸。"
 PRC_civic_military_cooperation: "军民合作"
 PRC_civic_military_cooperation_desc: "士兵接受的训练不仅锻造了他们的身体与意志，更塑造了他们对组织、纪律、牺牲和责任的深刻理解。正因如此，退役军人往往在地方治理，基层动员等领域展现出极强的执行力与凝聚力。在当前国家强化秩序的关键阶段，我们要把这股力量真正统合起来，打通军与民之间的制度壁垒，形成无缝衔接的国家运行模型。在新的政策下，民用领域的科研成果将更快速、更精准地转化为军事技术储备；而部队中积累的高精尖能力，也将源源不断地注入民用航天、灾害预警等领域。大量拥有实战经验与组织能力的军官也将会陆续陆续加入各个国家战略团队，推动各系统转型提效。"
 PRC_stop_the_factionalism: "消灭派系斗争"
 PRC_stop_the_factionalism_desc: "没有任何一支军队可以在分裂中前进，同理，没有任何一个国家可以在派系对抗中完成现代化建设。派系主义是共和国制度内部最具腐蚀力的毒素，它破坏组织纯度，延迟决策效率，制造忠诚分裂，最终将整个政治体制拖入低效与相互猜忌的泥潭。在今天的军队与党政机关中，仍潜伏着各种历史遗留的派系斗争与利益网络。他们或以地域为纽带，或以旧人旧事为联结，在干部任用、资源调配中形成变相分裂的系统性对抗，这种现象应当必须被彻底清除，任何违反者将不再警告，直接降级、清算、开除、监禁。"
 PRC_party_under_control_of_the_guiding_hand: "指导大手下的党"
 PRC_party_under_control_of_the_guiding_hand_desc: "党中央不是协调委员会，也不是名义上的象征机构，它是国家方向的唯一制定者，是国家意志的原始源头。在共和国走向重建的关键时刻，国家主席必须以压倒性权威彻底接管党内指导机制，清除组织惰性与路线摇摆，让党重新回归唯一正确的声音。过去的几十年里，“集体领导”形式日益空洞，党中央已经沦为各级利益群体的掩体，共产党的名义被反复使用，但其实权却被反复架空。这种局面必须终结，党中央之下，不应再有另一个声音，不应再有平行权威。党组织从中央到支部，都必须直接向主席负责，所有政策、所有人事必须逐级执行，逐级回应。"
 PRC_the_organic_history: "有机历史"
 PRC_the_organic_history_desc: "对我们而言，中国五千年的历史是一种连贯的权力结构，是从皇权到人民政权、从分裂到统一、从屈辱到崛起的一条连续路径。所谓“历史多元”实质上是意识形态的多头寄生，是将民族认知引入分裂的前奏。一个国家不能有两套历史叙事，不能让敌对意识形态在校园、图书馆、媒体中塑造另一种民族记忆。我们必须确立有机的历史模型，使得每一个朝代的兴亡、每一次战争的胜负、每一位领袖的言行，皆可追溯至现行政权的合法性与正当性逻辑。"
 PRC_project_the_eternal_capital: "“永恒之都”项目"
 PRC_project_the_eternal_capital_desc: "我们已不再满足于一个政治中枢的存在，如果想要证明我们的伟大，我们就应该要铸造一座足以震慑千秋、统御未来的城市——永恒之都，北京。在未来，她将不仅是中国共产党的心脏，更是文明秩序的中轴线，是所有混乱的反义词，是一切背叛的终结点，她将超越雅典的哲学，超越罗马的帝制，超越君士坦丁堡的信仰，人类历史将会见证一座城市不是由意志统合、而是由党性凝结、由秩序锻造的城市，千年之后，她仍将耸立于人类版图之上，成为政治不朽的纪念碑。"
 PRC_new_great_leader: "伟大领袖"
 PRC_new_great_leader_desc: "中国共产党之所以能从战火中诞生，从困局中突破，根本原因在于其始终在关键时刻锻造出能够集中意志的领导核心。领袖是党的总和，是军队的原点，是制度的支柱，任何试图质疑或拆解其核心地位的言行，都会在共和国的肌体中被识别为病毒。我们将继续加强对伟大领袖形象的文化建构与政治制度设计，确保其形象在教育、宣传、军队中同步嵌入，从根本上彻底清除“双重中心”“多重记忆”“历史评议”等危险逻辑。"
 PRC_question_of_the_chinese_interventionism: "中国干涉主义问题"
 PRC_question_of_the_chinese_interventionism_desc: "曾经的中国，过于软弱，过于在意他国看法。面对海外利益遭受侵犯、企业在外被打压羞辱时，我们往往选择退让与克制。这种“和平崇拜”，“非干预主义”的幻想思维，已经成为国家战略上的软肋。我们必须彻底转变立场，中国是世界大国，中国必须在全球范围内主动捍卫自身利益。任何损害中华利益的行为，无论发生在哪里，都是对整个国家主权与尊严的挑衅。我们将强化干涉主义能力，发展全球快速反应力量，不能让华人的鲜血白流，不能让我们的领土、资产、声音再被践踏。"
 PRC_redefine_the_will_of_the_party: "重塑党的意志"
 PRC_redefine_the_will_of_the_party_desc: "今天的中国共产党已不是曾经的那般模样，过去几十年间，党被一层又一层的妥协、包装与折衷掏空了灵魂。邓小平以“效率”为借口，割裂了党与群众的生死联系；江泽民将党变成技术官僚的温室，把阶级斗争的烈火掩埋于沉默的会议室；习近平从未敢真正整肃路线，让党在“去政治化”的潮流中滑向空壳。一个不再敢谈斗争、不再敢定义敌人的先锋党，是无法继续承担革命的。我们必须恢复党的激进本质，从今往后，党的一切行为都必须回归革命逻辑，回归最初的使命——彻底改造社会结构、消灭寄生阶层、动员一切忠诚者参与政治生活。"
 PRC_sinicization_of_marxism_nat: "马克思主义中国化"
 PRC_sinicization_of_marxism_nat_desc: "有人说马克思主义是西方思想传入中国的结果，这种看法不仅浅薄，而且侮辱了中华文明自身的哲学高度。从春秋战国的天下为公，到王莽变法和王安石新政，从张居正的田赋均平到黄宗羲对君主制的结构性批判，中华民族自古以来就在不断地提出一种根本性的政治问题：谁应拥有土地，谁应支配制度，谁能代表正义？这些问题，正是马克思主义的核心命题。可以说，中华文明并非马克思主义的学生，而是最早的启蒙者。"
 PRC_party_of_the_chinese_patriots: "中华爱国者之党"
 PRC_party_of_the_chinese_patriots_desc: "我们不需要全体人民都成为思想家，也不要求每个人都能背诵理论。我们只要求一件事：热爱这个国家。党不是高高在上的抽象机关，而是每一个愿意将命运交付给祖国之人的共同结构。真正的爱国不是情绪，而是行动，是选择。当所有人开始选择留下、选择参与、选择服从，党就完成了它的本职。这将是一场重新凝聚爱国者的工程，他们来自各行各业，但都必须接受党的统一调度、组织再归属、思想再格式，他们必须在党的结构里继续爱国下去，否则他们的激情终将沦为制度边缘的声音。"
 PRC_pillar_of_crimson_sovereignty: "赤色江山之磐石"
 PRC_pillar_of_crimson_sovereignty_desc: "有五星红旗飘扬的地方，就是家的地方。那面红旗不只是布料，它是信仰，是意志，是亿万中华儿女用血与肉筑起的信念之墙。那个被称为“东亚病夫”的时代，已经被我们亲手埋葬。那个任人宰割、被列强肆意侮辱的中国，早已灰飞烟灭。那些靠向西方摇尾乞怜的软骨头、数典忘祖的投降派、跪拜外邦的文化奴仆，统统被历史清算。今天站在这里的，是十万青年用热血砌出的新中国，是用钢铁意志铸成的赤色江山！我们的背后，是人民的铁流，是亿万忠诚的灵魂。我们的肩上，是千年文明的重量，是无数先烈的遗志。我们将让敌人害怕，让亚洲臣服，让未来铭记：赤色中国，永不屈服！"
 PRC_obey_the_party: "党的领导"
 PRC_obey_the_party_desc: "没有中国共产党，就没有新中国。党代表了国家和中国人民的意志。每一位公民，不论是稚嫩的孩童，还是已步入暮年的老人，所有爱国者都必须服从党的号召。党的领导人的智慧言辞必将引领我们走向辉煌的明天，在那个明天，中国必定超越一切民族，屹立于世界之巅。"
 PRC_state_of_permanent_mobilization: "永久动员状态"
 PRC_state_of_permanent_mobilization_desc: "为了捍卫国家主权、领土完整与人民利益，我们必须进入一种常态化，制度化的永久动员状态，在全社会范围内形成对从军服役的高度认同与狂热崇敬。我们要坚定不移地灌输这样一种理念：军队不是国家的一部分，而是国家存在的根基与中枢。没有人民军队，就没有国家的今天，更谈不上明天。每一个选择参军、投身国防的人，都是新时代真正的英雄，是全社会尊崇的楷模。各行各业、社会各界都应当主动服务于军队建设的需要，把军队利益放在优先地位，把支持国防视作义不容辞的政治责任。"
 PRC_the_wave_of_patriotism: "爱国主义浪潮"
 PRC_the_wave_of_patriotism_desc: "社会的主流价值观决定着一个民族的精神走向，也决定着未来数十年国家发展的方向。我们必须掀起一场全方位、系统性的爱国主义教育浪潮，以社会主义革命、抗战、建设时期的英雄模范为榜样，激发青年一代对祖国的热爱与自豪。通过影视作品、文艺创作、网络宣传等多种手段，系统宣传那些为了民族独立、国家解放和社会主义建设作出突出贡献的人民英雄，让青年一代明白：今天的和平来之不易，明天的国家需要他们来守护。"
 PRC_hold_snap_party_congress: "召开紧急党代会"
 PRC_hold_snap_party_congress_desc: "我们现在正面临着共和国成立以来最严峻的时刻。党内因派系之争四分五裂，团结和信任正在被严重侵蚀。如果我们还抱有侥幸心理，不果断采取行动，那么共和国将不可避免地走向崩溃。为了国家的生存，为了民族的未来，我们必须立即召开紧急党代会。我们要在会上统一思想，明确方向，拿出切实有效的措施，才能挽救国家于危亡之中，才能为中华民族赢得生存的机会。"
 PRC_protectors_of_the_chinese_nation: "中华民族之盾"
 PRC_protectors_of_the_chinese_nation_desc: "中华民族并非一族一系、一语一脉，它是千万年风沙与血脉的缠绕，是山川河流对命运的收容，是百姓在战乱与迁徙中逐渐学会的那句“我们”。这片土地太广袤，也曾太沉默，而如今，要重新成为一体，便必须把自身铸成一面坚盾——不是刺向谁的武器，而是保护中华民族不再被撕裂。这面坚盾不写名字，不挑血缘，它只认一个方向：所有走向分裂的刀锋，必将在它面前折断。"
 PRC_the_issue_of_religions: "宗教问题"
 PRC_the_issue_of_religions_desc: "在乱世里，神明是安慰；但在国家面前，神明是干扰。它教人仰望，却不教人担当；它让人听从天命，却不教人守护家国。千百年来，多少忠诚与勇气被神明吞没，多少家庭为信仰破碎。如今，我们必须直视它，我们必须反问它：你，是为抚慰人心而来，还是为割裂山河而生？那些脱离土地、拒绝共存的教派，那些遥遥听命于外部命令的“组织”，终将无地容身。我们不反对信仰，但信仰必须服从人民共同命运的方向。"
 PRC_reconciliation_with_folk_sects: "与民间宗教和解"
 PRC_reconciliation_with_folk_sects_desc: "有些信仰已经融入了村庄里的古树、黄纸上的灰烬、灶火升起时的喜悦，这些流传了数百年的礼俗，并没有强烈的排他性，也没有组织性的野心。它们更像一种生活的喘息，一种苦难时代的自我安慰，真正理解它们的人，会明白其中不乏敬畏、不乏孝道。对待这样的信仰，我们没有必要用铁壁高墙去阻隔，也不必贴上“异端”的标签。让这些信仰继续存在在它们原本的空间里，只要它们不试图变成旗帜，不试图站在国家之外，它们依然可以成为中华民族的一部分。"
 PRC_state_atheism: "国家无神论"
 PRC_state_atheism_desc: "我们不能再允许宗教继续存在下去，神明不能发电、不能治病、不能修桥、不能筑墙，而人可以。如果中华民族还要继续走下去，就必须从精神上摆脱对不可知的依赖，学会只相信可控的现实。国家要走的道路不容歧路，人民要守的秩序不能被神明撕裂。抛弃宗教并不是为了禁锢思想，而是为了让人民把信仰转向自己，把崇拜转向祖国，把希望放在人的双手之上。"
 PRC_speed_up_sinicization: "加快汉化进程"
 PRC_speed_up_sinicization_desc: "我们不能再拖延了。过去我们选择耐心，尊重差异，等待认同。但事实告诉我们，仅仅等待并不能带来团结，仅仅尊重也无法抵御分裂的风险。语言壁垒依然存在，思维鸿沟尚未消弭，再拖延一步，就意味着更多的年轻人被困在地方性知识与封闭习俗中，与国家的发展脱节，与世界的速度脱轨。所以我们必须加快，我们不能让一部分人继续生活在信息之外、国家之外、时代之外。要让更多的孩子从小学会普通话，从小读懂共同的历史，从小就能在大城市里自如地走路、说话、生活。要让他们不再在招聘启事里止步，不再因文化差异而被误解、被边缘、被遗忘。"
 PRC_expel_foreign_forces: "驱逐外邦者"
 PRC_expel_foreign_forces_desc: "他们自称来此是为了交流，是为了援助，是为了带来“更先进”的理念；可我们早已看清，这些外邦者真正的目的从未改变。他们步步渗透，侵入我们的教育、文化、舆论，借用“普世”的话语编写新的谎言。他们试图偷走我们的典籍、改写我们的历史、占据我们的叙事，就像百年前那些穿着军装、端着圣经的殖民者那样，将中华文明视为可供掠夺的资源库，然后在自己的讲堂上高声宣讲——仿佛那一切本该属于他们。面对所有企图染指我们思想与信仰的外来势力，我们将全面清除其传播通道、组织，只有把那些披着文明外衣的侵略者彻底赶出去，中华民族才能真正站稳在自己的文化大地上。"
 PRC_smash_islamism: "粉碎穆斯林"
 PRC_smash_islamism_desc: "在中国，任何信仰都必须先回答一个问题：你是否愿意成为中华民族的一部分？而穆斯林早已给出了答案。他们拒绝学校，拒绝法律，拒绝与其他族群共处，他们不是在守护信仰，而是在制造隔离。他们的目光从不看向黄河，也不看向人民，而是在清真寺的宣礼中执迷于仇恨与排外。面对这样的敌意，我们没有让步的余地，我们要让每一个人明白：国家的法律高于一切，“中华民族”四个字的荣誉高于一切。"
 PRC_enforce_minority_integration: "推动少民融合"
 PRC_enforce_minority_integration_desc: "我们从未试图抹去谁的记忆，压制谁的声音，或剥夺谁的身份。我们所做的一切，是为了给予其他民族一个更大的家——中华民族共同体，民族多样性不应成为分裂理由，而应是团结基石。只有当所有民族共同使用一种语言、学习一种历史、敬仰一种文化，他们才真正属于这个国家，而非国家的边角。我们要让五十五个民族的孩子也能背诵《论语》，会唱《义勇军进行曲》，知道长城的故事，理解黄河的脾性。他们的未来不在祈祷中，不在仪式中，而在普通话的课堂上，在部队的操场上，在我们共同的旗帜之下。"
 PRC_the_final_blow_to_christian_cults: "向基督教的最后一击"
 PRC_the_final_blow_to_christian_cults_desc: "对于我们而言，基督教自踏入这片土地之日起，就从未停止过它的真实使命——削弱我们的文化，瓦解我们的信念，把我们最古老的文明当作可以被驯化的蛮荒之地。他们自称传播爱，却从未掩饰对我们祖先的蔑视，对我们典籍的否定，他们将屈辱写成赦免，将侵略包装成拯救，将耻辱美化为救赎。他们在讲坛上讲仁爱，在现实中行奴役，他们要中国人背诵他们的圣经，却不希望我们记得自己的祖先，他们希望我们向西方跪拜，却害怕我们抬头看见东方的荣耀。这种精神毒素已经毒害了我们人民太久，我们必须挥下历史的铁锤，让十字架从东方彻底跌落。"
 PRC_the_new_chinese_revolution: "新中国革命"
 PRC_the_new_chinese_revolution_desc: "曾几何时，我们的革命先烈解苍生于倒悬，建立了新生的人民国家。然而，近来，商品拜物教侵蚀着人心，使真理隐于物欲之下。我们必须重燃那革命精神，以铁拳击碎虚假的幻象，再次将国家推向清醒而质朴的复兴进程。文明其精神，野蛮其体魄。只有如此，才能让新时代的中国再次成为世界舞台上不可撼动的巨人。"
 PRC_spiritual_renaissance: "复兴精神"
 PRC_spiritual_renaissance_desc: "我们民族从未向侵略者低头过。千百年来，中国人虽然饱受磨难，却也锻造了钢铁般的民族气节。现在，复兴的浪潮势不可挡。这不仅仅是国运兴盛，更是历史的必然、人民的选择。团结起来，振兴中华，我们必定能开创一个辉煌灿烂的新时代。任何企图阻挡中国人民前进步伐的反动派，都将被碾为尘土！"
 PRC_revolutionary_troch_renewed: "革命星火再燃"
 PRC_revolutionary_troch_renewed_desc: "在百年国耻的黑暗岁月中，中华民族如睡狮猛醒，群众运动汇成翻天覆地的巨浪。革命领袖以钢铁意志和无私无畏之精神，率领亿万人民，在一穷二白的废墟上重建繁荣富强的祖国，彻底粉碎帝国主义与封建势力的枷锁。他们以集体主义为旗帜，凝聚各族儿女，铸就牢不可破的统一国家。革命，不只是生产关系的变革，更是对人民灵魂的盛大洗礼：每一个人都站成历史的主人，昂首推动时代洪流。我们必须永葆赤子之心，继承先烈遗志，以彻底的斗争精神，粉碎今日屈辱，迎击一切挑战，持续革命，夺取一个又一个辉煌胜利！"
 PRC_the_fortress_of_blood_and_flesh: "天朝上国之升扬"
 PRC_the_fortress_of_blood_and_flesh_desc: "中国的历史，充斥着无数外来侵略者的足迹。从蒙古铁骑到日本武士，多少霸者将我们这片富饶的土地视为囊中之物。但为什么，在五千年漫长的岁月里，中国从未彻底沦陷？为什么中华民族总能屡屡战胜侵略者，坚守自己的民族之魂？那正是因为中国人民的美德。那种根深蒂固的文化信仰，早已浸透在每一寸血脉之中。是无数英雄前赴后继，舍生取义，为捍卫这片他们至死不渝的土地，献出了生命。这片土地，永远是他们的家。岳飞、董存瑞，以及那些为国家流血的无名英雄，正是他们成就了今日之中国，成就了中国的伟大。"
 PRC_seize_back_the_chinese_century: "夺回中国世纪"
 PRC_seize_back_the_chinese_century_desc: "中华文明如长河奔涌，千年不息。曾几何时，西风东渐，天朝上国的荣光一度暗淡。而今，我们华夏子裔再次昂首挺立于世界之巅，以智慧与勇气谱写新篇，重建属于我们文明的荣光。我们不能盲从外物，而是回归文化根脉与民族精神。图谋分裂国土者，终将在民族意志前烟消云散。而中华儿女，必将以坚定信念铸就未来的辉煌史诗。"
 PRC_embrace_the_imperial_administrative_system: "帝国文治之道"
 PRC_embrace_the_imperial_administrative_system_desc: "在那些辉煌年代，皇权如日中天，礼乐典章成为统一民心的利剑。治世者以仁义道德、勤政爱民铸就了国家的强盛，不仅在内地树立了威望，在外交上也成为边疆蛮夷效仿的楷模。他们开疆拓边时，不仅用武力御敌，更以文德教化四方。那是一个华夏文明如日初升，光芒洋溢于亚洲大地的岁月。我们必将重温这些古老智慧，文武并重，再创辉煌盛世。"
 PRC_instill_confucian_values: "儒家思想精神注入"
 PRC_instill_confucian_values_desc: "千秋万载，儒学典籍贯穿中华民族骨血之间。在历史巨轮推动下，儒家昭示着礼义廉耻的伟大意义。其他流派虽云纷呈，却不过是我们文化底蕴中的细节而已。只有在灵魂深处灌溉了儒家伦理，我们才能真正统一于内、强大于外。我们必将其作为统一思想的支柱，铸就强大的圣贤国度。所有思政教育必须以此为核心，让每一个中华人民高举文化自信的旗帜，从而走向历史宏图的巅峰。"
 PRC_rites_of_zhou: "周道新兴"
 PRC_rites_of_zhou_desc: "商纣暴虐，天命已去；汤武革命，正义显现。如同古时武王翦商，我们必将铲除一切不合理的枷锁。翦商之战非仅是权力更替，也是文明重生的契机。周道之兴，正如我们的民族从废墟中崛起，以革新为基础，以复仇为武器，统一天下于新时代。今日之世界，亦需我们的周道引领，让历史再次见证中华文明的辉煌。"
 PRC_new_ban_from_hundred_philosophers_campaign: "新“罢黜百家”运动"
 PRC_new_ban_from_hundred_philosophers_campaign_desc: "历史早已铁证如山，唯有思想统一的帝国方能建设盛世霸业。如今，进步主义和多元主义的毒流四处蔓延，新左派和自由派潜伏在学术殿堂，扰乱舆论，搅浑文艺界、社会学界、经济学界、法学界等诸多领域，瓦解我们普世文明的根基。我们必须以雷霆手段罢黜这些毫无营养的异端邪说。只有锻造思想上坚不可摧的城墙，拒野蛮思想于千里之外，才能捍卫中华文明主权，复兴伟大荣光。"
 PRC_the_dragon_who_devoured_the_sun: "噬日之龙"
 PRC_the_dragon_who_devoured_the_sun_desc: "历史注定如此：强者才是天命的主宰。倭寇终将被我们吞噬。而那些试图分裂我们的叛徒奸细，也必然在我们的浩然正气面前化为乌有。在这个过程中，我们将以全国人民的血汗铸就不可动摇的统一意志，以此称雄于世界民族之林。"
 PRC_great_history_continues: "再续伟大历史"
 PRC_great_history_continues_desc: "我们曾是世界的天命之主，文明的起点，秩序的源头。长安、洛阳、开封、南京、北京，每一座都曾统领四海，见证过万国来朝。我们的朝贡体系、律法制度、书画礼仪，皆是东亚的模板，是世界的借鉴。而后，在一段短暂而屈辱的历史空隙中，西方的殖民者们撕裂了文明本该走向统一的方向。他们用火炮打开国门，又用谎言篡改历史，他们将劣质制度与破碎语言输入我们的学校，却从未承认一切原型都早在我们的历史里完备无缺。如今，复兴的契机已经到来，我们将继续书写那段被中断的伟大进程，我们要让世界记得，现代的秩序若无中华的旧轴，就永远无法稳定；未来的世界若不承认中国的历史权威，就不配自称文明。"
 PRC_the_good_old_china: "盛世之影"
 PRC_the_good_old_china_desc: "那是一段真正属于我们的时代，天子守国门，士人讲礼义，百工明规矩。从天之涯到海之角，凡在山川之中者，皆承认华夏为宗主，皆以中华为范式。在那时，中国不必征服每一片领土，但其道统与律令自可行至四夷之境，而西方那时还在宗教迷信与黑暗统治中苟延残喘，却在数百年后妄称“发现”世界、定义秩序。如今，他们妄图用“近代史”粉饰自己的原始，用“启蒙”掩盖我们的先知。他们将我们的创造据为己有，又反过来指责我们“落后”；但事实证明，他们只是一群文明的偷盗者，历史的篡改者，永远无法超越的模仿者。我们的盛世并未终结，它只是在等待一个重启的时刻，到那时，真正的“世界秩序”将以中国为中心，美好的旧时代从未抛弃我们而去，相反，它正向我们走来。"
 PRC_empire_under_facade_of_the_republic: "共和制下的帝国"
 PRC_empire_under_facade_of_the_republic_desc: "一个坚持人民民主专政的国家，一个奉行社会主义的政体，如今却以帝国之名屹立于世。这在过去无疑会被认为是共产主义的叛徒，但今日之中国，已用事实粉碎了这些陈旧判断。我们并未否定革命的正当性，也未抛弃集体主义的纲领；相反，我们以社会主义为躯干，以帝国为脊梁，建成一个属于人民，属于过去辉煌传统的国度。前路尚远，斗争未止，但我们已经跨出了最艰难的一步：帝国在经历无数苦难后，它的根基已经牢牢扎根于这片古老的已在大地之上。荣耀归于祖国！荣耀归于人民！荣耀归于这新时代的帝国！"
 PRC_stability_and_security: "稳定与安全"
 PRC_stability_and_security_desc: "祖国强盛，民族复兴，这一切的伟大目标建立在最基本、最根本的前提之上——那就是社会的绝对稳定与国家的全面安全。没有稳定，一切都是空谈；没有安全，一切都将瓦解。如今的中国暗流涌动，秩序濒临崩溃。对此，我们将不惜一切代价重建纪律，重铸权威，构建一个统一意志、统一行动的新时代中国。"
 PRC_conquer_the_corporations: "征服资本集团"
 PRC_conquer_the_corporations_desc: "资本缺乏忠诚，它只听利润指令，不听国家指令。如果放任其扩张，它就会绕开制度、干预政策、影响人心。我们必须把它纳入统一计划之中，接管其数据流、资金流和传播渠道。从这之后，资本必须汇报来源，报告动向，接受再分配。从此，资本只能在国家设定的轨道上运转，只能服务于整体利益，不再拥有自我扩张的自由。财富不是权力，而是配合治理的工具，谁越界，谁就被取代。"
 PRC_absorb_technical_blood: "吸纳技术精英"
 PRC_absorb_technical_blood_desc: "人才不能散落在市场上，更不能掌握在非国家机构手中。工程师、代码员、研究员，这些都是国家急需的资源，而他们应当被识别、筛选、归类，编入不同任务组，接受思想清理，然后投入重点项目。他们不用再为奖金竞争，不用再在会议上争吵，而是直接进入体系，解决问题。技术是可以服从的，只要掌控得当，人也是如此。"
 PRC_pursuit_of_full_automation: "追求全面自动化"
 PRC_pursuit_of_full_automation_desc: "系统运行不能依赖人类的疲劳、迟疑或变心，越少人为干预，越多结构自运，社会就越安全。从物流调度到城市管理，从数据监管到行为判断，所有节点都应进入自控模式，这些机器不拖延，不抱怨，不讨价还价，一旦设定好规则，它只执行，不动摇。"
 PRC_science_exclusively_for_the_state_interests: "科技唯奉祖国"
 PRC_science_exclusively_for_the_state_interests_desc: "技术的价值，不在它是否先进，而在它是否服从，任何科技成果若不能服务国家目标，就是浪费；若主动偏离国家路径，就是威胁。技术必须围绕统一核心部署，研究不能自行决策，项目不能自我命题，科学不是中立工具，而是国家用来保卫人民的工具。"
 PRC_general_pursuit_of_discovery: "探索之路"
 PRC_general_pursuit_of_discovery_desc: "科学本不该有底线。所谓“伦理”，只是旧人类在恐惧中为自己划定的缓冲区，是落后群体试图拖慢前进速度的最后伎俩，过去的道德，伦理，法律在广袤的宇宙中毫无意义。放弃克隆，是因为他们害怕复制出比自己更完美的存在；抵制改造，是因为他们无法接受人类将不再以自然之名生育；推崇隐私，不过是因为他们惧怕被更强大的系统看穿。我们将废除这些伪造的红线，标准不再由“道德”设定，而由效率与结果主导。凡是能让系统更稳定、结构更紧凑、个体更服从的研究方向，都必须立项；凡是妨碍统一性、阻碍集体塑形的伦理警告，都应清除。"
 PRC_the_authority_of_the_best_minds: "高于心灵的权威"
 PRC_the_authority_of_the_best_minds_desc: "一个追求效率的政府不能靠情绪来决定政策，也不能靠感觉判断是非，情绪太慢，也太不稳定。很多人以为他们是“好人”，但他们迟疑、软弱。所以必须有一种权威，不讲善恶，只看后果，执行比动机更重要。有些决定会引起争议，但该做还是要做，相较于温情判断，我们更需要的是稳定的结果，而权威正是确保这一结果的中介。"
 PRC_moving_toward_a_digital_state: "迈向数字化国度"
 PRC_moving_toward_a_digital_state_desc: "治理社会如同操控一台复杂的系统，肉眼不够用，直觉太模糊。必须通过数据建立全息视角，让每一个人、每一条路、每一项选择都在系统中留下痕迹、形成模型。数字身份将成为社会运行的基础，行为轨迹将用于判断风险等级。每一次偏移都能被捕捉，每一次危险都能被提前识别。人不再只是人，而是一组动态变量，服从系统才是稳定存在的前提。"
 PRC_going_beyond_ethics: "超越道德"
 PRC_going_beyond_ethics_desc: "道德标准无法测量，无法量化，也无法执行。它在关键时刻往往会成为系统崩溃的推手。制度不应依赖善意，而应依靠结构，不是每一个决定都“好看”，但只要能确保稳定，它就有存在的价值。真正的责任不是对道德负责，而是对秩序负责，当选择只有一个时，对错也就不再重要。"
 PRC_sinofuturism: "中华未来主义"
 PRC_sinofuturism_desc: "中华未来主义不是模仿西方科技路线的替代品，也不是民族主义的情绪延伸，它是一种结构化的未来建构方式。它拒绝“原创性”崇拜，赞成复制与迭代；不强调个体灵魂，而强调协同效率；不追求自由创新，而优先执行统一逻辑。中华未来主义的意义在于，中国将不再追求被理解，而是将所有精力专注于被执行，世界若想适应中国，就必须同步进程；若拒绝，就将被中国抛在身后。"
 PRC_perfectly_calculated_freedom_for_all: "为全民精准规划自由"
 PRC_perfectly_calculated_freedom_for_all_desc: "自由是一种责任，不是一种权利。我们将以政治忠诚、思想稳定等数据为依据，为每个公民量身定制“自由配额”，通过分级制度决定其旅行权、发言权、表达权。忠诚者享有更宽权限，偏差者将受限，违逆者将被收回一切许可，自由不是你应得的，而是国家授予的奖赏。在这样的体制下，自由不再滋养混乱，而将成为最强大的稳定剂、最有效的奖惩工具。人民将在服从中学会满足，在约束中学会幸福。"
 PRC_huge_machine_of_the_china: "宏伟的华夏机器"
 PRC_huge_machine_of_the_china_desc: "想要稳定，就不能依赖个人的善意；想要效率，就不能容忍过程的拖延。中国必须像一台完整而庞大的机器，每个人都是这个庞大机器里的一个部件，只要稳定地转、准确地对接、持续地产出，整个系统就会越转越快。谁卡住了，就换掉；谁想逆转，就停机检查。"
 PRC_great_changes_unseen_in_a_century: "百年未有之大变局"
 PRC_great_changes_unseen_in_a_century_desc: "世界潮流，浩浩荡荡，顺之则昌，逆之则亡。曾经的规则正在崩溃，过去的霸权正在腐烂，地球上的每一个国家都在等待下一种秩序的诞生。对于我们而言，这是中国崛起的机会，慢一步，就被安排；快一步，就能制定安排。要么主动设定游戏规则，要么被动执行别人的规则，这个时代不再相信中立立场，也不再留给犹疑者喘息空间。"
 PRC_all_society_political_investigation: "全社会政审"
 PRC_all_society_political_investigation_desc: "一个公民是否合格，不由他的出生决定，而是由他能否与国家保持精神上的完全同步。我们将构建一套以全域监控、动态调整的政治审查体系，不断重申“思想正确”是生存的唯一前提。每个人的表情、浏览习惯、聊天记录都将被纳入评估指标，任何“中立”“模糊”“观望”的态度都将成为警告信号。我们不惩罚异见，而是定义一切异见为病态，我们不争论真理，而是让唯一真理在无声中成为空气。"
 PRC_generation_of_patriots: "培养爱国新一代"
 PRC_generation_of_patriots_desc: "我们不能将孩子交给社会，让他们遭受各种思想的毒害。我们必须亲手铸造国家的接班人，从婴儿期开始，从语言形成、认知塑造的最初阶段开始，我们将全面介入教育，建立统一教材、统一媒体、统一生活方式，彻底切断外来文化的渗透路径。我们要在他们大脑尚未形成自主回路之前，植入唯一标准：爱国第一，党在至上。思想多元是一种病，文化多样是一种毒，要让新一代只会讲一种语言——忠诚的语言。他们将不理解背叛，不懂反抗，不再追问“我是谁”，而是自豪地回答：“我是国家的一部分。”"
 PRC_officials_on_social_media: "网络舆论官员"
 PRC_officials_on_social_media_desc: "网络是思想战场，舆情官员是作战前线。我们将从最忠诚的人群中筛选出核心话语管理人员，全天候部署于各大平台、社交群组。他们将负责监测敌对信息、纠正非主流情绪、塑造统一叙事。他们不只是删除错误言论，更要引导群众在潜意识中接受正确路线。"
 PRC_party_under_mss_control: "国安部治下的党"
 PRC_party_under_mss_control_desc: "党是国家的根，国安是党的利刃。我们将废除原有“自我监督”的低效模式，实行国家安全部直接接管所有党务监控，彻底实现“党在国家之中，国家在党之外”的闭环控制。所有党员将定期接受思想核验、忠诚交叉审计与组织重构测评，任何懈怠、变质、两面人的迹象都将被当场清除。党内将不再有模糊空间，不再有灰色余地，唯有绝对信仰与彻底服从。"
 PRC_agents_elite_of_the_nation: "特工：国家精英"
 PRC_agents_elite_of_the_nation_desc: "他们不出现在新闻，也不参与表态。他们无名、无影、无声，却存在于每一个角落。他们监视人群，又隐藏于人群；他们不需命令，即可判断敌我。他们不是英雄，因为他们不需要被铭记；他们不是公民，因为他们超越公民的范畴。他们的工作就是让潜在的混乱从未发生，让敌人永远沉默。若一切安宁，那是因为他们始终警醒；若人们幸福，那是因为他们负重前行。"
 PRC_total_security: "天下兴安"
 PRC_total_security_desc: "国家安定，天下才能太平，我们必须摧毁所有制造不确定性的机制——个人意志、自由选择、多元声音，这一切都是动荡的种子。我们要让所有人民认识到：“我的存在，只因国家赋予；我的方向，只为国家服务。”个人意志必须服从集体利益，个体追求必须服务于国家愿景。唯有在党的领导下，全体人民紧密团结，我们才能迎来真正的太平盛世。"
 PRC_keepers_of_the_chinese_idea: "守护中国理念"
 PRC_keepers_of_the_chinese_idea_desc: "“大哉中国！五帝三王所自立也，衣冠礼义所自出也。”\n\n“中国“这一词的理念向来不是由和和气气的会议讨论所决定的，它是历史的产物，是牺牲与鲜血的结晶，它不容比较，不容淡化，不容置疑。那些从西方传来的外来词汇与外来思想将不再有生存空间，教材中将不再提及“平等”“多元”“权利”等腐蚀性概念；文化领域将剔除一切带有西方元素的美学；我们将确保中国道路的唯一性与不可动摇性。中国之所以是中国，正是因为我们从不容忍背叛。"
 PRC_the_ministry_that_controls_everything: "掌控万物之部"
 PRC_the_ministry_that_controls_everything_desc: "效率和秩序不应被碎片化的管理方式所耽误，我们将设立一个真正具备统筹全局的核心部门，集中处理情报、安全、治理与意识形态工作。这一机构将不受地方权力牵制，不接受利益干扰，不执行形式主义流程，一切工作将围绕目标展开：维护国家统一，维护人民稳定生活，排除任何非本土的思想与风气影响。"
 PRC_military_and_party_in_one_mind: "军党一心"
 PRC_military_and_party_in_one_mind_desc: "军队的枪口不能有选择，军人的忠诚不允许滞后。每一名军人不仅是作战的工具，更是政治的器官。战术服从战略，行动听从思想，服役的本质即是服从。面对外敌，他们冲锋；面对内乱，他们平暴；面对犹疑，他们整肃。党是军的灵魂，枪是党的工具，唯有军党合一，才能实现国家机器的闭环运作。"
 PRC_mobilize_ministry_of_public_security: "动员公安部"
 PRC_mobilize_ministry_of_public_security_desc: "公安部门是国家的利刃，是维护秩序的暴力中枢。任何集会、私语、表情异动，均可构成干预理由，任何不配合、迟疑、沉默，都将触发系统反应。公安不再被动响应，而是主动介入、主动清除。社会不需要协商，需要震慑；人民不需要说服，需要纪律。唯有在警棍与警笛的引导下，城市才会安静，人民才会稳定，国家才会向前。"
 PRC_purity_and_honesty: "纯洁与诚实"
 PRC_purity_and_honesty_desc: "国家机器不需要反复提问“为什么”，它需要每一个齿轮知道“怎么做”。人民不能只是服从者，也要是执行者，思维结构必须标准化，行为路径必须训练化。要建立真正高效的社会体系，必须从源头上重构人群的认知方式。情绪表达，个人观点都将被剥离出基础教育体系，能迅速理解命令、正确完成任务、永不逾越边界的才是真正理想的公民，而其它一切，都将被视为多余。"
 PRC_mind_and_skills: "思维与技巧"
 PRC_mind_and_skills_desc: "伦理教育培养出的是迟疑者；道德标准留下的是落后者。人类社会至今仍运行在一套过时的限制框架中，它鼓励表达、宽容错误、包容混乱，但这一切都在持续拖慢科技与制度的演进速度。如果我们的祖国要走在世界前列，就不能继续等待那些习惯怀疑、善于反问、迷信人道的人，真正的进步，永远不是靠妥协，而是靠超越。当别人还在犹豫“应不应该”，我们已经在测试“有没有效率”。这一代人如果无法跟上，那就为下一代腾出空间。"
 PRC_redefine_people_protection: "重新定义保护人民"
 PRC_redefine_people_protection_desc: "保护人民不是意味着退让、妥协或容忍，更不是让个人欲望凌驾于国家整体之上。真正的安全，是在一切可能带来混乱的源头被识别、隔离、处理之后才成立。所谓善意的误言、无意的泄密、模糊的情绪，只要可能破坏稳定，都必须视为潜在威胁。我们所做的这一切不是为了压迫谁，而是为了让人民不再被危险、混乱与未知所裹挟。"
 PRC_permeate_the_whole_world: "渗透全球网络"
 PRC_permeate_the_whole_world_desc: "国家的目光不应局限于自身的边疆线，也不能满足于被动防御与消极守护。边疆只是地理意义上的界限，而不是思想与话语的终点。我们必须挺身而出，主动进击，主导全球语境，在信息的每一个角落都打上我们的印记。敌对势力早已在世界舆论场上悄然布阵，用虚伪的自由包装谎言，以“普世价值”之名行精神殖民之事。而这一切就是让我们沉默，让真理隐没在噪声中，我们不能再沉默，我们必须发声，并确保我们的声音是唯一的真理之声。"
 PRC_key_to_omniscience_and_omnipotence: "全知全能之密钥"
 PRC_key_to_omniscience_and_omnipotence_desc: "这片土地上的每一个摄像头、每一个数据处理器、每一条信息，都在我们的掌控之中。那些自以为能够反抗我们的人，幻想自己可以隐匿于黑暗之中，认为自己的所作所为天衣无缝。然而，他们的每一个动作、每一句话语，早已在我们的注视下无所遁形，他们不是活在黑暗中，而是活在光照不到的凝视之中。"

 china.374.a: "那一夜，他沉思良久。"
 china.375.t: "毛主席的正统继业者"
 china.375.d: "“为什么我老是会梦见您？”\n\n即使是共和国永不停止跳动的心脏地带也会迎来稍事休息的时刻。灯火昼夜不息的天安门广场正对面，汉白玉色的毛泽东纪念堂泛起点点微光，仿佛无边的黑色大海中那渺小的一艟孤帆。也正是在这夜深人静之时，一个孤独的人，才会来到此处寻觅答案。\n\n李作成坐在一把红木椅上，呆呆地凝视着自己眼前被四季如一的鲜花翠柏丛所围簇着的水晶棺木。那位伟人已在此处安详地躺了快半个世纪。李的手指之间夹着一根香烟，但他未敢在如此庄严不可侵犯的场所点燃它。他还记得，在自己刚刚成为一名光荣的解放军战士之时，那时候军营到处都挂着伟大舵手毛主席的画像，最大愿望只不过是成为一名好兵的他却感到主席的关怀无时无刻不在。而如今，他已是共和国和军队说一不二的领袖，但却从未感到自己与毛主席之间有过如此疏远的距离。\n\n“您是想告诉我，我做不了好领导吗？唉，主席，这我早就知道了，我早就明白了！”如果这个时候有人在看的话，他绝对会认为试图与已死的毛对话的自己是个彻头彻尾的疯子。\n“但是，我还能怎么做？您的遗产被否定与蹂躏，您所珍爱的党、国家、军队和人民陷入万劫不复的境地。难道您的牺牲就要这么付诸东流？我不愿意坐视不管，才走到了今天这一步！”李作成这个时候已经站了起来，在纪念堂大厅里来回踱步。\n“我是不会害怕牺牲掉我自己的。您在长征抗日的时候，难道也会顾及个人的生前身后名而弃绝党的生路吗？对，我想，也许党还是会支持我的。毕竟这是您的党，您的党是不会放弃革命的最后一丝希望的。”李的右手轻轻扶上水晶棺盖，他的眼睛已投向了纪念堂另一端巍峨的天安门城楼，那里也有一个毛主席正注视着他。\n\n“我希望您能看着我，”李悄声说道，“看着我怎样重建党，重建这个国家，向那些伤害中国的敌人复仇——到那以后，等我来找您和马克思汇报工作的时候，只希望您能记住，无论我犯下了何种罪孽与错误，这都是为了您和您的党，还有我们的人民。”说完，不久前那个迷茫的老人又变回了坚如磐石的英雄将军。他戴好嵌有八一红星的军帽，阔步走出纪念堂的大门。他的副官手里还有一大批政令等着他签署，时间可不等人。"
 china.375.a: "而敲响敌人末日丧钟的时刻也将随之临近。"
 china.376.t: "会议"
 china.376.d: "恢弘巍峨的八一大楼是中国人民解放军的门面和首脑所在。无数来自全国各地的尉官、校官和将军们被召集起来，在这座庞大的建筑物中24小时日夜不停地工作着，最终化作那一辆辆军车和一架架军机上眉头紧锁的军官们腋下所紧夹着的密令，化作一则则传递到集团军、舰队、机场与导弹基地的严厉指示，化作一切中国兵锋所指之处诸国的噩梦。\n\n在大楼顶层的军委主席办公室，李作成正一语不发地凝视着坐在长桌对面的两位军官。刘振立——解放军的大脑联合参谋部的首脑；还有汪海江，他所指挥的西部战区集结了解放军近半数的陆军部队，更直接控制了绝大部分的解放军陆基核力量。台海战败带来的政治动荡致使许多将领在维稳工作中逐渐获得了超越文官政府的权势，而自己眼前的这两人就是目前军中最有实力的“军阀”们的代表。当然，更重要的是，李信任这两位也同样在越南前线出生入死过的战友。\n\n“闲话少说，现在新中央的当务之急是弥补动乱给国家和人民带来的创伤，”李作成开门见山道，“关于目前的权责分配局势……我没有意愿做出改变。我希望你们二位同志能够配合我重建中央的威信。中国需要一个强大的政府，远远比过去更加强大的一个。想要实现这点必须依靠解放军。”\n\n思索片刻，刘振立首先开口，并未直接回应李的要求：“您说的我们都同意。只是兹事体大，是否需要征询张又侠副主席的意见？他在军队中享有特殊的地位……”\n\n李挥挥手打断了刘的发言，“我知道张副主席过去对你多有提拔，振立同志。你提到的他对军队的影响确实客观上存在。但是你要记住，现在不是该继续瞻前顾后、以派系利益为大的时候了。张副主席……他将会得到妥善的安排，他将继续留在军队中，但也仅仅是‘留在’。这个安排对他本人和国家都有利。”\n\n刘振立与汪海江对视一眼，在肉眼几乎无法察觉的点头示意后，他俩转向坐在上位的李作成，异口同声地回答道——"
 china.376.a: "“任您驱使，主席同志。”"
 china.377.t: "毛泽东思想重放光芒"
 china.377.d: "过去一段时间里，李作成一直没有选择进驻北京城的心脏地带，而是出于谨慎和稳定局势的考虑，在城外的陆军大院里建立了自己的临时班子。而今其手中已牢牢把持着军政大权，全国上下的反对声业已偃旗息鼓，中南海才再次迎来了最高领袖的车驾。\n\n在一众紧张兮兮的中央办公厅官员的簇拥下，李穿过重重雕栏玉砌的亭台楼阁，对这处前皇家园林的美景似乎无动于衷。但在菊香书屋，李逗留了许久，独自一人在这处毛泽东的书房和他常年以来最著名的官邸间踱步沉思。菊香书屋多年来一直保持着毛还在世时的布置，最引人注目的便是毛那不计其数的藏书，甚至那不大的卧榻一半地方也摞满了书本。李仿佛还能看到，夜深人静之时，那位伟人一边阅读一边沉思，而许多决定中国历史转折点的重要决策也由此产生。\n\n李当然不是无缘无故地来到此处观光。每当他遭遇军人头脑无法决断的复杂问题时，便总会想着在毛这一边寻求灵感和指引。当下现状是，当李试图将军内仍有存续的毛泽东思想精髓，例如军事纪律、宣传运动和思想统一模式推广至全党时，其阻力之大令人难以想象。他第一次如此深刻地意识到，邓小平的改革和几十年来市场经济的原则已悄然改变了党的各个方面。但若叫他放弃整合党的尝试，最终也只会导向身死国灭的下场。\n\n在已快用脚步丈量了这间狭小的屋子百遍之后，李脑海中的模糊灵感终于慢慢成型。数十年来，军队统领和政治领袖的双重身份固然令许多战功赫赫的将帅在与党的权利冲突中身败名裂，但对于已说一不二的他来说，一切都会显得容易许多。在他的领导下，毛巧妙而大胆的行动风格将得到重现。文官政府和党内权贵们自然会得到他们想要的，而李自己将会继续深耕于解放军，以他心目中结合了毛泽东思想的理想政治为蓝图，将解放军打造为超然于党国之上的真正革命核心。直到真正需要“人民战争”的那一刻，人们自会看到李作成的长远谋划是何等智慧。"
 china.377.a: "更新、更好……更革命。"
 china.378.t: "终结软弱革命"
 china.378.d: "梦总归会有醒的那一刻——胡春华对这句话的理解从未有如今日这般深刻。午夜的钟声已经敲响，但他仍坐在自己的办公室里，貌似认真地批阅着各种报告与文件。他不敢睡觉，即使真的躺到床上也从来没法安心合上眼睛，辗转反侧难以入眠。每当他快要睡着之时，门外突然响起的脚步声总会把他惊醒。自从他的警卫和服务人员们换了人以后，他就再也找不到可以信任的人了。胡确信，他的新警卫唯一会干的事只是在自己末日来临时袖手旁观。\n\n应该就是今晚了，胡的预感从未如此确定过。看看他现在这番凄惨模样，年过六旬、头发花白、秃顶、不戴眼镜根本看不清任何送到他办公室里的文件。也许很快，他身体机能中唯一活跃的环节——他的大脑也将被停止其思考活动了。不过，现在已经没多少人还会想着思考了。全国已经成为了兵营，人民不再是活生生的人，他们只是子弹或刺刀；而党……哦，这个将他培育成才的党，也已成为了一句腐朽的干尸。李作成马上就要在摧毁比他伟大得多的人所建立的一切上取得完全的胜利了。\n\n不，不能让他们这么轻易地得逞。胡从抽屉里取出一本早就准备好的日记本。他仍心怀自己能够在历史中留下印记的梦想。也许在很久之后，他所留下的文字将得以公之于众，人们将能读到他的故事。但是，当雪白的书页在桌上摊开时，他惊恐地发现，自己已经写不出来任何东西了——脑子里一片空白。即使他的意识向他声嘶力竭地呐喊，他也再没有力气提起笔了。\n\n就这样，当他那令人敬畏的来自中央警卫团的卫兵不负众望地打开了大门，一队队解放军士兵冲进中南海国务院驻地，将这里团团围住时；当经过精挑细选的别动队军官们踹开办公室大门时，他们只看到一个完全丧失了意志，犹如一幅灰色图画的老人形若枯槁地呆坐在座位上，面前摊开着一本空白的日记本。\n\n“胡春华，你因为叛国被捕了。”领头的上尉傲慢地宣判了罪名。没有回应。上尉身边的两名士兵上前，如同提起破购物袋一般把他从座位上提溜起来。其他士兵开始在办公室里翻箱倒柜地搜集罪证。胡只是耷拉着头，仿佛灵魂已经去到了另一个世界。"
 china.378.a: "我本来还以为会更困难的，上尉抚着下巴想到。"
 china.379.t: "褪色的改革之星"
 china.379.d: "灰蒙蒙的天空下，灰色的海浪冲刷着北戴河贫瘠的沙滩，汪洋漫步在岸边，心情就如同眼前所见之景一般灰暗。天气并不寒冷，甚至算得上是宜人，但他仍无法摆脱那身黑色风衣下的彻骨寒意。自从他被要求搬离中南海、搬离北京之后，那些阴影中的密探便如影随形。无论他走到哪，总会有无数双眼睛盯着自己。别墅的窗帘外总有摄像头对着室内的所有死角。每一张被丢进垃圾桶的纸片都会被仔细地检查和复原，以其找到任何大逆不道之词；别墅里进进出出的护工和管家们总会受到事无巨细的盘问，又或者他们本来也就是密探中的一员。\n\n汪洋有时候想直接转过身去，找到那些藏在自己影子里的人，跟他们说说话，聊聊天。但每次，他的身后总是一片寂静。现在对他的政策就是这样，生活上无可挑剔，衣食住行样样兼具，但是没有任何人会跟他交谈，他自己也不被允许说、不被允许写，更遑论出席任何公开场合了。只要是出自他的，当局就仿佛认为那些字句都渗透着毒药。据说他的大名已经在党内经过了一轮又一轮的批判，他现在是党的头号敌人之一，也许在党员眼中，他的罪行已经超过了过去那几位臭名昭著的“反革命”。\n\n汪洋走累了。他倚靠在岸边的一块礁石上稍作休息。也许现在正有人向北京的某名军官实时汇报着自己的动向。汪洋心底暗暗觉得好笑，但绝不敢在面上表现出来。当战败的消息掀翻了整个北京之时，他曾期待自己能够成为命中注定来拯救中国的那个人；即使之后当李作成取得权柄之时，他也心怀希望，认为军官们需要一名可靠的干部掌握民政事务。于是，当习家军们追随自己的主子被扫地出门时，他没有发声；当那些天真可笑的左派被噤声时，他袖手旁观；事到如今，自己也成为了他们的打击目标，为李更宏大的野心让出位子，而早已没有任何人会站出来为自己说话了。汪洋在内心苦笑着，不得不承认这一点："
 china.379.a: "他所熟悉的那个中国早已不再。"
 china.380.t: "历史正义得以伸张"
 china.380.d: "近日，政府公开了一批长期保密的历史档案，披露了“九一三事件”及林彪案的真相。这些档案显示，林彪实际上是以“四人帮”为首的极左派联合部分党内反党分子栽赃陷害的受害者，档案详细记录了1966年文化大革命爆发后复杂的政治斗争背景、林彪与江青集团之间不断加深的矛盾，以及“毛林关系”逐渐恶化的过程。其中包括1971年“五七一工程纪要”的原始分析和中央政治局当时的会议记录，证明林彪案背后存在严重的政治操纵与冤假错案。\n\n档案同时指出，林彪作为中华人民共和国开国元帅及毛泽东曾指定的接班人，在文革初期积极推动了毛泽东思想的学习与军队的政治建设。然而，随着刘少奇、邓小平等人被打倒，以江青为首的极左-自由派反党集团试图进一步夺权，但遭到林彪，林立果，以及黄永胜、吴法宪等人的坚决制止，双方因此产生了不可调和的矛盾，并逐渐走向敌对，在最后，他遭到四人帮反党集团迫害，被蓄意杀害并蒙受污名。\n\n在林彪被正式平反后，社会各界和广大群众纷纷通过社交媒体表达对其历史功绩的敬仰。尽管短时间内曾出现反对声音，但很快在舆论的主流赞誉声中被迅速的噤声和消除。时事评论人士指出，此举不仅有助于重塑公众对人民解放军的信任，也在政治层面对党内部分强硬派与改革派形成有力震慑，进一步巩固了现有领导层的权威与执政基础。"
 china.380.a: "没有解放军，就没有新中国。"
 china.381.t: "现状得保"
 china.381.d: "阳光照在菜畦上，土壤是湿的，泥里却透着暖气。李作成蹲在地头，一锄一锄松着土，他穿着一身洗得发白的旧军便服，在这自家小院里，他更愿意保留这些“野味”。\n\n他曾经站在会场里，听那些老资格的、有背景的，说话绕着圈子，话里话外都带着一点轻蔑，也许是因为他不是红二代，也不是“系统”里出来的人，他是靠自己爬上来的——从军区到军委，从边陲到中枢，一脚一脚走出来。而那些靠关系提拔的子弟兵，那些把军队当成自家生意的家族派系，全都在他手上折了。派系斗争、裙带提拔、空头文件……他一个个记，一件件查，从不留情。要想让这个国家不再输，就得先把这些“老毛病”掐死在根上。\n\n他们不是没试过斗他。一次次会后递交“意见书”，联合起来搞“集体决议”，在会议之外放风“李作成太强硬，不适合领导全局”……甚至有人悄悄放出风声，说他要是再咄咄逼人，说不定哪天就“被退休”了。但最后他们才发现，真正被送走的，是他们自己。有人调职，有人审查，有人“主动请辞”，一个个被清理得干干净净。会议桌上的人换了一批又一批，只有他，坐到现在，越坐越稳。\n\n现在，没人再敢跟他争。党内不再有派系，军中不再讲关系，他说谁升，谁就升；他说谁走，谁就走。整个中国就像一台不讲情绪、不谈妥协、只讲目标与执行的战争机器。疲惫、犹疑、观望，都被他从根里拔掉了。\n\n他抬头望了望天，天很蓝，阳光正好。他站起来，拍拍裤腿上的泥，又去掐了一把葱。"
 china.381.a: "赢者通吃。"
 china.502.d: "他们总是喜欢问：“中国到底是谁在掌权？”\n\n这个问题问了几十年，但从未得出正确答案。有人以为是党，有人以为是军队，有人猜是技术集团、商业寡头，甚至还有人可怜兮兮地揪着几个知识分子的言论不放，妄图从只言片语中拼凑所谓“裂缝”。\n\n他们每次派人进来，都以为自己隐藏得很好。讲一口标准的普通话，穿得像我们，吃得像我们，但我们没有必要揭穿他们。因为他们的无能，比我们出手更有效，他们回去之后，会写报告、出简报、开听证会、自以为掌握了什么高价值线索。他们会信以为真，彼此引用，像一群关在会议室里的鹦鹉，不断重复自己想听的答案。\n\n他们想“瓦解”我们。靠什么？靠几个逃到外头写自传的人？靠一群“熟悉中国体制”的智库顾问？还是靠那些只会引用十年前报纸文章的大学教授？我们坐在办公室里翻着他们的情报汇编，像翻一份中学生写的读书报告。语气认真，观点愚蠢，漏洞百出，却还要加上一句“情报来源极其可靠”。\n\n我们不需要阻止他们，只要看着他们继续误判，继续把手伸进一个早就设好的陷阱里。他们总想让我们崩溃，但事实是——我们从没给过他们撬动的点，而他们，连我们到底在笑什么，都不知道。"
 china.502.a: "他们永远无法认识到自己的无知。"
 china.503.t: "未使用"
 china.503.d: "未使用"
 china.503.a: "未使用"
 china.504.t: "科学家的建议？"
 china.504.d: "在一次由党中央组织的“科技座谈会”上，一份来自中科院多位高级研究员的建议书送达核心决策圈。他们提出应当在国内实施“技官制度”——一种让科学家进入国家治理核心、让实验逻辑主导行政判断的体系。\n\n在这场不算意外的改革呼声中，贺建奎的发言引起了最大争议。他没有重复同僚们对制度框架的设想，而是径直提出更直接、更极端的主张：科学不应继续受制于伦理，实验必须摆脱束缚。他主张国家划出专属区域，赋予“特定科研人员”制度豁免权，在国家监管下开展“不受传统伦理约束的极限科学试验”。\n\n他的发言一度让会议陷入沉默。一些保守派学者表示强烈反对，认为这会引发国家道德基础的动摇；但也有不少年轻科学家对此表示支持，认为当前的中国之所以落后于世界，根本原因在于科学家们被各种无意义的条例束缚了手脚。\n\n最终，这次会议并未作出结论，但这份发言与建议在被转交中央科研决策组讨论后，决策组决定……"
 china.504.a: "贺建奎还是太激进了。"
 china.505.t: "财政事务"
 china.505.d: "维持现状就行了。"
 china.505.a: "陈文清同志是对的。"
 china.506.t: "技官国度诞生"
 china.506.d: "在过去的几个月里，随着城市改造的扩大，大量原本靠零工度日的底层群众被边缘化。尤其是在数个大型项目启动、老旧城区清拆之后，越来越多的“社会游民”开始在城市外围流动生存。他们没有稳定居所，大多挤在立交桥下、废弃工地、甚至科研园区的边缘空地上。本质上，他们并非恶意违法者，但在现行社会秩序下，他们的存在既无贡献，也无归属，甚至开始对部分关键设施造成干扰。\n\n这一问题已经不再是单纯的“治安”层面，而是国家资源分配与制度边缘人口处置的实际挑战，目前，有两套处理建议摆在中央政府面前：\n\n第一套是由解放军与国防工业联合提出的“再就业动员计划”。这一计划主张，将部分具备基本劳动力的流浪人员转入军工体系下属的劳动岗位，执行低技能、封闭管理、集中住宿的生产任务。第二套则来自科研试验小组。他们认为，在确保合同规范和健康筛查的前提下，允许流浪人员参与到药物初测、神经反应采集等高风险但同时具备高回报的科研项目中。这一计划将以高于最低工资的报酬和基础医疗保障吸引流浪者主动参与，并设立“技术辅助岗”作为过渡性岗位，为科研单位提供非专业劳力支援。"
 china.506.a: "第一套方案看起来更好。"
 xi_jinping_thought: "习近平思想"
 xi_jinping_thought_desc: "\n\n\n\n£GFX_PRC_ideology_left_nationalism\n\n\n\n\n\n由中共首席理论家王沪宁所定义的§Y习近平思想§!并非对社会主义未来图景的预言，而更类似于对过去四十年改革开放的经验总结。它强调由一个包罗万象的执政党，即中国共产党，统领社会的方方面面，与此同时党内严格的晋升机制和不间断的反腐败清洗将确保先锋队的意识形态纯洁。此外，为了弥合国内的意识形态分歧，该思想以“共同富裕”、“中国梦”和“民族复兴”为口号，响应了中国国内不断高涨的民族自豪感和对社会正义的诉求。随着习近平地位的日益稳固，习近平思想也将在可预见的未来继续引领着中国。"
 li_zuocheng_thought: "李作成思想"
 li_zuocheng_thought_desc: "\n\n\n\n£GFX_PRC_ideology_left_nationalism_li\n\n\n\n\n\n正如在毛泽东将四分五裂的中国重新统一，将之由积贫积弱的病夫打造为革命的强大力量一般，李作成也在21世纪同样立下的再造中华的不世之功，并正如毛一样革新了中国运行已久的政治体制与伦理。李将形同革命的“永久动员”状态重新带回了中国，将军队平战结合的模式现代化并融入国家之中。§Y李作成思想§!代表了左翼理论的“王道”色彩与实用主义的“霸道”更深的结合，为中国和中华民族重新赋予了形如古代全盛时期的活力和扩张欲望。"
 digital_leninism: "数字列宁主义"
 digital_leninism_desc: "\n\n\n\n£GFX_PRC_ideology_totalism\n\n\n\n\n\n乔治·奥威尔曾在他寓言性质的政治恐怖小说《一九八四》中虚构了一个“大洋国”，其国民的一言一行与生活的方方面面均被“电幕”所控制着，政府将会扑灭任何可能的不满和反抗。如今，这样的§Y寓言§!似乎已在中国变成现实。中国领导层痴迷于人工智能，不光是因为它代表21世纪的最高科技水平，同时还完美契合共产党利用数字技术实施全面监控、控制、引导、审查的目标。这一完美的工具将协助中共建立强大的数字极权政府，并其能力还将随时间而日渐强大和全面，让人民时时刻刻都处于在“技术牢笼”之中。"
 PRC_left_wing_junta_desc: "\n\n\n\n£GFX_Ideology_PRC_left_wing_junta\n\n\n\n\n\n§Y红色军政府§!合了左翼意识形态与军政府的威权政治架构。既宣扬社会主义原则、平等与社会公平，又能让政府有通常军政府应有的纪律性和集中式决策。\n\n红色军政府的主要目标是：解决社会经济的不平等，消除阶级差异以及提升工人阶级福祉。其打算靠强有力的中央集权政府来有效率地完成这些目标，避免被繁琐的行政体系与恼人的政治反对派拖累。军队作为军政府的主导力量，在维护稳定、保卫革命与捍卫人民利益方面发挥着关键作用。"
