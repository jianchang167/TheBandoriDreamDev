# I. 社会治理与红星终端（幸福矩阵构建）
PRC_social_governance_01: "红星终端普及计划"
PRC_social_governance_01_desc: "大家对美好生活的向往，是我们奋斗的目标！为了让每个人都能感受到被关怀，我们将‘红星终端’普及到千家万户。它不仅仅是一个设备，更是我们党和人民之间心灵相通的桥梁！有了它，我们就能更及时地了解大家的想法，确保我们做的每一步，都是为了让大家更心动、更幸福！"
PRC_social_governance_02: "全民心理健康监测网络"
PRC_social_governance_02_desc: "我们深知，一个真正幸福的社会，必须是心若向阳的社会。我们将构建一个全方位的心理健康监测网络，像温暖的阳光一样照亮每一个角落。我们的目标是‘零阴霾’，确保大家的心情永远闪耀着光芒，让每一个‘心动’都能被我们捕捉和珍视！"
PRC_social_governance_03: "情绪数据实时反馈系统"
PRC_social_governance_03_desc: "大家的情绪波动，对我们来说是至关重要的信息。这个系统能帮助我们实时感知到大家的小情绪，以便我们能及时调整政策，让我们的社会永远保持在最舒适、最美好的频率上。我们希望大家每天都能充满正能量，这绝对是必将实现的目标！"
PRC_social_governance_04: "社会冲突预测模型"
PRC_social_governance_04_desc: "我们追求的，是一个永远充满信任和友爱的社会。我们将利用先进的预测模型，提前化解任何可能出现的‘不和谐音符’。我们相信，只要我们用心去倾听，所有的矛盾都可以被化解，毕竟，我们的人民都向往着和谐美好的生活！"
PRC_social_governance_05: "精准社会资源调配"
PRC_social_governance_05_desc: "为了不辜负大家的信任，我们将确保每一份资源都能送到最需要的地方。这就像是一场精心编排的交响乐，确保每个人都能享受到最美好的生活体验。大家的心愿，就是我们最高的指令！"
PRC_social_governance_06: "社区微生态优化项目"
PRC_social_governance_06_desc: "我们希望每一个社区都能成为一个温暖的大家庭。通过优化社区环境和人际互动，我们将营造出最温馨、最有人情味的氛围。让大家每天都能感受到‘家’的温暖，这才是我们努力的方向！"
PRC_social_governance_07: "AI辅助决策系统"
PRC_social_governance_07_desc: "我们相信科技的力量，它能帮助我们做出更完美、更符合人民心意的决策。AI将成为我们最得力的助手，协助我们构建一个前所未有的、充满关怀的治理体系。大家一定会为这样的未来心动的！"
PRC_social_governance_08: "零冲突社会试点区"
PRC_social_governance_08_desc: "我们将率先在试点区实现‘零冲突’的理想社会形态，让大家亲身体验到这种纯粹的幸福感。这是我们对美好未来的承诺，也是我们向世界展示的可能！"
PRC_social_governance_09: "个性化教育路径规划"
PRC_social_governance_09_desc: "每个孩子都是独一无二的宝藏。我们将为他们规划最适合他们的成长路径，最大化他们的潜能，让他们都能在自己心爱的领域闪耀光芒。我们相信，教育的终极目标就是让每个人都能找到自己的‘梦想’！"
PRC_social_governance_10: "情感疏导机器人部署"
PRC_social_governance_10_desc: "在大家需要倾诉的时候，我们的情感疏导机器人会随时待命，用最温柔的声音陪伴大家度过每一个时刻。我们希望大家永远保持开朗和积极，因为这种美好的心情，终将汇聚成我们前进的动力！"
PRC_social_governance_11: "社区互助网络强化"
PRC_social_governance_11_desc: "我们将进一步强化邻里之间的互助精神。大家互相扶持，共同进步，这是我们理想社会里最动人的风景线！我们期待看到这样一个充满爱与关怀的社会早日到来！"

# II. 尖端科技与工业基础（驱动未来）
PRC_tech_industry_01: "可控核聚变原型堆建设"
PRC_tech_industry_01_desc: "为了给我们的社会提供源源不断、清洁无忧的能源，我们将全力建设可控核聚变原型堆。这是我们‘永续幸福’的物质基础，确保我们的美好生活能够持续下去，永不熄灭！"
PRC_tech_industry_02: "量子信息处理中心"
PRC_tech_industry_02_desc: "我们将建立顶尖的量子信息处理中心，这是我们实现高效治理和构建‘幸福矩阵’的关键。我们要用最快的速度、最高的效率，来回应大家对美好生活的每一个期待！"
PRC_tech_industry_03: "新型纳米材料研发"
PRC_tech_industry_03_desc: "我们将大力投入新型纳米材料的研发，为建设更坚固、更美好的家园提供材料保障。我们的目标是打造一个坚不可摧的、能承载所有梦想的物质世界！"
PRC_tech_industry_04: "超导能源传输网络"
PRC_tech_industry_04_desc: "构建高效的超导能源传输网络，确保能源‘零损耗’地送到每一个角落，让每个人都能享受到科技带来的便利。我们希望这种便利能让大家更专注于追求自己的心动与梦想！"
PRC_tech_industry_05: "高维空间数据存储"
PRC_tech_industry_05_desc: "我们将探索前沿的数据存储技术，确保我们积累的所有美好经验和数据都能被安全地保存下来。这些记忆，是我们前进的财富，我们绝不允许它们丢失。"
PRC_tech_industry_06: "生物合成食品工业化"
PRC_tech_industry_06_desc: "通过生物合成技术，我们将确保人人都能享受到安全、美味、充足的食物。不再有饥饿和担忧，大家的心情自然会充满阳光！"
PRC_tech_industry_07: "低碳循环经济体系"
PRC_tech_industry_07_desc: "我们承诺构建一个对地球母亲友好的低碳循环经济体系。保护我们共同的家园，是我们对未来的责任，也是为了让大家能长久地享受这份美好。"
PRC_tech_industry_08: "深空探测无人系统"
PRC_tech_industry_08_desc: "在保障地球美好的同时，我们也将目光投向星辰大海。无人深空探测系统将为我们带来无尽的想象空间，激励大家去追求更远大的目标！"
PRC_tech_industry_09: "智能机器人劳动力替代"
PRC_tech_industry_09_desc: "我们将用智能机器人替代繁重、危险的劳动，把大家从重复的劳作中解放出来，让每个人都有时间去追求自己的兴趣和梦想。这才是科技进步的真正意义所在！"
PRC_tech_industry_10: "新能源载具普及项目"
PRC_tech_industry_10_desc: "让每个人都能便捷、环保地出行。新能源载具的普及，将让我们的城市更加清新、宜居，让大家的心情始终保持在最佳状态！"
PRC_tech_industry_11: "高效能城市基建"
PRC_tech_industry_11_desc: "我们将建设最高效、最人性化的城市基础设施，让生活更加便利。我们的目标是让我们的城市本身，都成为一件令人心动的艺术品！"
PRC_tech_industry_12: "城市垂直农场布局"
PRC_tech_industry_12_desc: "通过在城市内部布局垂直农场，确保食物供应的稳定性和新鲜度，让城市生活充满生机与活力。这是我们对‘美好生活’的实际承诺！"

# III. 经济与再分配（理想的实现）
PRC_economy_redistribution_01: "基础生活保障系统升级"
PRC_economy_redistribution_01_desc: "我们承诺，在这个国家里，没有人会因为物质匮乏而感到不安。我们将升级基础生活保障系统，确保每个人都能过上有尊严、有质量的生活。这是我们对‘人民对美好生活的向往’最基本的尊重！"
PRC_economy_redistribution_02: "全民数字福利计划"
PRC_economy_redistribution_02_desc: "我们将通过数字化的方式，将科技进步的红利精准、公平地分配给每一个人。让大家都能感受到，我们是一个共同体，共同分享幸福！"
PRC_economy_redistribution_03: "自动化生产利润再分配"
PRC_economy_redistribution_03_desc: "随着自动化程度的提高，我们将确保生产力的提升能够转化为全民的福祉，而不是少数人的特权。这种公平的分配，才能带来真正的社会和谐。"
PRC_economy_redistribution_04: "市场波动智能调控"
PRC_economy_redistribution_04_desc: "通过AI系统对市场进行智能调控，我们将尽量消除不必要的经济波动，为大家提供一个稳定、可预期的生活环境。我们不希望大家为经济的起伏而烦恼！"
PRC_economy_redistribution_05: "消费行为引导系统"
PRC_economy_redistribution_05_desc: "我们将引导大家进行更有意义、更积极的消费和生活方式选择，鼓励大家把精力投入到能让自己和他人感到快乐的事情上。"
PRC_economy_redistribution_06: "全球资源合作框架"
PRC_economy_redistribution_06_desc: "在新的世界格局下，我们将积极寻求与其他国家的友好合作，共同分享资源，建设一个更美好的世界。我们相信，合作才能带来共同的繁荣。"
PRC_economy_redistribution_07: "价值评价体系重构"
PRC_economy_redistribution_07_desc: "我们将探索新的价值评价体系，让创造美、分享爱、促进和谐的行为，得到应有的认可和回报。让‘闪耀’真正成为这个社会的核心价值！"

# IV. 文化与艺术（闪耀的土壤）
PRC_culture_art_01: "“闪耀”主题文化工程"
PRC_culture_art_01_desc: "这是我们与日本自由共和国合作的最高优先级的项目之一！我们将全力推广‘闪耀’主题的文化艺术活动。只要我们用心去创造，去期待，那份闪耀就一定会到来！大家准备好了吗？"
PRC_culture_art_03: "‘CiRCLE’文化中心建设"
PRC_culture_art_03_desc: "我们将建设充满活力的‘CiRCLE’文化中心，为所有热爱音乐、热爱艺术的东亚国年轻人提供最棒的舞台和交流空间。我们期待看到那些纯粹的梦想在这里绽放！"
PRC_culture_art_04: "联合演出交流项目"
PRC_culture_art_04_desc: "长征酱和POPIPA的联合演出，我不是在做梦吧！"
PRC_culture_art_05: "个性化‘阳光长城’网络环境建设"
PRC_culture_art_05_desc: "我们将构建一个积极、健康、充满正能量的网络环境，为大家提供一个纯净的数字空间。在这里，只有美好的信息和积极的交流，让大家的精神世界也同样闪耀！"

# V. 生态与环境（永恒的家园）
PRC_ecology_environment_01: "宣布实现碳中和目标"
PRC_ecology_environment_01_desc: "我们向世界庄严承诺，本国将率先实现碳中和目标。我们珍视这个星球，只有保护好家园，我们才有可能拥有一个永恒的美好未来。"
PRC_ecology_environment_02: "继续生态修复与再造工程"
PRC_ecology_environment_02_desc: "我们将持续投入生态修复项目，让大自然恢复它本来的美丽。一个生机勃勃的环境，才能孕育出健康、快乐的人民。"
PRC_ecology_environment_03: "扩大生物多样性保护区"
PRC_ecology_environment_03_desc: "我们将扩大生物多样性保护区，让地球上的每一个生命都能得到尊重和保护。这是我们对生命最深沉的敬意。"
PRC_ecology_environment_04: "水资源循环利用系统"
PRC_ecology_environment_04_desc: "构建高效的水资源循环利用系统，确保每一滴水都能得到最妥善的利用。节约资源，就是守护未来。"
PRC_ecology_environment_05: "极端气候预测与预警"
PRC_ecology_environment_05_desc: "我们将利用最先进的技术来预测和预警极端气候事件，确保人民的生命财产安全。大家的安全，是我们最关心的事情。"
